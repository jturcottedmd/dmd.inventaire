/* ============================================================
   EXPORT EXCEL — toutes les équipes, tout le détail, 1 fichier
   ============================================================ */
// Chargement à la demande de la librairie Excel (~1 Mo) : uniquement lors d'un export/import.
let _xlsxLoading = null;
function ensureXLSX(){
  if(window.XLSX) return Promise.resolve();
  if(_xlsxLoading) return _xlsxLoading;
  _xlsxLoading = new Promise(function(res, rej){
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js';
    s.onload = function(){ res(); };
    s.onerror = function(){ _xlsxLoading = null; rej(new Error('xlsx')); };
    document.head.appendChild(s);
  });
  return _xlsxLoading;
}
async function exporterExcel(){
  const btn = document.getElementById('exportBtn');
  const old = btn ? btn.textContent : '';
  if(btn){ btn.textContent = '...'; btn.disabled = true; }
  try{
    await ensureXLSX();
    // Charger toutes les données de toutes les équipes/catégories
    for(const t of teams){
      for(const cat of allCatKeys()){ await ensureTeamCatLoaded(t.id, cat); }
      await loadTeamInfo(t.id);
    }

    // --- Instantané courant + comparaison avec le dernier export ---
    // Champs de saisie suivis par article, avec libellé lisible
    const FIELD_LABELS = {
      qte:'Qté prévue', qteReel:'Qté réelle',
      etatBon:'État bon', etatMoyen:'État moyen', etatMauvais:'État mauvais',
      ident:'Identification', opts:'Type', localisation:'Localisation',
      verif:'Vérif', pression:'Pression', huile:'Huile', tuneup:'Tune-up', lame:'État lame',
      comment:'Commentaire'
    };
    const TRACK = Object.keys(FIELD_LABELS);
    const INFO_LABELS = { projet:'N° projet', contremaitre:'Contremaître', adresse:'Adresse' };
    function normVal(k, v){
      if(k === 'opts') return Array.isArray(v) ? v.join(' + ') : '';
      return (v ?? '').toString();
    }
    function itemFieldsRec(s){
      const rec = {}; TRACK.forEach(k => { rec[k] = normVal(k, s[k]); }); return rec;
    }

    // Instantané courant, structuré :
    //  cats  : liste des catégories (clé -> label)
    //  items : { "teamId|cat|nomArticle" : { champ:valeur } }  (clé par NOM pour être stable)
    //  info  : { "teamId" : { projet, contremaitre, adresse } }
    const snapshotNow = { cats:{}, items:{}, info:{} };
    allCatKeys().forEach(cat => { snapshotNow.cats[cat] = catLabel(cat); });
    teams.forEach(t => {
      allCatKeys().forEach(cat => {
        const items = itemsFor(cat);
        const st = (perTeamState[t.id] && perTeamState[t.id][cat]) || [];
        items.forEach((it, i) => {
          if(it.header) return;
          if(isItemHidden(cat, it.name)) return;
          const s = st[i] || {};
          const rec = itemFieldsRec(s);
          rec._by = s._by || '';   // qui a modifié en dernier (non compté dans TRACK)
          const nom = (it.name || '').replace(/\n/g,' ');
          // On enregistre l'article s'il a une saisie (sinon inutile)
          if(TRACK.some(k => rec[k] !== '')) snapshotNow.items[t.id + '|' + cat + '|' + nom] = rec;
        });
      });
      const inf = teamInfo[t.id] || {};
      snapshotNow.info[t.id] = {
        projet: (inf.projet||'').toString(),
        contremaitre: (inf.contremaitre||'').toString(),
        adresse: (inf.adresse||'').toString()
      };
    });

    // Récupérer l'ancien instantané
    let prevSnap = null, prevMeta = null, hadBaseline = false;
    try{
      const raw = await window.storage.get('inv:snapshot', true);
      if(raw && raw.value){ const parsed = JSON.parse(raw.value); prevSnap = parsed.data || null; prevMeta = parsed.meta || null; }
    }catch(e){ prevSnap = null; }
    if(prevSnap){
      hadBaseline = true;
      // Compatibilité : ancien format (plat, clés "team|cat|idx") -> on repart d'une base vide.
      // (les index ne sont plus comparables aux nouvelles clés par nom)
      if(!prevSnap.items && !prevSnap.cats && !prevSnap.info){
        prevSnap = { cats:{}, items:{}, info:{} };
      }
    }

    // Calculer TOUTES les modifications
    // change = { team, cat, article, champ, avant, apres, level? }
    // Niveau de couleur d'un champ d'après sa valeur APRÈS modif (pour colorer la ligne)
    function champLevel(fieldKey, after){
      if(!after) return null;
      if(fieldKey === 'verif'){ const r = verifStatus(after.verif); return r ? r.level : null; }
      if(fieldKey === 'huile'){ const r = entretienStatus(after.huile); return r ? r.level : null; }
      if(fieldKey === 'tuneup'){ const r = entretienStatus(after.tuneup); return r ? r.level : null; }
      if(fieldKey === 'qte' || fieldKey === 'qteReel'){ const r = qtyStatus(after.qte, after.qteReel); return r ? r.level : null; }
      if(fieldKey === 'etatBon' || fieldKey === 'etatMoyen' || fieldKey === 'etatMauvais'){
        const es = etatSummary({ etatBon:after.etatBon, etatMoyen:after.etatMoyen, etatMauvais:after.etatMauvais });
        return es ? es.level : null;
      }
      return null; // ident, type, localisation, pression, lame, commentaire -> neutre
    }
    const changes = [];
    if(prevSnap){
      const pCats = prevSnap.cats || {}, nCats = snapshotNow.cats || {};
      const pItems = prevSnap.items || {}, nItems = snapshotNow.items || {};
      const pInfo = prevSnap.info || {}, nInfo = snapshotNow.info || {};

      // 1) Onglets (catégories) ajoutés / supprimés
      Object.keys(nCats).forEach(k => {
        if(!(k in pCats)) changes.push({ team:'—', cat:nCats[k], article:'—', champ:'Onglet', avant:'(absent)', apres:'ajouté' });
      });
      Object.keys(pCats).forEach(k => {
        if(!(k in nCats)) changes.push({ team:'—', cat:pCats[k], article:'—', champ:'Onglet', avant:'présent', apres:'supprimé' });
      });

      // 2) Articles ajoutés / supprimés / modifiés (clé = teamId|cat|nom)
      const allItemKeys = new Set([...Object.keys(pItems), ...Object.keys(nItems)]);
      allItemKeys.forEach(key => {
        const parts = key.split('|');
        const teamId = parts[0], cat = parts[1], nom = parts.slice(2).join('|');
        const teamNom = teamLabel(teamId);
        const catNom = (nCats[cat] || pCats[cat] || cat);
        const before = pItems[key], after = nItems[key];
        const parBy = (after && after._by) || (before && before._by) || '';
        if(before && !after){
          changes.push({ team:teamNom, cat:catNom, article:nom, champ:'Article', avant:'présent', apres:'retiré/vidé', par:parBy });
          return;
        }
        if(!before && after){
          // nouvel article renseigné : lister les valeurs saisies
          const remplis = TRACK.filter(k => after[k] !== '');
          const desc = remplis.map(k => FIELD_LABELS[k] + '=' + after[k]).join(', ');
          changes.push({ team:teamNom, cat:catNom, article:nom, champ:'Article', avant:'(vide)', apres:'renseigné' + (desc ? ' — ' + desc : ''), par:parBy });
          return;
        }
        // article présent avant et après : diff champ par champ
        TRACK.forEach(k => {
          const av = before[k] ?? '', ap = after[k] ?? '';
          if(av !== ap){
            changes.push({ team:teamNom, cat:catNom, article:nom, champ:FIELD_LABELS[k],
              avant: av===''?'(vide)':av, apres: ap===''?'(vide)':ap, level: champLevel(k, after), par:parBy });
          }
        });
      });

      // 3) Infos de chantier par équipe
      const allInfoTeams = new Set([...Object.keys(pInfo), ...Object.keys(nInfo)]);
      allInfoTeams.forEach(teamId => {
        const b = pInfo[teamId] || {}, a = nInfo[teamId] || {};
        Object.keys(INFO_LABELS).forEach(k => {
          const av = (b[k]||'').toString(), ap = (a[k]||'').toString();
          if(av !== ap){
            changes.push({ team:teamLabel(teamId), cat:'Chantier', article:'—', champ:INFO_LABELS[k], avant: av===''?'(vide)':av, apres: ap===''?'(vide)':ap });
          }
        });
      });

      // Trier par équipe puis catégorie puis article
      changes.sort((a,b) => (a.team+a.cat+a.article+a.champ).localeCompare(b.team+b.cat+b.article+b.champ, 'fr'));
    }

    const COLS = ['Catégorie','Article','Qté prévue','Qté réelle','Bon','Moyen','Mauvais','Total évalué',
                  'Identification','Type','Localisation','Vérif','Huile','Tune-up','État lame','Pression','Commentaire'];
    const WIDTHS = [14,32,10,10,6,7,8,11,14,16,16,10,10,10,14,9,34];

    function toNum(v){ const n = parseFloat(v); return isNaN(n) ? null : n; }
    function aUneSaisie(s){
      return ['qte','qteReel','etatBon','etatMoyen','etatMauvais','verif','pression','huile','tuneup']
        .some(k => (s[k] ?? '') !== '') || (Array.isArray(s.opts) && s.opts.length > 0);
    }

    const wb = XLSX.utils.book_new();
    let auMoinsUne = false;

    // === Feuille 1 : Résumé des modifications depuis le dernier export ===
    (function buildSummarySheet(){
      const now = new Date();
      const fmt = dt => dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' +
        String(dt.getDate()).padStart(2,'0') + ' ' + String(dt.getHours()).padStart(2,'0') + ':' + String(dt.getMinutes()).padStart(2,'0');
      const sAoa = [];
      const sMeta = [];
      // Titre
      sAoa.push(['RÉSUMÉ DES MODIFICATIONS', '', '', '', '', '']); sMeta.push({title:true});
      const depuis = (prevMeta && prevMeta.date) ? fmt(new Date(prevMeta.date)) : '—';
      sAoa.push(['Dernier export : ' + depuis, '', '', '', '', '']); sMeta.push({info:true});
      sAoa.push(['Export actuel : ' + fmt(now), '', '', '', '', '']); sMeta.push({info:true});
      sAoa.push(['', '', '', '', '', '']); sMeta.push({blank:true});
      // En-têtes du tableau
      sAoa.push(['Équipe','Catégorie','Article','Champ modifié','Avant → Après','Modifié par']); sMeta.push({header:true});
      if(!hadBaseline){
        sAoa.push(['Premier export — aucune comparaison disponible.', '', '', '', '', '']); sMeta.push({note:true});
      }else if(changes.length === 0){
        sAoa.push(['Aucune modification depuis le dernier export.', '', '', '', '', '']); sMeta.push({note:true});
      }else{
        changes.forEach(c => {
          sAoa.push([c.team, c.cat, c.article, c.champ, c.avant + '  →  ' + c.apres, c.par || '(non identifié)']);
          sMeta.push({row:true, level: c.level || null});
        });
      }
      const sws = XLSX.utils.aoa_to_sheet(sAoa);
      sws['!cols'] = [{wch:16},{wch:16},{wch:34},{wch:16},{wch:40},{wch:28}];
      sws['!freeze'] = { xSplit:0, ySplit:5 };
      // Filtre automatique sur la ligne d'en-tête du tableau (ligne 5, index 4)
      // -> permet de filtrer les modifications par Équipe, Catégorie, Modifié par, etc.
      sws['!autofilter'] = { ref: XLSX.utils.encode_range({s:{r:4,c:0}, e:{r:Math.max(4, sAoa.length-1), c:5}}) };
      // Fusion des lignes titre/info sur toute la largeur
      sws['!merges'] = [
        {s:{r:0,c:0},e:{r:0,c:5}},
        {s:{r:1,c:0},e:{r:1,c:5}},
        {s:{r:2,c:0},e:{r:2,c:5}}
      ];
      const nR = sAoa.length, nC = 6;
      for(let r=0; r<nR; r++){
        for(let c=0; c<nC; c++){
          const addr = XLSX.utils.encode_cell({r,c});
          if(!sws[addr]) sws[addr] = { t:'s', v:'' };
          const m = sMeta[r] || {};
          let fill='FFFFFF', bold=false, fontColor='000000', sz=10;
          if(m.title){ fill='232221'; bold=true; fontColor='E8600F'; sz=14; }
          else if(m.info){ fill='2F2D2B'; fontColor='F3EFE6'; }
          else if(m.header){ fill='D9D2C2'; bold=true; }
          else if(m.note){ fill='FFF2CC'; bold=true; }
          else if(m.row && m.level === 'red') fill='F4CCCC';
          else if(m.row && m.level === 'orange') fill='FFF2CC';
          else if(m.row && m.level === 'green') fill='D9EAD3';
          // sinon (changement neutre : ident, localisation, type, commentaire...) -> blanc
          sws[addr].s = {
            fill:{ patternType:'solid', fgColor:{rgb:fill} },
            font:{ name:'Arial', sz:sz, bold:bold, color:{rgb:fontColor} },
            alignment:{ vertical:'center', horizontal:(c===4||m.title||m.info||m.note)?'left':'left', wrapText:false },
            border:{
              top:{style:'thin',color:{rgb:'CCCCCC'}}, bottom:{style:'thin',color:{rgb:'CCCCCC'}},
              left:{style:'thin',color:{rgb:'CCCCCC'}}, right:{style:'thin',color:{rgb:'CCCCCC'}}
            }
          };
        }
      }
      XLSX.utils.book_append_sheet(wb, sws, 'Résumé modifs');
    })();

    // === Feuille 2 : Entretien mécanique (Vérif / Huile / Tune-up en jaune ou rouge) ===
    (function buildEntretienSheet(){
      // Rassemble, toutes équipes confondues, les entretiens/vérifs non-verts.
      const lignes = []; // { equipe, cat, article, type, etat(level), detail }
      teams.forEach(t => {
        allCatKeys().forEach(cat => {
          const items = itemsFor(cat);
          const st = (perTeamState[t.id] && perTeamState[t.id][cat]) || [];
          const catNom = catLabel(cat).toUpperCase();
          items.forEach((it, i) => {
            if(it.header) return;
            if(isItemHidden(cat, it.name)) return;
            const s = st[i] || {};
            const article = (it.name||'').replace(/\n/g,' ');
            // Vérif annuelle : seulement pour les équipements qui en ont une (vf ou ext)
            if(it.vf || it.ext){
              const vVal = effVerif(s, it);
              const vs = verifStatus(vVal);
              if(vs.level === 'orange' || vs.level === 'red'){
                lignes.push({ equipe:teamLabel(t.id), cat:catNom, article,
                  type:'Vérif annuelle', level:vs.level, valeur:(vVal||'').trim(), detail:vs.label });
              }
            }
            // Huile & Tune-up : seulement pour les moteurs (gas)
            if(it.gas){
              const hVal = effHuile(s, it);
              const hs = entretienStatus(hVal);
              if(hs.level === 'orange' || hs.level === 'red'){
                lignes.push({ equipe:teamLabel(t.id), cat:catNom, article,
                  type:'Huile', level:hs.level, valeur:(hVal||'').trim(), detail:hs.label });
              }
              const tVal = effTuneup(s, it);
              const ts = entretienStatus(tVal);
              if(ts.level === 'orange' || ts.level === 'red'){
                lignes.push({ equipe:teamLabel(t.id), cat:catNom, article,
                  type:'Tune-up', level:ts.level, valeur:(tVal||'').trim(), detail:ts.label });
              }
            }
          });
        });
      });
      // Rouge d'abord, puis jaune ; ensuite par catégorie/article
      const rank = lv => lv === 'red' ? 0 : 1;
      lignes.sort((a,b) => rank(a.level)-rank(b.level) || (a.cat+a.article).localeCompare(b.cat+b.article,'fr'));

      const EH = ['Priorité','Équipe','Catégorie','Article','Type d\'entretien','Date inscrite','État'];
      const aoa = [EH];
      const meta = [{header:true}];
      if(lignes.length === 0){
        aoa.push(['—','','','Aucun entretien ni vérification en attente. Tout est à jour ✔','','','']);
        meta.push({note:true});
      }else{
        lignes.forEach(l => {
          aoa.push([
            l.level === 'red' ? 'ROUGE' : 'JAUNE',
            l.equipe, l.cat, l.article, l.type,
            l.valeur || '(vide)', l.detail
          ]);
          meta.push({level:l.level});
        });
      }
      const ews = XLSX.utils.aoa_to_sheet(aoa);
      ews['!cols'] = [{wch:10},{wch:16},{wch:14},{wch:32},{wch:16},{wch:16},{wch:30}];
      ews['!freeze'] = { xSplit:0, ySplit:1 };
      ews['!autofilter'] = { ref: XLSX.utils.encode_range({s:{r:0,c:0}, e:{r:Math.max(0,aoa.length-1), c:EH.length-1}}) };
      const nR = aoa.length, nC = EH.length;
      for(let r=0; r<nR; r++){
        for(let c=0; c<nC; c++){
          const addr = XLSX.utils.encode_cell({r,c});
          if(!ews[addr]) ews[addr] = { t:'s', v:'' };
          const m = meta[r] || {};
          let fill='FFFFFF', bold=false, fontColor='000000';
          if(m.header){ fill='232221'; bold=true; fontColor='FFFFFF'; }
          else if(m.note){ fill='D9EAD3'; bold=true; }
          else if(m.level === 'red') fill='F4CCCC';
          else if(m.level === 'orange') fill='FFF2CC';
          // La colonne Priorité en gras coloré
          const prioBold = (c===0 && !m.header && !m.note);
          ews[addr].s = {
            fill:{ patternType:'solid', fgColor:{rgb:fill} },
            font:{ name:'Arial', sz: m.header?11:10, bold: bold || prioBold,
                   color:{rgb: prioBold ? (m.level==='red'?'B00000':'9C6500') : fontColor} },
            alignment:{ vertical:'center', horizontal:(c===3||c===6)?'left':'center', wrapText:m.header },
            border:{
              top:{style:'thin',color:{rgb:'CCCCCC'}}, bottom:{style:'thin',color:{rgb:'CCCCCC'}},
              left:{style:'thin',color:{rgb:'CCCCCC'}}, right:{style:'thin',color:{rgb:'CCCCCC'}}
            }
          };
        }
      }
      XLSX.utils.book_append_sheet(wb, ews, 'Entretien mécanique');
    })();

    // === Feuille : Matériel de maçonnerie (stock global de l'entreprise) ===
    await (async function buildMasonrySheet(){
      if(!masonryData){ await loadMasonry(); }
      if(!masonryData || !Array.isArray(masonryData.cats)) return;
      const champs = Array.isArray(masonryData.champs) ? masonryData.champs : [];
      // En-têtes : Catégorie, Article, [champs dynamiques...], Quantité, Unité
      const EH = ['Catégorie','Article', ...champs.map(c => c.label), 'Quantité','Unité'];
      const aoa = [EH];
      const meta = [{header:true}];
      let nbArticles = 0;
      masonryData.cats.forEach(cat => {
        const items = Array.isArray(cat.items) ? cat.items : [];
        if(!items.length){
          aoa.push([cat.nom, '(aucun article)', ...champs.map(()=>''), '', '']);
          meta.push({cat:true});
          return;
        }
        // Ligne titre de catégorie
        aoa.push([cat.nom, ...champs.map(()=>''), '', '', ''].slice(0, EH.length));
        meta.push({cat:true});
        items.forEach(it => {
          nbArticles++;
          const champVals = champs.map(ch => (it[ch.key] != null ? String(it[ch.key]) : ''));
          const qte = (it.qte !== '' && it.qte != null) ? it.qte : '';
          aoa.push(['', (it.nom || '(sans nom)'), ...champVals, qte, (it.unite || '')]);
          meta.push({row:true});
        });
      });
      if(nbArticles === 0 && masonryData.cats.length === 0){
        aoa.push(['—', 'Aucun matériel enregistré', ...champs.map(()=>''), '', '']);
        meta.push({note:true});
      }
      const mws = XLSX.utils.aoa_to_sheet(aoa);
      const cols = [{wch:20},{wch:28}, ...champs.map(()=>({wch:16})), {wch:12},{wch:12}];
      mws['!cols'] = cols;
      mws['!freeze'] = { xSplit:0, ySplit:1 };
      mws['!autofilter'] = { ref: XLSX.utils.encode_range({s:{r:0,c:0}, e:{r:Math.max(0,aoa.length-1), c:EH.length-1}}) };
      const nR = aoa.length, nC = EH.length;
      for(let r=0; r<nR; r++){
        for(let c=0; c<nC; c++){
          const addr = XLSX.utils.encode_cell({r,c});
          if(!mws[addr]) mws[addr] = { t:'s', v:'' };
          const m = meta[r] || {};
          let fill='FFFFFF', bold=false, fontColor='000000';
          if(m.header){ fill='232221'; bold=true; fontColor='FFFFFF'; }
          else if(m.cat){ fill='D9D2C2'; bold=true; }
          else if(m.note){ fill='FFF2CC'; bold=true; }
          mws[addr].s = {
            fill:{ patternType:'solid', fgColor:{rgb:fill} },
            font:{ name:'Arial', sz:m.header?11:10, bold:bold, color:{rgb:fontColor} },
            alignment:{ vertical:'center', horizontal:(c===0||c===1)?'left':'center', wrapText:m.header },
            border:{
              top:{style:'thin',color:{rgb:'CCCCCC'}}, bottom:{style:'thin',color:{rgb:'CCCCCC'}},
              left:{style:'thin',color:{rgb:'CCCCCC'}}, right:{style:'thin',color:{rgb:'CCCCCC'}}
            }
          };
        }
      }
      XLSX.utils.book_append_sheet(wb, mws, 'Matériel maçonnerie');
      if(nbArticles > 0) auMoinsUne = true;
    })();

    teams.forEach(t => {
      // Rassembler les lignes réellement saisies de cette équipe
      const aoa = [COLS.slice()];        // 1re ligne = en-têtes
      const meta = [{header:true}];      // info de style par ligne
      allCatKeys().forEach(cat => {
        const items = itemsFor(cat);
        const st = (perTeamState[t.id] && perTeamState[t.id][cat]) || [];
        const catNom = catLabel(cat).toUpperCase();
        const lignesCat = [];
        items.forEach((it, i) => {
          if(it.header) return;
          if(isItemHidden(cat, it.name)) return;
          const s = st[i] || {};
          const est = etatSummary(s);
          const qp = it.noQty ? null : toNum(s.qte), qr = it.noQty ? null : toNum(s.qteReel);
          const mauvais = toNum(s.etatMauvais) || 0, moyen = toNum(s.etatMoyen) || 0;
          let couleur = 'none';  // vide => blanc, pas de vert
          if(aUneSaisie(s)){
            couleur = 'green';
            if((qp!==null && qr!==null && qr<qp) || mauvais>0) couleur = 'red';
            else if(moyen>0) couleur = 'yellow';
          }
          lignesCat.push({
            vals:[
              catNom,
              (it.name||'').replace(/\n/g,' '),
              it.noQty ? '' : (s.qte ?? ''), it.noQty ? '' : (s.qteReel ?? ''),
              s.etatBon ?? '', s.etatMoyen ?? '', s.etatMauvais ?? '',
              est ? est.total : '',
              s.ident || '', (Array.isArray(s.opts) ? s.opts.join(' + ') : ''), (it.ext ? (extAssignLabel(it) || 'en stock') : (s.localisation || '')),
              effVerif(s, it) || '', effHuile(s, it) || '', effTuneup(s, it) || '', s.lame || '', s.pression || '', s.comment || ''
            ], couleur
          });
        });
        if(lignesCat.length){
          aoa.push([catNom, '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '']);
          meta.push({cat:true});
          lignesCat.forEach(l => { aoa.push(l.vals); meta.push({couleur:l.couleur}); });
        }
      });

      if(aoa.length <= 1) return; // équipe sans aucune saisie -> pas de feuille
      auMoinsUne = true;

      const ws = XLSX.utils.aoa_to_sheet(aoa);
      ws['!cols'] = WIDTHS.map(w => ({wch:w}));
      ws['!freeze'] = { xSplit:0, ySplit:1 };
      // Filtre automatique sur la ligne d'en-tête (permet de filtrer par Catégorie, etc.)
      ws['!autofilter'] = { ref: XLSX.utils.encode_range({s:{r:0,c:0}, e:{r:aoa.length-1, c:COLS.length-1}}) };

      // Styliser chaque cellule (SheetJS communautaire lit .s si présent)
      const nRows = aoa.length, nCols = COLS.length;
      for(let r=0; r<nRows; r++){
        for(let c=0; c<nCols; c++){
          const addr = XLSX.utils.encode_cell({r, c});
          if(!ws[addr]) ws[addr] = { t:'s', v:'' };
          const m = meta[r];
          let fill = 'FFFFFF', bold = false, fontColor = '000000';
          if(m.header){ fill = '232221'; bold = true; fontColor = 'FFFFFF'; }
          else if(m.cat){ fill = 'D9D2C2'; bold = true; }
          else if(m.couleur === 'red') fill = 'F4CCCC';
          else if(m.couleur === 'yellow') fill = 'FFF2CC';
          else if(m.couleur === 'green') fill = 'D9EAD3';
          // 'none' => reste blanc (FFFFFF)
          ws[addr].s = {
            fill:{ patternType:'solid', fgColor:{rgb:fill} },
            font:{ name:'Arial', sz: m.header?11:10, bold:bold, color:{rgb:fontColor} },
            alignment:{ vertical:'center', horizontal:(c===0||c===1||c===8||c===9||c===10||c===14||c===16)?'left':'center', wrapText:m.header },
            border:{
              top:{style:'thin',color:{rgb:'CCCCCC'}}, bottom:{style:'thin',color:{rgb:'CCCCCC'}},
              left:{style:'thin',color:{rgb:'CCCCCC'}}, right:{style:'thin',color:{rgb:'CCCCCC'}}
            }
          };
        }
      }
      const nom = teamLabel(t.id).substring(0,31).replace(/[\\/?*\[\]:]/g,' ');
      XLSX.utils.book_append_sheet(wb, ws, nom);
    });

    if(!auMoinsUne && changes.length === 0 && hadBaseline){
      alert("Aucune donnée et aucune modification depuis le dernier export.");
      return;
    }
    if(!auMoinsUne && !hadBaseline){
      alert("Aucune donnée saisie à exporter pour le moment.");
      return;
    }

    const d = new Date();
    const nomFichier = 'Inventaire_DMD_' + d.getFullYear() + '-' +
      String(d.getMonth()+1).padStart(2,'0') + '-' +
      String(d.getDate()).padStart(2,'0') + '.xlsx';
    XLSX.writeFile(wb, nomFichier);

    // Enregistrer le nouvel instantané pour la prochaine comparaison
    try{
      await window.storage.set('inv:snapshot', JSON.stringify({
        meta:{ date: d.toISOString() },
        data: snapshotNow
      }), true);
    }catch(e){ console.error('snapshot save', e); }

    // Recacher le bouton après l'export (il faudra refaire Ctrl+X pour le revoir)
    if(btn) btn.style.display = 'none';
  }catch(e){
    console.error(e);
    alert("Une erreur est survenue pendant l'export. Réessaie dans un instant.");
  }finally{
    if(btn){ btn.textContent = old || '⬇ Excel'; btn.disabled = false; }
  }
}

async function init(){
  document.getElementById('list').innerHTML = '<div class="empty-msg">Chargement...</div>';
  // 1) Réglages de base — en parallèle (indépendants les uns des autres)
  await loadTeams();
  await Promise.all([
    loadCustomCats(),
    loadHiddenItems(),
    loadMyTeam(),
    loadDeviceUser(),
    loadAdmin(),
    loadMachineRecords(),  // vérif/huile/tune-up des machines = source unique tuile Machinerie
    loadExtincteurs()      // registre des extincteurs (localisation = machine assignée)
  ]);

  // Si l'admin a supprimé la fiche de cet appareil, on efface l'identité locale
  // pour forcer une nouvelle identification (et on retire l'appareil de la liste).
  if(deviceUser && !deviceUser.chantier){
    try{
      const raw = await window.storage.get('inv:deletedPeople', true);
      const list = (raw && raw.value) ? JSON.parse(raw.value) : [];
      if(list.indexOf(getDeviceId()) !== -1){
        deviceUser = null;
        try{ await window.storage.delete('inv:deviceUser', false); }catch(e){}
        const rest = list.filter(x => x !== getDeviceId());
        await window.storage.set('inv:deletedPeople', JSON.stringify(rest), true);
      }
    }catch(e){}
  }
  // Assure que l'identité de cet appareil figure dans le répertoire partagé
  if(deviceUser && !deviceUser.chantier && (deviceUser.nom || deviceUser.courriel)){
    try{ saveDeviceUser(deviceUser); }catch(e){}  // sans await : non bloquant
  }

  // 2) Le strict minimum pour afficher le PREMIER écran :
  //    les articles ajoutés de l'onglet courant + l'inventaire de l'équipe courante.
  await Promise.all([
    loadExtraItems(currentCat),
    loadTeamInfo(currentTeam)
  ]);
  await ensureTeamCatLoaded(currentTeam, currentCat);

  // 3) Affichage immédiat : l'utilisateur voit l'app tout de suite.
  renderTeamBar();
  renderTabs();
  renderList();
  if(!deviceUser){ openIdentityModal(true); }

  // 4) Chargement du RESTE en arrière-plan, en parallèle (ne bloque pas l'écran).
  (async () => {
    try{
      const resteCats = allCatKeys().filter(c => c !== currentCat);
      const resteTeams = teams.filter(t => t.id !== currentTeam);
      await Promise.all([
        ...resteCats.map(c => loadExtraItems(c)),
        ...resteTeams.map(t => loadTeamInfo(t.id)),
        loadFormations()
      ]);
      // Précharge l'inventaire de l'équipe courante pour toutes les catégories,
      // afin que les compteurs (x/y) et pastilles rouges des onglets soient exacts.
      if(currentTeam !== 'TOTAL'){
        await Promise.all(resteCats.map(c => ensureTeamCatLoaded(currentTeam, c)));
      }
      // Rafraîchit une fois tout chargé (badges, listes, etc.)
      renderTeamBar();
      renderTabs();
      renderList();
      // Publie le catalogue des machines lourdes pour l'app Machinerie (source unique).
      publishMachineCatalog();
    }catch(e){ console.error('Chargement arrière-plan', e); }
  })();
}
// ================== EXPORT GLOBAL (accueil) ==================
// Fournit UNE page Excel pour cette tuile : une ligne par article renseigné
// (toutes équipes, toutes catégories) + le matériel de maçonnerie, au lieu des
// feuilles par équipe de l'export de la tuile. Les lignes sans aucune saisie
// sont omises.
window.__dmdFlatSheet = async function(){
  await loadTeams();
  await Promise.all([ loadCustomCats(), loadHiddenItems(), loadMachineRecords(), loadExtincteurs() ]);
  const cats = allCatKeys();
  await Promise.all(cats.map(c => loadExtraItems(c)));
  await Promise.all(teams.map(async t => {
    await loadTeamInfo(t.id);
    for(const cat of cats){ await ensureTeamCatLoaded(t.id, cat); }
  }));
  try{ await loadMasonry(); }catch(e){}

  const num = v => { const n = parseFloat(v); return isNaN(n) ? '' : n; };
  const val = v => (v === undefined || v === null) ? '' : String(v);
  const H = ['Équipe','Catégorie','Sous-section','Article','Qté prévue','Qté réelle','Écart','Bon','Moyen','Mauvais','Identification','Type','Localisation','Vérif','Huile','Tune-up','État lame','Pression','Commentaire','Modifié par','Alerte','N° projet','Contremaître','Adresse chantier'];
  const aoa=[H], meta=[{header:true}];
  const RANK = { red:2, orange:1, yellow:1 };

  teams.forEach(t=>{
    const info = teamInfo[t.id] || {};
    cats.forEach(cat=>{
      const items = itemsFor(cat);
      const st = (perTeamState[t.id] && perTeamState[t.id][cat]) || [];
      let section = '';
      items.forEach((it, i)=>{
        if(it.header){ section = (it.name||'').replace(/\n/g,' ').trim(); return; }
        if(isItemHidden(cat, it.name)) return;
        const s = st[i] || {};
        const verif = effVerif(s, it), huile = effHuile(s, it), tuneup = effTuneup(s, it);
        const loc = it.ext ? (extAssignLabel(it) || '') : val(s.localisation);
        const opts = Array.isArray(s.opts) ? s.opts.join(' + ') : '';
        // Une ligne n'apparaît que si l'équipe a réellement saisi quelque chose :
        // les valeurs venant du catalogue (commentaire type, code L01…) ne comptent pas,
        // et la vérif/huile/tune-up des machines vient de la tuile Machinerie (déjà sa page).
        const rempli = [s.qte,s.qteReel,s.etatBon,s.etatMoyen,s.etatMauvais,s.pression,s.lame,s.localisation,s.verif,s.huile,s.tuneup]
          .some(v => val(v) !== '')
          || (Array.isArray(s.opts) && s.opts.length > 0)
          || (val(s.comment) !== '' && val(s.comment) !== val(it.comment))
          || (val(s.ident) !== '' && val(s.ident) !== val(it.ident));
        if(!rempli) return;
        let niveau = 0;
        const qs = it.noQty ? null : qtyStatus(s.qte, s.qteReel); if(qs && RANK[qs.level]) niveau = Math.max(niveau, RANK[qs.level]);
        const es = etatSummary(s); if(es && RANK[es.level]) niveau = Math.max(niveau, RANK[es.level]);
        if(it.vf || it.ext){ const vs = verifStatus(verif); if(vs && RANK[vs.level]) niveau = Math.max(niveau, RANK[vs.level]); }
        if(it.gas){ [huile,tuneup].forEach(v=>{ const ms = entretienStatus(v); if(ms && RANK[ms.level]) niveau = Math.max(niveau, RANK[ms.level]); }); }
        const qp = it.noQty ? '' : num(s.qte), qr = it.noQty ? '' : num(s.qteReel);
        aoa.push([
          teamLabel(t.id), catLabel(cat), section, (it.name||'').replace(/\n/g,' '),
          qp, qr, (qp!=='' && qr!=='') ? (qr-qp) : '',
          num(s.etatBon), num(s.etatMoyen), num(s.etatMauvais),
          val(s.ident), opts, loc, verif||'', huile||'', tuneup||'',
          val(s.lame), val(s.pression), val(s.comment), val(s._by),
          niveau===2 ? 'ROUGE' : (niveau===1 ? 'JAUNE' : ''),
          val(info.projet), val(info.contremaitre), info.adresse ? formatAdresse(info.adresse) : ''
        ]);
        meta.push({ couleur: niveau===2 ? 'red' : (niveau===1 ? 'yellow' : 'green') });
      });
    });
  });

  // Matériel de maçonnerie (clé inv:masonry) — même feuille, colonne Équipe vide
  if(masonryData && Array.isArray(masonryData.cats)){
    const champs = Array.isArray(masonryData.champs) ? masonryData.champs : [];
    masonryData.cats.forEach(c=>{
      (c.items||[]).forEach(it=>{
        const desc = champs.map(ch => (ch.label||ch.key)+' : '+val(it[ch.key])).filter(x=>!/ : $/.test(x)).join(' · ');
        const q = num(it.qte);
        if(q === '' && !desc) return;
        aoa.push(['', 'Maçonnerie — '+(c.nom||''), '', it.nom||'(sans nom)', '', q, '', '', '', '', '', desc, val(it.unite), '', '', '', '', '', '', '', '', '', '', '']);
        meta.push({});
      });
    });
  }

  if(aoa.length===1){ aoa.push(['—','','','Aucune saisie d\'inventaire','','','','','','','','','','','','','','','','','','','','']); meta.push({}); }
  return { name:'Inventaire', aoa:aoa, meta:meta,
    widths:[14,20,18,32,10,10,8,6,7,8,14,16,20,10,12,12,14,9,34,22,9,12,20,32],
    leftCols:[0,1,2,3,10,11,12,18,19,21,22,23] };
};

const LOGIN_EMAIL = "equipe@dmd-inventaire.app";
async function _doLogin(){
  const errEl = document.getElementById('loginError');
  const pass  = document.getElementById('loginPass').value;
  errEl.textContent = 'Connexion...';
  const { error } = await _sb.auth.signInWithPassword({ email: LOGIN_EMAIL, password: pass });
  if(error){ errEl.textContent = 'Mot de passe incorrect'; return; }
  document.getElementById('loginScreen').style.display = 'none';
  init();
}
// Chargée en arrière-plan par l'export global de l'accueil (?dmdexport=1) : on ne
// démarre pas l'interface, seule __dmdFlatSheet() sera appelée.
const _DMD_EXPORT_MODE = /[?&]dmdexport=1/.test(location.search) || window.__DMD_EXPORT === true;
(async function(){
  if(_DMD_EXPORT_MODE) return;
  const ls = document.getElementById('loginScreen');
  const { data } = await _sb.auth.getSession();
  if(data && data.session){
    ls.style.display = 'none';
    init();
  } else {
    // Pas de session : on arrive normalement par l'accueil, mais si on ouvre
    // l'app d'inventaire directement, on affiche quand même le mot de passe.
    ls.style.display = 'flex';
  }
})();
document.getElementById('loginBtn').addEventListener('click', _doLogin);
var _expBtn = document.getElementById('exportBtn'); if(_expBtn) _expBtn.addEventListener('click', exporterExcel);

var _masonryBtn = document.getElementById('masonryBtn'); if(_masonryBtn) _masonryBtn.addEventListener('click', openMasonryStock);
// Le bouton Export est caché par défaut. Ctrl+X le révèle — mais seulement si on
// n'est pas en train d'éditer un champ (sinon on laisse le "couper" normal agir).
// Sans clavier physique (cellulaire/tablette), le bouton reste donc inaccessible.
document.addEventListener('keydown', function(e){
  if((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && (e.key === 'x' || e.key === 'X')){
    const el = document.activeElement;
    const enEdition = el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable);
    if(enEdition) return; // on ne bloque pas le vrai "couper"
    try{ if(localStorage.getItem('inv:isAdmin')!=='1') return; }catch(err){ return; }   // export réservé au mode admin
    e.preventDefault();
    const btn = document.getElementById('exportBtn');
    if(btn){ btn.style.display = ''; btn.focus(); }
  }
});
document.getElementById('loginPass').addEventListener('keydown', e => { if(e.key === 'Enter') _doLogin(); });
(function(){
  var tp = document.getElementById('togglePass');
  var pf = document.getElementById('loginPass');
  if(tp && pf){
    tp.addEventListener('click', function(){
      var show = pf.type === 'password';
      pf.type = show ? 'text' : 'password';
      tp.textContent = show ? '🙈' : '👁';
      tp.setAttribute('aria-label', show ? 'Masquer le mot de passe' : 'Afficher le mot de passe');
      pf.focus();
    });
  }
})();
<\/script>

// ================== HELPERS ==================
function escapeHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escapeAttr(s){ return escapeHtml(s).replace(/'/g,'&#39;'); }
function formatNom(s){ s=String(s==null?'':s).replace(/\s+/g,' ').trim(); if(!s) return s; return s.toLocaleLowerCase('fr').replace(/[\p{L}\p{N}]+/gu, function(w){ return w.charAt(0).toLocaleUpperCase('fr')+w.slice(1); }); }
function formatAdresse(s){
  s=String(s==null?'':s).replace(/\s+/g,' ').trim(); if(!s) return s;
  s=s.replace(/\s*,\s*/g,', ');
  var ST={avenue:'av.',ave:'av.',av:'av.',boulevard:'boul.',boul:'boul.',bd:'boul.',rue:'rue',chemin:'ch.',ch:'ch.',route:'rte',rte:'rte',rang:'rang',montee:'mtée',place:'pl.',impasse:'imp.'};
  var PART={de:1,du:1,des:1,la:1,le:1,les:1,l:1,d:1,a:1,au:1,aux:1,et:1,sur:1,sous:1};
  function deacc(w){ return w.toLocaleLowerCase('fr').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\./g,''); }
  function cap(w){ return w?w.charAt(0).toLocaleUpperCase('fr')+w.slice(1):w; }
  var segs=s.split(', ');
  return segs.map(function(seg,si){
    var last=si===segs.length-1;
    return seg.split(' ').filter(Boolean).map(function(w,wi){
      var d=deacc(w);
      if(ST[d]!==undefined) return ST[d];
      if(last && (d==='qc'||d==='quebec')) return 'Qc';
      return w.split('-').map(function(pp,pi){
        if(/\d/.test(pp)) return pp.toLocaleUpperCase('fr');
        var dp=deacc(pp);
        if(dp==='st'||dp==='saint') return 'St';
        if(dp==='ste'||dp==='sainte') return 'Ste';
        if(PART[dp] && !(wi===0 && pi===0)) return dp;
        return cap(pp.toLocaleLowerCase('fr'));
      }).join('-');
    }).join(' ');
  }).join(', ');
}
function normNom(s){ return (s||'').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[.,\-]/g,' ').replace(/\s+/g,' ').trim(); }

// ---- Heures moteur ----
// rec.heures = [{id,date,h,par}] (relevés successifs) ; rec.heuresProchain = compteur
// auquel le prochain entretien est dû. C'est l'écart entre les deux qui donne l'alerte.
function dernierReleve(rec){
  const l = (rec && rec.heures) || [];
  if(!l.length) return null;
  return l.slice().sort((a,b) => String(a.date||'').localeCompare(String(b.date||'')))[l.length-1];
}
function heuresStatus(rec){
  const d = dernierReleve(rec);
  if(!d) return { level:'grey', label:'Aucun relevé', h:null };
  const cible = parseFloat(rec && rec.heuresProchain);
  if(isNaN(cible) || !cible) return { level:'grey', label:d.h+' h', h:d.h };
  const reste = Math.round(cible - d.h);
  if(reste < 0)   return { level:'red',    label:'Entretien dépassé de '+(-reste)+' h', h:d.h, reste:reste };
  if(reste <= 100) return { level:'orange', label:'Entretien dans '+reste+' h',          h:d.h, reste:reste };
  return { level:'green', label:'Prochain entretien dans '+reste+' h', h:d.h, reste:reste };
}

// Fusionne les listes d'événements avec la version serveur avant d'écrire :
// si un collègue a ajouté un bris/une inspection sur la MÊME machine pendant qu'on
// éditait, son entrée est réintégrée au lieu d'être écrasée (dernier-écrit-gagne).
// Les entrées supprimées volontairement sont mémorisées dans rec.del pour ne pas revenir.
function mergeEventLists(rec, srv){
  const del = new Set(rec.del || []);
  ['bris','reparations','inspections','heures'].forEach(f => {
    const loc = rec[f] || [], remote = (srv && srv[f]) || [];
    const ids = new Set(loc.map(x => x && x.id));
    remote.forEach(x => { if(x && x.id && !ids.has(x.id) && !del.has(x.id)) loc.push(x); });
    loc.sort((a,b) => String((b&&b.date)||'').localeCompare(String((a&&a.date)||'')));
    rec[f] = loc;
  });
  return rec;
}
const _myFields = {};   // key -> Set des champs simples modifiés par CET appareil (pour l'auto-réparation)
async function saveMachine(m, rec){
  const key = machineKey(m);
  rec.ident = m.ident||''; rec.nom = m.nom; rec.cat = m.cat;
  // note les champs simples que NOUS modifions (différents du dernier état serveur connu)
  const snap0 = _srvSnap[key] || {};
  SCALAR_FIELDS.forEach(f => {
    if(JSON.stringify(rec[f]!==undefined?rec[f]:null) !== snap0[f]) (_myFields[key]=_myFields[key]||new Set()).add(f);
  });
  setSaveStatus('saving');
  try{
    const r = await storage.get('inv:machine:'+key, true);
    if(r && r.value){
      const srv = JSON.parse(r.value);
      mergeEventLists(rec, srv);
      // Fusion des champs simples (vérif, huile, tune-up, localisation) : si un AUTRE
      // appareil a changé un champ que NOUS n'avons pas touché, on garde sa valeur au
      // lieu de l'écraser avec notre ancienne copie.
      const snap = _srvSnap[key] || {};
      const emptyV = v => v===undefined || v===null || v==='';
      SCALAR_FIELDS.forEach(f => {
        const srvV = JSON.stringify(srv && srv[f]!==undefined ? srv[f] : null);
        const locV = JSON.stringify(rec[f]!==undefined ? rec[f] : null);
        if(srvV !== snap[f] && locV === snap[f]){
          // Un autre admin a changé ce champ après nous. On adopte SA valeur — SAUF si
          // c'est un vide qui effacerait une valeur que NOUS avons posée (copie périmée).
          const sv = srv ? srv[f] : undefined;
          const mineSet = _myFields[key] && _myFields[key].has(f);
          if(!(mineSet && emptyV(sv) && !emptyV(rec[f]))) rec[f] = sv;
        }
      });
    }
  }catch(e){}
  records[key] = rec;
  const res = await storage.set('inv:machine:'+key, JSON.stringify(rec), true);
  if(res){ _srvSnap[key] = snapScalars(rec); _machVerifyCount[key] = 0; scheduleMachineVerify(m, key); }   // nouveau cycle de vérification à chaque sauvegarde
  setSaveStatus(res ? 'ok' : 'err');
}

// ---- Auto-réparation anti-écrasement (même principe que l'inventaire) ----
// Si plusieurs admins enregistrent la MÊME machine dans la même seconde, le dernier
// écrit peut écraser les autres malgré la fusion (fenêtre lecture->écriture).
// Quelques secondes après chaque sauvegarde, on relit la fiche serveur : si un de NOS
// bris/réparations/inspections ou une de NOS valeurs a disparu, on ré-enregistre (fusion).
const _machVerifyTimers = {}; const _machVerifyCount = {};
function scheduleMachineVerify(m, key){
  _machVerifyCount[key] = _machVerifyCount[key] || 0;
  if(_machVerifyCount[key] >= 5) return;                     // plafond anti-boucle (remis à 0 à chaque nouvelle sauvegarde)
  clearTimeout(_machVerifyTimers[key]);
  _machVerifyTimers[key] = setTimeout(async () => {
    try{
      const local = records[key]; if(!local) return;
      const r = await storage.get('inv:machine:'+key, true);
      if(!r || !r.value) return;
      const srv = JSON.parse(r.value); if(!srv) return;
      const srvDel = new Set(srv.del || []);
      let lost = false;
      // nos entrées d'événements présentes localement doivent exister côté serveur
      ['bris','reparations','inspections','heures'].forEach(f => {
        const srvIds = new Set((srv[f]||[]).map(x => x && x.id));
        (local[f]||[]).forEach(x => { if(x && x.id && !srvDel.has(x.id) && !srvIds.has(x.id)) lost = true; });
      });
      // nos champs simples : réparer SEULEMENT si le serveur est revenu à vide alors que
      // nous avions enregistré une valeur (écrasement par une copie périmée). Si un autre
      // admin a mis une AUTRE valeur non vide, c'est un conflit légitime : dernier gagne.
      (_myFields[key] || new Set()).forEach(f => {
        const mine = local[f]; const theirs = srv[f];
        const empty = (v) => v===undefined || v===null || v==='';
        if(!empty(mine) && empty(theirs)) lost = true;
      });
      _machVerifyCount[key]++;
      if(lost){ await saveMachine({ident:local.ident, nom:local.nom, cat:local.cat}, local); }
      else if(_machVerifyCount[key] < 4){ scheduleMachineVerify(m, key); }   // repasse : un écrasement peut arriver après
    }catch(e){}
  }, (1800 + Math.random()*2200) * Math.max(1, (_machVerifyCount[key]||0) * 2));
}

function snapScalars(rec){ const o={}; SCALAR_FIELDS.forEach(f=>{ o[f]=JSON.stringify(rec&&rec[f]!==undefined?rec[f]:null); }); return o; }

// ================== EXTINCTEURS (registre partagé — assignés aux machines) ==================
// Une ligne par extincteur : inv:extincteur:<num> = { num, machineKey, machineNom,
// machineIdent, since, par, statut, history:[] }. Un extincteur = une seule machine.
let extincteurs = {};   // num (string) -> entrée
async function loadExtincteurs(){
  extincteurs = {};
  try{
    const res = await withTimeout(_sb.from('inv_store').select('key,value').like('key','inv:extincteur:%'), 12000, 'ext');
    if(res && Array.isArray(res.data)){
      res.data.forEach(r => { try{ const e = JSON.parse(r.value); if(e && e.num!=null) extincteurs[String(e.num)] = e; }catch(err){} });
    }
  }catch(e){ console.error('loadExtincteurs', e); }
}
function extForMachine(m){
  const k = machineKey(m);
  return Object.values(extincteurs).find(e => e && e.machineKey === k) || null;
}
// Relit la fiche serveur juste avant d'écrire : l'historique des deux appareils est
// fusionné au lieu que le dernier écrase l'autre (assignations simultanées).
async function saveExtincteur(e){
  try{
    const r = await storage.get('inv:extincteur:'+e.num, true);
    if(r && r.value){
      const srv = JSON.parse(r.value);
      if(srv && Array.isArray(srv.history)){
        const seen = new Set((e.history||[]).map(h=>h && (h.date+'|'+h.action)));
        srv.history.forEach(h => { if(h && !seen.has(h.date+'|'+h.action)) (e.history=e.history||[]).push(h); });
        e.history.sort((a,b)=>String((b&&b.date)||'').localeCompare(String((a&&a.date)||'')));
      }
    }
  }catch(err){}
  extincteurs[String(e.num)] = e;
  return await storage.set('inv:extincteur:'+e.num, JSON.stringify(e), true);
}
function extHistoPush(e, action){ e.history = e.history || []; e.history.unshift({ date:new Date().toISOString(), action, par:parLabel() }); }
// Assigne l'extincteur `num` à la machine m ; le retire de son ancienne machine (déplacement)
// et retire l'extincteur déjà présent sur m (remplacement).
async function assignExtincteur(m, num){
  num = String(num).replace(/[^\d]/g,'').replace(/^0+(?=\d)/,'');
  if(!num) return false;
  const k = machineKey(m);
  const actuel = extForMachine(m);
  if(actuel && String(actuel.num) !== num){
    actuel.machineKey = null; actuel.machineNom=''; actuel.machineIdent=''; actuel.statut='stock';
    extHistoPush(actuel, 'Retiré de '+(m.ident||m.nom)+' (remplacé par #'+num+')');
    await saveExtincteur(actuel);
  }
  let e = extincteurs[num] || { num:num, machineKey:null, history:[] };
  const provenance = (e.machineKey && e.machineKey !== k) ? (' — déplacé de '+(e.machineIdent||e.machineNom||'?')) : '';
  e.machineKey = k; e.machineNom = m.nom; e.machineIdent = m.ident||''; e.since = new Date().toISOString(); e.par = parLabel(); e.statut = 'assigne';
  extHistoPush(e, 'Assigné à '+(m.ident?m.ident+' — ':'')+m.nom+provenance);
  const res = await saveExtincteur(e);
  return !!res;
}
async function removeExtincteur(m){
  const e = extForMachine(m); if(!e) return;
  e.machineKey=null; e.machineNom=''; e.machineIdent=''; e.statut='stock';
  extHistoPush(e, 'Retiré de '+(m.ident||m.nom)+' — remis en stock');
  await saveExtincteur(e);
}

// Sélection des machines par équipe (faite dans l'inventaire) + chantier de chaque équipe.
// C'est la source de la localisation/équipe AUTOMATIQUE de chaque machine.
async function loadTeamAssignments(){
  teamMachines = {}; teamChantier = {};
  await Promise.all(teams.map(async t => {
    try{
      const r = await storage.get('inv:machines:'+t.id+':MACHINERIE', true);
      if(r && r.value){ const p = JSON.parse(r.value); if(p && p.set && Array.isArray(p.actifs)) teamMachines[t.id] = p.actifs; }
    }catch(e){}
    try{
      const r2 = await storage.get('inv:info:'+t.id, true);
      if(r2 && r2.value){ const info = JSON.parse(r2.value); if(info && typeof info==='object') teamChantier[t.id] = info; }
    }catch(e){}
  }));
}
// Localisation automatique d'une machine = équipe(s) qui l'ont cochée dans l'inventaire + le chantier de l'équipe.
function autoLocForMachine(m){
  const target = normNom(m.nom);
  const found = teams.filter(t => (teamMachines[t.id]||[]).some(n => normNom(n) === target));
  if(!found.length) return null;
  const info = teamChantier[found[0].id] || {};
  const cbits = [];
  if(info.projet && String(info.projet).trim()) cbits.push('Projet '+String(info.projet).trim());
  if(info.adresse && String(info.adresse).trim()) cbits.push(formatAdresse(info.adresse));
  return { equipe: found.map(x=>x.label).join(', '), chantier: cbits.join(' — '), multi: found.length>1 };
}
function locTextAuto(m){
  const a = autoLocForMachine(m);
  if(!a) return '<span class="muted">Non assignée — coche cette machine dans une équipe de l\'inventaire</span>';
  const bits = [];
  if(a.chantier) bits.push('🏗 '+escapeHtml(a.chantier));
  bits.push('👷 '+escapeHtml(a.equipe));
  return '📍 ' + bits.join(' · ');
}

// ================== STATUT / AFFICHAGE ==================
function machineStatus(m){
  const rec = recFor(m);
  const verif = verifStatus(rec.verif);
  const verifActive = !!(m.vf || (rec.verif && rec.verif.trim()));  // couleur seulement si pertinent
  const openBris = (rec.bris||[]).filter(b => b.statut !== 'resolu').length;
  const openRepar = (rec.reparations||[]).filter(r => r.statut !== 'fait').length;
  const insps = rec.inspections||[];
  const lastInsp = insps.length ? insps[0] : null;
  let maint = null;
  if(m.gas){
    const h=entretienStatus(rec.huile), t=entretienStatus(rec.tuneup);
    const rank={grey:0,green:1,orange:2,red:3};
    maint = (rank[h.level]>=rank[t.level]) ? h : t;
  }
  const hrs = heuresStatus(rec);
  // couleur de bord : pire de (verif si actif), bris ouverts, maintenance, heures moteur
  let edge='';
  const levels=[];
  if(verifActive) levels.push(verif.level);
  if(openBris>0) levels.push('red');
  if(maint) levels.push(maint.level);
  if(hrs.level!=='grey') levels.push(hrs.level);
  if(levels.indexOf('red')!==-1) edge=' edge-red';
  else if(levels.indexOf('orange')!==-1) edge=' edge-yellow';
  else if(levels.indexOf('green')!==-1) edge=' edge-green';
  return { rec, verif, verifActive, openBris, openRepar, lastInsp, maint, hrs, edge };
}
function locText(rec){
  const l = rec && rec.loc;
  if(!l || (!l.chantier && !l.equipe)) return '<span class="muted">Localisation non renseignée</span>';
  const bits=[];
  if(l.chantier) bits.push('🏗 '+escapeHtml(l.chantier));
  if(l.equipe) bits.push('👷 '+escapeHtml(l.equipe));
  let s = '📍 ' + bits.join(' · ');
  if(l.depuis) s += ' <span class="muted">(depuis '+fmtDateFR(l.depuis)+')</span>';
  return s;
}
function pill(level, text){ return '<span class="pill '+(level||'')+'"><span class="dot '+(level||'grey')+'"></span>'+escapeHtml(text)+'</span>'; }
// Identification officielle (liste des équipements) : n° de série et, pour les véhicules, la plaque.
function serieText(m){
  const bits = [];
  if(m && m.serie)  bits.push('N° série '+escapeHtml(m.serie));
  if(m && m.plaque) bits.push('Plaque '+escapeHtml(m.plaque));
  return bits.length ? '<div class="c-serie">'+bits.join(' · ')+'</div>' : '';
}

function renderSummary(){
  let verifDue=0, brisOpen=0, insp0=0, hrsDue=0;
  const vis = visibleCatalog();
  vis.forEach(m => {
    const st = machineStatus(m);
    if(st.verifActive && (st.verif.level==='red' || st.verif.level==='orange')) verifDue++;
    if(st.openBris>0) brisOpen++;
    if(!st.lastInsp) insp0++;
    if(st.hrs.level==='red' || st.hrs.level==='orange') hrsDue++;
  });
  document.getElementById('summary').innerHTML =
    '<div class="sum-chip'+(verifDue?' warn':'')+'"><b>'+verifDue+'</b>Vérif. à faire / dues</div>' +
    '<div class="sum-chip'+(brisOpen?' alert':'')+'"><b>'+brisOpen+'</b>Machines avec bris</div>' +
    '<div class="sum-chip'+(hrsDue?' alert':'')+'"><b>'+hrsDue+'</b>Entretiens dus (heures)</div>' +
    '<div class="sum-chip"><b>'+vis.length+'</b>Machines suivies</div>';
}
// Pastilles par onglet : rouge = machines en alerte, jaune = à surveiller, vert = tout est beau
function catAlert(cat){
  let red=0, orange=0, green=0;
  visibleCatalog().filter(m => m.cat===cat).forEach(m => {
    const e = machineStatus(m).edge;
    if(e===' edge-red') red++; else if(e===' edge-yellow') orange++; else if(e===' edge-green') green++;
  });
  return { red, orange, green };
}
function renderTabs(){
  document.getElementById('tabs').innerHTML = CATS.map(c => {
    const a = catAlert(c);
    const badge = a.red ? '<span class="tcount">'+a.red+'</span>'
                : (a.orange ? '<span class="tcount orange">'+a.orange+'</span>'
                : (a.green ? '<span class="tdot"></span>' : ''));
    return '<button type="button" class="tab'+(c===currentCat?' active':'')+'" data-cat="'+c+'">'+c+badge+'</button>';
  }).join('');
  document.querySelectorAll('#tabs .tab').forEach(t => t.onclick = () => { currentCat=t.getAttribute('data-cat'); document.getElementById('search').value=''; renderTabs(); renderList(); });
}
// ================== FILTRAGE PAR ÉQUIPE / CHANTIER ==================
// L'utilisateur ne voit que la machinerie de SON équipe (celle choisie dans l'inventaire,
// stockée dans inv:myTeam). En mode admin, on voit toutes les machines.
function isDeviceAdmin(){ try{ return localStorage.getItem('inv:isAdmin') === '1'; }catch(e){ return false; } }
function getMyTeam(){ try{ return localStorage.getItem('inv:myTeam') || null; }catch(e){ return null; } }
// Une machine est-elle sur le chantier de l'équipe donnée ? (cochée par cette équipe dans l'inventaire)
function machineInTeam(m, teamId){
  const target = normNom(m.nom);
  return (teamMachines[teamId]||[]).some(n => normNom(n) === target);
}
// Catalogue visible pour l'utilisateur courant : tout si admin, sinon la machinerie de son équipe.
function visibleCatalog(){
  if(isDeviceAdmin()) return catalog;
  const myTeam = getMyTeam();
  if(!myTeam) return [];   // pas d'équipe choisie -> rien (message d'invitation affiché ailleurs)
  return catalog.filter(m => machineInTeam(m, myTeam));
}

function renderList(){
  const list = document.getElementById('list');
  const q = normNom(document.getElementById('search').value);
  const base = visibleCatalog();
  // Non-admin sans équipe choisie : on invite à sélectionner son équipe dans l'inventaire.
  if(!isDeviceAdmin() && !getMyTeam()){
    document.getElementById('count').textContent = '';
    list.innerHTML = '<div class="empty" style="line-height:1.6;">👷 Choisis d\'abord ton équipe pour voir la machinerie de ton chantier.<br><br>' +
      'Ouvre l\'app <b>Inventaire</b>, onglet <b>Machinerie</b>, et sélectionne ton équipe (le marteau 🔨 apparaît). Tu verras ensuite ici les machines de ton chantier.</div>';
    return;
  }
  let shown;
  if(q){ shown = base.filter(m => normNom(m.nom).includes(q) || normNom(m.ident).includes(q)); }
  else { shown = base.filter(m => m.cat === currentCat); }
  document.getElementById('count').textContent = shown.length + ' machine' + (shown.length>1?'s':'') + (q ? ' trouvée'+(shown.length>1?'s':'') : ' — ' + currentCat);
  if(!shown.length){ list.innerHTML = '<div class="empty">Aucune machine' + (isDeviceAdmin()?'':' sur ton chantier') + ' dans cette catégorie.</div>'; return; }
  list.innerHTML = shown.map(m => {
    const st = machineStatus(m);
    const pills = [];
    pills.push(pill(st.verifActive ? st.verif.level : 'grey', 'Vérif : ' + (st.verifActive ? st.verif.label : 'n/a')));
    if(st.openBris>0) pills.push(pill('red', '⚠️ '+st.openBris+' bris'));
    if(st.openRepar>0) pills.push(pill('orange', '🛠 '+st.openRepar+' répar.'));
    pills.push(pill(st.lastInsp?'green':'grey', 'Insp : ' + (st.lastInsp ? fmtDateFR(st.lastInsp.date) : 'aucune')));
    if(st.maint) pills.push(pill(st.maint.level, '🛢 '+st.maint.label));
    if(st.hrs.h!==null) pills.push(pill(st.hrs.level, '⏱ '+st.hrs.label));
    if(m.cat==='Lift' || m.cat==='Fraco'){ const e = extForMachine(m); pills.push(pill(e?'green':'red', e ? ('🧯 #'+e.num) : '🧯 aucun')); }
    return '<div class="card'+st.edge+'" data-key="'+escapeAttr(machineKey(m))+'">' +
      '<div class="c-top"><span class="c-ident">'+escapeHtml(m.ident||'—')+'</span>' +
        '<span class="c-nom">'+escapeHtml(m.nom)+'</span>' + (q?'<span class="c-cat">'+escapeHtml(m.cat)+'</span>':'') + '</div>' +
      '<div class="c-loc">'+locTextAuto(m)+'</div>' +
      serieText(m) +
      '<div class="c-pills">'+pills.join('')+'</div>' +
    '</div>';
  }).join('');
  list.querySelectorAll('.card').forEach(c => c.onclick = () => openDetail(c.getAttribute('data-key')));
}

function openDetail(key){

  const rec = records[key] || blankRec(m);

  const st = machineStatus(m);

    '<div class="e-desc">'+escapeHtml(r.desc||'')+ (r.cout?(' <span class="muted">· '+escapeHtml(r.cout)+' $</span>'):'') +'</div>' +
    '<div class="e-actions"><span class="mini-link" data-rep-cyc="'+r.id+'">↻ Changer statut</span><span class="mini-link danger" data-rep-del="'+r.id+'">Supprimer</span></div></div>'
  ).join('') : '<div class="empty-sec">Aucune réparation enregistrée.</div>';
  const repSection =
    '<details class="sec"><summary>🛠 Réparations '+(st.openRepar?'<span class="tag orange" style="margin-left:6px;">'+st.openRepar+' en cours</span>':'')+'<span class="chev">▶</span></summary><div class="sec-body">' +
      '<div class="row2"><input class="inp" type="date" id="repDate" value="'+todayInput()+'"><input class="inp" id="repCout" inputmode="decimal" placeholder="Coût $ (optionnel)"></div>' +

  let entretienSection = '';
  if(m.gas){
    const h=entretienStatus(rec.huile), t=entretienStatus(rec.tuneup);

  }

  // --- Extincteur assigné (Lift / Fraco) ---
  let extincteurSection = '';

    const e = extForMachine(m);
    const cur = e

    serieText(m) +
    locSection + extincteurSection + verifSection + heuresSection + inspSection + brisSection + repSection + entretienSection;

  document.getElementById('overlay').classList.add('show');

  wireDetail(m, key);
}

function wireDetail(m, key){
  const rec = records[key];
  const reopen = () => {
    // Mémorise quelles sections (Bris, Réparations…) étaient dépliées pour les rouvrir
    // après le rafraîchissement — avant, chaque enregistrement repliait tout.
    const openSecs = [];
    document.querySelectorAll('#modalBox details.sec').forEach((d,i) => { if(d.open) openSecs.push(i); });
    renderSummary(); renderTabs(); renderList(); openDetail(key);
    document.querySelectorAll('#modalBox details.sec').forEach((d,i) => { if(openSecs.indexOf(i)!==-1) d.open = true; });
  };

  // Extincteur assigné (Lift/Fraco) — assignation / remplacement / retrait
  const extAssign = document.getElementById('extAssign');
  if(extAssign) extAssign.onclick = async () => {
    const cur = extForMachine(m);
    const saisie = prompt('Numéro de l\'extincteur à assigner à '+(m.ident||m.nom)+' :', cur ? String(cur.num) : '');
    if(saisie == null) return;
    const num = String(saisie).replace(/[^\d]/g,'').replace(/^0+(?=\d)/,'');   // même normalisation que l'assignation (« 05 » = « 5 »)
    if(!num){ alert('Entre un numéro d\'extincteur (ex. 12).'); return; }
    const other = Object.values(extincteurs).find(x => x && String(x.num) === num && x.machineKey && x.machineKey !== machineKey(m));
    if(other && !confirm('L\'extincteur #'+num+' est présentement sur '+(other.machineIdent||other.machineNom||'une autre machine')+'.\nLe déplacer sur '+(m.ident||m.nom)+' ?')) return;
    const ok = await assignExtincteur(m, num);
    if(ok) reopen(); else alert('Enregistrement impossible. Vérifie la connexion et réessaie.');
  };
  const extRemove = document.getElementById('extRemove');
  if(extRemove) extRemove.onclick = async () => {
    if(!confirm('Retirer l\'extincteur de '+(m.ident||m.nom)+' ? Il sera remis en stock.')) return;
    await removeExtincteur(m); reopen();
  };

  // (La localisation & l'équipe sont automatiques — plus de déplacement manuel ici.)
  // Vérif annuelle
  const vfIn = document.getElementById('vfInput');
  if(vfIn) vfIn.addEventListener('input', () => { const p=vfIn.selectionStart; const before=vfIn.value; vfIn.value=formatVerif(vfIn.value); const delta=vfIn.value.length-before.length; try{ vfIn.setSelectionRange(Math.max(0,p+delta), Math.max(0,p+delta)); }catch(e){} });   // garde le curseur en place pendant le reformatage
  const vfSave = document.getElementById('vfSave');
  if(vfSave) vfSave.onclick = async () => { rec.verif = formatVerif(document.getElementById('vfInput').value); await saveMachine(m, rec); reopen(); };
  // Bris
  const brisAdd = document.getElementById('brisAdd');
  if(brisAdd) brisAdd.onclick = async () => {
    const desc=document.getElementById('brisDesc').value.trim(); const date=document.getElementById('brisDate').value;
    if(!desc){ alert('Décris le bris.'); return; }
    rec.bris = rec.bris||[]; rec.bris.unshift({ id:uid(), date, desc, statut:'ouvert', par:parLabel() });
    await saveMachine(m, rec); reopen();
  };
  document.querySelectorAll('[data-bris-res]').forEach(el => el.onclick = async () => { const id=el.getAttribute('data-bris-res'); const b=(rec.bris||[]).find(x=>x.id===id); if(b){ b.statut='resolu'; b.resoluDate=new Date().toISOString(); } await saveMachine(m, rec); reopen(); });
  document.querySelectorAll('[data-bris-del]').forEach(el => el.onclick = async () => { if(!confirm('Supprimer ce bris ?')) return; const id=el.getAttribute('data-bris-del'); rec.bris=(rec.bris||[]).filter(x=>x.id!==id); (rec.del=rec.del||[]).push(id); await saveMachine(m, rec); reopen(); });
  // Réparations
  const repAdd = document.getElementById('repAdd');
  if(repAdd) repAdd.onclick = async () => {
    const desc=document.getElementById('repDesc').value.trim(); const date=document.getElementById('repDate').value; const cout=document.getElementById('repCout').value.trim();
    if(!desc){ alert('Décris la réparation.'); return; }
    rec.reparations = rec.reparations||[]; rec.reparations.unshift({ id:uid(), date, desc, cout, statut:'a_faire', par:parLabel() });
    await saveMachine(m, rec); reopen();
  };
  document.querySelectorAll('[data-rep-cyc]').forEach(el => el.onclick = async () => { const id=el.getAttribute('data-rep-cyc'); const r=(rec.reparations||[]).find(x=>x.id===id); if(r){ r.statut = r.statut==='a_faire'?'en_cours':(r.statut==='en_cours'?'fait':'a_faire'); } await saveMachine(m, rec); reopen(); });
  document.querySelectorAll('[data-rep-del]').forEach(el => el.onclick = async () => { if(!confirm('Supprimer cette réparation ?')) return; const id=el.getAttribute('data-rep-del'); rec.reparations=(rec.reparations||[]).filter(x=>x.id!==id); (rec.del=rec.del||[]).push(id); await saveMachine(m, rec); reopen(); });
  // Inspections
  const inspAdd = document.getElementById('inspAdd');
  if(inspAdd) inspAdd.onclick = async () => {
    const date=document.getElementById('inspDate').value; const conforme=document.getElementById('inspConf').value; const note=document.getElementById('inspNote').value.trim();
    rec.inspections = rec.inspections||[]; rec.inspections.unshift({ id:uid(), date, conforme, note, par:parLabel() });
    await saveMachine(m, rec); reopen();
  };
  document.querySelectorAll('[data-insp-del]').forEach(el => el.onclick = async () => { if(!confirm('Supprimer cette inspection ?')) return; const id=el.getAttribute('data-insp-del'); rec.inspections=(rec.inspections||[]).filter(x=>x.id!==id); (rec.del=rec.del||[]).push(id); await saveMachine(m, rec); reopen(); });
  // Heures moteur
  const hrAdd = document.getElementById('hrAdd');
  if(hrAdd) hrAdd.onclick = async () => {
    const v = parseInt(String(document.getElementById('hrVal').value).replace(/[^\d]/g,''), 10);
    if(isNaN(v) || v<=0){ alert('Entre le nombre d\'heures lu sur le compteur.'); return; }
    const dernier = dernierReleve(rec);
    if(dernier && v < dernier.h && !confirm('Le dernier relevé était de '+dernier.h+' h. Enregistrer quand même '+v+' h ?')) return;
    rec.heures = rec.heures||[];
    rec.heures.push({ id:uid(), date:document.getElementById('hrDate').value, h:v, par:parLabel() });
    await saveMachine(m, rec); reopen();
  };
  const hrNextSave = document.getElementById('hrNextSave');
  if(hrNextSave) hrNextSave.onclick = async () => {
    rec.heuresProchain = String(document.getElementById('hrNext').value).replace(/[^\d]/g,'');
    await saveMachine(m, rec); reopen();
  };
  document.querySelectorAll('[data-hr-del]').forEach(el => el.onclick = async () => {
    if(!confirm('Supprimer ce relevé ?')) return;
    const id = el.getAttribute('data-hr-del');
    rec.heures = (rec.heures||[]).filter(x => x.id !== id); (rec.del=rec.del||[]).push(id);
    await saveMachine(m, rec); reopen();
  });
  // Entretien moteur
  const entSave = document.getElementById('entSave');
  if(entSave) entSave.onclick = async () => { rec.huile=document.getElementById('entHuile').value.trim(); rec.tuneup=document.getElementById('entTune').value.trim(); await saveMachine(m, rec); reopen(); };
}

/* ============================================================
   EXPORT EXCEL (Ctrl+X révèle le bouton — même principe que l'inventaire)
   ============================================================ */
function xlsSheet(aoa, meta, widths, leftCols){
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = widths.map(w => ({wch:w}));
  ws['!freeze'] = { xSplit:0, ySplit:1 };
  ws['!autofilter'] = { ref: XLSX.utils.encode_range({s:{r:0,c:0}, e:{r:aoa.length-1, c:widths.length-1}}) };
  for(let r=0; r<aoa.length; r++){
    for(let c=0; c<widths.length; c++){
      const addr = XLSX.utils.encode_cell({r,c});
      if(!ws[addr]) ws[addr] = { t:'s', v:'' };
      const m = meta[r] || {};
      let fill='FFFFFF', bold=false, fontColor='000000';
      if(m.header){ fill='232221'; bold=true; fontColor='FFFFFF'; }
      else if(m.cat){ fill='D9D2C2'; bold=true; }
      else if(m.couleur==='red') fill='F4CCCC';
      else if(m.couleur==='yellow') fill='FFF2CC';
      else if(m.couleur==='green') fill='D9EAD3';
      ws[addr].s = {
        fill:{ patternType:'solid', fgColor:{rgb:fill} },
        font:{ name:'Arial', sz:m.header?11:10, bold:bold, color:{rgb:fontColor} },
        alignment:{ vertical:'center', horizontal:(leftCols.indexOf(c)!==-1)?'left':'center', wrapText:!!m.header },
        border:{ top:{style:'thin',color:{rgb:'CCCCCC'}}, bottom:{style:'thin',color:{rgb:'CCCCCC'}},
                 left:{style:'thin',color:{rgb:'CCCCCC'}}, right:{style:'thin',color:{rgb:'CCCCCC'}} }
      };
    }
  }
  return ws;
}
// Instantané de l'état des machines, pour la feuille « Résumé modifs » (comme l'inventaire)
function machSnapshotNow(){
  const snap = {};
  catalog.forEach(m => {
    const r = recFor(m) || {}; const loc = autoLocForMachine(m) || {};
    snap[machineKey(m)] = {
      nom:m.nom, verif:r.verif||'', chantier:loc.chantier||'', equipe:loc.equipe||'',
      huile:r.huile||'', tuneup:r.tuneup||'',
      brisOuverts:(r.bris||[]).filter(b=>b.statut!=='resolu').length,
      bris:(r.bris||[]).length,
      rep:(r.reparations||[]).length,
      repFaites:(r.reparations||[]).filter(x=>x.statut==='fait').length,
      insp:(r.inspections||[]).length
    };
  });
  return snap;
}
function machDiffRows(prev, now){
  const rows = [];
  const push = (k, changement, avant, apres, couleur) => {
    const ident = k.indexOf('nom:')===0 ? '—' : k;
    const nom = (now[k]||prev[k]||{}).nom || '';
    rows.push({ row:[ident, nom, changement, avant, apres], couleur });
  };
  Object.keys(now).forEach(k => {
    const p = prev[k], n = now[k];
    if(!p){ push(k, 'Nouvelle machine', '', '', 'yellow'); return; }
    if(p.verif !== n.verif){ const vs = verifStatus(n.verif); push(k, 'Vérif annuelle', p.verif||'—', n.verif||'—', vs?vs.level.replace('orange','yellow'):null); }
    if(p.chantier !== n.chantier || p.equipe !== n.equipe){
      push(k, 'Déplacement', [p.chantier,p.equipe].filter(Boolean).join(' · ')||'—', [n.chantier,n.equipe].filter(Boolean).join(' · ')||'—', 'yellow');
    }
    if(n.brisOuverts > p.brisOuverts) push(k, 'Nouveau bris', p.brisOuverts+' ouvert(s)', n.brisOuverts+' ouvert(s)', 'red');
    if(n.brisOuverts < p.brisOuverts) push(k, 'Bris résolu', p.brisOuverts+' ouvert(s)', n.brisOuverts+' ouvert(s)', 'green');
    if(n.rep > p.rep) push(k, 'Réparation ajoutée', p.rep, n.rep, 'yellow');
    if(n.repFaites > p.repFaites) push(k, 'Réparation faite', p.repFaites, n.repFaites, 'green');
    if(n.insp > p.insp) push(k, 'Inspection(s) +'+(n.insp-p.insp), p.insp, n.insp, 'green');
    if(p.huile !== n.huile) push(k, 'Huile', p.huile||'—', n.huile||'—', 'green');
    if(p.tuneup !== n.tuneup) push(k, 'Tune-up', p.tuneup||'—', n.tuneup||'—', 'green');
  });
  return rows;
}
// Chargement à la demande de la librairie Excel (~1 Mo) : uniquement lors d'un export/import.
let _xlsxLoading = null;
function ensureXLSX(){
  if(window.XLSX) return Promise.resolve();
  if(_xlsxLoading) return _xlsxLoading;
  _xlsxLoading = new Promise(function(res, rej){
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js';
    s.onload = function(){ res(); };
    s.onerror = function(){ _xlsxLoading = null; rej(new Error('xlsx')); };
    document.head.appendChild(s);
  });
  return _xlsxLoading;
}
async function exporterExcel(){
  const btn = document.getElementById('exportBtn');
  const old = btn ? btn.textContent : '';
  if(btn){ btn.textContent='...'; btn.disabled=true; }
  try{
    try{ await ensureXLSX(); }catch(e){ alert('Impossible de charger le module Excel. Vérifie ta connexion et réessaie.'); return; }
    const wb = XLSX.utils.book_new();
    const edgeToCouleur = e => e===' edge-red' ? 'red' : (e===' edge-yellow' ? 'yellow' : (e===' edge-green' ? 'green' : null));
    // --- Résumé modifs depuis le dernier export ---
    const snapNow = machSnapshotNow();
    let prevSnap = null;
    try{ const r = await storage.get('inv:machSnapshot', true); if(r && r.value) prevSnap = JSON.parse(r.value); }catch(e){}
    if(prevSnap && prevSnap.data){
      const diffs = machDiffRows(prevSnap.data, snapNow);
      const aoa=[['Ident','Machine','Changement','Avant','Après']], meta=[{header:true}];
      const depuis = prevSnap.meta && prevSnap.meta.date ? new Date(prevSnap.meta.date).toLocaleString('fr-CA') : '—';
      aoa.push(['Depuis le dernier export : '+depuis, '', '', '', '']); meta.push({cat:true});
      if(diffs.length){ diffs.forEach(dd => { aoa.push(dd.row); meta.push({couleur:dd.couleur}); }); }
      else { aoa.push(['Aucune modification.', '', '', '', '']); meta.push({}); }
      XLSX.utils.book_append_sheet(wb, xlsSheet(aoa, meta, [10,28,22,26,26], [1,3,4]), 'Résumé modifs');
    }
    // --- Une feuille par type de machine ---
    const H = ['Ident','Machine','N° série','Plaque','Chantier','Équipe','Vérif annuelle','Statut vérif','Bris ouverts','Répar. en cours','Dern. inspection','Huile','Tune-up','Heures','Prochain entretien (h)','État heures','Extincteur'];
    const W = [8,30,20,13,26,13,14,24,12,15,15,15,15,10,20,26,12];
    CATS.forEach(cat => {
      const machines = catalog.filter(m => m.cat===cat);
      if(!machines.length) return;
      const aoa=[H], meta=[{header:true}];
      machines.forEach(m => {
        const st = machineStatus(m); const rec = st.rec || {};
        const loc = autoLocForMachine(m) || {};
        aoa.push([
          m.ident||'—', m.nom, m.serie||'', m.plaque||'', loc.chantier||'', loc.equipe||'',
          rec.verif||'', st.verifActive ? st.verif.label : 'n/a',
          st.openBris||0, st.openRepar||0,
          st.lastInsp ? String(st.lastInsp.date).slice(0,10) : '',
          m.gas ? (rec.huile||'') : 'n/a', m.gas ? (rec.tuneup||'') : 'n/a',
          st.hrs.h!==null ? st.hrs.h : '', rec.heuresProchain||'', st.hrs.label,
          (m.cat==='Lift'||m.cat==='Fraco') ? (extForMachine(m) ? ('#'+extForMachine(m).num) : '—') : 'n/a'
        ]);
        meta.push({couleur:edgeToCouleur(st.edge)});
      });
      wb.SheetNames.length; XLSX.utils.book_append_sheet(wb, xlsSheet(aoa, meta, W, [1,2,4,11,12,15]), cat.substring(0,31));
    });
    // --- Feuille Historique : tous les événements ---
    const HH = ['Ident','Machine','Type','Date','Description','Statut','Par'];
    const HW = [8,28,14,12,52,14,22];
    const events = [];
    catalog.forEach(m => {
      const rec = recFor(m); if(!rec) return;
      (rec.histoLoc||[]).forEach(h => events.push({ d:h.date||'', row:[m.ident||'—', m.nom, 'Déplacement', String(h.date||'').slice(0,10), [h.chantier, h.equipe, h.note].filter(Boolean).join(' · '), '', formatNom(h.par)], couleur:null }));
      (rec.bris||[]).forEach(b => events.push({ d:b.date||'', row:[m.ident||'—', m.nom, 'Bris', String(b.date||'').slice(0,10), b.desc||'', b.statut==='resolu'?'Résolu':'Ouvert', formatNom(b.par)], couleur:b.statut==='resolu'?'green':'red' }));
      (rec.reparations||[]).forEach(x => events.push({ d:x.date||'', row:[m.ident||'—', m.nom, 'Réparation', String(x.date||'').slice(0,10), (x.desc||'')+(x.cout?(' ('+x.cout+' $)'):''), x.statut==='fait'?'Fait':(x.statut==='en_cours'?'En cours':'À faire'), formatNom(x.par)], couleur:x.statut==='fait'?'green':'yellow' }));
      (rec.inspections||[]).forEach(i => events.push({ d:i.date||'', row:[m.ident||'—', m.nom, 'Inspection', String(i.date||'').slice(0,10), i.note||'', i.conforme==='non'?'Non conforme':(i.conforme==='oui'?'Conforme':'N/A'), formatNom(i.par)], couleur:i.conforme==='non'?'red':(i.conforme==='oui'?'green':null) }));
      (rec.heures||[]).forEach(h => events.push({ d:h.date||'', row:[m.ident||'—', m.nom, 'Relevé heures', String(h.date||'').slice(0,10), h.h+' h au compteur', '', formatNom(h.par)], couleur:null }));
    });
    if(events.length){
      events.sort((a,b) => String(b.d).localeCompare(String(a.d)));
      const aoa=[HH], meta=[{header:true}];
      events.forEach(ev => { aoa.push(ev.row); meta.push({couleur:ev.couleur}); });
      XLSX.utils.book_append_sheet(wb, xlsSheet(aoa, meta, HW, [1,4]), 'Historique');
    }
    if(!wb.SheetNames.length){ alert('Aucune donnée à exporter.'); return; }
    const d = new Date();
    XLSX.writeFile(wb, 'Machinerie_DMD_' + d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + '.xlsx');
    // Nouvel instantané pour la prochaine comparaison
    try{ await storage.set('inv:machSnapshot', JSON.stringify({ meta:{ date:d.toISOString() }, data:snapNow }), true); }catch(e){}
    if(btn) btn.style.display='none';
  }catch(e){ console.error(e); alert("Une erreur est survenue pendant l'export."); }
  finally{ if(btn){ btn.textContent=old||'⬇ Excel'; btn.disabled=false; } }
}

let teams=[], teamLabelMap={}, myTeamId=null, isAdmin=false;
let catalog=[], catByName={}, identsByName={}, gasByName={}, serieByIdent={}, teamMachines={};
let units=[];              // {unitKey, teamId, name, cat, form, ident}
let currentTab='machines';
let curTeamSel=null;

const STD_TEAMS=[{id:'team_1',label:'Équipe 1'},{id:'team_2',label:'Équipe 2'},{id:'team_3',label:'Équipe 3'},{id:'team_4',label:'Équipe 4'},{id:'team_5',label:'Équipe 5'},{id:'team_6',label:'Équipe 6'},{id:'reno_1',label:'Réno 1'},{id:'reno_2',label:'Réno 2'},{id:'entrepot',label:'Entrepôt'},{id:'administration',label:'Administration'}];

async function loadTeams(){
  try{ const r=await storage.get('inv:teams'); if(r&&r.value){ const p=JSON.parse(r.value); if(Array.isArray(p)&&p.length) teams=p; } }catch(e){}
  if(!teams.length) teams=STD_TEAMS.slice();
  teamLabelMap={}; teams.forEach(t=>teamLabelMap[t.id]=t.label);
}
function teamLabel(id){ return teamLabelMap[id]||id; }

async function loadCatalog(){
  try{ const r=await storage.get('inv:machineCatalog'); if(r&&r.value){ const p=JSON.parse(r.value); if(p&&Array.isArray(p.machines)) catalog=p.machines; } }catch(e){ catalog=[]; }
  catByName={}; identsByName={}; gasByName={};
  catalog.forEach(m=>{ const k=normNom(m.nom); if(!(k in catByName)) catByName[k]=m.cat; if(!(k in gasByName)) gasByName[k]=!!m.gas; if(m.ident && m.serie) serieByIdent[m.ident]=m.serie; (identsByName[k]=identsByName[k]||[]).push(m.ident||''); });
}
async function loadTeamMachines(){
  teamMachines={};
  const rows=await storage.like('inv:machines:');
  rows.forEach(r=>{
    const mm=r.key.match(/^inv:machines:(.+):MACHINERIE$/); if(!mm) return;
    try{ const v=JSON.parse(r.value); if(v&&Array.isArray(v.actifs)) teamMachines[mm[1]]=v.actifs; }catch(e){}
  });
}
function formForMachine(cat,nom){
  const n=normNom(nom);
  if(cat==='Fraco'){ if(/grue/.test(n)) return null; return 'fraco'; }   // la grue n'est pas une plateforme sur mât
  if(cat==='Lift'){ if(/jigger/.test(n)) return null; return 'chariot'; } // un jigger n'est pas un chariot élévateur
  if(cat==='Scie'){
    // « chain » couvre déjà « Chainsaw HUSQVARNA ». On ne se fie plus à la marque seule : la
    // Scie Husqvarna 5HP sur rack est une découpeuse à béton, pas une scie à chaîne.
    if(/chain|chaine|troncon/.test(n)) return 'scie_chaine';
    // Gaz ou électrique : on suit le champ `gas` du catalogue (source unique = l'inventaire),
    // pas le nom. Une scie électrique n'a ni réservoir ni corde de lancement à inspecter.
    const g = gasByName[n];
    if(g === false) return 'scie_elec';
    return 'scie_gaz';
  }
  return null;   // Mixeur, Divers ou inconnu : aucune fiche d'inspection
}
function buildUnits(){
  units=[];
  const orderedTeams=teams.map(t=>t.id);
  orderedTeams.forEach(teamId=>{
    const actifs=teamMachines[teamId]||[]; const occ={};
    actifs.forEach(name=>{
      const k=normNom(name); const cat=catByName[k]; const form=formForMachine(cat,name); if(!form) return;
      occ[k]=(occ[k]||0)+1; const idx=occ[k];
      const ids=identsByName[k]||[]; const ident=ids[idx-1]||(ids[0]||'');
      // Clé STABLE : l'identifiant catalogue (L02, F04, S14…) quand il existe — l'historique
      // ne se détache pas si l'ordre ou le nombre de machines de l'équipe change.
      const stable = ids[idx-1] ? slug(ids[idx-1]) : (slug(name)+'|'+idx);
      units.push({ unitKey:teamId+'|'+stable, teamId, name, cat, form, ident:ident+(ids.length>1&&!ids[idx-1]?(' #'+idx):'') });
    });
  });
}
function unitsForTeam(teamId){ return units.filter(u=>u.teamId===teamId); }

// ---- équipe de l'utilisateur (registre inv:teammember) ----
async function loadMyTeam(){
  const me=myName(); if(!me||me==='Tablette de chantier'||/^Appareil /.test(me)){ myTeamId=null; return; }
  const rows=await storage.like('inv:teammember:'); const members=[];
  rows.forEach(r=>{ try{ const m=JSON.parse(r.value); if(m&&m.nom&&m.teamId) members.push(m); }catch(e){} });
  const hit=members.find(m=>normNom(m.nom)===normNom(me)); if(hit){ myTeamId=hit.teamId; return; }
  const near=members.filter(m=>nomsProches(m.nom,me)); if(near.length===1) myTeamId=near[0].teamId;
}
function canFillTeam(teamId){ return isAdmin || (myTeamId && teamId===myTeamId); }
