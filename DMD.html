/* ============================================================
   EXPORT EXCEL (Ctrl+X révèle le bouton — même principe que l'inventaire)
   ============================================================ */
function xlsSheet(aoa, meta, widths, leftCols){
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = widths.map(w => ({wch:w}));
  ws['!freeze'] = { xSplit:0, ySplit:1 };
  ws['!autofilter'] = { ref: XLSX.utils.encode_range({s:{r:0,c:0}, e:{r:aoa.length-1, c:widths.length-1}}) };
  for(let r=0; r<aoa.length; r++){
    for(let c=0; c<widths.length; c++){
      const addr = XLSX.utils.encode_cell({r,c});
      if(!ws[addr]) ws[addr] = { t:'s', v:'' };
      const m = meta[r] || {};
      let fill='FFFFFF', bold=false, fontColor='000000';
      if(m.header){ fill='232221'; bold=true; fontColor='FFFFFF'; }
      else if(m.cat){ fill='D9D2C2'; bold=true; }
      else if(m.couleur==='red') fill='F4CCCC';
      else if(m.couleur==='yellow') fill='FFF2CC';
      else if(m.couleur==='green') fill='D9EAD3';
      ws[addr].s = {
        fill:{ patternType:'solid', fgColor:{rgb:fill} },
        font:{ name:'Arial', sz:m.header?11:10, bold:bold, color:{rgb:fontColor} },
        alignment:{ vertical:'center', horizontal:(leftCols.indexOf(c)!==-1)?'left':'center', wrapText:!!m.header },
        border:{ top:{style:'thin',color:{rgb:'CCCCCC'}}, bottom:{style:'thin',color:{rgb:'CCCCCC'}},
                 left:{style:'thin',color:{rgb:'CCCCCC'}}, right:{style:'thin',color:{rgb:'CCCCCC'}} }
      };
    }
  }
  return ws;
}
// Chargement à la demande de la librairie Excel (~1 Mo) : uniquement lors d'un export/import.
let _xlsxLoading = null;
function ensureXLSX(){
  if(window.XLSX) return Promise.resolve();
  if(_xlsxLoading) return _xlsxLoading;
  _xlsxLoading = new Promise(function(res, rej){
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js';
    s.onload = function(){ res(); };
    s.onerror = function(){ _xlsxLoading = null; rej(new Error('xlsx')); };
    document.head.appendChild(s);
  });
  return _xlsxLoading;
}
async function exporterExcel(){
  const btn = document.getElementById('exportBtn');
  const old = btn ? btn.textContent : '';
  if(btn){ btn.textContent='...'; btn.disabled=true; }
  try{
    try{ await ensureXLSX(); }catch(e){ alert('Impossible de charger le module Excel. Vérifie ta connexion et réessaie.'); return; }
    if(!people.length && !(formationsData && formationsData.people && formationsData.people.length)){ alert('Aucune donnée à exporter.'); return; }
    const wb = XLSX.utils.book_new();
    // --- Répertoire ---
    if(people.length){
      const aoa=[['Nom','Téléphone','Courriel','Équipe']], meta=[{header:true}];
      people.forEach(p => { aoa.push([formatNom(p.nom)||'—', formatTel(p.tel), p.courriel||'', p.equipe||'']); meta.push({}); });
      XLSX.utils.book_append_sheet(wb, xlsSheet(aoa, meta, [30,16,32,14], [0,2]), 'Répertoire');
    }
    // --- Formations (admins seulement, avec échéances colorées comme à l'écran) ---
    if(isAdmin && formationsData && Array.isArray(formationsData.people) && formationsData.people.length){
      const aoa=[['Employé','Formation','Date','Attestation','Échéance','Statut']], meta=[{header:true}];
      formationsData.people.forEach(pers => {
        (pers.forms||[]).forEach(f => {
          const st = echeanceStatus(f.echeance);
          aoa.push([formatNom(pers.nom), f.formation||'', f.date||'', f.attestation||'', f.echeance||'', st?st.label:'']);
          meta.push({couleur: st ? (st.level==='orange'?'yellow':st.level) : null});
        });
      });
      XLSX.utils.book_append_sheet(wb, xlsSheet(aoa, meta, [30,26,12,12,14,16], [0,1]), 'Formations');
    }
    const d = new Date();
    XLSX.writeFile(wb, 'Infos_DMD_' + d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + '.xlsx');
    if(btn) btn.style.display='none';
  }catch(e){ console.error(e); alert("Une erreur est survenue pendant l'export."); }
  finally{ if(btn){ btn.textContent=old||'⬇ Excel'; btn.disabled=false; } }
}
document.getElementById('exportBtn').addEventListener('click', exporterExcel);
document.addEventListener('keydown', function(e){

/* ==== DMD : Entree = champ suivant + correction auto du champ ==== */
(function(){
  if (window.__dmdEnterNext) return; window.__dmdEnterNext = true;
  var NAV_SCOPE = '.modal, #modalBox, .card, form, .panel, .sheet, .edit-form';
  var SKIP = {button:1,submit:1,reset:1,checkbox:1,radio:1,file:1,range:1,color:1,hidden:1,image:1};
  function navigable(el){
    if(!el || el.tagName !== 'INPUT') return false;
    var ty = (el.getAttribute('type') || 'text').toLowerCase();
    return !SKIP[ty];
  }
  function visibleField(el){
    if(el.disabled || el.readOnly) return false;
    var ty = (el.getAttribute('type') || 'text').toLowerCase();
    if(ty === 'hidden' || ty === 'file') return false;
    return el.offsetParent !== null;
  }
  // Applique la correction d'ecriture au champ : majuscules, nom synchronise de la liste, adresse, telephone
  function fmtField(el){
    if(!el || el.tagName !== 'INPUT') return;
    var kind = el.getAttribute('data-fmt');
    if(!kind && (el.getAttribute('type') || '').toLowerCase() === 'tel') kind = 'tel';
    if(!kind) return;
    var v = el.value; if(v == null) return;
    var out = v;
    try{
      if(kind === 'nom'){
        if(typeof window.__dmdCanonNom === 'function') out = window.__dmdCanonNom(v);
        else if(typeof window.formatNom === 'function') out = window.formatNom(v);
      } else if(kind === 'adresse'){
        if(typeof window.formatAdresse === 'function') out = window.formatAdresse(v);
      } else if(kind === 'tel'){
        if(typeof window.formatTel === 'function') out = window.formatTel(v);
      }
    }catch(_){ out = v; }
    if(out != null && out !== v){
      el.value = out;
      try{ el.dispatchEvent(new Event('input', {bubbles:true})); }catch(_){}
    }
  }
  window.__dmdFmtField = fmtField;
  // Fleche "suivant" sur le clavier mobile, uniquement dans un formulaire
  document.addEventListener('focusin', function(e){
    var t = e.target;
    if(navigable(t) && t.closest(NAV_SCOPE) && !t.hasAttribute('enterkeyhint')){
      t.setAttribute('enterkeyhint', 'next');
    }
  });
  // Corrige aussi quand on quitte le champ autrement (toucher ailleurs, bouton Enregistrer)
  document.addEventListener('focusout', function(e){ fmtField(e.target); });
  // Entree : corrige le champ puis passe au champ suivant du meme formulaire
  document.addEventListener('keydown', function(e){
    if(e.key !== 'Enter' || e.shiftKey || e.altKey || e.ctrlKey || e.metaKey) return;
    if(e.defaultPrevented) return;            // respecte les gestionnaires existants (chat, ajout employe...)
    var t = e.target;
    if(!navigable(t)) return;                  // laisse tranquilles les textarea et les champs de recherche
    var scope = t.closest(NAV_SCOPE);
    if(!scope) return;
    fmtField(t);                               // correction immediate du champ courant
    var fields = [].slice.call(scope.querySelectorAll('input, select, textarea')).filter(visibleField);
    var i = fields.indexOf(t);
    if(i < 0) return;
    e.preventDefault();
    if(i < fields.length - 1){
      var nx = fields[i + 1];
      nx.focus();
      if(nx.select){ try { nx.select(); } catch(_){} }
    } else {
      t.blur();                                // dernier champ : ferme le clavier
    }
  });
})();

function getDeviceUser(){ try{ const v = localStorage.getItem('inv:deviceUser'); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
function isDeviceAdmin(){ try{ return localStorage.getItem('inv:isAdmin') === '1'; }catch(e){ return false; } }
const ADMIN_CODE = 'DMD-ADMIN';
function setAdmin(on){ try{ localStorage.setItem('inv:isAdmin', on?'1':'0'); }catch(e){} }

// ================== CORRESPONDANCE DES NOMS (identique à l'inventaire/infos) ==================
function normNom(s){
  return String(s==null?'':s).toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
}
function nomsProches(n1, n2){
  const w1 = normNom(n1).split(' ').filter(Boolean);
  const w2 = normNom(n2).split(' ').filter(Boolean);
  if(!w1.length || !w2.length) return false;
  const common = w1.filter(w => w2.includes(w));
  return common.length >= Math.min(2, Math.min(w1.length, w2.length));
}

// ================== STATUT SELON LES DATES ==================
// attente = début dans le futur ; encours = aujourd'hui entre début et fin (inclus) ;
// terminé = date de fin passée (retiré des listes actives)
function todayStr(){
  const d = new Date(); const z = n => String(n).padStart(2,'0');
  return d.getFullYear() + '-' + z(d.getMonth()+1) + '-' + z(d.getDate());
}
function statutOf(item){
  const t = todayStr();
  const deb = item.debut || '';
  const fin = item.fin || deb;
  if(fin && fin < t) return 'termine';
  if(deb && deb > t) return 'attente';
  return 'encours';
}
function frDate(s){
  if(!s) return '—';
  const [y,m,d] = s.split('-'); if(!y) return s;
  const mois = ['janv.','févr.','mars','avr.','mai','juin','juill.','août','sept.','oct.','nov.','déc.'];
  return parseInt(d,10) + ' ' + (mois[parseInt(m,10)-1]||'') + ' ' + y;
}
// Heure "HH:MM" -> "7h30"
function frHeure(h){ if(!h) return ''; const p=String(h).split(':'); if(p.length<2) return h; return parseInt(p[0],10)+'h'+p[1]; }
function heuresLine(it){
  const a=frHeure(it.heureDebut), b=frHeure(it.heureFin);
  if(a && b) return 'De <b>'+a+'</b> à <b>'+b+'</b>';
  if(a) return 'À partir de <b>'+a+'</b>';
  if(b) return 'Jusqu\'à <b>'+b+'</b>';
  return '';
}

// ================== RÉPERTOIRE (pour suggérer des noms à l'admin) ==================
let _repNames = [];
async function loadRepNames(){
  try{
    const res = await withTimeout(_sb.from('inv_store').select('key,value').like('key','inv:person:%'), 10000, 'people');
    const rows = (res && res.data) ? res.data : [];
    const names = [];
    rows.forEach(r => { try{ const p = JSON.parse(r.value); if(p && p.nom) names.push(p.nom); }catch(e){} });
    // + employés du fichier de formations (roster) si présent
    try{
      const f = await withTimeout(_sb.from('inv_store').select('value').eq('key','inv:formations').maybeSingle(), 8000, 'form');
      if(f && f.data && f.data.value){ const fp = JSON.parse(f.data.value); if(fp && Array.isArray(fp.people)) fp.people.forEach(p => { if(p.nom) names.push(p.nom); }); }
    }catch(e){}
    _repNames = Array.from(new Set(names)).sort((a,b)=>a.localeCompare(b,'fr'));
  }catch(e){ _repNames = []; }
}

// ================== RENDU DES LISTES ==================
let _items = [];
function render(){
  const admin = isDeviceAdmin();
  document.getElementById('addBtn').style.display = admin ? 'block' : 'none';
  const at=document.getElementById('admToggle'); if(at){ at.textContent = admin ? '🔑 Admin activé' : '🔒 Admin'; at.classList.toggle('on', admin); }

  const notice = document.getElementById('notice');
  if(admin){ notice.style.display=''; notice.innerHTML = '🔑 <b>Mode admin</b> — tu peux ajouter, modifier ou retirer des formations. Chaque employé inscrit verra un rappel à l\'ouverture de l\'application jusqu\'à la fin de sa formation.'; }
  else{ notice.style.display='none'; }

  const active = _items.filter(it => statutOf(it) !== 'termine');
  const encours = active.filter(it => statutOf(it) === 'encours');
  const attente = active.filter(it => statutOf(it) === 'attente');
  encours.sort((a,b)=>(a.fin||'').localeCompare(b.fin||''));
  attente.sort((a,b)=>(a.debut||'').localeCompare(b.debut||''));

  const c = document.getElementById('content');
  let html = '';

  html += '<div class="section-title"><span class="dot encours"></span>En cours</div><div class="list">';
  html += encours.length ? encours.map(cardHtml).join('') : '<div class="empty">Aucune formation en cours.</div>';
  html += '</div>';

  html += '<div class="section-title"><span class="dot attente"></span>En attente</div><div class="list">';
  html += attente.length ? attente.map(cardHtml).join('') : '<div class="empty">Aucune formation en attente.</div>';
  html += '</div>';

  c.innerHTML = html;

  if(admin){
    c.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openModal(b.getAttribute('data-edit')));
    c.querySelectorAll('[data-del]').forEach(b => b.onclick = () => removeItem(b.getAttribute('data-del')));
  }
}
function cardHtml(it){
  const st = statutOf(it);
  const admin = isDeviceAdmin();
  const emps = (it.employes||[]).map(n => '<span class="emp-chip">'+escapeHtml(formatNom(n))+'</span>').join('');
  return '<div class="card">' +
    '<div><span class="type">'+escapeHtml(it.type||'Formation')+'</span>' +
      '<span class="badge '+st+'">'+(st==='encours'?'En cours':'En attente')+'</span></div>' +
    '<div class="meta">📍 <b>'+escapeHtml(it.lieu||'—')+'</b><br>' +
      '🗓️ Du <b>'+frDate(it.debut)+'</b> au <b>'+frDate(it.fin)+'</b>' +
      (heuresLine(it) ? '<br>🕐 '+heuresLine(it) : '') +
      (it.notes ? '<br>📝 '+escapeHtml(it.notes) : '') + '</div>' +
    (emps ? '<div class="emps">'+emps+'</div>' : '<div class="meta" style="font-style:italic;color:var(--logo-grey);">Aucun employé inscrit.</div>') +
    (admin ? '<div class="actions"><button class="btn-edit" data-edit="'+it.id+'">✎ Modifier</button><button class="btn-del" data-del="'+it.id+'">🗑 Retirer</button></div>' : '') +
    '</div>';
}

// ================== MODALE ADMIN ==================
let _editing = null;
let _selEmps = [];
function openModal(id){
  _editing = id || null;
  _selEmps = [];
  const it = id ? _items.find(x => x.id === id) : null;
  document.getElementById('modalTitle').textContent = it ? 'Modifier la formation' : 'Nouvelle formation';
  document.getElementById('fType').value  = it ? (it.type||'')  : '';
  document.getElementById('fLieu').value  = it ? (it.lieu||'')  : '';
  document.getElementById('fDebut').value = it ? (it.debut||'') : '';
  document.getElementById('fFin').value   = it ? (it.fin||'')   : '';
  document.getElementById('fHDebut').value = it ? (it.heureDebut||'') : '';
  document.getElementById('fHFin').value   = it ? (it.heureFin||'')   : '';
  document.getElementById('fNotes').value = it ? (it.notes||'') : '';
  _selEmps = it ? (it.employes||[]).slice() : [];
  document.getElementById('fEmpInput').value = '';
  document.getElementById('fSuggest').style.display = 'none';
  document.getElementById('fError').textContent = '\u00a0';
  renderSelEmps();
  document.getElementById('overlay').style.display = 'flex';
}
function closeModal(){ document.getElementById('overlay').style.display = 'none'; }
function renderSelEmps(){
  document.getElementById('fEmpSelected').innerHTML = _selEmps.map((n,i) =>
    '<span class="chip">'+escapeHtml(formatNom(n))+' <span class="x" data-rm="'+i+'">✕</span></span>').join('');
  document.querySelectorAll('#fEmpSelected .x').forEach(x => x.onclick = () => {
    _selEmps.splice(parseInt(x.getAttribute('data-rm'),10),1); renderSelEmps();
  });
}
function addEmp(name){
  let clean = String(name||'').replace(/\s+/g,' ').trim();
  if(!clean) return;
  clean = (typeof window.__dmdCanonNom === 'function') ? window.__dmdCanonNom(clean) : formatNom(clean);
  if(_selEmps.some(n => normNom(n) === normNom(clean))) return;
  _selEmps.push(clean); renderSelEmps();
  document.getElementById('fEmpInput').value = '';
  document.getElementById('fSuggest').style.display = 'none';
}
function showSuggest(q){
  const box = document.getElementById('fSuggest');
  const t = normNom(q);
  if(!t){ box.style.display='none'; return; }
  const matches = _repNames.filter(n => normNom(n).includes(t) && !_selEmps.some(s => normNom(s)===normNom(n))).slice(0,8);
  if(!matches.length){ box.style.display='none'; return; }
  box.innerHTML = matches.map(n => '<div data-n="'+escapeHtml(n)+'">'+escapeHtml(formatNom(n))+'</div>').join('');
  box.style.display='';
  box.querySelectorAll('div').forEach(d => d.onclick = () => addEmp(d.getAttribute('data-n')));
}
async function saveItem(){
  const type  = document.getElementById('fType').value.replace(/\s+/g,' ').trim();
  const lieu  = document.getElementById('fLieu').value.replace(/\s+/g,' ').trim();
  const debut = document.getElementById('fDebut').value;
  const fin   = document.getElementById('fFin').value;
  const heureDebut = document.getElementById('fHDebut').value;
  const heureFin   = document.getElementById('fHFin').value;
  const notes = document.getElementById('fNotes').value.trim();
  const err = document.getElementById('fError');

  if(!type){ err.textContent = 'Indique le type de formation.'; return; }
  if(!debut){ err.textContent = 'La date de début est obligatoire.'; return; }
  if(!fin){ err.textContent = 'La date de fin est obligatoire.'; return; }
  if(fin < debut){ err.textContent = 'La date de fin doit être après la date de début.'; return; }
  if(!_selEmps.length){ err.textContent = 'Ajoute au moins un employé inscrit.'; return; }

  const rec = { id:_editing || ('f_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)),
    type, lieu, debut, fin, heureDebut, heureFin, notes, employes:_selEmps.slice() };

  const btn = document.getElementById('fSave'); btn.textContent = 'Enregistrement…'; btn.disabled = true;
  // Fusion : on relit le plan serveur juste avant d'écrire et on n'y applique QUE cette
  // formation (par id) — deux admins qui ajoutent/modifient en même temps ne s'écrasent plus.
  const fresh = await loadPlan();
  const i = fresh.findIndex(x => x.id === rec.id);
  if(i >= 0) fresh[i] = rec; else fresh.push(rec);
  const ok = await savePlan(fresh);
  btn.textContent = 'Enregistrer'; btn.disabled = false;
  if(!ok){ err.textContent = 'Échec de l\'enregistrement. Réessaie.'; return; }
  _items = fresh;                                    // on ne met la mémoire à jour QU'après le succès
  closeModal(); render();
}
async function removeItem(id){
  const it = _items.find(x => x.id === id); if(!it) return;
  if(!confirm('Retirer la formation « '+(it.type||'')+' » ?\nElle disparaîtra pour tous et les rappels associés cesseront.')) return;
  const fresh = (await loadPlan()).filter(x => x.id !== id);   // fusion : suppression par id sur la version serveur
  const ok = await savePlan(fresh);
  if(ok) _items = fresh; else alert('Échec de la suppression — réessaie.');
  render();
}

// ================== INIT ==================
document.getElementById('addBtn').onclick = () => openModal(null);
document.getElementById('admToggle').onclick = async () => {
  if(isDeviceAdmin()){ setAdmin(false); render(); }
  else {
    const c = prompt('Code admin :'); if(c==null) return;
    if(c.trim()===ADMIN_CODE){ setAdmin(true); try{ if(!_repNames.length) await loadRepNames(); }catch(e){} render(); }
    else alert('Code incorrect.');
  }
};
document.getElementById('fCancel').onclick = closeModal;
document.getElementById('fSave').onclick = saveItem;
document.getElementById('fEmpAdd').onclick = () => addEmp(document.getElementById('fEmpInput').value);
document.getElementById('fEmpInput').addEventListener('input', e => showSuggest(e.target.value));
document.getElementById('fEmpInput').addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); addEmp(e.target.value); } });
document.getElementById('overlay').addEventListener('click', e => { if(e.target.id==='overlay') closeModal(); });

// ================== EXPORT GLOBAL (accueil) ==================
// Fournit UNE page Excel pour cette tuile : une ligne par employé inscrit à une
// formation, tout l'historique (les formations terminées sont incluses, alors
// qu'elles sont masquées à l'écran).
window.__dmdFlatSheet = async function(){
  const items = await loadPlan();
  const H = ['Employé','Type de formation','Lieu','Date début','Date fin','Durée (j)','Heure début','Heure fin','Statut','Nb inscrits','Tous les inscrits','Notes'];
  const aoa=[H], meta=[{header:true}], lignes=[];
  const LBL = { termine:'Terminée', encours:'En cours', attente:'En attente' };
  (items||[]).forEach(it=>{
    if(!it) return;
    const st = statutOf(it);
    const deb = it.debut||'', fin = it.fin||deb;
    let duree = '';
    if(deb && fin){ const a=new Date(deb+'T00:00:00'), b=new Date(fin+'T00:00:00'); if(!isNaN(a)&&!isNaN(b)) duree = Math.round((b-a)/86400000)+1; }
    const emps = Array.isArray(it.employes) ? it.employes : [];
    const tous = emps.map(formatNom).join(', ');
    const liste = emps.length ? emps : [''];
    liste.forEach(nom=>{
      lignes.push({ d:deb, st:st, row:[ formatNom(nom)||'(aucun inscrit)', it.type||'Formation', it.lieu||'', deb, fin, duree, it.heureDebut||'', it.heureFin||'', LBL[st]||st, emps.length, tous, it.notes||'' ] });
    });
  });
  lignes.sort((a,b)=> String(b.d).localeCompare(String(a.d)) || String(a.row[0]).localeCompare(String(b.row[0]),'fr'));
  lignes.forEach(l=>{ aoa.push(l.row); meta.push({ couleur: l.st==='encours' ? 'green' : (l.st==='attente' ? 'yellow' : null) }); });
  if(!lignes.length){ aoa.push(['—','Aucune formation planifiée','','','','','','','','','','']); meta.push({}); }
  return { name:'Formations', aoa:aoa, meta:meta, widths:[26,26,34,12,12,10,11,11,13,11,44,44], leftCols:[0,1,2,10,11] };
};

// Chargée en arrière-plan par l'export global de l'accueil (?dmdexport=1) : on ne
// démarre pas l'interface, seule __dmdFlatSheet() sera appelée.
const _DMD_EXPORT_MODE = /[?&]dmdexport=1/.test(location.search) || window.__DMD_EXPORT === true;
(async function init(){
  if(_DMD_EXPORT_MODE) return;
  if(!_sb){ document.getElementById('content').innerHTML = '<div class="loading">Connexion indisponible. Réessaie plus tard.</div>'; return; }
  _items = await loadPlan();
  if(isDeviceAdmin()) await loadRepNames();
  render();
})();

/* ==== DMD : Entree = champ suivant + correction auto du champ ==== */
(function(){
  if (window.__dmdEnterNext) return; window.__dmdEnterNext = true;
  var NAV_SCOPE = '.modal, #modalBox, .card, form, .panel, .sheet, .edit-form';
  var SKIP = {button:1,submit:1,reset:1,checkbox:1,radio:1,file:1,range:1,color:1,hidden:1,image:1};
  function navigable(el){
    if(!el || el.tagName !== 'INPUT') return false;
    var ty = (el.getAttribute('type') || 'text').toLowerCase();
    return !SKIP[ty];
  }
  function visibleField(el){
    if(el.disabled || el.readOnly) return false;
    var ty = (el.getAttribute('type') || 'text').toLowerCase();
    if(ty === 'hidden' || ty === 'file') return false;
    return el.offsetParent !== null;
  }
  // Applique la correction d'ecriture au champ : majuscules, nom synchronise de la liste, adresse, telephone
  function fmtField(el){
    if(!el || el.tagName !== 'INPUT') return;
    var kind = el.getAttribute('data-fmt');
    if(!kind && (el.getAttribute('type') || '').toLowerCase() === 'tel') kind = 'tel';
    if(!kind) return;
    var v = el.value; if(v == null) return;
    var out = v;
    try{
      if(kind === 'nom'){
        if(typeof window.__dmdCanonNom === 'function') out = window.__dmdCanonNom(v);
        else if(typeof window.formatNom === 'function') out = window.formatNom(v);
      } else if(kind === 'adresse'){
        if(typeof window.formatAdresse === 'function') out = window.formatAdresse(v);
      } else if(kind === 'tel'){
        if(typeof window.formatTel === 'function') out = window.formatTel(v);
      }
    }catch(_){ out = v; }
    if(out != null && out !== v){
      el.value = out;
      try{ el.dispatchEvent(new Event('input', {bubbles:true})); }catch(_){}
    }
  }
  window.__dmdFmtField = fmtField;
  // Fleche "suivant" sur le clavier mobile, uniquement dans un formulaire
  document.addEventListener('focusin', function(e){
    var t = e.target;
    if(navigable(t) && t.closest(NAV_SCOPE) && !t.hasAttribute('enterkeyhint')){
      t.setAttribute('enterkeyhint', 'next');
    }
  });
  // Corrige aussi quand on quitte le champ autrement (toucher ailleurs, bouton Enregistrer)
  document.addEventListener('focusout', function(e){ fmtField(e.target); });
  // Entree : corrige le champ puis passe au champ suivant du meme formulaire
  document.addEventListener('keydown', function(e){
    if(e.key !== 'Enter' || e.shiftKey || e.altKey || e.ctrlKey || e.metaKey) return;
    if(e.defaultPrevented) return;            // respecte les gestionnaires existants (chat, ajout employe...)
    var t = e.target;
    if(!navigable(t)) return;                  // laisse tranquilles les textarea et les champs de recherche
    var scope = t.closest(NAV_SCOPE);
    if(!scope) return;
    fmtField(t);                               // correction immediate du champ courant
    var fields = [].slice.call(scope.querySelectorAll('input, select, textarea')).filter(visibleField);
    var i = fields.indexOf(t);
    if(i < 0) return;
    e.preventDefault();
    if(i < fields.length - 1){
      var nx = fields[i + 1];
      nx.focus();
      if(nx.select){ try { nx.select(); } catch(_){} }
    } else {
      t.blur();                                // dernier champ : ferme le clavier
    }
  });
})();

const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRvYWplZ2Vxc3F1bG5oZHdrYWptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1OTY1OTQsImV4cCI6MjA5OTE3MjU5NH0.LBLVG--c1d9V_ZRw-h_ATZE2SUX3OAP7lf0SxMqPqNE";

let _sb = null;
try{ if(window.supabase && window.supabase.createClient){ _sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } }catch(e){ console.error(e); }
function withTimeout(p, ms, label){ return Promise.race([Promise.resolve(p), new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout:'+(label||''))), ms))]); }
function escapeHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escapeAttr(s){ return escapeHtml(s).replace(/'/g,'&#39;'); }
function formatNom(s){ s=String(s==null?'':s).replace(/\s+/g,' ').trim(); if(!s) return s; return s.toLocaleLowerCase('fr').replace(/[\p{L}\p{N}]+/gu, function(w){ return w.charAt(0).toLocaleUpperCase('fr')+w.slice(1); }); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function normNom(s){ return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim(); }
function nomsProches(n1,n2){ const w1=normNom(n1).split(' ').filter(Boolean), w2=normNom(n2).split(' ').filter(Boolean); if(!w1.length||!w2.length) return false; const common=w1.filter(w=>w2.includes(w)); return common.length>=Math.min(2,Math.min(w1.length,w2.length)); }

function getDeviceId(){ try{ let v=localStorage.getItem('inv:deviceId'); if(!v){ v='dev_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8); localStorage.setItem('inv:deviceId',v);} return v; }catch(e){ return 'dev_'+Math.random().toString(36).slice(2,10); } }
function myName(){ try{ const v=localStorage.getItem('inv:deviceUser'); if(v){ const u=JSON.parse(v); if(u){ if(u.chantier) return 'Tablette de chantier'; if(u.nom) return u.nom; } } }catch(e){} return 'Appareil '+getDeviceId().slice(-4); }

const storage = {
  async get(k, shared=true){
    if(shared===false){ try{ const v=localStorage.getItem(k); return v===null?null:{key:k,value:v}; }catch(e){ return null; } }
    try{ const r=await withTimeout(_sb.from('inv_store').select('value').eq('key',k).maybeSingle(),8000,'get'); const {data,error}=r||{}; if(error){console.error(error);return null;} return data?{key:k,value:data.value}:null; }catch(e){ return null; }
  },
  async set(k, value, shared=true){
    if(shared===false){ try{ localStorage.setItem(k,value); return {key:k,value}; }catch(e){ return null; } }
    const {error}=await _sb.from('inv_store').upsert({key:k,value,updated_at:new Date().toISOString()}); if(error){console.error(error);return null;} return {key:k,value};
  }
};

// ================== CANAUX ==================
let teams = [];
let customChannels = [];       // [{id,label}]
let isAdmin = false;
let currentChan = 'general';

async function loadTeams(){
  try{ const r=await storage.get('inv:teams', true); if(r&&r.value){ const p=JSON.parse(r.value); if(Array.isArray(p)&&p.length) teams=p; } }catch(e){}
  if(!teams.length) teams = [1,2,3,4,5,6].map(n=>({id:'team_'+n,label:'Équipe '+n})).concat([{id:'entrepot',label:'Entrepôt'}]);
}
async function loadChannels(){
  try{ const r=await storage.get('inv:chatChannels', true); if(r&&r.value){ const p=JSON.parse(r.value); if(Array.isArray(p)) customChannels=p; } }catch(e){ customChannels=[]; }
}
async function saveChannels(){ try{ await storage.set('inv:chatChannels', JSON.stringify(customChannels), true); }catch(e){} }
async function loadAdmin(){ try{ const r=await storage.get('inv:isAdmin', false); isAdmin=!!(r&&r.value==='1'); }catch(e){ isAdmin=false; } }
async function setAdmin(on){ isAdmin=!!on; try{ await storage.set('inv:isAdmin', on?'1':'0', false); }catch(e){} }

function allChannels(){
  const base = [{id:'general', label:'Général', icon:'📢'}];
  const eq = teams.map(t => ({ id:'eq_'+t.id, label:t.label, icon:'👷' }));
  const cus = customChannels.map(c => ({ id:c.id, label:c.label, icon:'#', custom:true }));
  return base.concat(eq).concat(cus);
}
function channelById(id){ return allChannels().find(c => c.id===id) || allChannels()[0]; }

// Trouve le canal de l'équipe de l'utilisateur courant (registre inv:teammember:<id>, écrit par Infos équipe).
// Retourne l'id de canal 'eq_<teamId>' si trouvé et disponible, sinon null.
async function findMyTeamChannel(){
  const me = myName();
  if(!me || me==='Tablette de chantier' || /^Appareil /.test(me)) return null;
  try{
    const r = await withTimeout(_sb.from('inv_store').select('key,value').like('key','inv:teammember:%'), 10000, 'tm');
    const rows = (r && Array.isArray(r.data)) ? r.data : [];
    const members = [];
    rows.forEach(row => { try{ const m=JSON.parse(row.value); if(m && m.nom && m.teamId) members.push(m); }catch(e){} });
    let teamId = null;
    const hit = members.find(m => normNom(m.nom)===normNom(me));      // correspondance exacte d'abord
    if(hit) teamId = hit.teamId;
    if(!teamId){ const near = members.filter(m => nomsProches(m.nom, me)); if(near.length===1) teamId = near[0].teamId; }
    if(teamId){
      const chId = 'eq_' + teamId;
      if(allChannels().some(c => c.id===chId)) return chId;
    }
  }catch(e){}
  return null;
}

// ---- Pastilles non lu (rouge) / à jour (vert) par canal ----
// Date du dernier message de chaque canal : UNE LIGNE PAR CANAL (chatlast:<canal>),
// pour éviter que les envois simultanés de plusieurs personnes s'écrasent.
let lastMsgIndex = {};
async function loadLastMsgIndex(){
  try{
    const r = await withTimeout(_sb.from('inv_store').select('key,value').like('key','chatlast:%'), 10000, 'last');
    const idx = {};
    ((r&&r.data)||[]).forEach(row => { idx[row.key.slice('chatlast:'.length)] = row.value; });
    lastMsgIndex = idx;
  }catch(e){}
  updateChanIndicator();
}
function getRead(ch){ try{ return localStorage.getItem('chat:read:'+ch) || ''; }catch(e){ return ''; } }
function isUnread(ch){ const last = lastMsgIndex[ch]; return !!(last && last > getRead(ch)); }

// ---- Accusés de lecture partagés (qui a vu quoi) ----
// UNE LIGNE PAR APPAREIL : chatread:<canal>:<deviceId> = { ts, nom }.
// Aucune écriture concurrente sur une même ligne -> aucune perte, même à 20+ lecteurs.
let _reads = {};
let _lastPushedRead = '';
async function loadReads(ch){
  try{
    const r = await withTimeout(_sb.from('inv_store').select('key,value').like('key','chatread:'+ch+':%'), 10000, 'reads');
    const map = {}; const pref = 'chatread:'+ch+':';
    ((r&&r.data)||[]).forEach(row => { try{ map[row.key.slice(pref.length)] = JSON.parse(row.value); }catch(e){} });
    _reads = map;
  }catch(e){ _reads = {}; }
}
async function pushRead(ts){
  if(!ts || ts === _lastPushedRead) return;
  _lastPushedRead = ts;
  try{
    const rec = { ts, nom:myName() };
    _reads[getDeviceId()] = rec;
    await storage.set('chatread:'+currentChan+':'+getDeviceId(), JSON.stringify(rec), true);
  }catch(e){}
}
// Combien d'AUTRES personnes ont vu ce message
function seenCount(m){
  let n = 0;
  for(const id in _reads){
    if(id === m.deviceId) continue;
    const rr = _reads[id]; const ts = (rr && rr.ts) ? rr.ts : '';
    if(ts && ts >= (m.ts || '')) n++;
  }
  return n;
}
function markCurrentRead(){
  // On marque « lu » uniquement jusqu'au dernier message réellement CHARGÉ à l'écran
  // (pas l'index chatlast:, qui peut être en avance sur ce que l'utilisateur a vu).
  const ks = Object.keys(msgs).sort();
  const ts = ks.length ? (msgs[ks[ks.length-1]].ts || '') : '';
  if(ts){
    try{ localStorage.setItem('chat:read:'+currentChan, ts); }catch(e){}
    pushRead(ts);   // publie ma position de lecture (non bloquant)
  }
  updateChanIndicator();
}
function updateChanIndicator(){
  const dot = document.getElementById('cbDot'); if(!dot) return;
  dot.classList.toggle('show', allChannels().some(c => isUnread(c.id)));
}

// ================== MESSAGES ==================
// Clé triable chronologiquement : chat:<canal>:<ISO>_<rand>
function msgPrefix(ch){ return 'chat:'+ch+':'; }
let msgs = {};            // key -> message
let oldestKey = null, newestKey = null;
let pollTimer = null;

async function fetchPage(ch, opts){
  opts = opts || {};
  let q = _sb.from('inv_store').select('key,value').like('key', msgPrefix(ch)+'%');
  if(opts.before) q = q.lt('key', opts.before);
  if(opts.after) q = q.gt('key', opts.after);
  q = q.order('key', { ascending:false }).limit(opts.limit || PAGE);
  const r = await withTimeout(q, 12000, 'msgs');
  const rows = (r && Array.isArray(r.data)) ? r.data : [];
  return rows;
}
function ingest(rows){
  let added = 0;
  rows.forEach(r => {
    if(msgs[r.key]) return;
    try{ const m = JSON.parse(r.value); m._key = r.key; msgs[r.key] = m; added++; }catch(e){}
  });
  const keys = Object.keys(msgs).sort();
  oldestKey = keys[0] || null; newestKey = keys[keys.length-1] || null;
  return added;
}
async function loadRecent(ch){
  msgs = {}; oldestKey = null; newestKey = null;
  const rows = await fetchPage(ch, { limit:PAGE });
  ingest(rows);
  renderFeed(true);
  markCurrentRead();
}
async function loadOlder(){
  if(!oldestKey) return;
  const rows = await fetchPage(currentChan, { before:oldestKey, limit:PAGE });
  const feed = document.getElementById('feed');
  const prevH = feed.scrollHeight, prevTop = feed.scrollTop;
  const added = ingest(rows);
  renderFeed(false);
  // conserve la position de lecture
  feed.scrollTop = feed.scrollHeight - prevH + prevTop;
  if(!added){ const b=document.getElementById('loadMoreBtn'); if(b) b.remove(); }
}
let _pollTick = 0;
async function poll(){
  if(document.hidden) return;
  try{
    // On recharge toujours la dernière page complète (les doublons sont ignorés par ingest) :
    // un filtre « plus récent que mon dernier message » raterait les messages envoyés
    // par d'autres dans la même seconde (conversation active à plusieurs).
    const rows = await fetchPage(currentChan, { limit:PAGE });
    const added = ingest(rows);
    // Accusés de lecture : seulement quand il y a du nouveau, ou 1 tour sur 3 (allège la charge réseau)
    let readsChanged = false;
    if(added || _pollTick === 0){
      const readsBefore = JSON.stringify(_reads);
      await loadReads(currentChan);
      readsChanged = JSON.stringify(_reads) !== readsBefore;
    }
    if(added || readsChanged){
      const feed = document.getElementById('feed');
      const nearBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 120;
      renderFeed(nearBottom && added);
      if(nearBottom && added) markCurrentRead();
    }
    // Pastilles « non lu » des AUTRES canaux : moins urgent -> 1 tour sur 3 (allège la charge DB)
    _pollTick = (_pollTick + 1) % 3;
    if(_pollTick === 0){ await loadLastMsgIndex(); }
  }catch(e){}
}

function dayLabel(iso){
  const d = new Date(iso); if(isNaN(d)) return '';
  const now = new Date(); const sameDay = d.toDateString()===now.toDateString();
  const yest = new Date(now); yest.setDate(now.getDate()-1);
  if(sameDay) return "Aujourd'hui";
  if(d.toDateString()===yest.toDateString()) return 'Hier';
  return d.toLocaleDateString('fr-CA', { weekday:'long', day:'numeric', month:'long' });
}
function timeLabel(iso){ const d=new Date(iso); if(isNaN(d)) return ''; return String(d.getHours()).padStart(2,'0')+'h'+String(d.getMinutes()).padStart(2,'0'); }

function renderFeed(scrollBottom){
  const feed = document.getElementById('feed');
  const keys = Object.keys(msgs).sort();
  if(!keys.length){ feed.innerHTML = '<div class="empty">Aucun message dans ce canal.<br>Sois le premier à écrire 💬</div>'; return; }
  const myId = getDeviceId();
  let html = '<button class="load-more" id="loadMoreBtn">↑ Charger les messages plus anciens</button>';
  let lastDay = '';
  keys.forEach(k => {
    const m = msgs[k];
    const dl = dayLabel(m.ts);
    if(dl && dl!==lastDay){ html += '<div class="day-sep">'+escapeHtml(dl)+'</div>'; lastDay = dl; }
    const me = (m.deviceId === myId);
    // Anciens messages photo (avant le retrait de la fonction) : simple repère texte
    const txt = (m.photo && m.photo.url) ? ('📷 [Photo]' + (m.text ? '\n' + m.text : '')) : (m.text || '');
    // Accusé de lecture : ✓ N = vu par N autres personnes, ⊗ = pas encore vu
    const sc = seenCount(m);
    const mark = sc > 0 ? '<span class="seen">✓ '+sc+'</span>' : '<span class="unseen">⊗</span>';
    html += '<div class="msg'+(me?' me':'')+'">' +
      (me?'':'<div class="who">'+escapeHtml(formatNom(m.author)||'—')+'</div>') +
      '<div class="bubble">'+escapeHtml(txt)+'</div>' +
      '<div class="meta">'+timeLabel(m.ts)+(me?' · '+escapeHtml(formatNom(m.author)):'')+' · '+mark+'</div>' +
    '</div>';
  });
  feed.innerHTML = html;
  document.getElementById('loadMoreBtn').onclick = loadOlder;
  if(scrollBottom) feed.scrollTop = feed.scrollHeight;
}

// ================== ENVOI (texte) ==================
async function sendMessage(){
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if(!text) return;
  const sendBtn = document.getElementById('sendBtn');
  if(sendBtn.disabled) return;   // évite le double-envoi (Entrée pressée deux fois pendant l'envoi)
  sendBtn.disabled = true;
  const ts = new Date().toISOString();
  const key = msgPrefix(currentChan) + ts + '_' + uid();
  try{
    const msg = { id:uid(), ch:currentChan, author:myName(), deviceId:getDeviceId(), text, ts };
    const res = await storage.set(key, JSON.stringify(msg), true);
    if(!res) throw new Error('save');
    input.value=''; autoGrow(input);
    msg._key = key; msgs[key] = msg;
    const keys = Object.keys(msgs).sort(); newestKey = keys[keys.length-1];
    renderFeed(true);
    // met à jour l'index « dernier message » du canal (une ligne par canal)
    lastMsgIndex[currentChan] = ts;
    try{ storage.set('chatlast:'+currentChan, ts, true); }catch(e){}
    markCurrentRead();
  }catch(e){
    console.error('Envoi:', e);
    alert("Envoi impossible. Vérifie ta connexion et réessaie.");
  }finally{ sendBtn.disabled = false; input.focus(); }
}

// ================== TIROIR CANAUX ==================
function renderChannels(){
  const el = document.getElementById('chanList');
  const list = allChannels();
  let html='';
  html += '<div class="chan-group">Principal</div>';
  html += chanRow(list[0]);
  html += '<div class="chan-group">Équipes</div>';
  list.filter(c=>c.icon==='👷').forEach(c => html += chanRow(c));
  const cus = list.filter(c=>c.custom);
  if(cus.length){ html += '<div class="chan-group">Autres canaux</div>'; cus.forEach(c => html += chanRow(c)); }
  el.innerHTML = html;
  el.querySelectorAll('[data-chan]').forEach(r => r.onclick = e => {
    if(e.target.classList.contains('del')) return;
    switchChannel(r.getAttribute('data-chan'));
  });
  el.querySelectorAll('.del').forEach(d => d.onclick = async () => {
    const id=d.getAttribute('data-del');
    if(!confirm('Supprimer ce canal ? Les messages restent en base mais le canal disparaît de la liste.')) return;
    customChannels = customChannels.filter(c=>c.id!==id); await saveChannels();
    if(currentChan===id) switchChannel('general'); else renderChannels();
  });
  // zone admin
  const az = document.getElementById('adminChanZone');
  if(isAdmin){
    az.innerHTML = '<button class="btn primary" id="addChan">➕ Nouveau canal</button><button class="btn" id="lockAdmin">Quitter le mode admin</button>';
    document.getElementById('addChan').onclick = async () => {
      const name = prompt('Nom du nouveau canal :'); if(name==null) return;
      const label=name.trim(); if(!label) return;
      const id='c_'+uid();
      customChannels.push({ id, label }); await saveChannels(); renderChannels(); switchChannel(id);
    };
    document.getElementById('lockAdmin').onclick = async () => { await setAdmin(false); renderChannels(); };
  } else {
    az.innerHTML = '<button class="btn" id="unlockAdmin">🔑 Mode admin</button>';
    document.getElementById('unlockAdmin').onclick = async () => {

/* ============================================================
   EXPORT EXCEL (Ctrl+X révèle le bouton — même principe que l'inventaire)
   Une feuille par canal, tous les messages.
   ============================================================ */
// Chargement à la demande de la librairie Excel (~1 Mo) : uniquement lors d'un export/import.
let _xlsxLoading = null;
function ensureXLSX(){
  if(window.XLSX) return Promise.resolve();
  if(_xlsxLoading) return _xlsxLoading;
  _xlsxLoading = new Promise(function(res, rej){
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js';
    s.onload = function(){ res(); };
    s.onerror = function(){ _xlsxLoading = null; rej(new Error('xlsx')); };
    document.head.appendChild(s);
  });
  return _xlsxLoading;
}
function xlsSheet(aoa, meta, widths, leftCols){
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = widths.map(w => ({wch:w}));
  ws['!freeze'] = { xSplit:0, ySplit:1 };
  ws['!autofilter'] = { ref: XLSX.utils.encode_range({s:{r:0,c:0}, e:{r:aoa.length-1, c:widths.length-1}}) };
  for(let r=0; r<aoa.length; r++){
    for(let c=0; c<widths.length; c++){
      const addr = XLSX.utils.encode_cell({r,c});
      if(!ws[addr]) ws[addr] = { t:'s', v:'' };
      const m = meta[r] || {};
      let fill='FFFFFF', bold=false, fontColor='000000';
      if(m.header){ fill='232221'; bold=true; fontColor='FFFFFF'; }
      else if(m.cat){ fill='D9D2C2'; bold=true; }
      else if(m.couleur==='red') fill='F4CCCC';
      else if(m.couleur==='yellow') fill='FFF2CC';
      else if(m.couleur==='green') fill='D9EAD3';
      ws[addr].s = {
        fill:{ patternType:'solid', fgColor:{rgb:fill} },
        font:{ name:'Arial', sz:m.header?11:10, bold:bold, color:{rgb:fontColor} },
        alignment:{ vertical:'center', horizontal:(leftCols.indexOf(c)!==-1)?'left':'center', wrapText:!!m.header },
        border:{ top:{style:'thin',color:{rgb:'CCCCCC'}}, bottom:{style:'thin',color:{rgb:'CCCCCC'}},
                 left:{style:'thin',color:{rgb:'CCCCCC'}}, right:{style:'thin',color:{rgb:'CCCCCC'}} }
      };
    }
  }
  return ws;
}
async function exporterExcel(){
  const btn = document.getElementById('exportBtn');
  const old = btn ? btn.textContent : '';
  if(btn){ btn.textContent='...'; btn.disabled=true; }
  try{
    try{ await ensureXLSX(); }catch(e){ alert('Impossible de charger le module Excel. Vérifie ta connexion et réessaie.'); return; }
    // Tous les messages de tous les canaux
    const r = await withTimeout(_sb.from('inv_store').select('key,value').like('key','chat:%'), 20000, 'exp');
    const rows = (r && Array.isArray(r.data)) ? r.data : [];
    if(!rows.length){ alert('Aucun message à exporter.'); return; }
    const parChan = {};
    rows.forEach(row => {
      const rest = row.key.slice(5);                    // enlève "chat:"
      const ch = rest.slice(0, rest.indexOf(':'));      // id du canal
      try{ const m = JSON.parse(row.value); (parChan[ch] = parChan[ch] || []).push(m); }catch(e){}
    });
    const wb = XLSX.utils.book_new();
    const usedNames = {};
    Object.keys(parChan).forEach(ch => {
      const list = parChan[ch].sort((a,b)=>(a.ts||'').localeCompare(b.ts||''));
      const aoa=[['Date','Heure','Auteur','Message']], meta=[{header:true}];
      list.forEach(m => {
        const d = new Date(m.ts);
        const txt = (m.photo && m.photo.url) ? ('[Photo]' + (m.text ? ' ' + m.text : '')) : (m.text||'');
        aoa.push([ isNaN(d)?'':d.toLocaleDateString('fr-CA'), isNaN(d)?'':(String(d.getHours()).padStart(2,'0')+'h'+String(d.getMinutes()).padStart(2,'0')),
                   formatNom(m.author)||'—', txt ]);
        meta.push({});
      });
      const c = channelById(ch);
      let nom = ((c && c.id===ch) ? c.label : ch).substring(0,28).replace(/[\\/?*\[\]:]/g,' ');
      if(usedNames[nom]) nom = nom.substring(0,25)+' '+(++usedNames[nom]); else usedNames[nom]=1;
      XLSX.utils.book_append_sheet(wb, xlsSheet(aoa, meta, [12,8,24,70], [2,3]), nom);
    });
    const d = new Date();
    XLSX.writeFile(wb, 'Chat_DMD_' + d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + '.xlsx');
    if(btn) btn.style.display='none';
  }catch(e){ console.error(e); alert("Une erreur est survenue pendant l'export."); }
  finally{ if(btn){ btn.textContent=old||'⬇ Excel'; btn.disabled=false; } }
}
document.getElementById('exportBtn').addEventListener('click', exporterExcel);
document.addEventListener('keydown', function(e){
  if((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && (e.key==='x' || e.key==='X')){

    if(el && (el.tagName==='INPUT' || el.tagName==='TEXTAREA' || el.isContentEditable)) return;

    e.preventDefault();
    const btn = document.getElementById('exportBtn');
    if(btn){ btn.style.display=''; btn.focus(); }
  }
});

(async function(){
  if(!_sb){ document.getElementById('feed').innerHTML='<div class="empty">Connexion au serveur impossible (librairie non chargée).</div>'; return; }
  try{
    const { data } = await withTimeout(_sb.auth.getSession(), 8000, 'getSession');

  }catch(e){ document.getElementById('feed').innerHTML='<div class="empty">Serveur injoignable.</div>'; return; }
  try{
    await Promise.all([ loadTeams(), loadChannels(), loadAdmin(), loadLastMsgIndex() ]);
    // Chaque utilisateur arrive automatiquement dans le chat de son équipe ; il peut ensuite changer de canal (☰).
    const mine = await findMyTeamChannel();
    await switchChannel(mine || 'general');
    // Démarre/suspend le polling selon la visibilité de l'onglet : rien ne tourne en arrière-plan.
    function startPoll(){ if(!pollTimer) pollTimer = setInterval(poll, POLL_MS); }
    function stopPoll(){ if(pollTimer){ clearInterval(pollTimer); pollTimer = null; } }
    document.addEventListener('visibilitychange', () => {
      if(document.hidden){ stopPoll(); }
      else{ poll(); startPoll(); }   // au retour : rafraîchit tout de suite, puis reprend le cycle
    });
    startPoll();
  }catch(e){ console.error(e); document.getElementById('feed').innerHTML='<div class="empty">Impossible de démarrer le chat.</div>'; }
})();

/* ==== DMD : Entree = champ suivant + correction auto du champ ==== */
(function(){
  if (window.__dmdEnterNext) return; window.__dmdEnterNext = true;
  var NAV_SCOPE = '.modal, #modalBox, .card, form, .panel, .sheet, .edit-form';
  var SKIP = {button:1,submit:1,reset:1,checkbox:1,radio:1,file:1,range:1,color:1,hidden:1,image:1};
  function navigable(el){
    if(!el || el.tagName !== 'INPUT') return false;
    var ty = (el.getAttribute('type') || 'text').toLowerCase();
    return !SKIP[ty];
  }
  function visibleField(el){
    if(el.disabled || el.readOnly) return false;
    var ty = (el.getAttribute('type') || 'text').toLowerCase();
    if(ty === 'hidden' || ty === 'file') return false;
    return el.offsetParent !== null;
  }
  // Applique la correction d'ecriture au champ : majuscules, nom synchronise de la liste, adresse, telephone
  function fmtField(el){
    if(!el || el.tagName !== 'INPUT') return;
    var kind = el.getAttribute('data-fmt');
    if(!kind && (el.getAttribute('type') || '').toLowerCase() === 'tel') kind = 'tel';
    if(!kind) return;
    var v = el.value; if(v == null) return;
    var out = v;
    try{
      if(kind === 'nom'){
        if(typeof window.__dmdCanonNom === 'function') out = window.__dmdCanonNom(v);
        else if(typeof window.formatNom === 'function') out = window.formatNom(v);
      } else if(kind === 'adresse'){
        if(typeof window.formatAdresse === 'function') out = window.formatAdresse(v);
      } else if(kind === 'tel'){
        if(typeof window.formatTel === 'function') out = window.formatTel(v);
      }
    }catch(_){ out = v; }
    if(out != null && out !== v){
      el.value = out;
      try{ el.dispatchEvent(new Event('input', {bubbles:true})); }catch(_){}
    }
  }
  window.__dmdFmtField = fmtField;
  // Fleche "suivant" sur le clavier mobile, uniquement dans un formulaire
  document.addEventListener('focusin', function(e){
    var t = e.target;
    if(navigable(t) && t.closest(NAV_SCOPE) && !t.hasAttribute('enterkeyhint')){
      t.setAttribute('enterkeyhint', 'next');
    }
  });
  // Corrige aussi quand on quitte le champ autrement (toucher ailleurs, bouton Enregistrer)
  document.addEventListener('focusout', function(e){ fmtField(e.target); });
  // Entree : corrige le champ puis passe au champ suivant du meme formulaire
  document.addEventListener('keydown', function(e){
    if(e.key !== 'Enter' || e.shiftKey || e.altKey || e.ctrlKey || e.metaKey) return;
    if(e.defaultPrevented) return;            // respecte les gestionnaires existants (chat, ajout employe...)
    var t = e.target;
    if(!navigable(t)) return;                  // laisse tranquilles les textarea et les champs de recherche
    var scope = t.closest(NAV_SCOPE);
    if(!scope) return;
    fmtField(t);                               // correction immediate du champ courant
    var fields = [].slice.call(scope.querySelectorAll('input, select, textarea')).filter(visibleField);
    var i = fields.indexOf(t);
    if(i < 0) return;
    e.preventDefault();
    if(i < fields.length - 1){
      var nx = fields[i + 1];
      nx.focus();
      if(nx.select){ try { nx.select(); } catch(_){} }
    } else {
      t.blur();                                // dernier champ : ferme le clavier
    }
  });
})();

  }
  window.__dmdGo = function(h){
    var r = route(h) || 'accueil';
    try{ parent.postMessage({ dmdnav: r }, '*'); }catch(e){}

    var h = a.getAttribute('href') || '';
    if(/\.html(\?|#|$)/.test(h)){ e.preventDefault(); window.__dmdGo(h); }

})();

function withTimeout(p, ms, label){ return Promise.race([Promise.resolve(p), new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout:'+(label||''))), ms))]); }
function escapeHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escapeAttr(s){ return escapeHtml(s).replace(/'/g,'&#39;'); }
function formatNom(s){ s=String(s==null?'':s).replace(/\s+/g,' ').trim(); if(!s) return s; return s.toLocaleLowerCase('fr').replace(/[\p{L}\p{N}]+/gu, function(w){ return w.charAt(0).toLocaleUpperCase('fr')+w.slice(1); }); }

const storage = {
  async get(k, shared=true){
    if(shared===false){ try{ const v=localStorage.getItem(k); return v===null?null:{key:k,value:v}; }catch(e){ return null; } }
    try{ const r=await withTimeout(_sb.from('inv_store').select('value').eq('key',k).maybeSingle(),8000,'get'); const {data,error}=r||{}; if(error){console.error(error);return null;} return data?{key:k,value:data.value}:null; }catch(e){ return null; }
  },
  async set(k, value, shared=true){
    if(shared===false){ try{ localStorage.setItem(k,value); return {key:k,value}; }catch(e){ return null; } }
    const {error}=await _sb.from('inv_store').upsert({key:k,value,updated_at:new Date().toISOString()}); if(error){console.error(error);return null;} return {key:k,value};
  },
  async del(k){ const {error}=await _sb.from('inv_store').delete().eq('key',k); return !error; }

// ================== MOIS ==================
let curYM = (function(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); })();
const MOIS_FR = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
function ymLabel(ym){ const [y,m]=ym.split('-').map(Number); return MOIS_FR[m-1].toUpperCase()+' '+y; }
function ymShift(ym, delta){ let [y,m]=ym.split('-').map(Number); m+=delta; while(m<1){m+=12;y--;} while(m>12){m-=12;y++;} return y+'-'+String(m).padStart(2,'0'); }
function isCurrentMonth(ym){ const d=new Date(); return ym === d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }

// ================== DONNÉES ==================
// clé : fact:<AAAA-MM>:<ISO>_<uid> — valeur JSON { id, ym, author, deviceId, montant, fournisseur, note, photo{url,path}, ts, statut }
let factures = [];   // du mois affiché
let isAdmin = false;
let openHolders = new Set();

async function loadAdmin(){ try{ const r=await storage.get('inv:isAdmin', false); isAdmin=!!(r&&r.value==='1'); }catch(e){ isAdmin=false; } }
async function loadMonth(){
  const out = [];
  const r = await withTimeout(_sb.from('inv_store').select('key,value').like('key','fact:'+curYM+':%'), 12000, 'factures');
  if(r && Array.isArray(r.data)){
    r.data.forEach(row => { try{ const f=JSON.parse(row.value); if(f){ f._key=row.key; out.push(f); } }catch(e){} });
  }
  out.sort((a,b) => (a.ts||'').localeCompare(b.ts||''));
  return out;
}

// ================== AFFICHAGE ==================
function groupByHolder(){
  const map = {};
  factures.forEach(f => {
    const id = f.deviceId || '?';
    if(!map[id]) map[id] = { id, nom:f.author||'—', items:[], total:0, nonConf:0 };
    map[id].items.push(f);
    const v = parseFloat(f.montant); if(!isNaN(v)) map[id].total += v;
    if(f.statut!=='confirmee') map[id].nonConf++;
    if(f.author) map[id].nom = f.author;
  });
  return Object.values(map).sort((a,b)=> a.nom.localeCompare(b.nom,'fr'));
}
function renderSummary(){
  const holders = groupByHolder();
  let total=0, n=factures.length, nonConf=0;
  factures.forEach(f => { const v=parseFloat(f.montant); if(!isNaN(v)) total+=v; if(f.statut!=='confirmee') nonConf++; });
  document.getElementById('summary').innerHTML =
    '<div class="sum-chip"><b>'+fmtMoney(total)+'</b>Total du mois</div>' +
    '<div class="sum-chip"><b>'+n+'</b>Facture'+(n>1?'s':'')+' · '+holders.length+' carte'+(holders.length>1?'s':'')+'</div>' +
    '<div class="sum-chip '+(nonConf? 'warn':'ok')+'"><b>'+nonConf+'</b>À confirmer</div>';
}
function renderList(){
  const list = document.getElementById('list');
  const holders = groupByHolder();
  const myId = getDeviceId();
  if(!holders.length){
    list.innerHTML = '<div class="empty">Aucune facture pour '+escapeHtml(ymLabel(curYM))+'.<br>Touche « 📸 Ajouter une facture » pour publier la première.</div>';
    return;
  }
  list.innerHTML = holders.map(h => {
    const me = (h.id === myId);
    const open = openHolders.has(h.id) || me;
    const allConf = h.nonConf===0;
    const rows = h.items.map(f => {
      const conf = f.statut==='confirmee';
      const canDel = (me && !conf) || isAdmin;
      const canConf = me && !conf;
      return '<div class="fact">' +
        (f.photo && f.photo.url ? '<img src="'+escapeAttr(f.photo.url)+'" loading="lazy" data-full="'+escapeAttr(f.photo.url)+'" data-by="'+escapeAttr(f.author||'')+'" data-ts="'+escapeAttr(f.ts||'')+'">' : '') +
        '<div class="f-mid">' +
          '<div class="f-montant">'+fmtMoney(f.montant)+' <span class="tag '+(conf?'green':'orange')+'">'+(conf?'Confirmée':'Publiée')+'</span></div>' +
          '<div class="f-info">'+escapeHtml(f.fournisseur||'—')+(f.note?' · '+escapeHtml(f.note):'')+' · '+new Date(f.ts).toLocaleDateString('fr-CA')+'</div>' +
        '</div>' +
        '<div class="f-actions">' +
          (canConf ? '<button class="f-btn ok" data-conf="'+escapeAttr(f._key)+'">✔ Confirmer</button>' : '') +
          (canDel ? '<button class="f-btn danger" data-del="'+escapeAttr(f._key)+'">Suppr.</button>' : '') +
        '</div>' +
      '</div>';
    }).join('');
    const confirmAll = (me && h.nonConf>0)
      ? '<button class="confirm-month" data-confall="1">✅ Confirmer toutes mes factures du mois ('+h.nonConf+')</button>'
      : (me && h.items.length ? '<div class="month-done">✔ Ton mois est confirmé — '+h.items.length+' facture'+(h.items.length>1?'s':'')+'</div>' : '');
    return '<div class="holder'+(me?' me':'')+(open?' open':'')+(allConf?' edge-green':' edge-yellow')+'" data-holder="'+escapeAttr(h.id)+'">' +
      '<div class="h-head">' +
        '<span class="h-name">💳 '+escapeHtml(formatNom(h.nom))+(me?' <span class="h-you">Toi</span>':'')+'</span>' +
        '<span class="h-total">'+fmtMoney(h.total)+'</span>' +
      '</div>' +
      '<div class="h-sub">'+h.items.length+' facture'+(h.items.length>1?'s':'')+
        (allConf ? ' <span class="tag green">Mois confirmé</span>' : ' <span class="tag orange">'+h.nonConf+' à confirmer</span>')+'</div>' +
      '<div class="h-body">'+rows+confirmAll+'</div>' +

  }).join('');

  // interactions
  list.querySelectorAll('.h-head').forEach(hd => hd.onclick = () => {
    const el = hd.parentElement, id = el.getAttribute('data-holder');

  });
  list.querySelectorAll('.fact img').forEach(img => img.onclick = () => openViewer(img.getAttribute('data-full'), img.getAttribute('data-by'), img.getAttribute('data-ts')));
  list.querySelectorAll('[data-conf]').forEach(b => b.onclick = () => confirmOne(b.getAttribute('data-conf')));
  list.querySelectorAll('[data-del]').forEach(b => b.onclick = () => delOne(b.getAttribute('data-del')));
  list.querySelectorAll('[data-confall]').forEach(b => b.onclick = confirmAllMine);
}
function renderMonth(){ document.getElementById('mLabel').innerHTML = escapeHtml(ymLabel(curYM)) + '<small>' + (isCurrentMonth(curYM) ? 'mois en cours' : 'mois passé') + '</small>'; }
let _refreshToken = 0;
async function refresh(){
  renderMonth();
  const tok = ++_refreshToken;                     // ignore les chargements périmés (double-tap rapide sur ‹ ›)
  try{
    const loaded = await loadMonth();
    if(tok !== _refreshToken) return;              // un mois plus récent a été demandé entre-temps
    factures = loaded;
    renderSummary(); renderList();
  }catch(e){ if(tok===_refreshToken){ console.error(e); document.getElementById('list').innerHTML='<div class="empty">Impossible de charger les factures.</div>'; } }
}

// ================== ACTIONS ==================
function setSaveStatus(state){
  const el = document.getElementById('saveStatus'); if(!el) return;
  if(state==='saving'){ el.className='save-status'; el.textContent='💾 Enregistrement…'; }
  else if(state==='ok'){ const d=new Date(); el.className='save-status ok'; el.textContent='✔ Enregistré à '+String(d.getHours()).padStart(2,'0')+'h'+String(d.getMinutes()).padStart(2,'0'); }
  else if(state==='err'){ el.className='save-status err'; el.textContent='⚠ Non enregistré — vérifie la connexion et réessaie'; }
  else { el.className='save-status'; el.innerHTML='&nbsp;'; }
}
async function confirmOne(key){
  const f = factures.find(x=>x._key===key); if(!f) return;
  // On ne marque « confirmée » à l'écran QUE si l'enregistrement serveur a réussi
  // (sinon une panne réseau affichait une fausse confirmation impossible à refaire).
  const rec = Object.assign({}, f, { statut:'confirmee', confirmeeLe:new Date().toISOString() }); delete rec._key;
  setSaveStatus('saving');
  const res = await storage.set(key, JSON.stringify(rec), true);
  setSaveStatus(res ? 'ok' : 'err');
  if(res){ f.statut=rec.statut; f.confirmeeLe=rec.confirmeeLe; renderSummary(); renderList(); }
}
async function confirmAllMine(){
  const myId=getDeviceId();
  const mine = factures.filter(f => f.deviceId===myId && f.statut!=='confirmee');
  setSaveStatus('saving');
  let allOk = true;
  for(const f of mine){
    const rec=Object.assign({},f,{ statut:'confirmee', confirmeeLe:new Date().toISOString() }); delete rec._key;
    const res = await storage.set(f._key, JSON.stringify(rec), true);
    if(res){ f.statut=rec.statut; f.confirmeeLe=rec.confirmeeLe; } else { allOk = false; }
  }
  setSaveStatus(allOk ? 'ok' : 'err');
  renderSummary(); renderList();
}
async function delOne(key){
  const f = factures.find(x=>x._key===key); if(!f) return;
  if(!confirm('Supprimer cette facture ('+fmtMoney(f.montant)+' — '+(f.fournisseur||'sans fournisseur')+') ?')) return;
  setSaveStatus('saving');
  const res = await storage.del(key);
  setSaveStatus(res ? 'ok' : 'err');
  if(res){ factures = factures.filter(x=>x._key!==key); renderSummary(); renderList(); }
}

// ================== AJOUT (photo + compression, comme le chat) ==================
let pendingPhoto = null;
async function compressImage(file){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res, rej) => { const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    let w=img.naturalWidth, h=img.naturalHeight;
    const scale=Math.min(1, MAX_DIM/Math.max(w,h)); w=Math.round(w*scale); h=Math.round(h*scale);
    const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
    canvas.getContext('2d').drawImage(img,0,0,w,h);
    const blob=await new Promise(res=>canvas.toBlob(res,'image/jpeg',JPEG_Q));
    return { blob, w, h };
  } finally { URL.revokeObjectURL(url); }
}
function openAdd(){
  pendingPhoto=null;
  document.getElementById('pzImg').style.display='none'; document.getElementById('pzImg').src='';
  document.getElementById('pzEmpty').style.display='';
  document.getElementById('pzStatus').textContent='';
  document.getElementById('fMontant').value=''; document.getElementById('fFournisseur').value=''; document.getElementById('fNote').value='';
  document.getElementById('fErr').innerHTML='&nbsp;';
  document.getElementById('overlay').classList.add('show');
}
function closeAdd(){ document.getElementById('overlay').classList.remove('show'); if(pendingPhoto && pendingPhoto.url) URL.revokeObjectURL(pendingPhoto.url); pendingPhoto=null; }
async function onPhotoChosen(file){
  if(!file) return;
  try{
    const {blob,w,h}=await compressImage(file);
    if(pendingPhoto && pendingPhoto.url) URL.revokeObjectURL(pendingPhoto.url);
    pendingPhoto={ blob, w, h, url:URL.createObjectURL(blob) };
    const img=document.getElementById('pzImg'); img.src=pendingPhoto.url; img.style.display='';
    document.getElementById('pzEmpty').style.display='none';
    document.getElementById('pzStatus').textContent=Math.round(blob.size/1024)+' Ko · '+w+'×'+h;
  }catch(e){ console.error(e); document.getElementById('fErr').textContent="Impossible de préparer cette photo."; }
}
async function publish(){
  const err=document.getElementById('fErr');
  const montant=document.getElementById('fMontant').value.trim().replace(',','.');
  const fournisseur=document.getElementById('fFournisseur').value.trim();
  const note=document.getElementById('fNote').value.trim();
  if(!pendingPhoto){ err.textContent='La photo de la facture est requise.'; return; }
  if(!montant || isNaN(parseFloat(montant))){ err.textContent='Indique le montant de la facture.'; return; }
  const btn=document.getElementById('fSend'); btn.disabled=true; err.textContent='Envoi…';
  try{
    const ts=new Date().toISOString();
    const path='factures/'+curYM+'/'+getDeviceId()+'/'+ts.replace(/[:.]/g,'-')+'_'+uid()+'.jpg';
    const up=await _sb.storage.from(BUCKET).upload(path, pendingPhoto.blob, { contentType:'image/jpeg', upsert:false });
    if(up && up.error) throw up.error;
    const pub=_sb.storage.from(BUCKET).getPublicUrl(path);
    const urlPub=pub && pub.data ? pub.data.publicUrl : '';
    const key='fact:'+curYM+':'+ts+'_'+uid();
    const rec={ id:uid(), ym:curYM, author:myName(), deviceId:getDeviceId(), montant:parseFloat(montant).toFixed(2), fournisseur, note, photo:{url:urlPub, path, w:pendingPhoto.w, h:pendingPhoto.h}, ts, statut:'publiee' };
    const saved=await storage.set(key, JSON.stringify(rec), true);
    if(!saved) throw new Error('save');
    closeAdd();
    rec._key=key; factures.push(rec); factures.sort((a,b)=>(a.ts||'').localeCompare(b.ts||''));
    setSaveStatus('ok');
    renderSummary(); renderList();
  }catch(e){
    console.error(e);
    setSaveStatus('err');
    err.textContent="Envoi impossible. Vérifie la connexion et que le bucket « "+BUCKET+" » existe (voir le guide).";
  }finally{ btn.disabled=false; }
}

let vState={scale:1,x:0,y:0,natW:0,natH:0};
function applyV(){ document.getElementById('vImg').style.transform='translate('+vState.x+'px,'+vState.y+'px) scale('+vState.scale+')'; }
function fitViewer(){ const vw=window.innerWidth,vh=window.innerHeight; const s=Math.min(vw/vState.natW,vh/vState.natH); vState.scale=s; vState.x=(vw-vState.natW*s)/2; vState.y=(vh-vState.natH*s)/2; applyV(); }
function openViewer(url,by,ts){
  const img=document.getElementById('vImg');
  document.getElementById('vMeta').textContent=(formatNom(by)||'')+(ts?' · '+new Date(ts).toLocaleString('fr-CA'):'');
  document.getElementById('vOpen').href=url;
  img.onload=()=>{ vState.natW=img.naturalWidth||1; vState.natH=img.naturalHeight||1; fitViewer(); };
  img.src=url; document.getElementById('viewer').classList.add('show');
}
function closeViewer(){ document.getElementById('viewer').classList.remove('show'); document.getElementById('vImg').src=''; }
function zoomBy(f,cx,cy){ const vw=window.innerWidth/2,vh=window.innerHeight/2; cx=cx==null?vw:cx; cy=cy==null?vh:cy; const ns=Math.max(0.2,Math.min(8,vState.scale*f)); const k=ns/vState.scale; vState.x=cx-(cx-vState.x)*k; vState.y=cy-(cy-vState.y)*k; vState.scale=ns; applyV(); }
(function(){
  const v=document.getElementById('viewer');
  let pts=new Map(), lastDist=0, dragging=false, lx=0, ly=0;
  v.addEventListener('pointerdown', e=>{ if(e.target.id==='vImg'||e.target===v){ v.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); dragging=true; lx=e.clientX; ly=e.clientY; } });
  v.addEventListener('pointermove', e=>{
    if(!pts.has(e.pointerId)) return; pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const a=[...pts.values()];
    if(a.length===2){ const dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y); const mid={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2}; if(lastDist) zoomBy(dist/lastDist,mid.x,mid.y); lastDist=dist; }
    else if(a.length===1 && dragging){ vState.x+=e.clientX-lx; vState.y+=e.clientY-ly; lx=e.clientX; ly=e.clientY; applyV(); }
  });
  function up(e){ pts.delete(e.pointerId); if(pts.size<2) lastDist=0; if(!pts.size) dragging=false; }
  v.addEventListener('pointerup',up); v.addEventListener('pointercancel',up);
  v.addEventListener('wheel', e=>{ e.preventDefault(); zoomBy(e.deltaY<0?1.15:0.87,e.clientX,e.clientY); }, {passive:false});
  document.getElementById('vImg').addEventListener('dblclick', e=>zoomBy(vState.scale<1.5?2.2:0.45,e.clientX,e.clientY));
})();

/* ============================================================
   EXPORT EXCEL (Ctrl+X révèle le bouton — même principe que l'inventaire)
   ============================================================ */
function xlsSheet(aoa, meta, widths, leftCols){
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = widths.map(w => ({wch:w}));
  ws['!freeze'] = { xSplit:0, ySplit:1 };
  ws['!autofilter'] = { ref: XLSX.utils.encode_range({s:{r:0,c:0}, e:{r:aoa.length-1, c:widths.length-1}}) };
  for(let r=0; r<aoa.length; r++){
    for(let c=0; c<widths.length; c++){
      const addr = XLSX.utils.encode_cell({r,c});
      if(!ws[addr]) ws[addr] = { t:'s', v:'' };
      const m = meta[r] || {};
      let fill='FFFFFF', bold=false, fontColor='000000';
      if(m.header){ fill='232221'; bold=true; fontColor='FFFFFF'; }
      else if(m.cat){ fill='D9D2C2'; bold=true; }
      else if(m.couleur==='red') fill='F4CCCC';
      else if(m.couleur==='yellow') fill='FFF2CC';
      else if(m.couleur==='green') fill='D9EAD3';
      ws[addr].s = {
        fill:{ patternType:'solid', fgColor:{rgb:fill} },
        font:{ name:'Arial', sz:m.header?11:10, bold:bold, color:{rgb:fontColor} },
        alignment:{ vertical:'center', horizontal:(leftCols.indexOf(c)!==-1)?'left':'center', wrapText:!!m.header },
        border:{ top:{style:'thin',color:{rgb:'CCCCCC'}}, bottom:{style:'thin',color:{rgb:'CCCCCC'}},
                 left:{style:'thin',color:{rgb:'CCCCCC'}}, right:{style:'thin',color:{rgb:'CCCCCC'}} }
      };
    }
  }
  return ws;
}
// Chargement à la demande de la librairie Excel (~1 Mo) : uniquement lors d'un export/import.
let _xlsxLoading = null;
function ensureXLSX(){
  if(window.XLSX) return Promise.resolve();
  if(_xlsxLoading) return _xlsxLoading;
  _xlsxLoading = new Promise(function(res, rej){
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js';
    s.onload = function(){ res(); };
    s.onerror = function(){ _xlsxLoading = null; rej(new Error('xlsx')); };
    document.head.appendChild(s);
  });
  return _xlsxLoading;
}
async function exporterExcel(){
  const btn = document.getElementById('exportBtn');
  const old = btn ? btn.textContent : '';
  if(btn){ btn.textContent='...'; btn.disabled=true; }
  try{
    try{ await ensureXLSX(); }catch(e){ alert('Impossible de charger le module Excel. Vérifie ta connexion et réessaie.'); return; }
    if(!factures.length){ alert('Aucune facture pour '+ymLabel(curYM)+'.'); return; }
    const wb = XLSX.utils.book_new();
    // --- Résumé modifs depuis le dernier export (du même mois) ---
    const snapNow = {};
    factures.forEach(f => { snapNow[f._key] = { montant:f.montant||'', statut:f.statut||'', author:f.author||'', fournisseur:f.fournisseur||'' }; });
    let prevSnap = null;
    try{ const r = await storage.get('inv:factSnapshot', true); if(r && r.value) prevSnap = JSON.parse(r.value); }catch(e){}
    if(prevSnap && prevSnap.ym === curYM && prevSnap.data){
      const diffs = [];
      Object.keys(snapNow).forEach(k => {
        const p = prevSnap.data[k], n = snapNow[k];
        if(!p){ diffs.push({ row:[n.author, 'Nouvelle facture', n.montant+' $ · '+(n.fournisseur||'—'), ''], couleur:'yellow' }); return; }
        if(p.statut !== n.statut && n.statut==='confirmee') diffs.push({ row:[n.author, 'Confirmée', n.montant+' $ · '+(n.fournisseur||'—'), ''], couleur:'green' });
        if(p.montant !== n.montant) diffs.push({ row:[n.author, 'Montant modifié', p.montant+' $', n.montant+' $'], couleur:'yellow' });
      });
      Object.keys(prevSnap.data).forEach(k => {
        if(!snapNow[k]){ const p = prevSnap.data[k]; diffs.push({ row:[p.author, 'Supprimée', p.montant+' $ · '+(p.fournisseur||'—'), ''], couleur:'red' }); }
      });
      const aoa=[['Détenteur','Changement','Détail','Après']], meta=[{header:true}];
      const depuis = prevSnap.date ? new Date(prevSnap.date).toLocaleString('fr-CA') : '—';
      aoa.push(['Depuis le dernier export : '+depuis, '', '', '']); meta.push({cat:true});
      if(diffs.length){ diffs.forEach(dd => { aoa.push(dd.row); meta.push({couleur:dd.couleur}); }); }
      else { aoa.push(['Aucune modification.', '', '', '']); meta.push({}); }
      XLSX.utils.book_append_sheet(wb, xlsSheet(aoa, meta, [28,20,32,18], [0,2]), 'Résumé modifs');
    }
    // --- Résumé par détenteur ---
    const holders = groupByHolder();
    const aoa1=[['Détenteur','Nb factures','Total ($)','Confirmées','À confirmer']], meta1=[{header:true}];
    let grandTotal=0;
    holders.forEach(h => {
      grandTotal += h.total;
      aoa1.push([formatNom(h.nom), h.items.length, h.total.toFixed(2), h.items.length-h.nonConf, h.nonConf]);
      meta1.push({couleur: h.nonConf===0 ? 'green' : 'yellow'});
    });
    aoa1.push(['TOTAL '+ymLabel(curYM), factures.length, grandTotal.toFixed(2), '', '']);
    meta1.push({cat:true});
    XLSX.utils.book_append_sheet(wb, xlsSheet(aoa1, meta1, [28,12,14,12,13], [0]), 'Résumé');
    // --- Détail des factures ---
    const aoa2=[['Détenteur','Date','Montant ($)','Fournisseur','Note','Statut']], meta2=[{header:true}];
    factures.slice().sort((a,b)=>(a.author||'').localeCompare(b.author||'','fr') || (a.ts||'').localeCompare(b.ts||'')).forEach(f => {
      aoa2.push([ formatNom(f.author)||'—', String(f.ts||'').slice(0,10), f.montant||'', f.fournisseur||'', f.note||'',
                  f.statut==='confirmee'?'Confirmée':'Publiée' ]);
      meta2.push({couleur: f.statut==='confirmee' ? 'green' : 'yellow'});
    });
    XLSX.utils.book_append_sheet(wb, xlsSheet(aoa2, meta2, [28,12,12,20,36,13], [0,3,4]), 'Factures');
    XLSX.writeFile(wb, 'Factures_DMD_' + curYM + '.xlsx');
    // Nouvel instantané pour la prochaine comparaison (par mois)
    try{ await storage.set('inv:factSnapshot', JSON.stringify({ ym:curYM, date:new Date().toISOString(), data:snapNow }), true); }catch(e){}
    if(btn) btn.style.display='none';
  }catch(e){ console.error(e); alert("Une erreur est survenue pendant l'export."); }
  finally{ if(btn){ btn.textContent=old||'⬇ Excel'; btn.disabled=false; } }
}

// Fournit UNE page Excel pour cette tuile : une ligne par facture, TOUS les mois
// (l'écran, lui, ne montre qu'un mois à la fois).
window.__dmdFlatSheet = async function(){
  const rows=[]; let from=0;
  for(;;){
    let d=[];
    try{ const r=await withTimeout(_sb.from('inv_store').select('key,value').like('key','fact:%').order('key').range(from,from+999),20000,'page'); d=(r&&Array.isArray(r.data))?r.data:[]; }catch(e){ break; }
    rows.push.apply(rows,d);
    if(d.length<1000) break;
    from+=1000; if(from>200000) break;
  }
  const H = ['Mois','Mois (libellé)','Date','Heure','Détenteur','Montant ($)','Fournisseur','Note','Statut','Confirmée le','Photo (URL)','Appareil'];
  const aoa=[H], meta=[{header:true}], lignes=[];
  rows.forEach(r=>{
    let f; try{ f=JSON.parse(r.value); }catch(e){ return; }
    if(!f) return;
    const ym = f.ym || String(r.key).slice(5,12);
    const ts = String(f.ts||'');
    let heure=''; const dts=new Date(ts); if(!isNaN(dts)) heure=String(dts.getHours()).padStart(2,'0')+'h'+String(dts.getMinutes()).padStart(2,'0');
    const mnt = parseFloat(f.montant);
    const conf = f.statut==='confirmee';
    lignes.push({ ym:ym, ts:ts, conf:conf, row:[
      ym, (/^\d{4}-\d{2}$/.test(ym)?ymLabel(ym):''), ts.slice(0,10), heure,
      formatNom(f.author)||'—', isNaN(mnt)?'':mnt, f.fournisseur||'', f.note||'',
      conf?'Confirmée':'Publiée', f.confirmeeLe?String(f.confirmeeLe).slice(0,10):'',
      (f.photo&&f.photo.url)||'', f.deviceId||'' ] });
  });
  lignes.sort((a,b)=> String(b.ym).localeCompare(String(a.ym)) || String(a.row[4]).localeCompare(String(b.row[4]),'fr') || String(a.ts).localeCompare(String(b.ts)));
  lignes.forEach(l=>{ aoa.push(l.row); meta.push({ couleur: l.conf ? 'green' : 'yellow' }); });
  if(!lignes.length){ aoa.push(['—','Aucune facture enregistrée','','','','','','','','','','']); meta.push({}); }
  return { name:'Factures', aoa:aoa, meta:meta, widths:[10,16,12,8,26,13,22,40,12,13,52,24], leftCols:[1,4,6,7,10,11] };
};

/* ==== DMD : Entree = champ suivant + correction auto du champ ==== */
(function(){
  if (window.__dmdEnterNext) return; window.__dmdEnterNext = true;
  var NAV_SCOPE = '.modal, #modalBox, .card, form, .panel, .sheet, .edit-form';
  var SKIP = {button:1,submit:1,reset:1,checkbox:1,radio:1,file:1,range:1,color:1,hidden:1,image:1};
  function navigable(el){
    if(!el || el.tagName !== 'INPUT') return false;
    var ty = (el.getAttribute('type') || 'text').toLowerCase();
    return !SKIP[ty];
  }
  function visibleField(el){
    if(el.disabled || el.readOnly) return false;
    var ty = (el.getAttribute('type') || 'text').toLowerCase();
    if(ty === 'hidden' || ty === 'file') return false;
    return el.offsetParent !== null;
  }
  // Applique la correction d'ecriture au champ : majuscules, nom synchronise de la liste, adresse, telephone
  function fmtField(el){
    if(!el || el.tagName !== 'INPUT') return;
    var kind = el.getAttribute('data-fmt');
    if(!kind && (el.getAttribute('type') || '').toLowerCase() === 'tel') kind = 'tel';
    if(!kind) return;
    var v = el.value; if(v == null) return;
    var out = v;
    try{
      if(kind === 'nom'){
        if(typeof window.__dmdCanonNom === 'function') out = window.__dmdCanonNom(v);
        else if(typeof window.formatNom === 'function') out = window.formatNom(v);
      } else if(kind === 'adresse'){
        if(typeof window.formatAdresse === 'function') out = window.formatAdresse(v);
      } else if(kind === 'tel'){
        if(typeof window.formatTel === 'function') out = window.formatTel(v);
      }
    }catch(_){ out = v; }
    if(out != null && out !== v){
      el.value = out;
      try{ el.dispatchEvent(new Event('input', {bubbles:true})); }catch(_){}
    }
  }
  window.__dmdFmtField = fmtField;
  // Fleche "suivant" sur le clavier mobile, uniquement dans un formulaire
  document.addEventListener('focusin', function(e){
    var t = e.target;
    if(navigable(t) && t.closest(NAV_SCOPE) && !t.hasAttribute('enterkeyhint')){
      t.setAttribute('enterkeyhint', 'next');
    }
  });
  // Corrige aussi quand on quitte le champ autrement (toucher ailleurs, bouton Enregistrer)
  document.addEventListener('focusout', function(e){ fmtField(e.target); });
  // Entree : corrige le champ puis passe au champ suivant du meme formulaire
  document.addEventListener('keydown', function(e){
    if(e.key !== 'Enter' || e.shiftKey || e.altKey || e.ctrlKey || e.metaKey) return;
    if(e.defaultPrevented) return;            // respecte les gestionnaires existants (chat, ajout employe...)
    var t = e.target;
    if(!navigable(t)) return;                  // laisse tranquilles les textarea et les champs de recherche
    var scope = t.closest(NAV_SCOPE);
    if(!scope) return;
    fmtField(t);                               // correction immediate du champ courant
    var fields = [].slice.call(scope.querySelectorAll('input, select, textarea')).filter(visibleField);
    var i = fields.indexOf(t);
    if(i < 0) return;
    e.preventDefault();
    if(i < fields.length - 1){
      var nx = fields[i + 1];
      nx.focus();
      if(nx.select){ try { nx.select(); } catch(_){} }
    } else {
      t.blur();                                // dernier champ : ferme le clavier
    }
  });
})();
