.foot{ padding:16px; font-size:11.5px; color:var(--logo-grey); text-align:center; line-height:1.5; }
</style>
</head>
<body>
<script>
(function(){
  var R = {"index.html": "accueil", "APPLI__INVENTAIRE.html": "inventaire", "APPLI__MACHINERIE.html": "machinerie", "APPLI__INSPECTIONS.html": "inspections", "APPLI__PUNCH.html": "punch", "APPLI__EQUIPES.html": "equipes", "APPLI__INFOS.html": "infos", "APPLI__FORMATIONS.html": "formations", "APPLI__CHAT.html": "chat", "APPLI__FACTURES.html": "factures", "APPLI__PREVENTION.html": "prevention", "APPLI__POLITIQUES.html": "politiques"};
  function route(h){
    var m = String(h||'').match(/([A-Za-z_0-9]+\.html)/);
    return m ? (R[m[1]] || '') : '';
  }
  window.__dmdGo = function(h){
    var r = route(h) || 'accueil';
    try{ parent.postMessage({ dmdnav: r }, '*'); }catch(e){}
  };
  // Un lien vers une autre page de l'appli devient une navigation dans le shell.
  document.addEventListener('click', function(e){
    var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
    if(!a) return;
    var h = a.getAttribute('href') || '';
    if(/\.html(\?|#|$)/.test(h)){ e.preventDefault(); window.__dmdGo(h); }
  }, true);
})();
<\/script>
<div id="app">
  <div class="hdr">
    <a class="back" href="./index.html" aria-label="Accueil">←</a>
    <div class="hdr-txt">
      <h1 class="hdr-title" id="hTitle">Programme de prévention</h1>
      <div class="hdr-sub" id="hSub">Santé & sécurité — Maçonnerie DMD</div>
    </div>
    <button class="hbtn" id="tocBtn" style="display:none;">☰ Table</button>
  </div>

  <div class="toolbar" id="toolbar" style="display:none;">
    <input type="search" id="search" placeholder="🔍 Chercher dans le programme…" autocomplete="off">
    <button class="fs-btn" id="fsMinus" title="Réduire le texte">A−</button>
    <button class="fs-btn" id="fsPlus" title="Agrandir le texte">A+</button>
  </div>

  <div class="wrap">
    <div id="tocList" class="toclist"><div class="empty">Chargement du programme…</div></div>
    <div id="searchResults" style="display:none;"></div>
    <div id="reader" class="reader">
      <div class="sec-title" id="secTitle"></div>
      <div class="sec-body" id="secBody"></div>
      <div class="sec-nav">
        <button id="prevSec">‹ Section précédente</button>
        <button id="nextSec">Section suivante ›</button>
      </div>
    </div>
  </div>

  <div class="foot">Document de référence interne — en cas de divergence, la version signée officielle prévaut.</div>
</div>

<script>
// ============================================================================
// LECTEUR DU PROGRAMME DE PRÉVENTION (multi-documents : PPE, PPC…)
// Contenu statique ./prevention/ déployé avec l'appli :
//   manifest.json           -> { documents:[{id,titre,sousTitre,version,date,photoPdf,sections:[{id,titre,file,niveau}]}] }
//   sN.html                 -> une section, chargée à la demande
//   index_recherche.json    -> texte brut par section (chargé seulement si on cherche)
//   media/…                 -> images compressées (lazy loading)
// Servi par le CDN Vercel : rapide, cache navigateur, AUCUNE consommation Supabase.
// ============================================================================
const BASE = './prevention/';
function escapeHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escapeAttr(s){ return escapeHtml(s).replace(/'/g,'&#39;'); }

let manifest=null, docs=[], curDoc=null, curIdx=-1, searchIndex=null, searchIndexLoading=null;
const secCache={};

function getFs(){ try{ return parseInt(localStorage.getItem('prev:fs')||'16',10)||16; }catch(e){ return 16; } }
function setFs(v){ v=Math.max(13,Math.min(24,v)); try{ localStorage.setItem('prev:fs',String(v)); }catch(e){} document.documentElement.style.setProperty('--fs', v+'px'); }
function posKey(){ return 'prev:pos:'+(curDoc?curDoc.id:'d'); }
function getPos(){ try{ return JSON.parse(localStorage.getItem(posKey())||'null'); }catch(e){ return null; } }
function setPos(idx){ try{ localStorage.setItem(posKey(), JSON.stringify({ idx, t:Date.now() })); }catch(e){} }
function luSet(){ try{ return new Set(JSON.parse(localStorage.getItem('prev:lus:'+(curDoc?curDoc.id:'d'))||'[]')); }catch(e){ return new Set(); } }
function markLu(id){ try{ const s=luSet(); s.add(id); localStorage.setItem('prev:lus:'+(curDoc?curDoc.id:'d'), JSON.stringify([...s])); }catch(e){} }

async function fetchJson(url){ const r=await fetch(url,{cache:'no-cache'}); if(!r.ok) throw new Error('http '+r.status); return r.json(); }
async function fetchText(url){ const r=await fetch(url); if(!r.ok) throw new Error('http '+r.status); return r.text(); }

// ================== CHOIX DU DOCUMENT (PPE / PPC) ==================
function renderDocPicker(){
  const el=document.getElementById('tocList');
  let h='<div class="toc-group">Documents disponibles</div>';
  docs.forEach((d,i)=>{
    h+='<div class="toc-item" data-doc="'+i+'"><span class="toc-num">'+escapeHtml((d.id||'').toUpperCase())+'</span>'
      +'<span class="toc-txt">'+escapeHtml(d.titre)+'<br><span style="font-weight:500;font-size:12.5px;color:var(--paper-dim);">'
      +(d.version?('Version '+escapeHtml(d.version)+' · '):'')+d.sections.length+' sections</span></span></div>';
  });
  el.innerHTML=h;
  el.querySelectorAll('[data-doc]').forEach(x=>x.onclick=()=>selectDoc(parseInt(x.getAttribute('data-doc'),10)));
}
function selectDoc(i){
  curDoc=docs[i]; curIdx=-1;
  document.getElementById('toolbar').style.display='';
  document.getElementById('hTitle').textContent=curDoc.titre.length>34 ? (curDoc.id||'').toUpperCase() : curDoc.titre;
  document.getElementById('hSub').textContent=(curDoc.version?('Version '+curDoc.version+' · '):'')+(curDoc.sousTitre||'Santé & sécurité');
  document.getElementById('tocBtn').style.display = docs.length>1 ? '' : 'none';
  renderToc();
}

// ================== TABLE DES MATIÈRES ==================
function renderToc(){
  const el=document.getElementById('tocList');
  el.classList.remove('hide');
  document.getElementById('reader').classList.remove('show');
  document.getElementById('searchResults').style.display='none';
  const lus=luSet();
  let h='';
  h+='<div class="doc-head"><div class="doc-title">'+escapeHtml(curDoc.titre)+'</div>'
    +'<div class="doc-meta">'+(curDoc.version?('Version '+escapeHtml(curDoc.version)+' · '):'')+(curDoc.date?('Mise à jour : '+escapeHtml(curDoc.date)+' · '):'')
    +curDoc.sections.length+' sections</div>'
    +(curDoc.photoPdf?('<a class="photo-link" href="'+escapeAttr(BASE+curDoc.photoPdf)+'" target="_blank" rel="noopener">📎 '+escapeHtml(curDoc.photoPdfLabel||'Annexe photo (PDF)')+'</a>'):'')
    +'</div>';
  const pos=getPos();
  if(pos && pos.idx>=0 && pos.idx<curDoc.sections.length){
    h+='<button class="resume-btn" id="resumeBtn">▶ Reprendre la lecture — '+escapeHtml(curDoc.sections[pos.idx].titre)+'</button>';
  }
  curDoc.sections.forEach((s,i)=>{
    const sub=(s.niveau||1)>1;
    h+='<div class="toc-item'+(sub?' toc-sub':'')+(lus.has(s.id)?' lu':'')+'" data-i="'+i+'">'
      +'<span class="toc-num">'+(i+1)+'</span><span class="toc-txt">'+escapeHtml(s.titre)+'</span>'
      +(lus.has(s.id)?'<span style="color:var(--ok-green);font-size:15px;">✓</span>':'')
      +'</div>';
  });
  el.innerHTML=h;
  el.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>openSection(parseInt(x.getAttribute('data-i'),10)));
  const rb=document.getElementById('resumeBtn'); if(rb) rb.onclick=()=>openSection(getPos().idx);
  document.getElementById('tocBtn').style.display = docs.length>1 ? '' : 'none';
}

// ================== LECTURE D'UNE SECTION ==================
async function openSection(i, highlight){
  if(!curDoc || i<0 || i>=curDoc.sections.length) return;
  curIdx=i; const s=curDoc.sections[i];
  document.getElementById('tocList').classList.add('hide');
  document.getElementById('searchResults').style.display='none';
  const rd=document.getElementById('reader'); rd.classList.add('show');
  document.getElementById('tocBtn').style.display='';
  document.getElementById('secTitle').textContent=(i+1)+'. '+s.titre;
  const body=document.getElementById('secBody');
  body.innerHTML='<div class="sec-loading">Chargement de la section…</div>';
  window.scrollTo(0,0);
  try{
    if(!secCache[s.id]) secCache[s.id]=await fetchText(BASE+s.file);
    let html=secCache[s.id].replace(/src="media\//g, 'src="'+BASE+'media/');   // les images vivent dans ./prevention/media/
    if(highlight){
      try{
        const re=new RegExp('('+highlight.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
        html=html.replace(/(>[^<]+<)/g, seg=>seg.replace(re,'<mark>$1</mark>'));
      }catch(e){}
    }
    body.innerHTML=html;
    if(highlight){ const m=body.querySelector('mark'); if(m) setTimeout(()=>m.scrollIntoView({behavior:'smooth',block:'center'}),120); }
    markLu(s.id); setPos(i);
  }catch(e){
    body.innerHTML='<div class="empty">Impossible de charger cette section.<br>Vérifie ta connexion puis réessaie.</div>';
  }
  document.getElementById('prevSec').disabled = (i<=0);
  document.getElementById('nextSec').disabled = (i>=curDoc.sections.length-1);
  document.getElementById('prevSec').onclick=()=>openSection(i-1);
  document.getElementById('nextSec').onclick=()=>openSection(i+1);
}
function backToToc(){
  if(document.getElementById('reader').classList.contains('show') || document.getElementById('searchResults').style.display!=='none'){
    document.getElementById('search').value='';
    renderToc(); window.scrollTo(0,0); return;
  }
  if(docs.length>1){ // depuis la TOC : retour au choix du document
    curDoc=null; document.getElementById('toolbar').style.display='none';
    document.getElementById('hTitle').textContent='Programme de prévention';
    document.getElementById('hSub').textContent='Santé & sécurité — Maçonnerie DMD';
    document.getElementById('tocBtn').style.display='none';
    document.getElementById('reader').classList.remove('show');
    document.getElementById('tocList').classList.remove('hide');
    renderDocPicker();
  }
}
document.getElementById('tocBtn').onclick=backToToc;

// ================== RECHERCHE (index chargé à la demande) ==================
async function ensureSearchIndex(){
  if(searchIndex) return searchIndex;
  if(searchIndexLoading) return searchIndexLoading;
  searchIndexLoading = fetchJson(BASE+'index_recherche.json').then(j=>{ searchIndex=j; return j; }).catch(()=>{ searchIndexLoading=null; return null; });
  return searchIndexLoading;
}
function norm(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
let _sTimer=null;
document.getElementById('search').addEventListener('input', ()=>{ clearTimeout(_sTimer); _sTimer=setTimeout(doSearch, 260); });
async function doSearch(){
  if(!curDoc) return;
  const q=document.getElementById('search').value.trim();
  const box=document.getElementById('searchResults');
  if(q.length<3){ box.style.display='none'; if(curIdx<0) document.getElementById('tocList').classList.remove('hide'); return; }
  box.style.display=''; document.getElementById('tocList').classList.add('hide');
  document.getElementById('reader').classList.remove('show');
  document.getElementById('tocBtn').style.display='';
  box.innerHTML='<div class="sec-loading">Recherche…</div>';
  const idxAll=await ensureSearchIndex();
  const idx = idxAll && Array.isArray(idxAll.documents) ? (idxAll.documents.find(d=>d.id===curDoc.id)||{}) : idxAll;
  if(!idx || !Array.isArray(idx.sections)){ box.innerHTML='<div class="empty">Recherche indisponible (index non déployé).</div>'; return; }
  const nq=norm(q); const out=[];
  idx.sections.forEach(sec=>{
    const nt=norm(sec.texte||''); let from=0, count=0;
    while(count<3){
      const p=nt.indexOf(nq, from); if(p===-1) break;
      const a=Math.max(0,p-60), b=Math.min(nt.length,p+nq.length+80);
      out.push({ id:sec.id, titre:sec.titre, ext:(sec.texte||'').slice(a,b), q });
      from=p+nq.length; count++;
    }
  });
  if(!out.length){ box.innerHTML='<div class="empty">Aucun résultat pour « '+escapeHtml(q)+' ».</div>'; return; }
  const secIdxById={}; curDoc.sections.forEach((s,i)=>secIdxById[s.id]=i);
  box.innerHTML='<div class="toc-group">'+out.length+' résultat'+(out.length>1?'s':'')+'</div>'+out.slice(0,60).map(r=>{
    let ext=escapeHtml(r.ext);
    try{ const re=new RegExp('('+r.q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'); ext=ext.replace(re,'<b>$1</b>'); }catch(e){}
    return '<div class="sr-item" data-sid="'+escapeAttr(r.id)+'"><div class="sr-sec">'+escapeHtml(r.titre)+'</div><div class="sr-ext">… '+ext+' …</div></div>';
  }).join('');
  box.querySelectorAll('[data-sid]').forEach(el=>el.onclick=()=>{ const i=secIdxById[el.getAttribute('data-sid')]; if(i!==undefined) openSection(i, q); });
}

// ================== TAILLE DU TEXTE ==================
document.getElementById('fsMinus').onclick=()=>setFs(getFs()-1);
document.getElementById('fsPlus').onclick=()=>setFs(getFs()+1);

// ================== DÉMARRAGE ==================
(async function(){
  setFs(getFs());
  try{ manifest=await fetchJson(BASE+'manifest.json'); }catch(e){ manifest=null; }
  // rétro-compatibilité : ancien format à un seul document { sections:[...] }
  if(manifest && Array.isArray(manifest.sections)) manifest={ documents:[manifest] };
  docs = manifest && Array.isArray(manifest.documents) ? manifest.documents.filter(d=>d && Array.isArray(d.sections) && d.sections.length) : [];
  if(!docs.length){
    document.getElementById('tocList').innerHTML =
      '<div class="notice">📘 <b>Le programme de prévention n\'est pas encore chargé dans l\'application.</b><br><br>'+
      'Le document Word officiel (et son annexe photo PDF) seront convertis et ajoutés ici.</div>';
    return;
  }
  if(docs.length===1){ selectDoc(0); }
  else{ renderDocPicker(); }
})();
<\/script>
</body>
</html>
</script>

        <p style="color:var(--paper-dim);font-size:12px;">Version 1.1 · En vigueur le 10 juillet 2026</p>
        <p>Chez <b>Maçonnerie DMD inc.</b>, nous accordons une grande importance à la protection de vos renseignements personnels. La présente politique explique quels renseignements nous recueillons, pourquoi, comment nous les protégeons et les droits dont vous disposez. Elle est adoptée conformément à la <i>Loi sur la protection des renseignements personnels dans le secteur privé</i> du Québec, telle que modifiée par la Loi 25.</p>

        <h4>1. Responsable de la protection des renseignements personnels</h4>
        <p>Jason Turcotte — courriel : jturcotte@maconneriedmd.com · téléphone : (450)502-7273 · 906, avenue Simard, Chambly (Québec) J3L 4X2.</p>

        <h4>2. Renseignements que nous recueillons</h4>
        <p>Identité (nom et prénom); coordonnées (courriel, téléphone); renseignements liés à l'emploi (équipe et chantier d'affectation, fonction); formations et compétences (dossiers de formation, cartes de compétence, certifications); <b>contact d'urgence</b> (nom, numéro et lien d'une personne à joindre en cas d'incident — voir la section 5.1); <b>photos</b> transmises dans la messagerie interne; <b>données de localisation ponctuelles</b> si une fonction de pointage de chantier est activée; renseignements techniques (identifiant d'appareil servant au fonctionnement de l'application). Nous ne recueillons que le nécessaire.</p>

        <h4>3. Fins de la collecte</h4>
        <p>Gérer l'inventaire, les équipements et le matériel par équipe et par chantier; assurer le suivi des formations, compétences et certifications; coordonner les équipes, communiquer avec le personnel et permettre la messagerie interne; <b>joindre rapidement un proche en cas d'incident sur un chantier</b> (contact d'urgence); le cas échéant, <b>confirmer la présence au chantier lors d'un pointage</b>; respecter nos obligations légales, contractuelles et de santé et sécurité au travail.</p>

        <h4>4. Consentement</h4>
        <p>En fournissant vos renseignements ou en utilisant l'application, vous consentez à leur collecte et utilisation aux fins décrites. Vous pouvez retirer votre consentement en tout temps, sous réserve des renseignements dont la conservation est requise par la loi ou nécessaire à la relation d'emploi.</p>

        <h4>5. Communication à des tiers</h4>
        <p>Nous ne vendons pas vos renseignements. Nous les communiquons uniquement : à nos employés et mandataires qui en ont besoin pour leurs fonctions; à nos fournisseurs technologiques qui hébergent ou traitent les données pour notre compte (notamment Supabase, Vercel et GitHub), liés par des engagements de confidentialité; lorsque la loi l'exige ou le permet.</p>
        <p><b>Visibilité entre utilisateurs :</b> votre nom et vos coordonnées (téléphone, courriel) sont visibles par les autres utilisateurs afin qu'ils puissent vous joindre. Vos <b>formations et compétences</b> ne sont visibles que par vous-même et par l'administration — jamais par les autres employés. Votre <b>contact d'urgence</b> n'apparaît pas dans le répertoire; il n'est révélé qu'au moment où un collègue utilise le bouton « En cas d'urgence », en situation d'incident.</p>

        <h4>5.1 Renseignements concernant un tiers (contact d'urgence)</h4>
        <p>Le contact d'urgence que vous fournissez concerne une autre personne. Vous devez <b>l'aviser</b> que son nom et son numéro sont enregistrés dans l'application et pourront être consultés par vos collègues présents en cas d'incident sur un chantier. Ces renseignements sont utilisés <b>uniquement à des fins d'urgence</b> et de santé et sécurité, et ne servent à aucune autre fin.</p>

        <h4>6. Hébergement et localisation</h4>
        <p>Les données sont hébergées <b>au Canada</b>, dans un centre de données situé au Québec (région ca-central-1). Si un renseignement devait être communiqué à l'extérieur du Québec, l'évaluation requise par la loi serait faite au préalable.</p>

        <h4>7. Mesures de sécurité</h4>
        <p>Accès protégé par authentification (mot de passe); règles de sécurité au niveau de la base de données restreignant l'accès aux personnes autorisées; accès limité selon le principe du besoin de savoir.</p>

        <h4>8. Conservation et destruction</h4>
        <p>Vos renseignements sont conservés uniquement pour la durée nécessaire aux fins prévues ou exigée par la loi, puis détruits ou anonymisés de manière sécuritaire. Les délais détaillés figurent dans notre politique interne de conservation (voir le Cadre de gouvernance ci-dessous).</p>

        <h4>9. Vos droits</h4>
        <p>Accéder à vos renseignements; les faire rectifier s'ils sont inexacts, incomplets ou équivoques; retirer votre consentement; demander la communication de vos renseignements dans un format technologique structuré (portabilité); demander la cessation de la diffusion dans certains cas. Réponse en 30 jours. Recours possible auprès de la Commission d'accès à l'information du Québec.</p>

        <h4>10. Témoins, appareil photo et géolocalisation</h4>
        <p><b>Stockage local :</b> l'application utilise un stockage local minimal sur votre appareil (ex. identifiant d'appareil) strictement nécessaire à son fonctionnement. Aucun profilage publicitaire, aucune publicité.</p>
        <p><b>Appareil photo :</b> l'accès à la caméra est demandé <b>seulement</b> lorsque vous choisissez d'envoyer une photo dans la messagerie, et en <b>mode direct</b>. L'application n'accède pas à la pellicule ni aux photos déjà enregistrées sur votre appareil.</p>
        <p><b>Géolocalisation :</b> si une fonction de pointage de chantier est offerte, elle utilise une technologie permettant de vous localiser. Conformément à la Loi 25, cette fonction est <b>désactivée par défaut</b> — c'est vous qui l'activez, après avoir été informé. La position est relevée <b>uniquement au moment du pointage</b> (entrée/sortie), pour confirmer la présence au chantier. <b>Aucun suivi en continu</b>, ni en dehors des heures de travail, ni entre les pointages.</p>

        <h4>11. Incidents de confidentialité</h4>
        <p>En cas d'incident présentant un risque de préjudice sérieux, nous aviserons sans délai la Commission d'accès à l'information et les personnes concernées, et prendrons les mesures nécessaires pour en réduire les conséquences.</p>

        <h4>12. Modifications</h4>

function withTimeout(promise, ms, label){

function escapeHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

async function loadConsents(){
  const listEl = document.getElementById('cList');
  const countEl = document.getElementById('cCount');
  try{
    const res = await withTimeout(_sb.from('inv_store').select('key,value').like('key','inv:consent:%'), 12000, 'consents');
    const rows = [];
    if(res && Array.isArray(res.data)){
      res.data.forEach(r => {

          if(c){ c._id = r.key.replace('inv:consent:',''); rows.push(c); }
        }catch(e){}
      });
    }
    rows.sort((a,b) => (b.date||'').localeCompare(a.date||''));
    window._consentRows = rows;   // pour l'export Excel
    countEl.textContent = rows.length;

      listEl.innerHTML = '<div class="c-empty">Aucun consentement enregistré pour le moment. Chaque acceptation de l\'avis de collecte apparaîtra ici avec sa date.</div>';

    const myId = getDeviceId();

}

function xlsSheet(aoa, meta, widths, leftCols){
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = widths.map(w => ({wch:w}));
  ws['!freeze'] = { xSplit:0, ySplit:1 };
  ws['!autofilter'] = { ref: XLSX.utils.encode_range({s:{r:0,c:0}, e:{r:aoa.length-1, c:widths.length-1}}) };
  for(let r=0; r<aoa.length; r++){
    for(let c=0; c<widths.length; c++){
      const addr = XLSX.utils.encode_cell({r,c});
      if(!ws[addr]) ws[addr] = { t:'s', v:'' };
      const m = meta[r] || {};
      let fill='FFFFFF', bold=false, fontColor='000000';
      if(m.header){ fill='232221'; bold=true; fontColor='FFFFFF'; }
      else if(m.couleur==='green') fill='D9EAD3';
      ws[addr].s = {
        fill:{ patternType:'solid', fgColor:{rgb:fill} },
        font:{ name:'Arial', sz:m.header?11:10, bold:bold, color:{rgb:fontColor} },
        alignment:{ vertical:'center', horizontal:(leftCols.indexOf(c)!==-1)?'left':'center', wrapText:!!m.header },
        border:{ top:{style:'thin',color:{rgb:'CCCCCC'}}, bottom:{style:'thin',color:{rgb:'CCCCCC'}},
                 left:{style:'thin',color:{rgb:'CCCCCC'}}, right:{style:'thin',color:{rgb:'CCCCCC'}} }
      };
    }
  }
  return ws;
}
// Chargement à la demande de la librairie Excel (~1 Mo) : uniquement lors d'un export/import.
let _xlsxLoading = null;
function ensureXLSX(){
  if(window.XLSX) return Promise.resolve();
  if(_xlsxLoading) return _xlsxLoading;
  _xlsxLoading = new Promise(function(res, rej){
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js';
    s.onload = function(){ res(); };
    s.onerror = function(){ _xlsxLoading = null; rej(new Error('xlsx')); };
    document.head.appendChild(s);
  });
  return _xlsxLoading;
}

      aoa.push([ formatNom(c.nom) || ('Appareil '+String(c.deviceId||c._id).slice(-6)), String(c.deviceId||c._id||''), dateTxt, c.version||'' ]);
      meta.push({couleur:'green'});
    });
    XLSX.utils.book_append_sheet(wb, xlsSheet(aoa, meta, [30,26,20,16], [0,1]), 'Consentements');
    const d = new Date();
    XLSX.writeFile(wb, 'Consentements_DMD_' + d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + '.xlsx');
    if(btn) btn.style.display='none';
  }catch(e){ console.error(e); alert("Une erreur est survenue pendant l'export."); }
  finally{ if(btn){ btn.textContent=old||'⬇ Excel'; btn.disabled=false; } }
}

/* ==== DMD : Entree = champ suivant + correction auto du champ ==== */
(function(){
  if (window.__dmdEnterNext) return; window.__dmdEnterNext = true;
  var NAV_SCOPE = '.modal, #modalBox, .card, form, .panel, .sheet, .edit-form';
  var SKIP = {button:1,submit:1,reset:1,checkbox:1,radio:1,file:1,range:1,color:1,hidden:1,image:1};
  function navigable(el){
    if(!el || el.tagName !== 'INPUT') return false;
    var ty = (el.getAttribute('type') || 'text').toLowerCase();
    return !SKIP[ty];
  }
  function visibleField(el){
    if(el.disabled || el.readOnly) return false;
    var ty = (el.getAttribute('type') || 'text').toLowerCase();
    if(ty === 'hidden' || ty === 'file') return false;
    return el.offsetParent !== null;
  }
  // Applique la correction d'ecriture au champ : majuscules, nom synchronise de la liste, adresse, telephone
  function fmtField(el){
    if(!el || el.tagName !== 'INPUT') return;
    var kind = el.getAttribute('data-fmt');
    if(!kind && (el.getAttribute('type') || '').toLowerCase() === 'tel') kind = 'tel';
    if(!kind) return;
    var v = el.value; if(v == null) return;
    var out = v;
    try{
      if(kind === 'nom'){
        if(typeof window.__dmdCanonNom === 'function') out = window.__dmdCanonNom(v);
        else if(typeof window.formatNom === 'function') out = window.formatNom(v);
      } else if(kind === 'adresse'){
        if(typeof window.formatAdresse === 'function') out = window.formatAdresse(v);
      } else if(kind === 'tel'){
        if(typeof window.formatTel === 'function') out = window.formatTel(v);
      }
    }catch(_){ out = v; }
    if(out != null && out !== v){
      el.value = out;
      try{ el.dispatchEvent(new Event('input', {bubbles:true})); }catch(_){}
    }
  }
  window.__dmdFmtField = fmtField;
  // Fleche "suivant" sur le clavier mobile, uniquement dans un formulaire
  document.addEventListener('focusin', function(e){
    var t = e.target;
    if(navigable(t) && t.closest(NAV_SCOPE) && !t.hasAttribute('enterkeyhint')){
      t.setAttribute('enterkeyhint', 'next');
    }
  });
  // Corrige aussi quand on quitte le champ autrement (toucher ailleurs, bouton Enregistrer)
  document.addEventListener('focusout', function(e){ fmtField(e.target); });
  // Entree : corrige le champ puis passe au champ suivant du meme formulaire
  document.addEventListener('keydown', function(e){
    if(e.key !== 'Enter' || e.shiftKey || e.altKey || e.ctrlKey || e.metaKey) return;
    if(e.defaultPrevented) return;            // respecte les gestionnaires existants (chat, ajout employe...)
    var t = e.target;
    if(!navigable(t)) return;                  // laisse tranquilles les textarea et les champs de recherche
    var scope = t.closest(NAV_SCOPE);
    if(!scope) return;
    fmtField(t);                               // correction immediate du champ courant
    var fields = [].slice.call(scope.querySelectorAll('input, select, textarea')).filter(visibleField);
    var i = fields.indexOf(t);
    if(i < 0) return;
    e.preventDefault();
    if(i < fields.length - 1){
      var nx = fields[i + 1];
      nx.focus();
      if(nx.select){ try { nx.select(); } catch(_){} }
    } else {
      t.blur();                                // dernier champ : ferme le clavier
    }
  });
})();

<script>
(function(){
  var PAGES = [{"r": "accueil", "t": "Accueil"}, {"r": "inventaire", "t": "Inventaire"}, {"r": "machinerie", "t": "Machinerie"}, {"r": "inspections", "t": "Inspection quotidienne"}, {"r": "punch", "t": "Punch"}, {"r": "equipes", "t": "Infos équipe"}, {"r": "infos", "t": "Infos personnelles"}, {"r": "formations", "t": "Formations"}, {"r": "chat", "t": "Messagerie"}, {"r": "factures", "t": "Factures"}, {"r": "prevention", "t": "Programme de prévention"}, {"r": "politiques", "t": "Politiques"}];
  var VALIDES = {}; PAGES.forEach(function(p){ VALIDES[p.r] = p.t; });
  var BASE = location.href.replace(/[#?].*$/, '').replace(/[^/]*$/, '');
  var cadre = document.getElementById('cadre');
  var chargement = document.getElementById('chargement');
  var courante = null;

  // Source d'une page, prête à être posée dans un cadre.
  function source(route, modeExport){
    var el = document.getElementById('dmd-' + route);
    if(!el) return '';
    // rétablit la séquence masquée à l'assemblage (voir embarquer())
    var MASQUE = '<' + String.fromCharCode(92) + '/script';
    var t = el.textContent.split(MASQUE).join('</script');
    // <base> : les chemins relatifs (dossier prevention/, CDN, polices) restent valides
    var tete = '<base href="' + BASE + '">';
    if(modeExport) tete += '<scr' + 'ipt>window.__DMD_EXPORT=true;</scr' + 'ipt>';
    return t.replace(/<head([^>]*)>/i, '<head$1>' + tete);
  }
  // Utilisé par l'accueil pour son export Excel complet (il charge les tuiles en arrière-plan).
  window.__dmdSource = function(fichier, modeExport){
    var m = String(fichier||'').match(/([A-Za-z_0-9]+\.html)/);
    var route = m ? ({"index.html": "accueil", "APPLI__INVENTAIRE.html": "inventaire", "APPLI__MACHINERIE.html": "machinerie", "APPLI__INSPECTIONS.html": "inspections", "APPLI__PUNCH.html": "punch", "APPLI__EQUIPES.html": "equipes", "APPLI__INFOS.html": "infos", "APPLI__FORMATIONS.html": "formations", "APPLI__CHAT.html": "chat", "APPLI__FACTURES.html": "factures", "APPLI__PREVENTION.html": "prevention", "APPLI__POLITIQUES.html": "politiques"}[m[1]] || '') : '';
    return route ? source(route, modeExport) : '';
  };

  // DMD.html#reinitialiser : l'appareil oublie tout ce qu'il sait de lui-même
  // (identité, mode admin, équipe, consentement, lectures). Les données partagées
  // dans Supabase ne sont pas touchées. Sert à repartir « comme un appareil neuf ».
  function reinitialiser(){
    try{
      var aJeter = [];
      for(var i = 0; i < localStorage.length; i++){
        var k = localStorage.key(i);
        if(/^(inv:|punch:|chat:|prev:)/.test(k)) aJeter.push(k);
      }
      aJeter.forEach(function(k){ localStorage.removeItem(k); });
      try{ sessionStorage.clear(); }catch(e){}
      cadre.removeAttribute('srcdoc');
      chargement.classList.remove('parti');
      chargement.textContent = aJeter.length + ' réglage(s) effacé(s) — appareil remis à neuf';
    }catch(e){ chargement.textContent = 'Impossible de réinitialiser cet appareil.'; }
    setTimeout(function(){ location.replace(location.pathname); }, 1500);
  }
  var ESTRESET = /^#?reinitialiser$/i;

  // Tuiles ouvertes — même liste que TUILES_OUVERTES dans la grille de l'accueil.
  // Sans ça, DMD.html#punch tapé à la main ouvrirait quand même la tuile fermée.
  // Rouvrir une tuile = l'ajouter aux DEUX listes.
  var OUVERTES = { accueil:1, inventaire:1, machinerie:1, equipes:1, infos:1 };

  function aller(route, remplacer){
    if(!VALIDES[route]) route = 'accueil';
    if(!OUVERTES[route]) route = 'accueil';
    if(route === courante) return;
    courante = route;
    document.title = route === 'accueil' ? 'Maçonnerie DMD'
                                         : VALIDES[route] + ' — Maçonnerie DMD';
    cadre.srcdoc = source(route, false);
    var h = '#' + route;
    if(location.hash !== h){
      if(remplacer) location.replace(h); else location.hash = route;
    }
  }

  // Navigation demandée depuis une page (lien ou redirection JavaScript)
  window.addEventListener('message', function(e){
    if(e.data && e.data.dmdnav) aller(String(e.data.dmdnav), false);
  });
  // Bouton retour du téléphone
  window.addEventListener('hashchange', function(){
    if(ESTRESET.test(location.hash)){ reinitialiser(); return; }
    aller((location.hash || '').replace(/^#/, '') || 'accueil', false);
  });
  cadre.addEventListener('load', function(){ chargement.classList.add('parti'); });

  if(ESTRESET.test(location.hash)) reinitialiser();
  else aller((location.hash || '').replace(/^#/, '') || 'accueil', true);
})();
</script>
<script>
// Mode hors ligne : l'app s'ouvre sur le chantier même sans réception.
// Ne s'active que sur une vraie adresse (https) — ignoré si on ouvre le fichier
// directement depuis le téléphone, où les service workers sont interdits.
(function(){
  if(!('serviceWorker' in navigator)) return;
  if(location.protocol !== 'https:' && location.hostname !== 'localhost') return;
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('/sw.js').then(function(reg){
      // Une nouvelle version déposée sur le serveur prend la main au prochain
      // démarrage, sans que personne ait à désinstaller quoi que ce soit.
      reg.addEventListener('updatefound', function(){
        var sw = reg.installing;
        if(!sw) return;
        sw.addEventListener('statechange', function(){
          if(sw.state === 'installed' && navigator.serviceWorker.controller){
            try{ sw.postMessage('dmd-maj'); }catch(e){}
          }
        });
      });
    }).catch(function(e){ console.warn('Hors ligne indisponible :', e); });
  });
})();
</script>
