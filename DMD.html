          if(_edge) card.classList.add(_edge);
          // Recolore le champ vérif. en direct sans perdre le focus
          if(inp.dataset.field === 'verif'){
            const formatted = formatVerif(inp.value);
            if(formatted !== inp.value){
              inp.value = formatted;
              st[i].verif = formatted;
              inp.setSelectionRange(formatted.length, formatted.length);
            }
            const vs = verifStatus(inp.value);
            inp.classList.remove('verif-red','verif-orange','verif-green');
            inp.classList.add('verif-' + vs.level);
            const hint = inp.parentElement.querySelector('.verif-hint');
            if(hint){ hint.className = 'verif-hint ' + vs.level; hint.textContent = vs.label; }
            const dot = card.querySelector('.verif-dot[data-dot="verif"]');
            if(dot){ dot.className = 'verif-dot ' + vs.level; dot.title = 'Vérif — ' + vs.label; }
          }
          // Recolore huile / tune-up en direct (format date AAAA/MM comme la vérif)
          if(inp.dataset.field === 'huile' || inp.dataset.field === 'tuneup'){
            const formatted = formatVerif(inp.value);
            if(formatted !== inp.value){
              inp.value = formatted;
              st[i][inp.dataset.field] = formatted;
              inp.setSelectionRange(formatted.length, formatted.length);
            }
            const es = entretienStatus(inp.value);
            inp.classList.remove('verif-red','verif-orange','verif-green');
            inp.classList.add('verif-' + es.level);
            const hint = inp.parentElement.querySelector('.verif-hint');
            if(hint){ hint.className = 'verif-hint ' + es.level; hint.textContent = es.label; }
          }
          // Recolore l'indicateur de quantité en direct
          if(inp.dataset.field === 'qte' || inp.dataset.field === 'qteReel'){
            const qs = qtyStatus(st[i].qte, st[i].qteReel);
            const reelInp = body.querySelector('input[data-field="qteReel"]');
            if(reelInp){
              reelInp.classList.remove('verif-red','verif-orange','verif-green');
              if(qs) reelInp.classList.add('verif-' + qs.level);
            }
            const wrap = body.querySelector('.qty-hint-wrap');
            const qhint = wrap ? wrap.querySelector('.verif-hint') : null;
            if(wrap && qhint){
              if(qs){ wrap.style.display=''; qhint.className='verif-hint '+qs.level; qhint.textContent=qs.label; }
              else { wrap.style.display='none'; qhint.textContent=''; }
            }
            // pastille d'en-tête quantité
            let qdot = card.querySelector('.verif-dot[data-dot="qty"]');
            const meta = card.querySelector('.card-meta');
            if(qs){
              if(!qdot && meta){
                qdot = document.createElement('span');
                qdot.setAttribute('data-dot','qty');
                meta.insertBefore(qdot, meta.firstChild);
              }
              if(qdot){ qdot.className = 'verif-dot ' + qs.level; qdot.title = 'Quantité — ' + qs.label; }
            } else if(qdot){ qdot.remove(); }
          }
          // Recolore l'indicateur d'état (compteurs Bon/Moyen/Mauvais)
          if(inp.dataset.field === 'etatBon' || inp.dataset.field === 'etatMoyen' || inp.dataset.field === 'etatMauvais'){
            const es = etatSummary(st[i]);
            // pastille dans le label
            const lbl = body.querySelector('.etat-counters').parentElement.querySelector('label');
            if(lbl){
              const existing = lbl.querySelector('.etat-pill');
              if(existing) existing.remove();
              if(es){ lbl.insertAdjacentHTML('beforeend', ' <span class="etat-pill ' + es.level + '">' + escapeHtml(es.label) + '</span>'); }
            }
            // texte d'aide (total + alerte)
            const eh = body.querySelector('[data-etat-hint]');
            if(eh){ eh.textContent = es ? etatHintText(es, st[i]) : ''; eh.className = 'etat-total-hint' + (es && !isNaN(parseFloat(st[i].qteReel)) && st[i].qteReel!=="" && es.total !== parseFloat(st[i].qteReel) ? ' mismatch' : ''); }
            // pastille d'en-tête état + bordure de carte
            let edot = card.querySelector('.verif-dot[data-dot="etat"]');
            const meta2 = card.querySelector('.card-meta');
            if(es){
              if(!edot && meta2){ edot = document.createElement('span'); edot.setAttribute('data-dot','etat'); meta2.insertBefore(edot, meta2.firstChild); }
              if(edot){ edot.className = 'verif-dot ' + es.level; edot.title = 'État — ' + es.label; }
            } else if(edot){ edot.remove(); }
            // (bordure recalculée globalement plus bas)
          }
        });
        inp.addEventListener('click', e => e.stopPropagation());
      });
      const delLink = body.querySelector('[data-del-item]');
      if(delLink){
        delLink.addEventListener('click', async (e) => {
          e.stopPropagation();
          if(!isAdmin) return;
          if(!confirm('Supprimer "' + it.name + '" ? (pour toutes les équipes)')) return;
          const extraIdx = i - baseLen;
          extraItems[currentCat].splice(extraIdx, 1);
          await saveExtraItems(currentCat);
          // Ré-indexe TOUTES les équipes, y compris celles pas encore chargées en mémoire :
          // avant, leurs données stockées gardaient une ligne de trop et tous les articles
          // suivants se décalaient d'une case (mauvaises quantités affichées/enregistrées).
          for(const t of teams){
            let arr = (perTeamState[t.id] && perTeamState[t.id][currentCat]) || null;
            if(!arr){
              try{
                const r = await window.storage.get('inv:' + t.id + ':' + currentCat, true);
                if(r && r.value){ const p = JSON.parse(r.value); if(Array.isArray(p)) arr = p; }
              }catch(e){}
            }
            if(arr && arr.length > i){
              arr.splice(i, 1);
              if(perTeamState[t.id]) perTeamState[t.id][currentCat] = arr;
              await window.storage.set('inv:' + t.id + ':' + currentCat, JSON.stringify(arr), true);
            }
          }
          openIndex = null;
          renderTabs();
          renderList();
        });
      }
      // Admin : renommer un article ajouté (extraItems), pour toutes les équipes
      const renameLink = body.querySelector('[data-rename-item]');
      if(renameLink){
        renameLink.addEventListener('click', (e) => {
          e.stopPropagation();
          if(!isAdmin) return;
          const extraIdx = i - baseLen;
          openRenameItemModal(currentCat, extraIdx);
        });
      }
      // Admin : masquer un article de base (permanent, toutes équipes, survit aux refontes)
      const delBase = body.querySelector('[data-del-base]');
      if(delBase){
        delBase.addEventListener('click', async (e) => {
          e.stopPropagation();
          if(!isAdmin) return;
          if(!confirm('Supprimer définitivement « ' + it.name.replace(/\n/g,' ') + ' » ?\n\n' +
            'Il disparaîtra pour toutes les équipes et restera supprimé, même après une refonte de l\'app.')) return;
          await hideItem(currentCat, it.name);
          openIndex = null;
          renderTabs();
          renderList();
        });
      }
      body.querySelectorAll('.opt-chip[data-opt]').forEach(chip => {
        chip.addEventListener('click', (e) => {
          e.stopPropagation();
          if(!st[i]) st[i] = defaultItemState(it);   // garde : état pas encore chargé (connexion lente) -> pas de crash
          if(!confirmForeignEdit(i)) return; // autre équipe : refus -> on ne change rien
          const opt = chip.getAttribute('data-opt');
          if(!Array.isArray(st[i].opts)) st[i].opts = [];
          const pos = st[i].opts.indexOf(opt);
          if(pos === -1){ st[i].opts.push(opt); chip.classList.add('sel'); }
          else { st[i].opts.splice(pos, 1); chip.classList.remove('sel'); }
          st[i]._by = deviceUserLabel();
          st[i]._at = Date.now();
          // Met à jour le sous-titre de la carte
          const subEl = card.querySelector('.card-sub');
          const bits = [];
          if(st[i].ident) bits.push(st[i].ident);
          if(st[i].opts && st[i].opts.length) bits.push('🔩 ' + st[i].opts.join(' + '));
          if(st[i].localisation) bits.push('📍 ' + st[i].localisation);
          const esNow = etatSummary(st[i]);
          if(esNow) bits.push('🔧 ' + esNow.label);
          if(st[i].comment) bits.push(st[i].comment);
          if(subEl){
            if(bits.length){ subEl.textContent = bits.join(' · '); subEl.style.display=''; }
            else { subEl.textContent=''; subEl.style.display='none'; }
          }
          markDirtyIdx(currentTeam, currentCat, i);
          scheduleSaveTeamCat(currentTeam, currentCat);
        });
      });
    }
  });

  if(!anyVisible){
    const empty = document.createElement('div');
    empty.className = 'empty-msg';
    empty.textContent = query ? 'Aucun article ne correspond à "' + query + '".' : 'Aucun article.';
    listEl.appendChild(empty);
  }

  if(!query){
    const addBtn = document.createElement('button');
    addBtn.className = 'add-item-btn';
    addBtn.textContent = '+ Ajouter un article';
    addBtn.onclick = openAddItemModal;
    listEl.appendChild(addBtn);
    // Bouton dédié aux extincteurs, dans l'onglet S.S.T. (là où vit le registre).
    if(currentCat === 'S.S.T.'){
      const addExt = document.createElement('button');
      addExt.className = 'add-item-btn';
      addExt.textContent = '🧯 Ajouter un extincteur';
      addExt.onclick = addExtincteur;
      listEl.appendChild(addExt);
    }
  }
}

function renderTotalList(){
  const listEl = document.getElementById('list');
  const query = document.getElementById('search').value.trim();
  listEl.innerHTML = '';

  if(!query){ const b = sstBannerHTML(); if(b){ const d = document.createElement('div'); d.innerHTML = b; listEl.appendChild(d); } }

  const banner = document.createElement('div');
  banner.className = 'total-banner';
  banner.textContent = 'Vue Total — détail par équipe et somme des quantités réelles pour "' + catLabel(currentCat) + '".';
  listEl.appendChild(banner);

  // Récapitulatif des infos de chantier de chaque équipe (lecture seule)
  const anyInfo = teams.some(t => {
    const inf = teamInfo[t.id]; return inf && (inf.projet || inf.adresse || inf.contremaitre);
  });
  if(anyInfo && !query){
    const wrap = document.createElement('div');
    wrap.innerHTML = teams.map(t => {
      const inf = teamInfo[t.id] || {};
      if(!(inf.projet || inf.adresse || inf.contremaitre)) return '';
      const bits = [];
      if(inf.projet) bits.push('<span class="tir-line">N° projet : <b>' + escapeHtml(inf.projet) + '</b></span>');
      if(inf.contremaitre) bits.push('<span class="tir-line">Contremaître : <b>' + escapeHtml(inf.contremaitre) + '</b></span>');
      if(inf.adresse) bits.push('<span class="tir-line">Adresse : <b>' + escapeHtml(inf.adresse) + '</b></span>');
      return '<div class="team-info-readonly"><div class="tir-team">' + escapeHtml(t.label) + '</div>' + bits.join('<br>') + '</div>';
    }).join('');
    listEl.appendChild(wrap);
  }

  const items = itemsFor(currentCat);
  ensureSectionsInit(currentCat, items);
  let anyVisible = false;

  // Priorité en vue Total : pire priorité parmi toutes les équipes pour l'article
  const totalPrio = items.map((it, i) => {
    if(it.header) return 2;
    let best = 2;
    for(const t of teams){
      const st = (perTeamState[t.id] && perTeamState[t.id][currentCat]) || [];
      const s = st[i] || defaultItemState(it);
      best = Math.min(best, itemPriority(it, s));
    }
    return best;
  });
  // Réordonne en gardant les sections
  const orderedTotal = [];
  {
    let block = [];
    const flush = () => {
      block.map((e,idx)=>({e,idx})).sort((a,b)=>
        (totalPrio[a.e.i]-totalPrio[b.e.i]) ||
        (a.e.it.name||'').replace(/\n/g,' ').localeCompare((b.e.it.name||'').replace(/\n/g,' '), 'fr', { sensitivity:'base', numeric:true }) ||
        (a.idx-b.idx)
      ).forEach(x=>orderedTotal.push(x.e));
      block = [];
    };
    items.forEach((it,i)=>{ if(it.header){ flush(); orderedTotal.push({it,i,header:true}); } else { block.push({it,i,header:false}); } });
    flush();
  }

  let curHeaderNameT = null, curCollapsedT = false;
  orderedTotal.forEach(({ it, i }) => {
    if(it.header){
      if(query){ curHeaderNameT = null; curCollapsedT = false; return; }
      curHeaderNameT = (it.name||'').replace(/\n/g,' ');
      curCollapsedT = isSectionCollapsed(currentCat, curHeaderNameT);
      let count = 0;
      for(let j = i + 1; j < items.length; j++){
        const nx = items[j];
        if(nx.header) break;
        if(isItemHidden(currentCat, nx.name)) continue;
        count++;
      }
      const label = document.createElement('div');
      label.className = 'section-label' + (curCollapsedT ? ' collapsed' : '');
      label.innerHTML = '<span class="sec-arrow">▾</span>' +
        '<span class="sec-name">' + escapeHtml(it.name) + '</span>' +
        '<span class="sec-count">' + count + '</span>';
      label.onclick = () => { toggleSection(currentCat, it.name); renderList(); };
      listEl.appendChild(label);
      return;
    }
    if(curCollapsedT) return;
    if(!matchesSearch(it.name, query)) return;
    if(isItemHidden(currentCat, it.name)) return;
    anyVisible = true;

    let totalReel = 0, anyNumeric = false;
    let aggBon = 0, aggMoyen = 0, aggMauvais = 0, anyEtat = false;
    const perTeamRows = teams.map(t => {
      const st = (perTeamState[t.id] && perTeamState[t.id][currentCat]) || [];
      const s = st[i] || defaultItemState(it);
      const n = parseFloat(s.qteReel);
      if(!isNaN(n)){ totalReel += n; anyNumeric = true; }
      const es = etatSummary(s);
      if(es){ aggBon += es.b; aggMoyen += es.m; aggMauvais += es.x; anyEtat = true; }
      return {team: t, s, es};
    });
    const hasAnyData = perTeamRows.some(r => r.s.qte !== "" || r.s.qteReel !== "" || r.es);

    const card = document.createElement('div');
    card.className = 'card' + (openIndex === i ? ' open' : '');

    const row = document.createElement('div');
    row.className = 'card-row';
    row.innerHTML = `
      <div>
        <div class="card-name">${escapeHtml(it.name.replace(/\n/g,' '))}</div>
        ${!hasAnyData ? '<div class="card-sub">Aucune donnée saisie</div>' : ''}
      </div>
      <div class="card-meta">
        ${(!it.noQty && anyNumeric) ? `<span class="qty-badge total-badge">${totalReel}</span>` : ''}
        <span class="chevron">▾</span>
      </div>
    `;
    row.onclick = () => { openIndex = (openIndex === i ? null : i); renderList(); };
    card.appendChild(row);

    const body = document.createElement('div');
    body.className = 'card-body';
    let rowsHtml = perTeamRows.map(({team, s, es}) => {
      const etatChip = es ? `<span class="etat-pill ${es.level}">${escapeHtml(es.label)}</span>` : '';
      const metaBits = [];
      if(s.ident) metaBits.push(s.ident);
      if(Array.isArray(s.opts) && s.opts.length) metaBits.push('🔩 ' + s.opts.join(' + '));
      if(s.localisation) metaBits.push('📍 ' + s.localisation);
      { const _v = effVerif(s, it); if(_v) metaBits.push('Vérif: ' + _v); }
      if(s.pression) metaBits.push('Pression: ' + s.pression);
      { const _h = effHuile(s, it); if(_h) metaBits.push('🛢️ ' + _h); }
      { const _t = effTuneup(s, it); if(_t) metaBits.push('🔧 ' + _t); }
      if(s.comment) metaBits.push(s.comment);
      return `
        <div class="team-detail-row">
          <div>
            <div class="team-detail-name">${escapeHtml(team.label)}</div>
            ${metaBits.length ? `<div class="team-detail-meta">${escapeHtml(metaBits.join(' · '))}</div>` : ''}
          </div>
          <div class="team-detail-vals">
            ${it.noQty ? '' : `<span class="qty-badge">P:${s.qte !== "" ? escapeHtml(s.qte) : '-'}</span>
            <span class="qty-badge">R:${s.qteReel !== "" ? escapeHtml(s.qteReel) : '-'}</span>`}
            ${etatChip}
          </div>
        </div>
      `;
    }).join('');
    const aggLevel = aggMauvais > 0 ? 'red' : (aggMoyen > 0 ? 'orange' : 'green');
    const aggParts = [];
    if(aggBon) aggParts.push(aggBon + ' bon' + (aggBon>1?'s':''));
    if(aggMoyen) aggParts.push(aggMoyen + ' moyen' + (aggMoyen>1?'s':''));
    if(aggMauvais) aggParts.push(aggMauvais + ' mauvais');
    body.innerHTML = rowsHtml + `
      ${it.noQty ? '' : `<div class="team-detail-row" style="margin-top:6px; border-top:2px solid var(--safety-yellow); padding-top:10px;">
        <div class="team-detail-name" style="color:var(--safety-yellow);">TOTAL (Qté réelle)</div>
        <div class="team-detail-vals"><span class="qty-badge total-badge">${anyNumeric ? totalReel : '-'}</span></div>
      </div>`}
      ${anyEtat ? `<div class="team-detail-row">
        <div class="team-detail-name" style="color:var(--safety-yellow);">TOTAL (états)</div>
        <div class="team-detail-vals"><span class="etat-pill ${aggLevel}">${escapeHtml(aggParts.join(' · '))}</span></div>
      </div>` : ''}
    `;
    card.appendChild(body);
    listEl.appendChild(card);
  });

  if(!anyVisible){
    const empty = document.createElement('div');
    empty.className = 'empty-msg';
    empty.textContent = query ? 'Aucun article ne correspond à "' + query + '".' : 'Aucun article.';
    listEl.appendChild(empty);
  }
}

async function onResetCategory(){
  if(!confirm('Réinitialiser les données de "' + catLabel(currentCat) + '" pour l\'équipe "' + teamLabel(currentTeam) + '" ? Action irréversible.')) return;
  perTeamState[currentTeam][currentCat] = itemsFor(currentCat).map(it => defaultItemState(it));
  try{ await window.storage.delete('inv:' + currentTeam + ':' + currentCat, true); }catch(e){}
  openIndex = null;
  renderTabs();
  renderList();
}

async function onDeleteCategory(){
  if(!confirm('Supprimer complètement la catégorie "' + catLabel(currentCat) + '" et toutes les données de toutes les équipes ?')) return;
  const catToDelete = currentCat;
  customCats = customCats.filter(c => c.key !== catToDelete);
  await saveCustomCats();
  try{ await window.storage.delete('inv:extra:' + catToDelete, true); }catch(e){}
  for(const t of teams){
    try{ await window.storage.delete('inv:' + t.id + ':' + catToDelete, true); }catch(e){}
    if(perTeamState[t.id]) delete perTeamState[t.id][catToDelete];
  }
  delete extraItems[catToDelete];
  currentCat = allCatKeys()[0];
  openIndex = null;
  if(currentTeam === 'TOTAL'){
    for(const t of teams){ await ensureTeamCatLoaded(t.id, currentCat); }
  } else {
    await ensureTeamCatLoaded(currentTeam, currentCat);
  }
  renderTeamBar();
  renderTabs();
  renderList();
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str){ return escapeHtml(str); }

/* ---- Recherche globale + suggestions (tous onglets, présents et futurs) ---- */
function highlightMatch(name, query){
  const i = name.toLowerCase().indexOf(query.toLowerCase());
  if(i < 0) return escapeHtml(name);
  return escapeHtml(name.slice(0,i)) + '<mark>' + escapeHtml(name.slice(i, i+query.length)) + '</mark>' + escapeHtml(name.slice(i+query.length));
}

function buildSuggestions(query){
  // Cherche dans TOUTES les catégories (base + lourd + personnalisées, actuelles et futures)
  const results = [];
  allCatKeys().forEach(cat => {
    const items = itemsFor(cat);
    items.forEach((it, idx) => {
      if(it.header) return;
      const cleanName = it.name.replace(/\n/g,' ');
      if(matchesSearch(cleanName, query)){
        results.push({ cat, idx, name: cleanName });
      }
    });
  });
  return results;
}

function renderSuggestions(){
  const box = document.getElementById('suggestions');
  const query = document.getElementById('search').value.trim();
  if(query.length < 1){
    box.classList.remove('show');
    box.innerHTML = '';
    return;
  }
  const results = buildSuggestions(query);
  if(results.length === 0){
    box.innerHTML = '<div class="suggestion-empty">Aucun article trouvé pour « ' + escapeHtml(query) + ' »</div>';
    box.classList.add('show');
    return;
  }
  // Limite l'affichage pour rester lisible
  const shown = results.slice(0, 40);
  box.innerHTML = shown.map(r =>
    `<div class="suggestion" data-cat="${escapeAttr(r.cat)}" data-idx="${r.idx}">
      <span class="suggestion-name">${highlightMatch(r.name, query)}</span>
      <span class="suggestion-cat">${escapeHtml(catLabel(r.cat))}</span>
    </div>`
  ).join('') + (results.length > shown.length
      ? `<div class="suggestion-empty">+ ${results.length - shown.length} autres résultats…</div>`
      : '');
  box.classList.add('show');
  box.querySelectorAll('.suggestion').forEach(el => {
    el.addEventListener('click', () => goToSuggestion(el.dataset.cat, parseInt(el.dataset.idx, 10)));
  });
}

async function goToSuggestion(cat, idx){
  // Bascule vers l'onglet et ouvre l'article correspondant
  currentCat = cat;
  openIndex = idx;
  document.getElementById('search').value = '';
  document.getElementById('suggestions').classList.remove('show');
  document.getElementById('suggestions').innerHTML = '';
  if(currentTeam === 'TOTAL'){
    for(const t of teams){ await ensureTeamCatLoaded(t.id, currentCat); }
  } else {
    await ensureTeamCatLoaded(currentTeam, currentCat);
  }
  renderTabs();
  renderList();
  // Fait défiler jusqu'à la carte ouverte
  setTimeout(() => {
    const openCard = document.querySelector('.card.open');
    if(openCard) openCard.scrollIntoView({behavior:'smooth', block:'center'});
  }, 60);
}

let _searchDebounce = null;   // debounce : la liste complète n'est plus reconstruite à chaque caractère
document.getElementById('search').addEventListener('input', () => {
  clearTimeout(_searchDebounce);
  _searchDebounce = setTimeout(() => {
    renderSuggestions();  // suggestions globales pendant la frappe
    renderList();         // filtre aussi l'onglet courant
  }, 180);
});
// Ferme les suggestions si on tape Échap
document.getElementById('search').addEventListener('keydown', (e) => {
  if(e.key === 'Escape'){
    document.getElementById('search').value = '';
    document.getElementById('suggestions').classList.remove('show');
    renderList();
  }
});
// Ferme les suggestions en cliquant ailleurs
document.addEventListener('click', (e) => {
  const box = document.getElementById('suggestions');
  const inp = document.getElementById('search');
  if(box && !box.contains(e.target) && e.target !== inp){
    box.classList.remove('show');
  }
});

/* ---- Modals ---- */
function closeModal(){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('modalBox').innerHTML = '';
}

// Rend les formations d'une personne : nom de formation + échéance colorée
function formationsHtmlFor(nom){
  if(!formationsData || !Array.isArray(formationsData.people)) return '';
  // 1) correspondance exacte (normalisée) en priorité ; 2) sinon correspondance proche
  let match = formationsData.people.find(p => normNom(p.nom) === normNom(nom));
  if(!match) match = formationsData.people.find(p => nomsProches(p.nom, nom));
  if(!match || !match.forms || !match.forms.length) return '';
  const forms = match.forms;
  const items = forms.map(f => {
    const st = echeanceStatus(f.echeance);
    const dot = st ? '<span class="verif-dot ' + st.level + '" style="margin-right:5px;"></span>' : '';
    const ech = f.echeance
      ? ('<span class="form-ech ' + (st ? st.level : '') + '">' + escapeHtml(f.echeance) + (st && st.level!=='green' ? ' — ' + st.label : '') + '</span>')
      : '<span class="form-ech">—</span>';
    return '<div class="formation-line">' + dot + '<b>' + escapeHtml(f.formation) + '</b> · éch : ' + ech + '</div>';
  }).join('');
  return '<div class="people-formations"><div class="pf-title">🎓 Formations (' + forms.length + ')</div>' + items + '</div>';
}

// Répertoire partagé des personnes identifiées
async function openPeopleDirectory(){
  const box = document.getElementById('modalBox');
  box.innerHTML = '<h3>👤 Identification — Répertoire</h3>' +
    '<div style="color:var(--paper-dim);font-size:13px;margin-bottom:10px;">Chargement…</div>';
  document.getElementById('overlay').classList.add('show');

  const people = await loadPeopleDirectory();
  const myId = getDeviceId();
  let rows;
  if(!people.length){
    rows = '<div style="color:var(--paper-dim);font-size:14px;">Aucune personne identifiée pour le moment.</div>';
  }else{
    rows = '<div class="people-list">' + people.map(p => {
      const isMe = (p.id === myId);
      const equipe = p.equipe ? '<span class="people-team">' + escapeHtml(p.equipe) + '</span>' : '';
      const tel = p.tel ? '<a href="' + escapeAttr(telHref(p.tel)) + '">' + escapeHtml(formatTel(p.tel)) + '</a>' : '';
      const mail = p.courriel ? '<a href="mailto:' + escapeAttr(p.courriel) + '">' + escapeHtml(p.courriel) + '</a>' : '';
      const contact = [tel, mail].filter(Boolean).join(' · ');
      const carte = (p.extra && p.extra.carteUrl)
        ? '<div class="people-carte"><a href="' + escapeAttr(p.extra.carteUrl) + '" target="_blank" rel="noopener">🪪 Voir la carte / certificat</a></div>' : '';
      const adminCarteBtn = isAdmin
        ? '<button type="button" class="people-admin-btn" data-carte-key="' + escapeAttr(p._key || ('inv:person:'+p.id)) + '">🔗 ' + (p.extra && p.extra.carteUrl ? 'Modifier' : 'Ajouter') + ' lien carte</button>' : '';
      const adminDelBtn = isAdmin
        ? '<button type="button" class="people-del-btn" data-del-key="' + escapeAttr(p._key || ('inv:person:'+p.id)) + '" data-del-id="' + escapeAttr(p.id||'') + '" data-del-nom="' + escapeAttr(p.nom||'') + '">🗑️ Supprimer</button>' : '';
      return '<div class="people-item' + (isMe ? ' me' : '') + '">' +
        '<div class="people-top"><span class="people-name">' + escapeHtml(formatNom(p.nom) || '(sans nom)') +
          (isMe ? ' <span class="people-you">cet appareil</span>' : '') + '</span>' + equipe + '</div>' +
        (contact ? '<div class="people-contact">' + contact + '</div>' : '') +
        carte +
        formationsHtmlFor(p.nom) +
        (isMe ? '<button type="button" class="people-edit" id="editMyInfo">✏️ Modifier mes infos</button>' : '') +
        adminCarteBtn + adminDelBtn +
        '</div>';
    }).join('') + '</div>';
  }

  // Bandeau formations (état + bouton d'import pour l'admin)
  const majTxt = formationsData && formationsData.maj
    ? ('Formations à jour : ' + new Date(formationsData.maj).toLocaleDateString('fr-CA')) : 'Aucune formation importée.';
  const adminZone = isAdmin
    ? '<div class="admin-zone">' +
        '<div class="admin-zone-title">🔑 Admin</div>' +
        '<div style="font-size:12px;color:var(--paper-dim);margin-bottom:8px;">' + escapeHtml(majTxt) + '</div>' +
        '<input type="file" id="formFile" accept=".xlsx,.xls,.csv" style="display:none;">' +
        '<button class="btn btn-confirm" id="importForm" style="width:100%;margin-bottom:6px;">📥 Mettre à jour les formations (Excel)</button>' +
        '<button class="btn btn-cancel" id="adminLock" style="width:100%;">Quitter le mode admin</button>' +
      '</div>'
    : '<button class="btn btn-cancel" id="adminUnlock" style="width:100%;margin-top:6px;">🔑 Mode admin</button>';

  box.innerHTML = '<h3>👤 Identification — Répertoire</h3>' +
    '<div style="color:var(--paper-dim);font-size:13px;margin-bottom:12px;">' + people.length + ' personne' + (people.length>1?'s':'') + ' identifiée' + (people.length>1?'s':'') + '. Tu peux modifier ta propre fiche.</div>' +
    rows +
    '<div class="modal-actions" style="margin-top:14px;flex-direction:column;gap:8px;">' +
      (people.some(p => p.id === myId) ? '' : '<button class="btn btn-confirm" id="addMyInfo" style="width:100%;">👤 M\'ajouter au répertoire</button>') +
      adminZone +
      '<button class="btn btn-cancel" id="closePeople" style="width:100%;">Fermer</button>' +
    '</div>';

  document.getElementById('closePeople').onclick = closeModal;
  const editBtn = document.getElementById('editMyInfo');
  if(editBtn) editBtn.onclick = () => openIdentityModal(false, true);
  const addBtn = document.getElementById('addMyInfo');
  if(addBtn) addBtn.onclick = () => openIdentityModal(false, true);

  // Débloquer / verrouiller admin
  const unlock = document.getElementById('adminUnlock');
  if(unlock) unlock.onclick = async () => {
    const code = prompt('Code admin :');
    if(code == null) return;
    if(code.trim() === ADMIN_CODE){ await setAdmin(true); openPeopleDirectory(); }
    else alert('Code incorrect.');
  };
  const lock = document.getElementById('adminLock');
  if(lock) lock.onclick = async () => { await setAdmin(false); openPeopleDirectory(); };

  // Import Excel des formations (admin)
  const importBtn = document.getElementById('importForm');
  const fileInp = document.getElementById('formFile');
  if(importBtn && fileInp){
    importBtn.onclick = () => fileInp.click();
    fileInp.onchange = async () => {
      const f = fileInp.files && fileInp.files[0];
      if(!f) return;
      try{
        importBtn.textContent = 'Lecture…'; importBtn.disabled = true;
        const data = await importFormationsFromFile(f);
        if(!data.people || !data.people.length){ alert('Aucune formation trouvée. Vérifie que la feuille « Liste des formations » est présente.'); }
        else {
          await saveFormations(data);
          const total = data.people.reduce((n,p) => n + p.forms.length, 0);
          alert(data.people.length + ' employé(s) et ' + total + ' formation(s) importés.');
        }
      }catch(e){ console.error(e); alert('Impossible de lire ce fichier Excel.'); }
      finally{ importBtn.textContent = '📥 Mettre à jour les formations (Excel)'; importBtn.disabled = false; openPeopleDirectory(); }
    };
  }

  // Admin : ajouter/modifier le lien de carte d'une personne
  if(isAdmin){
    box.querySelectorAll('[data-carte-key]').forEach(btn => {
      btn.onclick = async () => {
        const key = btn.getAttribute('data-carte-key');
        const person = people.find(x => (x._key || ('inv:person:'+x.id)) === key);
        const actuel = (person && person.extra && person.extra.carteUrl) || '';
        const url = prompt('Lien vers la photo de la carte / certificat (Google Drive, etc.) :', actuel);
        if(url == null) return;
        const rec = Object.assign({}, person);
        delete rec._key; // ne pas enregistrer la clé technique dans la valeur
        rec.extra = Object.assign({}, person.extra || {}, { carteUrl: url.trim() });
        try{ await window.storage.set(key, JSON.stringify(rec), true); }catch(e){}
        openPeopleDirectory();
      };
    });
    // Supprimer une fiche
    box.querySelectorAll('[data-del-key]').forEach(btn => {
      btn.onclick = async () => {
        const key = btn.getAttribute('data-del-key');
        const pid = btn.getAttribute('data-del-id') || key.replace('inv:person:','');
        const pnom = btn.getAttribute('data-del-nom') || 'cette personne';
        if(!confirm('Supprimer la fiche de « ' + pnom + ' » ?\n\n' +
          'Elle disparaîtra du répertoire. La personne devra se réidentifier pour recréer sa fiche.')) return;
        // 1) retirer la fiche partagée (par sa vraie clé de stockage)
        try{ await window.storage.delete(key, true); }catch(e){}
        // 2) marquer l'appareil comme "supprimé" pour qu'il ne se recrée pas tout seul
        try{
          const raw = await window.storage.get('inv:deletedPeople', true);
          const list = (raw && raw.value) ? JSON.parse(raw.value) : [];
          if(list.indexOf(pid) === -1) list.push(pid);
          await window.storage.set('inv:deletedPeople', JSON.stringify(list), true);
        }catch(e){}
        // 3) si c'est CET appareil, effacer l'identité locale -> réidentification forcée
        if(pid === getDeviceId()){
          deviceUser = null;
          try{ await window.storage.delete('inv:deviceUser', false); }catch(e){}
        }
        openPeopleDirectory();
      };
    });
  }
}

/* ============================================================
   MATÉRIEL DE MAÇONNERIE (stock global, séparé des équipes)
   Stocké partagé dans inv:masonry. Tout le monde peut modifier.
   ============================================================ */
let masonryData = null;
const MASONRY_UNITES = ['pièces','palettes','pi','pi²','pi³','sacs','boîtes','caisses','paquets','rouleaux','kg','tonnes'];
function defaultMasonryData(){
  const mk = (nom,type,dimension,qte,unite) => ({ nom,type,dimension,qte,unite,extra:{} });
  return {
    champs: [ { key:'type', label:'Type' }, { key:'dimension', label:'Dimension' } ],
    cats: [
      { id:'ancrages', nom:'Ancrages', items:[
        mk('Ancrage ajustable','Ajustable','2"','', 'boîtes'),
        mk('Ancrage à brique','Fixe','4"','', 'boîtes'),
        mk('Attache à maçonnerie','Corrugué','7/8"','', 'boîtes')
      ]},
      { id:'linteaux', nom:'Linteaux (angles d\'acier)', items:[
        mk('Linteau acier','Angle','4" x 4" x 1/4"','', 'pièces'),
        mk('Linteau acier','Angle','6" x 4" x 3/8"','', 'pièces'),
        mk('Linteau acier','Angle','8" x 6" x 3/8"','', 'pièces')
      ]},
      { id:'blocs', nom:'Blocs de béton', items:[
        mk('Bloc standard','Creux','8" x 8" x 16"','', 'palettes'),
        mk('Bloc standard','Creux','4" x 8" x 16"','', 'palettes'),
        mk('Bloc d\'angle','Plein','12" x 8" x 16"','', 'palettes')
      ]},
      { id:'briques', nom:'Briques', items:[
        mk('Brique modulaire','Argile','Standard','', 'palettes')
      ]},
      { id:'mortier', nom:'Mortier / Ciment', items:[
        mk('Mortier type N','Sac','30 kg','', 'sacs'),
        mk('Ciment Portland','Sac','30 kg','', 'sacs')
      ]},
      { id:'pierre', nom:'Pierre / Maçonnerie', items:[
        mk('Pierre naturelle','Décorative','Variable','', 'palettes')
      ]},
      { id:'accessoires', nom:'Accessoires', items:[
        mk('Treillis d\'armature','Galvanisé','8"','', 'rouleaux'),
        mk('Solin métallique','Aluminium','—','', 'rouleaux')
      ]}
    ],
    maj: new Date().toISOString()
  };
}
async function loadMasonry(){
  try{
    const r = await window.storage.get('inv:masonry', true);
    if(r && r.value){ const p = JSON.parse(r.value); if(p && Array.isArray(p.cats)) masonryData = p; }
  }catch(e){ masonryData = null; }
  if(!masonryData){ masonryData = defaultMasonryData(); await saveMasonry(); }
  if(!Array.isArray(masonryData.champs)) masonryData.champs = [{key:'type',label:'Type'},{key:'dimension',label:'Dimension'}];
}
async function saveMasonry(){
  if(!masonryData) return;
  masonryData.maj = new Date().toISOString();
  try{ await window.storage.set('inv:masonry', JSON.stringify(masonryData), true); }catch(e){}
}

let masonryOpenCat = null; // id de la catégorie déployée

async function openMasonryStock(){
  const box = document.getElementById('modalBox');
  box.innerHTML = '<h3>🧱 Matériel de maçonnerie</h3>' +
    '<div style="color:var(--paper-dim);font-size:13px;margin-bottom:10px;">Chargement…</div>';
  document.getElementById('overlay').classList.add('show');
  if(!masonryData) await loadMasonry();
  renderMasonry();
}

function renderMasonry(){
  const box = document.getElementById('modalBox');
  const champs = masonryData.champs;
  let html = '<h3>🧱 Matériel de maçonnerie</h3>' +
    '<div style="color:var(--paper-dim);font-size:12px;margin-bottom:12px;">Stock global de l\'entreprise. Tout le monde peut ajouter, modifier ou supprimer.</div>';

  if(!masonryData.cats.length){
    html += '<div style="color:var(--paper-dim);font-size:14px;">Aucune catégorie. Ajoutes-en une ci-dessous.</div>';
  }

  masonryData.cats.forEach(cat => {
    const open = masonryOpenCat === cat.id;
    html += '<div class="mas-cat">' +
      '<div class="mas-cat-head" data-cat-toggle="' + escapeAttr(cat.id) + '">' +
        '<span class="mas-cat-arrow">' + (open ? '▾' : '▸') + '</span>' +
        '<span class="mas-cat-nom">' + escapeHtml(cat.nom) + '</span>' +
        '<span class="mas-cat-count">' + cat.items.length + '</span>' +
      '</div>';
    if(open){
      html += '<div class="mas-cat-body">';
      if(!cat.items.length){ html += '<div style="color:var(--paper-dim);font-size:13px;padding:6px 0;">Aucun article.</div>'; }
      cat.items.forEach((it, idx) => {
        const bits = [];
        champs.forEach(ch => { if(it[ch.key]) bits.push('<b>' + escapeHtml(ch.label) + ':</b> ' + escapeHtml(it[ch.key])); });
        if(it.extra){ Object.keys(it.extra).forEach(k => { if(it.extra[k]) bits.push('<b>' + escapeHtml(k) + ':</b> ' + escapeHtml(it.extra[k])); }); }
        const qteLine = (it.qte !== '' && it.qte != null)
          ? '<span class="mas-qte">' + escapeHtml(String(it.qte)) + ' ' + escapeHtml(it.unite || '') + '</span>'
          : '<span class="mas-qte mas-qte-empty">quantité —</span>';
        html += '<div class="mas-item">' +
          '<div class="mas-item-top"><span class="mas-item-nom">' + escapeHtml(it.nom || '(sans nom)') + '</span>' + qteLine + '</div>' +
          (bits.length ? '<div class="mas-item-meta">' + bits.join(' · ') + '</div>' : '') +
          '<div class="mas-item-actions">' +
            '<button type="button" class="mas-mini" data-mas-edit="' + escapeAttr(cat.id) + '|' + idx + '">✏️ Modifier</button>' +
            '<button type="button" class="mas-mini mas-mini-del" data-mas-del="' + escapeAttr(cat.id) + '|' + idx + '">🗑️</button>' +
          '</div>' +
        '</div>';
      });
      html += '<button type="button" class="mas-add-item" data-mas-additem="' + escapeAttr(cat.id) + '">＋ Ajouter un article</button>';
      html += '<div class="mas-cat-tools">' +
        '<button type="button" class="mas-mini" data-mas-rencat="' + escapeAttr(cat.id) + '">Renommer</button>' +
        '<button type="button" class="mas-mini mas-mini-del" data-mas-delcat="' + escapeAttr(cat.id) + '">Supprimer la catégorie</button>' +
      '</div></div>';
    }
    html += '</div>';
  });

  html += '<button type="button" class="mas-add-cat" id="masAddCat">＋ Ajouter une catégorie</button>';
  html += '<div class="modal-actions" style="margin-top:14px;flex-direction:column;gap:8px;">' +
    '<button type="button" class="btn btn-cancel" id="masFields">⚙️ Modifier les champs (' + champs.map(c=>c.label).join(', ') + ')</button>' +
    '<button type="button" class="btn btn-cancel" id="masClose" style="width:100%;">Fermer</button>' +
  '</div>';

  box.innerHTML = html;

  box.querySelectorAll('[data-cat-toggle]').forEach(el => {
    el.onclick = () => { const id = el.getAttribute('data-cat-toggle'); masonryOpenCat = (masonryOpenCat === id ? null : id); renderMasonry(); };
  });
  box.querySelectorAll('[data-mas-additem]').forEach(b => { b.onclick = () => masonryEditItem(b.getAttribute('data-mas-additem'), null); });
  box.querySelectorAll('[data-mas-edit]').forEach(b => { b.onclick = () => { const [cid,idx] = b.getAttribute('data-mas-edit').split('|'); masonryEditItem(cid, parseInt(idx,10)); }; });
  box.querySelectorAll('[data-mas-del]').forEach(b => { b.onclick = async () => {
    const [cid,idx] = b.getAttribute('data-mas-del').split('|');
    const cat = masonryData.cats.find(c=>c.id===cid); if(!cat) return;
    const it = cat.items[parseInt(idx,10)];
    if(!confirm('Supprimer « ' + (it.nom||'cet article') + ' » ?')) return;
    cat.items.splice(parseInt(idx,10),1); await saveMasonry(); renderMasonry();
  }; });
  box.querySelectorAll('[data-mas-rencat]').forEach(b => { b.onclick = async () => {
    const cat = masonryData.cats.find(c=>c.id===b.getAttribute('data-mas-rencat')); if(!cat) return;
    const nom = prompt('Nom de la catégorie :', cat.nom); if(nom==null) return;
    cat.nom = nom.trim() || cat.nom; await saveMasonry(); renderMasonry();
  }; });
  box.querySelectorAll('[data-mas-delcat]').forEach(b => { b.onclick = async () => {
    const cat = masonryData.cats.find(c=>c.id===b.getAttribute('data-mas-delcat')); if(!cat) return;
    if(!confirm('Supprimer la catégorie « ' + cat.nom +' » et tous ses articles ?')) return;
    masonryData.cats = masonryData.cats.filter(c=>c.id!==cat.id); await saveMasonry(); renderMasonry();
  }; });
  const addCat = document.getElementById('masAddCat');
  if(addCat) addCat.onclick = async () => {
    const nom = prompt('Nom de la nouvelle catégorie :'); if(nom==null) return;
    const clean = nom.trim(); if(!clean) return;
    const id = 'cat_' + Date.now().toString(36);
    masonryData.cats.push({ id, nom:clean, items:[] });
    masonryOpenCat = id; await saveMasonry(); renderMasonry();
  };
  const fieldsBtn = document.getElementById('masFields');
  if(fieldsBtn) fieldsBtn.onclick = masonryEditFields;
  document.getElementById('masClose').onclick = closeModal;
}

function masonryEditItem(catId, idx){
  const cat = masonryData.cats.find(c=>c.id===catId); if(!cat) return;
  const isNew = (idx == null);
  const it = isNew ? { nom:'', qte:'', unite:'pièces', extra:{} } : Object.assign({ extra:{} }, cat.items[idx]);
  const champs = masonryData.champs;
  const box = document.getElementById('modalBox');
  const champHtml = champs.map(ch =>
    '<div class="field"><label>' + escapeHtml(ch.label) + '</label>' +
    '<input type="text" data-champ="' + escapeAttr(ch.key) + '" value="' + escapeAttr(it[ch.key]||'') + '"></div>'
  ).join('');
  const uniteOpts = MASONRY_UNITES.map(u => '<option value="' + escapeAttr(u) + '"' + ((it.unite===u)?' selected':'') + '>' + escapeHtml(u) + '</option>').join('');
  box.innerHTML = '<h3>' + (isNew ? 'Nouvel article' : 'Modifier l\'article') + '</h3>' +
    '<div style="font-size:12px;color:var(--paper-dim);margin-bottom:10px;">Catégorie : ' + escapeHtml(cat.nom) + '</div>' +
    '<div class="field"><label>Nom *</label><input type="text" id="masNom" value="' + escapeAttr(it.nom||'') + '" placeholder="ex: Bloc standard"></div>' +
    champHtml +
    '<div class="field-row">' +
      '<div class="field"><label>Quantité</label><input type="text" inputmode="decimal" id="masQte" value="' + escapeAttr(String(it.qte==null?'':it.qte))+ '" placeholder="ex: 12"></div>' +
      '<div class="field"><label>Unité</label><select id="masUnite">' + uniteOpts + '</select></div>' +
    '</div>' +
    '<div id="masError" style="color:#e88;font-size:12px;min-height:16px;"></div>' +
    '<div class="modal-actions" style="flex-direction:column;gap:8px;">' +
      '<button type="button" class="btn btn-confirm" id="masSave" style="width:100%;">Enregistrer</button>' +
      '<button type="button" class="btn btn-cancel" id="masCancel" style="width:100%;">Annuler</button>' +
    '</div>';
  document.getElementById('masCancel').onclick = () => renderMasonry();
  document.getElementById('masSave').onclick = async () => {
    const nom = document.getElementById('masNom').value.trim();
    if(!nom){ document.getElementById('masError').textContent = 'Le nom est requis.'; return; }
    const rec = { nom, qte: document.getElementById('masQte').value.trim(), unite: document.getElementById('masUnite').value, extra: it.extra || {} };
    box.querySelectorAll('[data-champ]').forEach(inp => { rec[inp.getAttribute('data-champ')] = inp.value.trim(); });
    if(isNew) cat.items.push(rec); else cat.items[idx] = rec;
    masonryOpenCat = cat.id; await saveMasonry(); renderMasonry();
  };
}

function masonryEditFields(){
  const box = document.getElementById('modalBox');
  const champs = masonryData.champs;
  const rows = champs.map((ch,i) =>
    '<div class="mas-field-row"><span>' + escapeHtml(ch.label) + '</span>' +
    '<button type="button" class="mas-mini mas-mini-del" data-delfield="' + i + '">🗑️</button></div>'
  ).join('');
  box.innerHTML = '<h3>⚙️ Champs des articles</h3>' +
    '<div style="font-size:12px;color:var(--paper-dim);margin-bottom:10px;">Ces champs s\'appliquent à toutes les catégories. Le nom, la quantité et l\'unité sont toujours présents.</div>' +
    (rows || '<div style="color:var(--paper-dim);font-size:13px;">Aucun champ additionnel.</div>') +
    '<button type="button" class="mas-add-item" id="masAddField">＋ Ajouter un champ</button>' +
    '<div class="modal-actions" style="margin-top:12px;"><button type="button" class="btn btn-cancel" id="masFieldsBack" style="width:100%;">Retour</button></div>';
  box.querySelectorAll('[data-delfield]').forEach(b => { b.onclick = async () => {
    const i = parseInt(b.getAttribute('data-delfield'),10);
    if(!confirm('Supprimer le champ « ' + champs[i].label + ' » ?')) return;
    masonryData.champs.splice(i,1); await saveMasonry(); masonryEditFields();
  }; });
  document.getElementById('masAddField').onclick = async () => {
    const label = prompt('Nom du nouveau champ (ex: Couleur, Fournisseur, Emplacement) :'); if(label==null) return;
    const clean = label.trim(); if(!clean) return;
    const key = 'f_' + clean.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'') + '_' + Date.now().toString(36).slice(-4);

// Ajoute un nouvel extincteur numéroté au registre (catégorie S.S.T.).
// Il est créé comme les extincteurs de base (ext:true, loc:true) et s'ajoute à la suite
// d'« Extincteur 20 ». Partagé avec toutes les équipes ; assignable ensuite dans la Machinerie.
async function addExtincteur(){
  const cat = 'S.S.T.';
  let maxN = 0;
  itemsFor(cat).forEach(it => { const m = String((it && it.name) || '').match(/^Extincteur\s+(\d+)/i); if(m){ const n = parseInt(m[1], 10); if(n > maxN) maxN = n; } });
  const saisie = prompt('Numéro du nouvel extincteur :', String(maxN + 1));
  if(saisie == null) return;
  const num = String(saisie).replace(/[^\d]/g, '').replace(/^0+(?=\d)/, '');
  if(!num){ alert('Entre un numéro d\'extincteur (ex. 21).'); return; }
  const nom = 'Extincteur ' + num;
  if(itemsFor(cat).some(it => String((it && it.name) || '').trim().toLowerCase() === nom.toLowerCase())){
    alert('L\'extincteur « ' + nom + ' » existe déjà.'); return;
  }
  if(!extraItems[cat]) extraItems[cat] = [];
  extraItems[cat].push({ name:nom, header:false, ident:'', comment:'', ext:true, loc:true, custom:true });
  await saveExtraItems(cat);
  // État pour l'équipe courante ; les autres équipes se complètent au chargement.
  if(perTeamState[currentTeam] && perTeamState[currentTeam][cat]){
    perTeamState[currentTeam][cat].push(defaultItemState({ ext:true, loc:true }));
    try{ await window.storage.set('inv:' + currentTeam + ':' + cat, JSON.stringify(perTeamState[currentTeam][cat]), true); }catch(e){}
  }
  if(currentCat !== cat){ currentCat = cat; await ensureTeamCatLoaded(currentTeam, cat); }
  const arr = itemsFor(cat);
  openIndex = arr.length - 1;   // ouvre le nouvel extincteur
  // Déplie la section qui contient le nouvel extincteur (sinon il était créé mais invisible)
  for(let j = openIndex; j >= 0; j--){ if(arr[j] && arr[j].header){ collapsedSections.delete(sectionKey(cat, arr[j].name)); break; } }
  renderTabs(); renderList();
  setTimeout(() => { const c = document.querySelector('.card.open'); if(c) c.scrollIntoView({behavior:'smooth', block:'center'}); }, 80);
}
