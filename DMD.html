<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --asphalt: #232221;
  --asphalt-2: #2f2d2b;
  --paper: #f3efe6;
  --paper-dim: #d9d2c2;
  --brick: #8a2f31;
  --brick-line: #5e2022;
  --logo-grey: #656263;
  --safety-yellow: #f2b705;
  --ok-green: #4c7a3f;
  --line: #46433f;
}
*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
html,body{margin:0;padding:0;background:var(--asphalt);color:var(--paper);font-family:'Barlow',sans-serif;min-height:100%;}
#app{min-height:100vh; display:flex; flex-direction:column; max-width:560px; margin:0 auto; background:var(--asphalt);}

/* En-tête façon mur de brique, comme l'app d'inventaire */
.hdr{
  padding:22px 18px 18px;
  background-color:#6e2325;
  background-image:
    linear-gradient(180deg, rgba(0,0,0,0.10), rgba(0,0,0,0.30)),
    repeating-linear-gradient(0deg,
      rgba(48,16,16,0.85) 0px, rgba(48,16,16,0.85) 3px,
      transparent 3px, transparent 30px),
    repeating-linear-gradient(90deg,
      rgba(48,16,16,0.85) 0px, rgba(48,16,16,0.85) 3px,
      transparent 3px, transparent 62px);
  border-bottom:3px solid var(--brick-line);
  text-align:center;
}
.hdr-logo{
  height:74px; width:auto; display:block; margin:0 auto 10px;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
}
.hdr-title{
  font-family:'Barlow Condensed',sans-serif; font-weight:700;
  font-size:26px; letter-spacing:2px; text-transform:uppercase;
  margin:0; color:var(--paper);
}
.hdr-sub{
  font-family:'Barlow',sans-serif; font-weight:500;
  font-size:13px; letter-spacing:1px; text-transform:uppercase;
  color:var(--paper-dim); margin-top:2px;
}

.intro{
  padding:18px 18px 4px; color:var(--paper-dim); font-size:14px;
}

/* Grille de tuiles-applications */
.grid{
  display:grid; grid-template-columns:1fr 1fr; gap:14px;
  padding:14px 18px 28px;
}
.tile{
  position:relative;
  background:var(--asphalt-2);
  border:1.5px solid var(--line);
  border-radius:14px;
  padding:20px 14px 16px;
  display:flex; flex-direction:column; align-items:center; gap:12px;
  text-decoration:none; color:var(--paper);
  cursor:pointer;
  transition:transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
  min-height:150px;
}
.tile:active{ transform:scale(0.97); }
.tile.active:hover{ border-color:var(--safety-yellow); }
.tile-ico{
  width:62px; height:62px; display:flex; align-items:center; justify-content:center;
  border-radius:12px; background:#26302a00;
}
.tile-ico svg{ width:58px; height:58px; display:block; }
.tile-name{
  font-family:'Barlow Condensed',sans-serif; font-weight:700;
  font-size:17px; letter-spacing:1px; text-transform:uppercase;
  text-align:center; line-height:1.05;
}
.tile-desc{
  font-size:11.5px; color:var(--paper-dim); text-align:center; margin-top:-6px;
}
/* Tuile bientôt disponible */
.tile.soon{ opacity:0.62; cursor:default; }
.tile.soon:active{ transform:none; }
.badge-soon{
  position:absolute; top:8px; right:8px;
  background:var(--asphalt); color:var(--paper-dim);
  border:1px solid var(--line); border-radius:20px;
  font-size:9.5px; letter-spacing:0.5px; text-transform:uppercase;
  padding:2px 7px; font-weight:600;
}
.tile.active .badge-ok{
  position:absolute; top:8px; right:8px;
  width:9px; height:9px; border-radius:50%;
  background:var(--ok-green); box-shadow:0 0 0 3px rgba(76,122,63,0.25);
}
/* Mode réorganisation des tuiles (par appareil) */
.tile.reordering{ cursor:default; border-style:dashed; }
.tile.reordering:active{ transform:none; }
.reorder-ctrl{ position:absolute; top:8px; left:8px; display:flex; gap:6px; }
.reorder-ctrl .ro-move{ width:32px; height:32px; border-radius:8px; border:1.5px solid var(--safety-yellow); background:rgba(0,0,0,0.55); color:var(--safety-yellow); font-size:14px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; }
.reorder-ctrl .ro-move:disabled{ opacity:0.3; border-color:var(--line); color:var(--logo-grey); cursor:default; }

.foot{
  margin-top:auto; padding:16px 18px 22px;
  color:var(--logo-grey); font-size:11px; text-align:center;
  border-top:1px solid var(--line);
}
.foot .v{ color:var(--paper-dim); font-weight:600; }
.foot .me{ display:block; margin-bottom:6px; color:var(--paper-dim); }
.foot .me b{ color:var(--paper); }
.foot .lnk{ color:var(--safety-yellow); cursor:pointer; text-decoration:none; }
/* Export Excel complet (une page par tuile) — visible en mode admin seulement */
#exportAllBtn{
  display:block; margin:0 auto 12px; background:var(--ok-green); color:var(--paper);
  border:none; border-radius:9px; padding:11px 18px; cursor:pointer;
  font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:15px;
  text-transform:uppercase; letter-spacing:0.6px; box-shadow:0 2px 8px rgba(0,0,0,0.35);
}
#exportAllBtn:disabled{ opacity:0.65; cursor:default; }
#exportAllStatus{
  margin:-6px auto 12px; max-width:340px; color:var(--paper-dim); font-size:12px;
  line-height:1.5; text-align:left; background:var(--asphalt-2);
  border:1px solid var(--line); border-radius:9px; padding:9px 11px;
}
#exportAllStatus .l-ok{ color:var(--ok-green); }
#exportAllStatus .l-err{ color:#e08b7d; }

/* ================== ÉCRAN D'IDENTIFICATION (mot de passe + identité) ================== */
.gate{
  position:fixed; inset:0; z-index:1000;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:28px 22px; text-align:center; overflow:auto;
  background-color:#232221;
  background-image:
    linear-gradient(180deg, rgba(0,0,0,0.35), rgba(0,0,0,0.55)),
    repeating-linear-gradient(0deg, rgba(48,16,16,0.6) 0, rgba(48,16,16,0.6) 3px, transparent 3px, transparent 30px),
    repeating-linear-gradient(90deg, rgba(48,16,16,0.6) 0, rgba(48,16,16,0.6) 3px, transparent 3px, transparent 62px);
}
.gate-logo{ height:84px; width:auto; margin-bottom:12px; filter:drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
.gate-title{ font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:26px; letter-spacing:2px; text-transform:uppercase; }
.gate-sub{ font-size:12px; letter-spacing:1px; text-transform:uppercase; color:var(--paper-dim); margin-bottom:16px; }
.gate-hint{ color:var(--paper-dim); font-size:14px; margin:2px 0 12px; max-width:320px; line-height:1.4; }
.gate-panel{ display:flex; flex-direction:column; align-items:center; width:100%; }
.gate input{ width:100%; max-width:320px; padding:12px 14px; font-size:16px; border-radius:8px; border:2px solid var(--line); background:rgba(35,34,33,0.92); color:var(--paper); margin:5px 0; }
.gate input:focus{ outline:none; border-color:var(--paper); }
.gate .pass-wrap{ position:relative; width:100%; max-width:320px; display:flex; justify-content:center; }
.gate .pass-wrap input{ padding-right:46px; }
.gate #togglePass{ position:absolute; right:0; top:0; height:100%; width:44px; background:transparent; border:none; color:var(--paper-dim); font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.gate .gate-btn{ width:100%; max-width:320px; padding:12px 14px; font-size:16px; font-weight:700; border:none; border-radius:8px; background:var(--brick); color:var(--paper); cursor:pointer; text-transform:uppercase; letter-spacing:0.5px; margin-top:8px; box-shadow:0 2px 8px rgba(0,0,0,0.35); }
.gate .gate-btn:active{ background:var(--brick-line); }
.gate .gate-btn.secondary{ background:var(--asphalt-2); border:1.5px solid var(--line); box-shadow:none; }
.gate .gate-err{ color:#ffd7cf; font-size:14px; min-height:18px; font-weight:600; margin-top:6px; }
/* Avis de collecte (Loi 25) */
.consent-box{
  width:100%; max-width:340px; text-align:left;
  background:rgba(35,34,33,0.92); border:1.5px solid var(--line); border-radius:10px;
  padding:14px 15px; margin:4px 0 10px;
  font-size:13.5px; line-height:1.55; color:var(--paper);
  max-height:42vh; overflow:auto;
}
.consent-box b{ color:var(--safety-yellow); }
.consent-ver{ font-size:11px; color:var(--paper-dim); margin-top:8px; }
.consent-msg{ color:#ffd7cf; font-size:13px; line-height:1.5; max-width:340px; min-height:18px; margin-top:8px; font-weight:600; }
</style>
</head>

<script>
(function(){
  var R = {"index.html": "accueil", "APPLI__INVENTAIRE.html": "inventaire", "APPLI__MACHINERIE.html": "machinerie", "APPLI__INSPECTIONS.html": "inspections", "APPLI__PUNCH.html": "punch", "APPLI__EQUIPES.html": "equipes", "APPLI__INFOS.html": "infos", "APPLI__FORMATIONS.html": "formations", "APPLI__CHAT.html": "chat", "APPLI__FACTURES.html": "factures", "APPLI__PREVENTION.html": "prevention", "APPLI__POLITIQUES.html": "politiques"};
  function route(h){
    var m = String(h||'').match(/([A-Za-z_0-9]+\.html)/);
    return m ? (R[m[1]] || '') : '';
  }
  window.__dmdGo = function(h){
    var r = route(h) || 'accueil';
    try{ parent.postMessage({ dmdnav: r }, '*'); }catch(e){}
  };
  // Un lien vers une autre page de l'appli devient une navigation dans le shell.
  document.addEventListener('click', function(e){
    var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
    if(!a) return;
    var h = a.getAttribute('href') || '';
    if(/\.html(\?|#|$)/.test(h)){ e.preventDefault(); window.__dmdGo(h); }
  }, true);
})();
<\/script>

    <div class="gate-hint" style="background:rgba(242,183,5,0.10); border:1px solid rgba(242,183,5,0.4); border-radius:8px; padding:9px 11px; color:var(--paper); font-size:12.5px; text-align:left;">🔒 L'identification empêche l'accès à l'application par une personne <b>extérieure à l'organisation</b>. Le <b>nom et le numéro de téléphone sont obligatoires</b>, et ton nom doit figurer dans la liste des employés de Maçonnerie DMD.</div>

// ================== ORDRE DES TUILES (par appareil) ==================
// L'ordre est stocké comme une LISTE D'IDENTIFIANTS dans localStorage. À l'affichage,
// on le réconcilie avec les tuiles réelles (APPS) : les ids disparus sont ignorés et
// les NOUVELLES tuiles (ajoutées via GitHub) apparaissent automatiquement à la fin.
// -> aucun plantage même si l'app change (tuiles ajoutées/retirées/renommées).
let _reorder = false;
function getTileOrder(){ try{ const v=localStorage.getItem('inv:tileOrder'); const a=v?JSON.parse(v):null; return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function setTileOrder(ids){ try{ localStorage.setItem('inv:tileOrder', JSON.stringify(ids)); }catch(e){} }
function orderedApps(){
  const order=getTileOrder(); const byId={}; APPS.forEach(a=>{ byId[a.id]=a; });
  const seen=new Set(); const out=[];
  order.forEach(id=>{ if(byId[id] && !seen.has(id)){ out.push(byId[id]); seen.add(id); } });   // ordre sauvegardé (ids encore valides)
  APPS.forEach(a=>{ if(!seen.has(a.id)){ out.push(a); seen.add(a.id); } });                       // nouvelles tuiles -> à la fin
  return out;
}
function moveTile(id, dir){
  const ids=orderedApps().map(a=>a.id); const i=ids.indexOf(id); if(i<0) return;
  const j=i+dir; if(j<0 || j>=ids.length) return;
  const t=ids[i]; ids[i]=ids[j]; ids[j]=t; setTileOrder(ids); render();
}

// ================== RENDU ==================
function render(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const list = orderedApps();
  list.forEach((app, idx) => {
    const bientot = estBientot(app);
    const tag = (bientot || _reorder) ? 'div' : 'a';
    const tile = document.createElement(tag);
    tile.className = 'tile ' + (bientot ? 'soon' : 'active') + (_reorder ? ' reordering' : '');
    if(!bientot && !_reorder){ tile.href = app.href; }
    let inner =
      (bientot ? '<span class="badge-soon">Bientôt</span>' : (_reorder ? '' : '<span class="badge-ok" title="Disponible"></span>')) +
      '<div class="tile-ico">' + (ICONS[app.icon] || '') + '</div>' +
      '<div class="tile-name">' + app.nom + '</div>' +
      '<div class="tile-desc">' + app.desc + '</div>';
    if(_reorder){
      inner += '<div class="reorder-ctrl">' +
        '<button class="ro-move" data-id="' + app.id + '" data-dir="-1"' + (idx===0?' disabled':'') + ' aria-label="Avancer">◀</button>' +
        '<button class="ro-move" data-id="' + app.id + '" data-dir="1"' + (idx===list.length-1?' disabled':'') + ' aria-label="Reculer">▶</button>' +
      '</div>';
    }
    tile.innerHTML = inner;
    grid.appendChild(tile);
  });
  if(_reorder){
    grid.querySelectorAll('.ro-move').forEach(b => b.onclick = (e) => { e.preventDefault(); e.stopPropagation(); moveTile(b.getAttribute('data-id'), parseInt(b.getAttribute('data-dir'),10)); });
  }
  const rt=document.getElementById('reorderToggle'); if(rt) rt.textContent = _reorder ? '✓ Terminé' : '✥ Réorganiser';
  const rr=document.getElementById('reorderReset'); if(rr) rr.style.display = _reorder ? '' : 'none';
  const it=document.getElementById('introText'); if(it) it.textContent = _reorder ? 'Réorganise avec ◀ ▶ :' : 'Choisis une application :';
  // Numéro de version = date du jour, pratique pour vérifier la mise en cache
  const d = new Date();
  document.getElementById('ver').textContent =
    'v' + d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

// Empêche un appel réseau de figer l'écran indéfiniment (ex : mauvaise connexion sur le chantier)
function withTimeout(promise, ms, label){
  return Promise.race([
    Promise.resolve(promise),
    new Promise((_, rej) => setTimeout(() => rej(new Error('timeout:' + (label||''))), ms))
  ]);
}

// ================== CONTRÔLE D'ACCÈS : liste des employés autorisés ==================
// La liste des noms autorisés vient du fichier de formations (inv:formations) et des
// employés ajoutés via l'app en mode admin (inv:roster:added). Si aucune liste n'existe
// encore, aucune restriction n'est appliquée (évite de verrouiller tout le monde avant
// le premier import). L'appareil admin garde toujours l'accès.
function normNom(s){
  return (s||'').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[.,\-]/g,' ').replace(/\s+/g,' ').trim();
}
function escapeHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function levenshtein(a, b){
  if(a === b) return 0;
  if(!a || !b) return (a.length + b.length);
  let prev = Array.from({length:b.length+1}, (_,i)=>i);
  for(let i=0;i<a.length;i++){
    let cur = [i+1];
    for(let j=0;j<b.length;j++){ cur.push(Math.min(prev[j+1]+1, cur[j]+1, prev[j] + (a[i]!==b[j] ? 1 : 0))); }
    prev = cur;
  }
  return prev[b.length];
}
function motsProches(m1, m2){
  const d = levenshtein(m1, m2), L = Math.max(m1.length, m2.length);
  if(L >= 6) return d <= 2;
  if(L >= 4) return d <= 1;
  return d === 0;
}
function nomsProches(n1, n2){
  const w1 = normNom(n1).split(' ').filter(Boolean);
  const w2 = normNom(n2).split(' ').filter(Boolean);
  if(w1.length !== w2.length || w1.length === 0) return false;
  const used = new Array(w2.length).fill(false);
  for(const a of w1){
    let ok = false;
    for(let i=0;i<w2.length;i++){ if(!used[i] && motsProches(a, w2[i])){ used[i] = true; ok = true; break; } }
    if(!ok) return false;
  }
  return true;
}
let _rosterNames = null, _rosterLoaded = false;
// Cache court (60 s) de la liste des employés : évite de retaper la base à chaque
// connexion/rafraîchissement pendant une période de forte affluence.
const ROSTER_CACHE_MS = 60000;
async function loadRoster(){
  // 1) Cache mémoire (déjà chargé dans cette page)
  if(_rosterLoaded && _rosterNames) return _rosterNames;
  // 2) Cache de session (survit à un rafraîchissement de page, pas à la fermeture)
  try{
    const raw = sessionStorage.getItem('inv:rosterCache');
    if(raw){ const c = JSON.parse(raw); if(c && Array.isArray(c.names) && (Date.now() - c.t) < ROSTER_CACHE_MS){ _rosterNames = c.names; _rosterLoaded = true; return _rosterNames; } }
  }catch(e){}
  // 3) Lecture réseau (deux clés ciblées, en parallèle)
  const names = [];
  try{
    if(_sb){
      const [fRes, aRes] = await Promise.all([
        withTimeout(_sb.from('inv_store').select('value').eq('key','inv:formations').maybeSingle(), 8000, 'formations'),
        withTimeout(_sb.from('inv_store').select('value').eq('key','inv:roster:added').maybeSingle(), 8000, 'added')
      ]);
      if(fRes && fRes.data && fRes.data.value){ try{ const f=JSON.parse(fRes.data.value); if(f && Array.isArray(f.people)) f.people.forEach(p=>{ if(p && p.nom) names.push(p.nom); }); }catch(e){} }
      if(aRes && aRes.data && aRes.data.value){ try{ const a=JSON.parse(aRes.data.value); if(Array.isArray(a)) a.forEach(n=>{ if(n) names.push(n); }); }catch(e){} }
    }
  }catch(e){ console.error('Roster:', e); }
  _rosterNames = names; _rosterLoaded = true;
  try{ sessionStorage.setItem('inv:rosterCache', JSON.stringify({ t:Date.now(), names })); }catch(e){}
  return names;
}
function isOnRoster(nom){
  if(!_rosterNames || _rosterNames.length === 0) return true; // aucune liste => pas de restriction (bootstrap)
  const t = normNom(nom);
  for(const rn of _rosterNames){ if(normNom(rn) === t || nomsProches(rn, nom)) return true; }
  return false;
}

function syncConsent(){
  if(!_sb) return Promise.resolve();

    if(!c || !c.accepte || c.synced) return Promise.resolve();

      .then(() => { c.synced = true; try{ localStorage.setItem('inv:consentement', JSON.stringify(c)); }catch(e){} })
      .catch(e => console.error('Sync consentement:', e));
  }catch(e){ return Promise.resolve(); }
}

// ================== RAPPEL DE FORMATION (pop-up d'accueil) ==================
function _formTodayStr(){
  const d = new Date(); const z = n => String(n).padStart(2,'0');
  return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());
}
function _formDismissedToday(){
  try{ return localStorage.getItem('inv:formPopDismissed') === _formTodayStr(); }catch(e){ return false; }
}
function _formFrDate(s){
  if(!s) return '—'; const [y,m,d] = s.split('-'); if(!y) return s;
  const mois=['janv.','févr.','mars','avr.','mai','juin','juill.','août','sept.','oct.','nov.','déc.'];
  return parseInt(d,10)+' '+(mois[parseInt(m,10)-1]||'')+' '+y;
}
// Formations actives (de l'inscription jusqu'à la date de fin incluse) qui visent l'utilisateur courant
async function checkFormationReminder(){
  try{
    if(_formDismissedToday()) return;
    const u = getDeviceUser();
    if(!u || u.chantier || !u.nom) return;           // pas de rappel pour une tablette de chantier
    if(!_sb) return;
    // Cache court (60 s) du plan de formation : allège la base quand beaucoup d'appareils
    // ouvrent l'accueil en même temps. Les mises à jour admin apparaissent au tour suivant.
    let planRaw = null;
    try{
      const c = JSON.parse(sessionStorage.getItem('inv:formPlanCache') || 'null');
      if(c && (Date.now() - c.t) < 60000){ planRaw = c.v; }
    }catch(e){}
    if(planRaw === null){
      const res = await withTimeout(_sb.from('inv_store').select('value').eq('key','inv:formationsPlan').maybeSingle(), 8000, 'formplan');
      if(!res || !res.data || !res.data.value) return;
      planRaw = res.data.value;
      try{ sessionStorage.setItem('inv:formPlanCache', JSON.stringify({ t:Date.now(), v:planRaw })); }catch(e){}
    }
    const plan = JSON.parse(planRaw);
    const items = (plan && Array.isArray(plan.items)) ? plan.items : [];
    const today = _formTodayStr();
    const mine = items.filter(it => {
      const fin = it.fin || it.debut || '';
      if(fin && fin < today) return false;           // terminée -> plus de rappel
      return (it.employes||[]).some(n => normNom(n) === normNom(u.nom) || nomsProches(n, u.nom));
    });
    if(!mine.length) return;
    mine.sort((a,b)=>(a.debut||'').localeCompare(b.debut||''));
    const list = document.getElementById('formPopList');
    list.innerHTML = mine.map(it => {
      const enCours = (it.debut||'') <= today;

        ? '<span style="background:#6fae5d;color:#1c2417;border-radius:16px;padding:2px 9px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;">En cours</span>'

      return '<div style="background:#232221;border:1px solid #45423f;border-radius:12px;padding:11px 13px;margin:8px 0;">'+
        '<div style="font-family:\'Barlow Condensed\',sans-serif;font-weight:700;font-size:18px;color:#f3efe6;">'+escapeHtml(it.type||'Formation')+' '+badge+'</div>'+
        '<div style="font-size:13px;color:#d9d2c2;margin-top:5px;line-height:1.5;">📍 <b style="color:#f3efe6;">'+escapeHtml(it.lieu||'—')+'</b><br>'+

// ---- Formatage uniforme des noms et téléphones ----
function _fmtOnlyDigits(s){ return String(s==null?'':s).replace(/\D/g,''); }
function formatTel(s){ const d=_fmtOnlyDigits(s); let n=d; if(n.length===11 && n[0]==='1') n=n.slice(1); if(n.length===10) return '('+n.slice(0,3)+')'+n.slice(3,6)+'-'+n.slice(6); return String(s==null?'':s).trim(); }
function formatNom(s){ s=String(s==null?'':s).replace(/\s+/g,' ').trim(); if(!s) return s; return s.toLocaleLowerCase('fr').replace(/[\p{L}\p{N}]+/gu, function(w){ return w.charAt(0).toLocaleUpperCase('fr')+w.slice(1); }); }
// Synchronise un nom saisi avec l'orthographe exacte de la liste des employés (roster : formations Excel + ajouts).
// Peu importe la casse, les accents ou l'ordre prénom/nom : renvoie « Prénom Nom » en casse propre.
window.__dmdCanonNom = function(raw){
  var s = formatNom(raw); if(!s) return s;
  try{
    var pool = (Array.isArray(_rosterNames) ? _rosterNames : []);
    var k = normNom(raw);
    var exact = pool.filter(function(n){ return normNom(n)===k; });
    if(exact.length) return formatNom(exact[0]);
    var near = pool.filter(function(n){ return nomsProches(n, raw); });
    if(near.length===1) return formatNom(near[0]);
  }catch(_){}
  return s;
};

// window.__dmdFlatSheet(). Aucune logique de données n'est dupliquée ici : chaque
// tuile reste la seule responsable de la forme de ses propres données.
const EXPORT_TUILES = [
  { fichier:'./APPLI__INVENTAIRE.html',  nom:'Inventaire' },
  { fichier:'./APPLI__MACHINERIE.html',  nom:'Machinerie' },
  { fichier:'./APPLI__INSPECTIONS.html', nom:'Inspection quotidienne' },

let _xlsxLoading = null;
function ensureXLSX(){
  if(window.XLSX) return Promise.resolve();
  if(_xlsxLoading) return _xlsxLoading;
  _xlsxLoading = new Promise(function(res, rej){
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js';
    s.onload = function(){ res(); };
    s.onerror = function(){ _xlsxLoading = null; rej(new Error('xlsx')); };
    document.head.appendChild(s);
  });
  return _xlsxLoading;
}

// Même mise en forme que les exports des tuiles (en-tête foncé, lignes colorées,
// filtre automatique, première ligne figée).
function xlsSheet(aoa, meta, widths, leftCols){
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = widths.map(w => ({wch:w}));
  ws['!freeze'] = { xSplit:0, ySplit:1 };
  ws['!autofilter'] = { ref: XLSX.utils.encode_range({s:{r:0,c:0}, e:{r:aoa.length-1, c:widths.length-1}}) };
  for(let r=0; r<aoa.length; r++){
    for(let c=0; c<widths.length; c++){
      const addr = XLSX.utils.encode_cell({r,c});
      if(!ws[addr]) ws[addr] = { t:'s', v:'' };
      const m = meta[r] || {};
      let fill='FFFFFF', bold=false, fontColor='000000';
      if(m.header){ fill='232221'; bold=true; fontColor='FFFFFF'; }
      else if(m.cat){ fill='D9D2C2'; bold=true; }
      else if(m.couleur==='red') fill='F4CCCC';
      else if(m.couleur==='yellow') fill='FFF2CC';
      else if(m.couleur==='green') fill='D9EAD3';
      ws[addr].s = {
        fill:{ patternType:'solid', fgColor:{rgb:fill} },
        font:{ name:'Arial', sz:m.header?11:10, bold:bold, color:{rgb:fontColor} },
        alignment:{ vertical:'center', horizontal:((leftCols||[]).indexOf(c)!==-1)?'left':'center', wrapText:!!m.header },
        border:{ top:{style:'thin',color:{rgb:'CCCCCC'}}, bottom:{style:'thin',color:{rgb:'CCCCCC'}},
                 left:{style:'thin',color:{rgb:'CCCCCC'}}, right:{style:'thin',color:{rgb:'CCCCCC'}} }
      };
    }
  }
  return ws;
}

// Charge une tuile dans un cadre masqué et récupère sa page Excel.
function feuilleDeTuile(fichier, ms){
  return new Promise((resolve, reject)=>{
    const f = document.createElement('iframe');
    f.setAttribute('aria-hidden','true');
    f.style.cssText = 'position:fixed;left:-10000px;top:0;width:1024px;height:768px;border:0;visibility:hidden;';
    let fini = false;
    const nettoyer = () => { try{ f.remove(); }catch(e){} };
    const minuteur = setTimeout(()=>{ if(fini) return; fini=true; nettoyer(); reject(new Error('délai dépassé')); }, ms || 180000);
    f.onload = async () => {
      if(fini) return;
      try{
        const w = f.contentWindow;
        if(!w || typeof w.__dmdFlatSheet !== 'function') throw new Error('page non disponible (session expirée ?)');
        const sheet = await w.__dmdFlatSheet();
        if(!sheet || !Array.isArray(sheet.aoa)) throw new Error('aucune donnée renvoyée');
        if(fini) return;
        fini = true; clearTimeout(minuteur); nettoyer(); resolve(sheet);
      }catch(e){
        if(fini) return;
        fini = true; clearTimeout(minuteur); nettoyer(); reject(e);
      }
    };
    f.onerror = () => { if(fini) return; fini=true; clearTimeout(minuteur); nettoyer(); reject(new Error('chargement impossible')); };
    if(window.parent && typeof window.parent.__dmdSource === 'function'){ f.srcdoc = window.parent.__dmdSource(fichier, true); } else { f.src = fichier + (fichier.indexOf('?')>=0 ? '&' : '?') + 'dmdexport=1'; }
    document.body.appendChild(f);
  });
}

let _exportEnCours = false;
async function exporterToutExcel(){
  if(_exportEnCours) return;
  if(!isDeviceAdmin()){ alert('Export réservé au mode admin.'); return; }
  const btn = document.getElementById('exportAllBtn');
  const zone = document.getElementById('exportAllStatus');
  const libelle = btn ? btn.textContent : '';
  _exportEnCours = true;
  if(btn){ btn.disabled = true; }
  if(zone){ zone.style.display='block'; zone.innerHTML=''; }
  const trace = (txt, cls) => { if(!zone) return; const d=document.createElement('div'); if(cls) d.className=cls; d.textContent=txt; zone.appendChild(d); };
  const erreurs = [];
  try{
    try{ await ensureXLSX(); }
    catch(e){ alert('Module Excel indisponible. Vérifie ta connexion Internet et réessaie.'); return; }
    const wb = XLSX.utils.book_new();
    let pages = 0;
    for(let i=0; i<EXPORT_TUILES.length; i++){
      const t = EXPORT_TUILES[i];
      if(btn) btn.textContent = '⏳ ' + t.nom + '… (' + (i+1) + '/' + EXPORT_TUILES.length + ')';
      try{
        const s = await feuilleDeTuile(t.fichier);
        const nom = String(s.name || t.nom).substring(0,31).replace(/[\\\/?*\[\]:]/g,' ');
        const largeurs = s.widths || (s.aoa[0]||[]).map(()=>18);
        XLSX.utils.book_append_sheet(wb, xlsSheet(s.aoa, s.meta || [], largeurs, s.leftCols || []), nom);
        pages++;
        trace('✓ ' + t.nom + ' — ' + Math.max(0, s.aoa.length-1) + ' ligne(s)', 'l-ok');
      }catch(e){
        console.error('Export ' + t.nom, e);
        erreurs.push(t.nom + ' (' + (e && e.message ? e.message : 'erreur') + ')');
        trace('✗ ' + t.nom + ' — non exportée : ' + (e && e.message ? e.message : 'erreur'), 'l-err');
      }
    }
    if(!pages){ alert("Aucune tuile n'a pu être exportée.\n" + erreurs.join('\n')); return; }
    const d = new Date();
    const jour = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    if(btn) btn.textContent = '💾 Écriture du fichier…';
    XLSX.writeFile(wb, 'DMD_Complet_' + jour + '.xlsx');
    trace('Fichier créé : DMD_Complet_' + jour + '.xlsx (' + pages + ' page' + (pages>1?'s':'') + ')', 'l-ok');
    if(erreurs.length) alert('Export terminé, mais ' + erreurs.length + ' tuile(s) manquante(s) :\n• ' + erreurs.join('\n• '));
  }catch(e){
    console.error('Export global', e);
    alert("Une erreur est survenue pendant l'export. Réessaie dans un instant.");
  }finally{
    _exportEnCours = false;
    if(btn){ btn.disabled = false; btn.textContent = libelle || '⬇ Export Excel complet'; }
  }
}
const _exportAllBtn = document.getElementById('exportAllBtn');
if(_exportAllBtn) _exportAllBtn.addEventListener('click', exporterToutExcel);

      transparent 3px,
      transparent 30px
    ),
    /* joints verticaux, rangée du HAUT (0-30px) : aux positions 0 et 124 */

      rgba(48,16,16,0.85) 0px, rgba(48,16,16,0.85) 3px,
      transparent 3px, transparent 124px),
    /* joints verticaux, rangée du BAS (30-60px) : décalés de 62px */

      transparent 0px, transparent 62px,
      rgba(48,16,16,0.85) 62px, rgba(48,16,16,0.85) 65px,
      transparent 65px, transparent 124px);
  background-size: 100% 100%, 100% 30px, 124px 30px, 124px 30px;
  background-position: 0 0, 0 0, 0 0px, 0 30px;

  border-radius:6px;
  font-size:15px;
  font-family:'Barlow',sans-serif;
}
.field input:focus{outline:none; border-color:var(--safety-orange);}
/* Statut de vérification annuelle */
.field input.verif-red{ border-color:var(--danger-red); background:rgba(194,59,34,0.14); color:#ffd9d1; }
.field input.verif-orange{ border-color:var(--safety-yellow); background:rgba(242,183,5,0.14); color:#ffe9a8; }
.field input.verif-green{ border-color:var(--ok-green); background:rgba(76,122,63,0.14); }
.verif-hint{ font-size:11px; margin-top:4px; font-weight:600; }
.verif-hint.red{ color:var(--danger-red); }
.verif-hint.orange{ color:var(--safety-yellow); }
.verif-hint.green{ color:var(--ok-green); }
.verif-dot{ display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:4px; vertical-align:middle; }
.verif-dot.red{ background:var(--danger-red); }
.verif-dot.orange{ background:var(--safety-yellow); }
.verif-dot.green{ background:var(--ok-green); }

.etat-chips{display:flex; gap:6px; flex-wrap:wrap;}
.etat-chip{
  padding:6px 12px;
  border-radius:16px;
  border:1.5px solid var(--line);
  background:var(--asphalt);
  color:var(--paper-dim);
  font-size:13px;
  font-weight:600;
  cursor:pointer;
}
.etat-chip.sel-bon{background:var(--ok-green); border-color:var(--ok-green); color:#fff;}
.etat-chip.sel-moyen{background:var(--safety-yellow); border-color:var(--safety-yellow); color:var(--asphalt);}
.etat-chip.sel-mauvais{background:var(--danger-red); border-color:var(--danger-red); color:#fff;}
.etat-chip.readonly{cursor:default;}
/* Compteurs par état */
.etat-counters{display:flex; gap:8px;}
.etat-counter{flex:1; text-align:center;}
.etat-counter label{
  display:block; font-size:11px; font-weight:700; text-transform:uppercase;
  letter-spacing:0.5px; margin-bottom:4px;
}
.etat-counter.bon label{color:var(--ok-green);}
.etat-counter.moyen label{color:var(--safety-yellow);}
.etat-counter.mauvais label{color:var(--danger-red);}
.etat-counter input{
  width:100%; text-align:center; background:var(--asphalt);
  border:1.5px solid var(--line); color:var(--paper);
  padding:9px 4px; border-radius:6px; font-size:16px; font-weight:700;
  font-family:'Barlow',sans-serif;
}
.etat-counter.bon input:focus{outline:none; border-color:var(--ok-green);}
.etat-counter.moyen input:focus{outline:none; border-color:var(--safety-yellow);}
.etat-counter.mauvais input:focus{outline:none; border-color:var(--danger-red);}
.etat-total-hint{font-size:11px; margin-top:6px; font-weight:600; color:var(--paper-dim);}
.etat-total-hint.mismatch{color:var(--safety-yellow);}
/* Options cochables (ex: Fil / Batterie) */
.opt-chips{display:flex; flex-wrap:wrap; gap:8px;}
.opt-chip{
  display:inline-flex; align-items:center; gap:6px;
  border:1.5px solid var(--line); background:var(--asphalt);
  color:var(--paper); padding:8px 12px; border-radius:8px;
  font-size:14px; font-weight:600; cursor:pointer; user-select:none;
  font-family:'Barlow',sans-serif;
}
.opt-chip .box{
  width:16px; height:16px; border-radius:4px; border:2px solid var(--paper-dim);
  display:inline-flex; align-items:center; justify-content:center;
  font-size:12px; line-height:1; color:transparent;
}
.opt-chip.sel{background:var(--safety-orange); border-color:var(--safety-orange); color:#fff;}
.opt-chip.sel .box{border-color:#fff; color:#fff;}
.etat-pill{
  display:inline-block; font-size:11px; font-weight:700; padding:2px 8px;
  border-radius:10px; margin-left:4px;
}
.etat-pill.green{background:var(--ok-green); color:#fff;}
.etat-pill.orange{background:var(--safety-yellow); color:var(--asphalt);}
.etat-pill.red{background:var(--danger-red); color:#fff;}


.delete-link{
  color:var(--danger-red);
  font-size:12px;
  font-weight:600;
  text-decoration:underline;
  cursor:pointer;
  margin-top:6px;
  display:inline-block;
}

.add-item-btn{
  width:100%;
  margin-top:6px;
  padding:14px;
  border-radius:8px;
  border:2px dashed var(--line);
  background:transparent;
  color:var(--paper-dim);
  font-family:'Barlow Condensed',sans-serif;
  font-weight:700;
  font-size:15px;
  text-transform:uppercase;
  letter-spacing:0.5px;
  cursor:pointer;
}
.add-item-btn:active{border-color:var(--safety-orange); color:var(--safety-orange);}

.empty-msg{
  text-align:center;
  color:var(--paper-dim);
  padding:40px 20px;
  font-size:15px;
}

.team-detail-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 0;
  border-bottom:1px solid var(--line);
  font-size:14px;
}
.team-detail-row:last-child{border-bottom:none;}
.team-detail-name{color:var(--paper); font-weight:600;}
.team-detail-meta{color:var(--paper-dim); font-size:12px;}
.team-detail-vals{display:flex; align-items:center; gap:8px;}

.footer{
  padding:10px 16px;
  text-align:center;
  font-size:11px;
  color:var(--paper-dim);
  background:var(--asphalt-2);
  border-top:1px solid var(--line);
}
.reset-link{
  color:var(--danger-red);
  text-decoration:underline;
  cursor:pointer;
  font-weight:600;
}

/* Modal */
.overlay{
  position:fixed; inset:0; background:rgba(0,0,0,0.6);
  display:none; align-items:flex-end; justify-content:center;
  z-index:100;
}
.overlay.show{display:flex;}
.modal{
  background:var(--asphalt-2);
  width:100%; max-width:560px;
  border-radius:16px 16px 0 0;
  border-top:3px solid var(--safety-orange);
  padding:20px 18px 26px;
  max-height:85vh;
  overflow-y:auto;
  animation:slideup 0.2s ease-out;
}
@keyframes slideup{ from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;} }
.modal h3{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:0.5px;
  font-size:20px;
  margin:0 0 14px 0;
  color:var(--safety-yellow);
}
.modal .field{margin-bottom:12px;}
.modal-actions{display:flex; gap:10px; margin-top:6px;}
.btn{
  flex:1;
  padding:12px;
  border-radius:8px;
  border:none;
  font-family:'Barlow Condensed',sans-serif;
  font-weight:700;
  font-size:16px;
  text-transform:uppercase;
  letter-spacing:0.5px;
  cursor:pointer;
}
.btn-cancel{background:var(--asphalt); color:var(--paper-dim); border:1.5px solid var(--line);}
.btn-confirm{background:var(--safety-orange); color:var(--paper);}

    return m ? (R[m[1]] || '') : '';

  document.addEventListener('click', function(e){
    var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
    if(!a) return;
    var h = a.getAttribute('href') || '';
    if(/\.html(\?|#|$)/.test(h)){ e.preventDefault(); window.__dmdGo(h); }
  }, true);
})();

const _sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

window.storage = {
  async get(k, shared = true){
    if(shared === false){
      try{ const v = localStorage.getItem(k); return v === null ? null : { key:k, value:v }; }
      catch(e){ return null; }
    }
    try{
      const req = _sb.from('inv_store').select('value').eq('key', k).maybeSingle();
      // Garde-fou : si le réseau ne répond pas, on n'attend pas indéfiniment.
      const timeout = new Promise((resolve) => setTimeout(() => resolve({ __timeout:true }), 8000));
      const res = await Promise.race([req, timeout]);
      if(res && res.__timeout){ console.warn('storage.get timeout:', k); return null; }
      const { data, error } = res;
      if(error){ console.error(error); return null; }
      return data ? { key:k, value:data.value } : null;
    }catch(e){ console.error(e); return null; }
  },
  async set(k, value, shared = true){
    if(shared === false){
      try{ localStorage.setItem(k, value); return { key:k, value }; }
      catch(e){ return null; }
    }
    const { error } = await _sb.from('inv_store').upsert({ key:k, value:value, updated_at:new Date().toISOString() });
    if(error){ console.error(error); return null; }
    return { key:k, value };
  },
  async delete(k, shared = true){
    if(shared === false){
      try{ localStorage.removeItem(k); return { key:k, deleted:true }; }
      catch(e){ return null; }
    }
    const { error } = await _sb.from('inv_store').delete().eq('key', k);
    if(error){ console.error(error); return null; }
    return { key:k, deleted:true };
  },
  async list(prefix, shared = true){
    if(shared === false){
      const keys = [];
      try{
        for(let i=0;i<localStorage.length;i++){ const kk = localStorage.key(i); if(!prefix || kk.startsWith(prefix)) keys.push(kk); }
      }catch(e){}
      return { keys };
    }
    let q = _sb.from('inv_store').select('key');
    if(prefix) q = q.like('key', prefix + '%');
    const { data, error } = await q;
    if(error){ console.error(error); return { keys: [] }; }
    return { keys: (data || []).map(r => r.key) };
  }
};

/* ===== FUSION : Lift + Fraco + Mixeur + Scie regroupés dans un seul onglet « Machinerie ».
   Les sous-sections restent visibles par en-tête (Lift, Fraco, Accessoires Fraco, Mixeur, Scie).
   Chaque machine conserve son type dans it.mtype (pour le catalogue publié et l'app Machinerie). */
(function mergeMachinerie(){
  const parts = [
    { key:'LOURD_LIFT',   type:'Lift',   titre:'LIFT' },
    { key:'LOURD_FRACO',  type:'Fraco',  titre:'FRACO' },
    { key:'LOURD_MIXEUR', type:'Mixeur', titre:'MIXEUR' },
    { key:'LOURD_SCIE',   type:'Scie',   titre:'SCIE' },
    { key:'LOURD_MACH_DIVERS', type:'Divers', titre:'DIVERS' }
  ];
  if(!parts.some(p => RAW_DATA[p.key])) return; // déjà fusionné ou catégories absentes
  const items = [];
  const accFraco = [];   // accessoires Fraco + rack gris -> onglet séparé « Accessoire Fraco »
  parts.forEach(p => {
    const src = RAW_DATA[p.key];
    if(!src || !Array.isArray(src.items)) return;
    const firstIsHeader = src.items.length && src.items[0].header;
    if(!firstIsHeader){ items.push({ name:p.titre, header:true }); } // en-tête de sous-section
    let fracoStopped = false;   // pour Fraco : machines avant « ACCESSOIRES FRACO », accessoires après
    src.items.forEach(it => {
      const copy = Object.assign({}, it);
      if(it.header){
        if(/ACCESSOIRES/i.test(it.name || '')) fracoStopped = true;
      } else {
        copy.mtype = p.type;
        if(p.type === 'Fraco'){
          if(!fracoStopped){ copy.noQty = true; copy.selectable = true; }
        } else {
          copy.noQty = true; copy.selectable = true;
        }
      }
      // Fraco : tout ce qui suit l'en-tête « ACCESSOIRES FRACO » (accessoires + rack gris)
      // part dans l'onglet séparé au lieu de rester dans Machinerie.
      if(p.type === 'Fraco' && fracoStopped){ accFraco.push(copy); }
      else { items.push(copy); }
    });
  });
  RAW_DATA['MACHINERIE'] = { label:'Machinerie', items: items };
  if(accFraco.length){ RAW_DATA['ACC_FRACO'] = { label:'Accessoire Fraco', items: accFraco }; }
  parts.forEach(p => { delete RAW_DATA[p.key]; });
})();

const CAT_ORDER = ['BASE','S.S.T.','NÉCÉSSAIRE','OUTILS','MACHINERIE','ACC_FRACO',
                   'HIVER','SHACK',
                   'LOURD_ECHAFAUDAGE','LOURD_DIVERS'];

/* Retrait de la quantité sur les équipements lourds.
   - Lift, Mixeur, Scie : tous les items (aucun accessoire).
   - Fraco : seulement les machines (section « FRACO »).
     Dès qu'on atteint l'en-tête « ACCESSOIRES FRACO », on garde la quantité
     (accessoires + « RACK GRIS »). */
(function markNoQty(){
  ['LOURD_LIFT','LOURD_MIXEUR','LOURD_SCIE'].forEach(cat => {
    const d = RAW_DATA[cat];
    if(!d) return;
    d.items.forEach(it => { if(!it.header){ it.noQty = true; it.selectable = true; } });
  });
  const fraco = RAW_DATA['LOURD_FRACO'];
  if(fraco){
    let stopped = false;
    fraco.items.forEach(it => {
      if(it.header && /ACCESSOIRES/i.test(it.name)) stopped = true;
      if(!stopped && !it.header){ it.noQty = true; it.selectable = true; } // machines FRACO uniquement
    });
  }
})();

/* Statut d'une date de vérif. annuelle au format AAAA-MM.
   - red    : vide, invalide, ou >= 12 mois écoulés (expiré)
   - orange : entre 9 et 12 mois écoulés (approche)
   - green  : < 9 mois écoulés (à jour) */
/* Formate une saisie libre en AAAA/MM.
   Garde uniquement les chiffres, insère la barre après l'année. */
function formatVerif(val){
  const d = (val || '').replace(/[^\d]/g, '').slice(0, 6); // max 6 chiffres AAAAMM
  if(d.length <= 4) return d;
  return d.slice(0,4) + '/' + d.slice(4);
}

function verifStatus(val){
  const s = (val || '').trim();
  // Accepte 2026/07, 2026-07, 2026.07, 2026 07, ou 202607
  const m = s.match(/^(\d{4})[\/\-. ]?(\d{1,2})$/);
  if(!m) return { level:'red', label: s ? 'Format AAAA/MM attendu' : 'Aucune date — vérif. requise' };
  const y = parseInt(m[1],10), mo = parseInt(m[2],10);
  if(mo < 1 || mo > 12) return { level:'red', label:'Mois invalide (01–12)' };
  const now = new Date();
  // mois écoulés depuis la date de vérif
  const months = (now.getFullYear() - y) * 12 + (now.getMonth() + 1 - mo);
  if(months < 0) return { level:'green', label:'Date future' };
  if(months >= 12) return { level:'red', label:'Expirée (' + months + ' mois) — à revérifier' };
  if(months >= 9)  return { level:'orange', label:'Bientôt due (' + months + ' mois)' };
  return { level:'green', label:'À jour (' + months + ' mois)' };
}

/* Statut d'un entretien libre (Huile / Tune-up).
   Le champ est du texte libre (ex. « fait 2025-03 »). On tente d'y trouver
   une date AAAA-MM ; sinon on considère l'entretien comme non daté.
   - vide          -> rouge (à faire)
   - date trouvée  -> même règle que la vérif (>=12 mois rouge, >=9 jaune)
   - texte sans date -> jaune (présent mais date inconnue)  */
function entretienStatus(val){
  const s = (val || '').trim();
  if(!s) return { level:'red', label:'À faire (aucune date)' };
  const m = s.match(/(\d{4})[\/\-. ]?(\d{1,2})/);
  if(!m) return { level:'orange', label:'Date à préciser' };
  const y = parseInt(m[1],10), mo = parseInt(m[2],10);
  if(mo < 1 || mo > 12) return { level:'orange', label:'Date à préciser' };
  const now = new Date();
  const months = (now.getFullYear() - y) * 12 + (now.getMonth() + 1 - mo);
  if(months < 0) return { level:'green', label:'Date future' };
  if(months >= 12) return { level:'red', label:'Expiré (' + months + ' mois)' };
  if(months >= 9)  return { level:'orange', label:'Bientôt dû (' + months + ' mois)' };
  return { level:'green', label:'À jour (' + months + ' mois)' };
}

/* Statut de quantité : compare prévue vs réelle.
   - null   : comparaison impossible (une des deux vide)
   - red    : réelle < prévue (manque)
   - green  : réelle >= prévue (compte bon ou surplus) */
function qtyStatus(qte, qteReel){
  if(qte === "" || qteReel === "" || qte == null || qteReel == null) return null;
  const p = parseFloat(qte), r = parseFloat(qteReel);
  if(isNaN(p) || isNaN(r)) return null;
  if(r < p) return { level:'red', label:'Manque ' + (p - r) + ' (prévu ' + p + ', réel ' + r + ')' };
  if(r > p) return { level:'green', label:'Surplus ' + (r - p) + ' (prévu ' + p + ', réel ' + r + ')' };
  return { level:'green', label:'Compte exact (' + p + ')' };
}

/* Synthèse des compteurs d'état d'un article.
   Retourne null si aucun compteur rempli, sinon { bon, moyen, mauvais, total, level, label }.
   - level red    : au moins 1 en mauvais
   - level orange : des moyens mais aucun mauvais
   - level green  : uniquement des bons */
function etatSummary(s){
  const b = parseInt(s.etatBon,10)   || 0;
  const m = parseInt(s.etatMoyen,10) || 0;
  const x = parseInt(s.etatMauvais,10)|| 0;
  if(s.etatBon==="" && s.etatMoyen==="" && s.etatMauvais==="") return null;
  const total = b + m + x;
  let level = 'green';
  if(x > 0) level = 'red';
  else if(m > 0) level = 'orange';
  const parts = [];
  if(b) parts.push(b + ' bon' + (b>1?'s':''));
  if(m) parts.push(m + ' moyen' + (m>1?'s':''));
  if(x) parts.push(x + ' mauvais');
  return { b, m, x, total, level, label: parts.length ? parts.join(' · ') : 'aucun' };
}

/* Texte d'aide sous les compteurs : total compté, et alerte si ≠ quantité réelle */
function etatHintText(est, s){
  if(!est) return '';
  let txt = 'Total évalué : ' + est.total;
  const r = parseFloat(s.qteReel);
  if(!isNaN(r) && s.qteReel !== "" && est.total !== r){
    txt += ' — ⚠ ne correspond pas à la qté réelle (' + r + ')';
  }
  return txt;
}

/* Priorité d'un article : 0 = rouge (urgent), 1 = orange, 2 = normal.
   Prend le pire des trois indicateurs (état, quantité, vérif). */
/* Couleur de la barre gauche d'un article selon TA règle :
   - rouge  : quantité insuffisante OU état mauvais
   - jaune  : état moyen (et rien de rouge)
   - vert   : le reste (données saisies, tout va bien)
   - ''     : aucune donnée saisie (barre grise par défaut) */
function edgeClassFor(s, it){
  const noQty = !!(it && it.noQty);
  // On rassemble tous les statuts colorables de l'article et on garde le pire.
  const levels = [];
  const est = etatSummary(s);
  if(est) levels.push(est.level);
  const qst = noQty ? null : qtyStatus(s.qte, s.qteReel);
  if(qst) levels.push(qst.level);
  // Dates : vérif annuelle (vf/ext) + huile & tune-up (moteurs gas)
  if(it && (it.vf || it.ext)){ const vs = verifStatus(effVerif(s, it)); if(vs) levels.push(vs.level); }
  if(it && it.gas){
    const hs = entretienStatus(effHuile(s, it));  if(hs) levels.push(hs.level);
    const ts = entretienStatus(effTuneup(s, it)); if(ts) levels.push(ts.level);
  }
  if(levels.indexOf('red') !== -1) return ' edge-red';
  if(levels.indexOf('orange') !== -1) return ' edge-yellow';
  // vert si au moins une donnée saisie (quantité, état, ou une date à jour)
  const hasData = (!noQty && (s.qte !== "" || s.qteReel !== "")) || !!est || levels.indexOf('green') !== -1;
  return hasData ? ' edge-green' : '';
}

function levelRank(level){ return level === 'red' ? 0 : (level === 'orange' ? 1 : 2); }
function itemPriority(it, s){
  let best = 2;
  const est = etatSummary(s);
  if(est) best = Math.min(best, levelRank(est.level));
  const qst = (it && it.noQty) ? null : qtyStatus(s.qte, s.qteReel);
  if(qst) best = Math.min(best, levelRank(qst.level));
  if(it.vf || it.ext){ const vst = verifStatus(effVerif(s, it)); if(vst) best = Math.min(best, levelRank(vst.level)); }
  if(it.gas){
    const hst = entretienStatus(effHuile(s, it));  if(hst) best = Math.min(best, levelRank(hst.level));
    const tst = entretienStatus(effTuneup(s, it)); if(tst) best = Math.min(best, levelRank(tst.level));
  }
  return best;
}

/* Réordonne les articles en gardant les sections (en-têtes) :
   dans chaque bloc délimité par un en-tête, tri stable par priorité (rouge, orange, reste).
   Renvoie une liste de {it, i} où i est l'index d'origine (pour l'état). */
function orderedItemsWithPriority(items, st){
  const out = [];
  let block = [];
  const flush = () => {
    // tri stable : priorité (rouge, orange, reste) PUIS alphabétique
    block.map((e, idx) => ({ e, idx }))
      .sort((a, b) =>
        (a.e.prio - b.e.prio) ||
        a.e.name.localeCompare(b.e.name, 'fr', { sensitivity:'base', numeric:true }) ||
        (a.idx - b.idx))
      .forEach(x => out.push(x.e));
    block = [];
  };
  items.forEach((it, i) => {
    if(it.header){
      flush();
      out.push({ it, i, header:true });
    } else {
      const s = (st && st[i]) || defaultItemState(it);
      block.push({ it, i, header:false, prio: itemPriority(it, s), name: (it.name||'').replace(/\n/g,' ') });
    }
  });
  flush();
  return out;
}

// suivie d'un changement d'équipe/onglet dans la demi-seconde ANNULAIT la sauvegarde précédente.
const saveTimers = {};          // 'team|cat' -> timeout
const dirtyIdx = {};            // 'team|cat' -> Set des index modifiés localement (fusion à l'écriture)
function markDirtyIdx(teamId, cat, idx){ const k=teamId+'|'+cat; (dirtyIdx[k]=dirtyIdx[k]||new Set()).add(idx); }
// Rafraîchissement différé des pastilles d'alerte (onglets + barre d'équipes) : ces calculs

// ---- Auto-réparation anti-écrasement ----
// Après une sauvegarde, plusieurs personnes qui enregistraient la MÊME liste au même
// moment peuvent s'être écrasées (dernier-écrit-gagne sur la clé). Quelques secondes
// plus tard, chaque appareil relit la copie serveur : si une de SES valeurs a disparu,
// il la ré-applique (fusion). Tous les appareils convergent ainsi sans rien perdre.
const _verifyTimers = {}; const _verifyCount = {};
function scheduleSaveVerify(teamId, cat){
  const k = teamId + '|' + cat;
  _verifyCount[k] = (_verifyCount[k]||0);
  if(_verifyCount[k] >= 5) return;                       // plafond anti-boucle (remis à 0 à chaque sauvegarde)
  clearTimeout(_verifyTimers[k]);
  _verifyTimers[k] = setTimeout(async () => {
    try{
      const dirty = dirtyIdx[k]; if(!dirty || !dirty.size) return;
      const local = perTeamState[teamId] && perTeamState[teamId][cat]; if(!local) return;
      const r = await window.storage.get('inv:' + teamId + ':' + cat, true);
      if(!r || !r.value) return;
      const srv = JSON.parse(r.value); if(!Array.isArray(srv)) return;
      let lost = false;
      dirty.forEach(i => { if(i < local.length && JSON.stringify(srv[i]||null) !== JSON.stringify(local[i]||null)) lost = true; });
      _verifyCount[k]++;
      if(lost){ scheduleSaveTeamCat(teamId, cat); }
      else if(_verifyCount[k] < 5){ scheduleSaveVerify(teamId, cat); }   // repasse plus tard : un écrasement peut arriver APRÈS la 1re vérif
    }catch(e){}
  }, (1800 + Math.random()*2200) * Math.max(1, (_verifyCount[k]||0) * 2));   // passes de plus en plus espacées
}
function scheduleSaveTeamCat(teamId, cat){
  const statusEl = document.getElementById('saveStatus');
  statusEl.textContent = 'Modif...';
  const k = teamId + '|' + cat;
  clearTimeout(saveTimers[k]);
  saveTimers[k] = setTimeout(async () => {
    try{
      // FUSION : on relit la copie serveur et on n'y applique que les index modifiés ICI.
      // Deux personnes qui remplissent la même liste en même temps ne s'écrasent plus.
      const local = perTeamState[teamId][cat];
      let merged = local;
      const dirty = dirtyIdx[k];
      try{
        const r = await window.storage.get('inv:' + teamId + ':' + cat, true);
        if(r && r.value && dirty && dirty.size){
          const srv = JSON.parse(r.value);
          if(Array.isArray(srv)){
            // Fusion EN PLACE (même objet tableau) : les cartes déjà affichées gardent
            // leur référence — les frappes en cours ne sont jamais orphelines.
            for(let idx = 0; idx < srv.length; idx++){
              if(!dirty.has(idx) && srv[idx] !== undefined) local[idx] = srv[idx];
            }
            merged = local;
          }
        }
      }catch(e){}
      await window.storage.set('inv:' + teamId + ':' + cat, JSON.stringify(merged), true);
      // NOTE : on NE vide PAS `dirty` — les index touchés sur cet appareil sont ré-affirmés
      // à chaque sauvegarde de la session. Si une écriture concurrente a fait perdre une
      // valeur pendant la course initiale, la prochaine modification la répare d'elle-même.
      _verifyCount[teamId+'|'+cat] = 0; scheduleSaveVerify(teamId, cat);   // nouveau cycle d'auto-réparation à chaque sauvegarde
      statusEl.textContent = 'Enregistré ✓';
      setTimeout(() => { if(statusEl.textContent === 'Enregistré ✓') statusEl.textContent = '\u00A0'; }, 1500);
    }catch(e){
      statusEl.textContent = 'Erreur';
    }
  }, 500);
}

    if(s && (s.qte !== "" || s.qteReel !== "" || s.etatBon !== "" || s.etatMoyen !== "" || s.etatMauvais !== "")) filled++;

  return {filled, total};
}

// Normalise un nom pour la correspondance (sans accents, casse, ponctuation, tirets)
function normNom(s){
  return (s||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[.,\-]/g,' ').replace(/\s+/g,' ').trim();
}
// ---- Affichage uniforme des noms et t\u00e9l\u00e9phones ----
function onlyDigits(s){ return String(s==null?'':s).replace(/\D/g,''); }
function formatTel(s){ const d=onlyDigits(s); let n=d; if(n.length===11 && n[0]==='1') n=n.slice(1); if(n.length===10) return '('+n.slice(0,3)+')'+n.slice(3,6)+'-'+n.slice(6); return String(s==null?'':s).trim(); }
function telHref(s){ const d=onlyDigits(s); return 'tel:'+(d||String(s==null?'':s).trim()); }
function formatNom(s){ s=String(s==null?'':s).replace(/\s+/g,' ').trim(); if(!s) return s; return s.toLocaleLowerCase('fr').replace(/[\p{L}\p{N}]+/gu, function(w){ return w.charAt(0).toLocaleUpperCase('fr')+w.slice(1); }); }
// Notation d'adresse standard (ex. : 1100 av. André-Champagne, St-Bruno, Qc)
function formatAdresse(s){
  s=String(s==null?'':s).replace(/\s+/g,' ').trim(); if(!s) return s;
  s=s.replace(/\s*,\s*/g,', ');
  var ST={avenue:'av.',ave:'av.',av:'av.',boulevard:'boul.',boul:'boul.',bd:'boul.',rue:'rue',chemin:'ch.',ch:'ch.',route:'rte',rte:'rte',rang:'rang',montee:'mtée',place:'pl.',impasse:'imp.'};
  var PART={de:1,du:1,des:1,la:1,le:1,les:1,l:1,d:1,a:1,au:1,aux:1,et:1,sur:1,sous:1};
  function deacc(w){ return w.toLocaleLowerCase('fr').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\./g,''); }
  function cap(w){ return w?w.charAt(0).toLocaleUpperCase('fr')+w.slice(1):w; }
  var segs=s.split(', ');
  return segs.map(function(seg,si){
    var last=si===segs.length-1;
    return seg.split(' ').filter(Boolean).map(function(w,wi){
      var d=deacc(w);
      if(ST[d]!==undefined) return ST[d];
      if(last && (d==='qc'||d==='quebec')) return 'Qc';
      return w.split('-').map(function(pp,pi){
        if(/\d/.test(pp)) return pp.toLocaleUpperCase('fr');
        var dp=deacc(pp);
        if(dp==='st'||dp==='saint') return 'St';
        if(dp==='ste'||dp==='sainte') return 'Ste';
        if(PART[dp] && !(wi===0 && pi===0)) return dp;
        return cap(pp.toLocaleLowerCase('fr'));
      }).join('-');
    }).join(' ');
  }).join(', ');
}
// Distance d'édition (Levenshtein) entre deux mots
function levenshtein(a, b){
  if(a === b) return 0;
  if(!a || !b) return (a.length + b.length);
  let prev = Array.from({length:b.length+1}, (_,i)=>i);
  for(let i=0;i<a.length;i++){
    let cur = [i+1];
    for(let j=0;j<b.length;j++){
      cur.push(Math.min(prev[j+1]+1, cur[j]+1, prev[j] + (a[i]!==b[j] ? 1 : 0)));
    }
    prev = cur;
  }
  return prev[b.length];
}
// Deux mots se ressemblent-ils ? (tolérance selon la longueur, prudente)
function motsProches(m1, m2){
  const d = levenshtein(m1, m2), L = Math.max(m1.length, m2.length);
  if(L >= 6) return d <= 2;   // mots longs : 2 lettres de différence max
  if(L >= 4) return d <= 1;   // mots moyens : 1 lettre
  return d === 0;             // mots courts : exact
}
// Deux noms complets correspondent-ils ? (même nb de mots, chaque mot proche, ordre libre)
function nomsProches(n1, n2){
  const w1 = normNom(n1).split(' ').filter(Boolean);
  const w2 = normNom(n2).split(' ').filter(Boolean);
  if(w1.length !== w2.length || w1.length === 0) return false;
  const used = new Array(w2.length).fill(false);
  for(const a of w1){
    let ok = false;
    for(let i=0;i<w2.length;i++){
      if(!used[i] && motsProches(a, w2[i])){ used[i] = true; ok = true; break; }
    }
    if(!ok) return false;
  }
  return true;
}
// Statut d'une échéance de formation (date AAAA-MM-JJ) : rouge expiré, jaune <90j, vert sinon
function echeanceStatus(dateStr){
  const m = (dateStr||'').match(/(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
  if(!m) return null; // pas une date (ex: N.A., NORME) -> pas de couleur
  const d = new Date(+m[1], +m[2]-1, +m[3]);
  if(isNaN(d)) return null;
  const now = new Date(); now.setHours(0,0,0,0);
  const jours = Math.round((d - now) / 86400000);
  if(jours < 0) return { level:'red', label:'Expirée' };
  if(jours <= 90) return { level:'orange', label:'Bientôt due' };
  return { level:'green', label:'À jour' };
}

// Lit l'Excel croisé « Liste des formations » : en-têtes sur 2 lignes,
// blocs de 3 lignes par employé (Date / Attestation reçu / Échéance).
async function importFormationsFromFile(file){
  await ensureXLSX();
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type:'array', cellDates:true });

  // Choisir la feuille croisée : celle qui contient "EMPLOYÉ" en haut à gauche
  // et une ligne "Échéance" dans la colonne 2.
  let sheet = null;
  wb.SheetNames.forEach(sn => {
    const ws = wb.Sheets[sn];
    const aoa = XLSX.utils.sheet_to_json(ws, { header:1, defval:'', raw:false });
    const flat = aoa.slice(0,6).map(r => (r||[]).join(' ')).join(' ').toLowerCase();
    const hasEmp = /employ/.test(flat);
    const hasEch = aoa.some(r => (r||[]).some(c => /échéance|echeance/i.test(String(c))));
    if(hasEmp && hasEch && !sheet){ sheet = { sn, aoa }; }
  });
  if(!sheet) return { people:[], maj:new Date().toISOString() };

  const aoa = sheet.aoa;
  const fmt = v => {
    if(v == null) return '';
    if(v instanceof Date){ return v.getFullYear() + '-' + String(v.getMonth()+1).padStart(2,'0') + '-' + String(v.getDate()).padStart(2,'0'); }
    return String(v).trim();
  };

  // Ligne d'en-tête des formations = celle qui contient "SECOURISTE" (ligne 2 dans ton fichier)
  let hRow = -1;
  for(let r=0; r<Math.min(aoa.length, 6); r++){
    if((aoa[r]||[]).some(c => /secouriste|silice/i.test(String(c)))){ hRow = r; break; }
  }
  if(hRow === -1) hRow = 1;
  // colonnes de formation = à partir de la 3e colonne (index 2), là où il y a un nom en hRow
  const formCols = [];
  const headerRow = aoa[hRow] || [];
  for(let c=2; c<headerRow.length; c++){
    const nom = fmt(headerRow[c]).replace(/\s+/g,' ').trim();
    if(nom) formCols.push({ c, nom });
  }

  // Blocs employés : à partir de la ligne suivant les en-têtes.
  // Nom en colonne 0 (1re ligne du bloc) ; 3 lignes = Date / Attestation / Échéance.
  const people = [];
  let r = hRow + 1;
  while(r < aoa.length){
    const nom = fmt((aoa[r]||[])[0]);
    if(nom){
      const rowDate = aoa[r] || [], rowAtt = aoa[r+1] || [], rowEch = aoa[r+2] || [];
      const forms = [];
      formCols.forEach(({c, nom:fnom}) => {
        const d = fmt(rowDate[c]), a = fmt(rowAtt[c]), e = fmt(rowEch[c]);
        if(d || a || e){ forms.push({ formation:fnom, date:d, attestation:a, echeance:e }); }
      });
      if(forms.length) people.push({ nom, forms });
      r += 3;
    } else {
      r += 1;
    }
  }
  return { people, maj:new Date().toISOString() };
}

// Clé d'une machine (même règle que machineKey() de la tuile Machinerie) :
// identifiant s'il existe, sinon « nom:<nom normalisé> ».
function machineRecKey(it){
  const id = (it && it.ident) ? String(it.ident).trim() : '';
  return id ? id : 'nom:' + normNom(((it && it.name) || '').replace(/\n/g,' '));
}

// Valeurs EFFECTIVES : depuis la Machinerie pour les machines, sinon l'état local
// (ex. extincteurs, qui n'existent pas dans la Machinerie et restent modifiables ici).
function effVerif(s, it){ if(isMachineryMachine(it)){ const r = machRecFor(it); return (r && r.verif) || ''; } return (s && s.verif) || ''; }
function effHuile(s, it){ if(isMachineryMachine(it)){ const r = machRecFor(it); return (r && r.huile) || ''; } return (s && s.huile) || ''; }
function effTuneup(s, it){ if(isMachineryMachine(it)){ const r = machRecFor(it); return (r && r.tuneup) || ''; } return (s && s.tuneup) || ''; }

  menu.innerHTML = isMine
    ? '<button data-act="unset">🔨 Retirer « mon équipe »</button>'
    : '<button data-act="set">🔨 Définir « ' + escapeHtml(label) + ' » comme mon équipe</button>';
  document.body.appendChild(menu);

  // positionner sous le chip
  const r = chip.getBoundingClientRect();
  const mw = menu.offsetWidth;
  let left = r.left + (r.width/2) - (mw/2);
  left = Math.max(8, Math.min(left, window.innerWidth - mw - 8));
  menu.style.left = left + 'px';
  menu.style.top = (r.bottom + 6) + 'px';

  menu.querySelector('button').onclick = async (e) => {
    e.stopPropagation();
    const act = e.currentTarget.getAttribute('data-act');
    if(act === 'set') await saveMyTeam(teamId);
    else { myTeam = null; try{ await window.storage.delete('inv:myTeam', false); }catch(err){} }
    menu.remove();
    renderTeamBar();
  };

  // fermer si on touche ailleurs
  setTimeout(() => {
    const closer = (ev) => {
      if(!menu.contains(ev.target)){ menu.remove(); document.removeEventListener('click', closer, true); document.removeEventListener('touchstart', closer, true); }
    };
    document.addEventListener('click', closer, true);
    document.addEventListener('touchstart', closer, true);
  }, 10);
}

function renderTeamBar(){
  const bar = document.getElementById('teamBar');
  bar.innerHTML = '';
  teams.forEach(t => {
    const chip = document.createElement('div');
    chip.className = 'team-chip' + (currentTeam === t.id ? ' active' : '');
    const _col = teamColor(t.id);
    chip.style.borderLeft = '5px solid ' + _col;
    if(currentTeam === t.id){ chip.style.background = _col; chip.style.borderColor = _col; chip.style.color = '#fff'; }
    chip.innerHTML = '<span class="team-color-dot" style="background:' + _col + '"></span>' + escapeHtml(t.label) +
      (myTeam === t.id ? '<span class="my-team-badge" title="Mon équipe">🔨</span>' : '') +
      (teamHasRed(t.id) ? '<span class="alert-dot" title="Article(s) en rouge"></span>' : '');
    chip.onclick = async () => {
      if(chip._lpFired){ chip._lpFired = false; return; } // ignore le clic si un appui long vient de se déclencher
      if(currentTeam === t.id) return; // déjà dessus
      const ok = await switchToTeam(t.id);
      if(!ok){ renderTeamBar(); return; } // annulé : on ne change pas
      currentTeam = t.id;
      openIndex = null;
      await ensureTeamCatLoaded(currentTeam, currentCat);
      renderTeamBar(); renderTabs(); renderList();
    };
    // Appui long -> menu "Définir comme mon équipe"
    let lpTimer = null;
    const startLP = (ev) => {
      clearTimeout(lpTimer);
      lpTimer = setTimeout(() => {
        chip._lpFired = true;
        showTeamContextMenu(chip, t.id);
      }, 500);
    };
    const cancelLP = () => { clearTimeout(lpTimer); };
    chip.addEventListener('touchstart', startLP, {passive:true});
    chip.addEventListener('touchend', cancelLP);
    chip.addEventListener('touchmove', cancelLP);
    chip.addEventListener('mousedown', startLP);
    chip.addEventListener('mouseup', cancelLP);
    chip.addEventListener('mouseleave', cancelLP);
    bar.appendChild(chip);
  });
  const totalChip = document.createElement('div');
  totalChip.className = 'team-chip total' + (currentTeam === 'TOTAL' ? ' active' : '');
  totalChip.textContent = 'Total';
  totalChip.onclick = async () => {
    currentTeam = 'TOTAL';
    openIndex = null;
    for(const t of teams){ await ensureTeamCatLoaded(t.id, currentCat); }
    renderTeamBar(); renderTabs(); renderList();
  };
  bar.appendChild(totalChip);

  const editBtn = document.createElement('div');
  editBtn.className = 'team-edit-btn';
  editBtn.textContent = '✎';
  editBtn.onclick = openEditTeamsModal;
  bar.appendChild(editBtn);
}

/* ---- Rendering: Category tabs ---- */
function renderTabs(){

    tab.innerHTML = `${isSST ? '🦺 ' : ''}${escapeHtml(catLabel(cat))} ${countHtml}${redDot}`;

      currentCat = cat; openIndex = null;

function matchesSearch(name, query){
  if(!query) return true;
  // On découpe AUSSI la requête en mots : « extincteur 5 » trouve « Extincteur 5 »
  // (avant, une recherche à plusieurs mots ne retournait jamais rien).
  const mots = name.toLowerCase().split(/[\s\-/(),.]+/).filter(Boolean);
  const qMots = query.toLowerCase().split(/[\s\-/(),.]+/).filter(Boolean);
  if(!qMots.length) return true;
  return qMots.every(q => mots.some(m => m.startsWith(q)));
}

// Écran de sélection des machines pour l'équipe courante dans une select-cat
function renderMachineSelection(){
  const listEl = document.getElementById('list');
  listEl.innerHTML = '';
  const cat = currentCat;
  const items = itemsFor(cat).filter(it => !it.header && isSelectableItem(it));
  const v = (machineSel[currentTeam] && machineSel[currentTeam][cat]) || { set:false, actifs:[] };
  const dejaConfig = v.set;
  // pré-cocher : si déjà configuré, on garde les actifs ; sinon rien de coché
  const coche = new Set(v.actifs);

  const wrap = document.createElement('div');
  wrap.className = 'machine-select';
  wrap.innerHTML =
    '<div class="ms-title">🔧 ' + escapeHtml(catLabel(cat)) + ' — ' + escapeHtml(teamLabel(currentTeam)) + '</div>' +
    '<div class="ms-sub">Coche les ' + escapeHtml(catLabel(cat).toLowerCase()) + ' présents sur ton chantier. ' +
      'Les autres restent en réserve et pourront être ajoutés plus tard.</div>' +
    '<div class="ms-list">' +
      items.map(it => {
        const nom = (it.name||'').replace(/\n/g,' ');
        return '<label class="ms-item"><input type="checkbox" value="' + escapeAttr(nom) + '"' +
               (coche.has(nom) ? ' checked' : '') + '><span>' + escapeHtml(nom) + '</span></label>';
      }).join('') +
    '</div>' +
    '<div class="ms-actions">' +
      '<button type="button" class="ms-all">Tout cocher</button>' +
      '<button type="button" class="ms-none">Tout décocher</button>' +
      '<button type="button" class="ms-save">Enregistrer ma liste</button>' +
    '</div>';
  listEl.appendChild(wrap);

  const boxes = () => Array.from(wrap.querySelectorAll('input[type="checkbox"]'));
  wrap.querySelector('.ms-all').onclick = () => boxes().forEach(b => b.checked = true);
  wrap.querySelector('.ms-none').onclick = () => boxes().forEach(b => b.checked = false);
  wrap.querySelector('.ms-save').onclick = async () => {
    if(!confirmForeignEdit(0)) return;
    const actifs = boxes().filter(b => b.checked).map(b => b.value);
    if(!machineSel[currentTeam]) machineSel[currentTeam] = {};
    machineSel[currentTeam][cat] = { set:true, actifs };
    await saveMachineSel(currentTeam, cat);
    openIndex = null;
    renderTeamList();
    renderTabs();

function renderTeamList(){
  const listEl = document.getElementById('list');
  const query = document.getElementById('search').value.trim();
  listEl.innerHTML = '';

  // Catégories à sélection de machines (Lift/Fraco/Mixeur/Scie) :
  // si l'équipe n'a pas encore choisi ses machines -> écran de sélection.
  if(isSelectCat(currentCat)){
    const v = (machineSel[currentTeam] && machineSel[currentTeam][currentCat]) || { set:false, actifs:[] };
    if(!v.set){ renderMachineSelection(); return; }
  }

  if(!query){ const b = sstBannerHTML(); if(b){ const d = document.createElement('div'); d.innerHTML = b; listEl.appendChild(d); } }
  // Bouton "Gérer ma liste" en haut des catégories à sélection
  if(isSelectCat(currentCat) && !query){
    const bar = document.createElement('div');
    bar.className = 'manage-machines-bar';
    const v = machineSel[currentTeam][currentCat];
    bar.innerHTML = '<span>🔧 ' + v.actifs.length + ' machine' + (v.actifs.length>1?'s':'') + ' sur le chantier</span>' +
                    '<button type="button" id="manageMachinesBtn">Gérer ma liste</button>';
    listEl.appendChild(bar);
    bar.querySelector('#manageMachinesBtn').onclick = () => { renderMachineSelection(); };
  }

  const items = itemsFor(currentCat);
  ensureSectionsInit(currentCat, items);
  const st = (perTeamState[currentTeam] && perTeamState[currentTeam][currentCat]) || [];
  const baseLen = baseItemsFor(currentCat).length;
  let anyVisible = false;

  let curHeaderName = null, curCollapsed = false;
  orderedItemsWithPriority(items, st).forEach(({ it, i }) => {
    if(it.header){
      if(query){ curHeaderName = null; curCollapsed = false; return; }
      curHeaderName = (it.name||'').replace(/\n/g,' ');
      curCollapsed = isSectionCollapsed(currentCat, curHeaderName);
      // Compter les articles visibles de cette section (pour le badge)
      let count = 0;
      for(let j = i + 1; j < items.length; j++){
        const nx = items[j];
        if(nx.header) break;
        if(isItemHidden(currentCat, nx.name)) continue;
        if(isSelectCat(currentCat) && isSelectableItem(nx) &&
           !isMachineActive(currentTeam, currentCat, (nx.name||'').replace(/\n/g,' '))) continue;

      const label = document.createElement('div');
      label.className = 'section-label' + (curCollapsed ? ' collapsed' : '');

        '<span class="sec-count">' + count + '</span>';

      listEl.appendChild(label);

    // Si la sous-classe est repliée, on saute ses articles

    if(!matchesSearch(it.name, query)) return;
    // Articles supprimés par l'admin : masqués partout

    // Dans les catégories à sélection : masquer seulement les MACHINES non cochées.
