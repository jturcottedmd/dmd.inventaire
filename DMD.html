const TABS=[{id:'machines',label:'Machinerie & scies'},{id:'echafaudage',label:'Échafaudage'},{id:'madriers',label:'Madriers'}];
function renderTabs(){
  document.getElementById('tabs').innerHTML = TABS.map(t=>'<div class="tab'+(t.id===currentTab?' active':'')+'" data-tab="'+t.id+'">'+escapeHtml(t.label)+'</div>').join('');
  document.querySelectorAll('#tabs .tab').forEach(el=>el.onclick=()=>{ currentTab=el.getAttribute('data-tab'); renderTabs(); renderTab(); });
}
function renderTab(){
  if(currentTab==='machines') renderMachines();
  else renderGlobal(currentTab);
}

// ================== ONGLET MACHINES ==================
let weekCache={};   // unitKey -> {weekStart -> record}
function renderMachines(){
  const wrap=document.getElementById('wrap');
  if(curTeamSel==null) curTeamSel = myTeamId || (teams[0]&&teams[0].id);
  let html='';
  html+='<div class="teamsel"><label>Équipe</label><select id="teamSel">'+teams.map(t=>'<option value="'+escapeAttr(t.id)+'"'+(t.id===curTeamSel?' selected':'')+'>'+escapeHtml(t.label)+(t.id===myTeamId?' — mon équipe':'')+'</option>').join('')+'</select></div>';
  const canFill=canFillTeam(curTeamSel);
  if(!canFill) html+='<div class="ro-note">🔒 Lecture seule — tu peux remplir uniquement les inspections des machines de ton équipe'+(myTeamId?(' ('+escapeHtml(teamLabel(myTeamId))+')'):'')+'.</div>';
  const list=unitsForTeam(curTeamSel);
  if(!list.length){
    html+='<div class="empty">Aucune machine assignée à cette équipe dans l\'inventaire.<br>Les machines proviennent de la sélection par équipe de la tuile Inventaire (onglet Machinerie).</div>';
  } else {
    const byForm={};
    list.forEach(u=>{ (byForm[u.form]=byForm[u.form]||[]).push(u); });
    ['chariot','fraco','scie_gaz','scie_chaine'].forEach(fk=>{
      if(!byForm[fk]) return;
      html+='<div class="grp-title">'+escapeHtml(FORMS[fk].label)+'</div>';
      byForm[fk].forEach(u=>{ html+=unitCard(u); });
    });
  }
  wrap.innerHTML=html;
  document.getElementById('teamSel').onchange=e=>{ curTeamSel=e.target.value; renderMachines(); };
  wrap.querySelectorAll('[data-unit]').forEach(el=>el.onclick=()=>openWeek(el.getAttribute('data-unit')));
  // charge les enregistrements de la semaine courante pour colorer les pastilles
  loadWeekDotsFor(list);
}
function unitCard(u){
  const ws=isoDate(mondayOf(new Date())); const rec=(weekCache[u.unitKey]||{})[ws];
  const days=weekDays(ws); const today=todayISO();
  let dots='';
  days.forEach((d,i)=>{
    let cls='dot ';
    if(d>today) cls+='future';
    else{ const st=dayStatus(rec,d); cls+=st; }
    dots+='<div class="wd"><div class="d">'+DAYNAMES[i]+'</div><div class="'+cls+'"></div></div>';
  });
  return '<div class="card" data-unit="'+escapeAttr(u.unitKey)+'"><div class="card-top">'+(u.ident?'<span class="card-ident">'+escapeHtml(u.ident)+'</span>':'')+'<div><div class="card-nom">'+escapeHtml(u.name)+'</div><div class="card-form">'+escapeHtml(FORMS[u.form].label)+'</div></div></div><div class="weekdots">'+dots+'</div></div>';
}
function dayStatus(rec,d){
  if(!rec||!rec.days||!rec.days[d]) return '';   // vide
  const ans=rec.days[d].answers||{}; let filled=0,anom=0;
  for(const k in ans){ if(ans[k]){ filled++; if(ans[k]==='anomalie') anom++; } }
  if(!filled) return '';
  if(anom>0) return 'red';
  return 'green';
}
async function loadWeekDotsFor(list){
  const ws=isoDate(mondayOf(new Date()));
  const missing=list.filter(u=>!(weekCache[u.unitKey] && weekCache[u.unitKey][ws]!==undefined));
  if(!missing.length) return;
  const teamAtStart=curTeamSel;
  // Chargement en PARALLÈLE (une requête par unité, toutes en même temps) — fini le
  // chargement séquentiel qui faisait attendre les pastilles avec 10+ machines.
  await Promise.all(missing.map(async u=>{
    try{ const r=await storage.get('inv:insp:'+u.form+':'+u.unitKey+':'+ws);
      weekCache[u.unitKey]=weekCache[u.unitKey]||{};
      weekCache[u.unitKey][ws]= r&&r.value ? JSON.parse(r.value) : null;
    }catch(e){ weekCache[u.unitKey]=weekCache[u.unitKey]||{}; weekCache[u.unitKey][ws]=null; }
  }));
  if(currentTab==='machines' && curTeamSel===teamAtStart) renderMachines();
}

// ---- Grille hebdo d'une unité ----
let fillState=null;   // { u, weekStart, rec, selDay, answers }
async function openWeek(unitKey){
  const u=units.find(x=>x.unitKey===unitKey); if(!u) return;
  const weekStart=isoDate(mondayOf(new Date()));
  await loadWeek(u,weekStart, todayISO());
}
async function loadWeek(u, weekStart, selDay){
  const r=await storage.get('inv:insp:'+u.form+':'+u.unitKey+':'+weekStart);
  const rec = r&&r.value ? JSON.parse(r.value) : { form:u.form, unitKey:u.unitKey, teamId:u.teamId, name:u.name, ident:u.ident, weekStart, header:{}, days:{} };
  weekCache[u.unitKey]=weekCache[u.unitKey]||{}; weekCache[u.unitKey][weekStart]=rec;
  const today=todayISO();
  // jour sélectionné par défaut : aujourd'hui s'il est dans la semaine, sinon dernier jour <= aujourd'hui
  const days=weekDays(weekStart);
  if(!selDay || selDay>today) { selDay = days.filter(d=>d<=today).pop() || days[0]; }
  fillState={ u, weekStart, rec, selDay, answers:Object.assign({}, (rec.days[selDay]&&rec.days[selDay].answers)||{}) };
  renderWeekModal();
}
function renderWeekModal(){
  const {u,weekStart,rec,selDay}=fillState; const canFill=canFillTeam(u.teamId);
  const days=weekDays(weekStart); const today=todayISO();
  const thisMonday=isoDate(mondayOf(new Date()));
  let h='<h3>'+escapeHtml(u.name)+'</h3>';
  h+='<div class="m-meta">'+(u.ident?('<b>'+escapeHtml(u.ident)+'</b> · '):'')+escapeHtml(FORMS[u.form].label)+' · '+escapeHtml(teamLabel(u.teamId))+'</div>';
  // navigation semaine
  const canNext = weekStart < thisMonday;
  h+='<div class="wknav"><button id="wkPrev">‹</button><div class="lbl">Semaine du '+frDate(weekStart)+' au '+frDate(addDays(weekStart,6))+'</div><button id="wkNext"'+(canNext?'':' disabled')+'>›</button></div>';
  // en-tête (une fois par semaine)
  if((FORMS[u.form].header||[]).length){
    h+='<div style="display:flex;gap:8px;flex-wrap:wrap;">';
    // Le n° du véhicule et le n° de série sont déjà connus (catalogue) : on les propose
    // pré-remplis pour éviter de les retaper chaque semaine. Le champ reste modifiable.
    const idBrut = String(u.ident||'').replace(/\s*#\d+$/,'').trim();
    const defauts = { noVehicule: idBrut, noSerie: serieByIdent[idBrut] || '' };
    (FORMS[u.form].header||[]).forEach(f=>{
      const val = (rec.header && rec.header[f]) || defauts[f] || '';
      h+='<div style="flex:1;min-width:44%;"><div class="field-label">'+escapeHtml(HEADER_LABELS[f]||f)+'</div><input class="inp" data-hdr="'+f+'" value="'+escapeAttr(val)+'"'+(canFill?'':' disabled')+'></div>';
    });
    h+='</div>';
  }
  if(FORMS[u.form].note) h+='<div class="formnote">'+escapeHtml(FORMS[u.form].note)+'</div>';
  // sélecteur de jour
  h+='<div class="daychips">';
  days.forEach((d,i)=>{
    const fut=d>today; const sel=d===selDay;
    h+='<div class="daychip'+(sel?' sel':'')+(fut?' future':'')+'" data-day="'+d+'"><div class="dn">'+DAYNAMES[i]+'</div><div class="dd">'+d.slice(8)+'</div><div class="cdot '+(fut?'future':dayStatus(rec,d))+'"></div></div>';
  });
  h+='</div>';
  const future = selDay>today;
  if(future){ h+='<div class="ro-note">Ce jour n\'est pas encore arrivé — remplissage indisponible.</div>'; }
  // légende
  h+='<div style="font-size:11.5px;color:var(--paper-dim);margin:2px 0 4px;">Inspecteur : <b>'+escapeHtml(formatNom(myName()))+'</b> · Légende : OK · Anomalie (X) · N.A.</div>';
  // items
  h+='<div class="itbl'+((canFill&&!future)?'':' roflag')+'">';
  (FORMS[u.form].groups||[]).forEach((g,gi)=>{
    h+='<div class="igroup">'+escapeHtml(g.title)+'</div>';
    g.items.forEach((it,ii)=>{ h+=itemRow(u.form,'g'+gi+'_'+ii,it,fillState.answers['g'+gi+'_'+ii]); });
  });
  h+='</div>';
  h+='<div class="save-status" id="saveStatus"></div>';
  if(canFill&&!future) h+='<button class="btn primary" id="saveDay">💾 Enregistrer le '+DAYNAMES[days.indexOf(selDay)]+' '+frDate(selDay)+'</button>';
  h+='<button class="btn" id="closeM">Fermer</button>';
  const box=document.getElementById('modalBox'); box.innerHTML=h;
  document.getElementById('overlay').classList.add('show');
  document.getElementById('overlay').onclick=e=>{ if(e.target.id==='overlay'){ if(!confirmDiscard()) return; closeModal(); } };
  document.getElementById('closeM').onclick=()=>{ if(!confirmDiscard()) return; closeModal(); };
  document.getElementById('wkPrev').onclick=()=>{ if(!confirmDiscard()) return; loadWeek(u, addDays(weekStart,-7), null); };
  if(canNext) document.getElementById('wkNext').onclick=()=>{ if(!confirmDiscard()) return; loadWeek(u, addDays(weekStart,7), null); };
  box.querySelectorAll('.daychip').forEach(el=>el.onclick=()=>{ const d=el.getAttribute('data-day'); if(d>today) return; // futur bloqué
    if(d===fillState.selDay) return;
    if(!confirmDiscard()) return;                     // réponses cochées mais pas enregistrées -> on demande avant de les perdre
    fillState.selDay=d; fillState.answers=Object.assign({},(rec.days[d]&&rec.days[d].answers)||{}); renderWeekModal(); });
  if(canFill&&!future){
    box.querySelectorAll('.st').forEach(b=>b.onclick=()=>{ const k=b.getAttribute('data-k'); const v=b.getAttribute('data-v'); fillState.answers[k]=(fillState.answers[k]===v?'':v); paintItem(k); });
    const sd=document.getElementById('saveDay'); if(sd) sd.onclick=saveDay;
  }
}
// Des réponses ont-elles été cochées sans être enregistrées ? (comparaison avec la version sauvegardée du jour)
function hasUnsaved(){
  if(!fillState) return false;
  const saved=(fillState.rec.days[fillState.selDay]&&fillState.rec.days[fillState.selDay].answers)||{};
  const cur=fillState.answers||{};
  const keys=new Set(Object.keys(saved).concat(Object.keys(cur)));
  for(const k of keys){ if((saved[k]||'')!==(cur[k]||'')) return true; }
  return false;
}
function confirmDiscard(){
  if(!hasUnsaved()) return true;
  return confirm('Des réponses cochées ne sont pas enregistrées.\n\nQuitter sans enregistrer ? (OK = abandonner, Annuler = rester)');
}
function itemRow(form,key,label,val){
  const opts=statusOptions(form);
  let btns=opts.map(o=>'<div class="st '+o[0]+(val===o[0]?' on':'')+'" data-k="'+key+'" data-v="'+o[0]+'">'+escapeHtml(o[1])+'</div>').join('');
  return '<div class="irow" data-row="'+key+'"><div class="it-lbl">'+escapeHtml(label)+'</div><div class="st-btns">'+btns+'</div></div>';
}
function paintItem(key){
  const row=document.querySelector('.irow[data-row="'+key+'"]'); if(!row) return;
  row.querySelectorAll('.st').forEach(b=>b.classList.toggle('on', b.getAttribute('data-v')===fillState.answers[key]));

async function saveDay(){
  const {u,weekStart,selDay}=fillState;

  // FUSION : on relit l'enregistrement serveur juste avant d'écrire et on n'y remplace
  // QUE le jour sauvegardé (+ l'en-tête). Deux inspecteurs sur la même machine la même
  // semaine ne s'effacent plus mutuellement (ex. le lundi de l'un écrasé par le mardi de l'autre).
  const storeKey='inv:insp:'+u.form+':'+u.unitKey+':'+weekStart;
  let rec=null;

  if(!rec) rec={ form:u.form, unitKey:u.unitKey, teamId:u.teamId, name:u.name, ident:u.ident, weekStart, header:{}, days:{} };

let globalCache={};
async function renderGlobal(form){
  const wrap=document.getElementById('wrap'); const f=FORMS[form];
  wrap.innerHTML='<button class="btn brick" id="newInsp">＋ Nouvelle inspection — '+escapeHtml(f.label)+'</button><div class="empty">Chargement de l\'historique…</div>';

function inspHasAnomalie(x){ const a=x.answers||{}; for(const k in a){ if(a[k]==='anomalie') return true; } return false; }
function openGlobalForm(form, existing){

      if(g.qty){ h+='<div class="qtyrow"><div class="qf"><div class="field-label">Attendu</div><input class="inp" data-qa="'+key+'" inputmode="numeric" value="'+escapeAttr((qty[key]&&qty[key].a)||'')+'"'+(ro?' disabled':'')+'></div><div class="qf"><div class="field-label">Réel</div><input class="inp" data-qr="'+key+'" inputmode="numeric" value="'+escapeAttr((qty[key]&&qty[key].r)||'')+'"'+(ro?' disabled':'')+'></div></div>'; }
      const opts=statusOptions(form);

  if(ro && isAdmin) h+='<button class="btn danger" id="gDel">🗑️ Supprimer cette inspection</button>';
  h+='<button class="btn" id="closeM">Fermer</button>';
  const box=document.getElementById('modalBox'); box.innerHTML=h;
  document.getElementById('overlay').classList.add('show');

    box.querySelectorAll('.st').forEach(b=>b.onclick=()=>{ const k=b.getAttribute('data-k'),v=b.getAttribute('data-v'); st.answers[k]=(st.answers[k]===v?'':v); const row=box.querySelector('.irow[data-row="'+k+'"]'); row.querySelectorAll('.st').forEach(x=>x.classList.toggle('on',x.getAttribute('data-v')===st.answers[k])); });

  if(ro && isAdmin){ document.getElementById('gDel').onclick=async()=>{ if(!confirm('Supprimer cette inspection ?')) return; await storage.del(existing._key); closeModal(); renderGlobal(form); }; }

async function saveGlobal(st){

// ================== EXPORT EXCEL (Ctrl+X, admin) ==================
let _xlsxLoading=null;
function ensureXLSX(){ if(window.XLSX) return Promise.resolve(); if(_xlsxLoading) return _xlsxLoading; _xlsxLoading=new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js'; s.onload=()=>res(); s.onerror=()=>{ _xlsxLoading=null; rej(new Error('xlsx')); }; document.head.appendChild(s); }); return _xlsxLoading; }
async function exporterExcel(){
  const btn=document.getElementById('exportBtn'); const old=btn?btn.textContent:'';
  if(btn){ btn.textContent='...'; btn.disabled=true; }
  try{
    try{ await ensureXLSX(); }catch(e){ alert('Module Excel indisponible.'); return; }
    const rows=await storage.like('inv:insp:');
    if(!rows.length){ alert('Aucune inspection à exporter.'); return; }
    const aoa=[['Fiche','Machine/Ident','Équipe','Date','Élément','Statut','Inspecteur','Commentaire']];
    rows.forEach(r=>{
      let v; try{ v=JSON.parse(r.value); }catch(e){ return; }
      const form=(r.key.split(':')[2])||''; const flabel=(FORMS[form]&&FORMS[form].label)||form;
      const items=itemsFlat(form);
      if(v.days){ // hebdo machine
        Object.keys(v.days).sort().forEach(d=>{ const dd=v.days[d]; const ans=dd.answers||{};
          items.forEach(it=>{ if(ans[it.key]) aoa.push([flabel, (v.ident?v.ident+' ':'')+(v.name||''), teamLabel(v.teamId), d, it.label, statLabel(form,ans[it.key]), formatNom(dd.inspecteur||''), '']); });
        });
      } else { // global
        const ans=v.answers||{};
        items.forEach(it=>{ if(ans[it.key]) aoa.push([flabel, (v.header&&(v.header.chantier||v.header.lieu||v.header.emplacement))||'', teamLabel(v.teamId||''), v.date||'', it.label, statLabel(form,ans[it.key]), formatNom(v.inspecteur||''), v.commentaires||'']); });
      }
    });
    const ws=XLSX.utils.aoa_to_sheet(aoa); ws['!cols']=[{wch:26},{wch:22},{wch:16},{wch:12},{wch:52},{wch:14},{wch:20},{wch:30}];
    const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Inspections');
    const d=new Date(); XLSX.writeFile(wb,'Inspections_DMD_'+d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'.xlsx');
    if(btn) btn.style.display='none';
  }catch(e){ console.error(e); alert('Erreur pendant l\'export.'); }
  finally{ if(btn){ btn.textContent=old||'⬇ Excel'; btn.disabled=false; } }
}
function statLabel(form,v){ const o=statusOptions(form).find(x=>x[0]===v); return o?o[1]:v; }
document.getElementById('exportBtn').addEventListener('click',exporterExcel);
document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&!e.altKey&&(e.key==='x'||e.key==='X')){

// ================== EXPORT GLOBAL (accueil) ==================
// Fournit UNE page Excel pour cette tuile. index.html charge la page dans un cadre
// masqué avec ?dmdexport=1 puis appelle cette fonction : elle charge elle-même ses
// données (aucune dépendance à l'affichage) et renvoie la feuille prête à écrire.
async function _dmdAllRows(prefix){
  const out=[]; let from=0;
  for(;;){
    let d=[];
    try{ const r=await withTimeout(_sb.from('inv_store').select('key,value').like('key',prefix+'%').order('key').range(from,from+999),20000,'page'); d=(r&&Array.isArray(r.data))?r.data:[]; }catch(e){ break; }
    out.push.apply(out,d);
    if(d.length<1000) break;
    from+=1000; if(from>200000) break;
  }
  return out;
}
window.__dmdFlatSheet = async function(){
  await loadTeams();
  const rows = await _dmdAllRows('inv:insp:');
  const H = ['Date','Fiche','Ident','Machine / lieu','Équipe','Inspecteur','Éléments remplis','OK','Anomalies','N.A.','Détail des anomalies','Commentaires'];
  const aoa=[H], meta=[{header:true}], lignes=[];
  function compile(form, ans){
    const items = FORMS[form] ? itemsFlat(form) : [];
    const lab={}; items.forEach(it=>{ lab[it.key]=it.label; });
    let ok=0, an=0, na=0; const detail=[];
    Object.keys(ans||{}).forEach(k=>{
      const v=ans[k]; if(!v) return;
      if(v==='anomalie'){ an++; detail.push(lab[k]||k); }
      else if(v==='na'){ na++; }
      else { ok++; }
    });
    return { ok, an, na, total:ok+an+na, detail:detail.join(' · ') };
  }
  rows.forEach(r=>{
    let v; try{ v=JSON.parse(r.value); }catch(e){ return; }
    if(!v) return;
    const form=(String(r.key).split(':')[2])||'';
    const flabel=(FORMS[form]&&FORMS[form].label)||form;
    if(v.days){
      Object.keys(v.days).forEach(d=>{
        const dd=v.days[d]||{}; const c=compile(form, dd.answers);
        if(!c.total) return;
        lignes.push({ d:d, an:c.an, row:[ d, flabel, v.ident||'', v.name||'', teamLabel(v.teamId||''), formatNom(dd.inspecteur||''), c.total, c.ok, c.an, c.na, c.detail, '' ] });
      });
    } else {
      const c=compile(form, v.answers);
      const lieu=(v.header&&(v.header.chantier||v.header.lieu||v.header.emplacement))||'';
      const d=v.date||String(v.ts||'').slice(0,10);
      lignes.push({ d:d, an:c.an, row:[ d, flabel, '', lieu, teamLabel(v.teamId||''), formatNom(v.inspecteur||''), c.total, c.ok, c.an, c.na, c.detail, v.commentaires||'' ] });
    }
  });
  lignes.sort((a,b)=> String(b.d).localeCompare(String(a.d)));
  lignes.forEach(l=>{ aoa.push(l.row); meta.push({ couleur: l.an>0 ? 'red' : 'green' }); });
  if(!lignes.length){ aoa.push(['—','Aucune inspection enregistrée','','','','','','','','','','']); meta.push({}); }
  return { name:'Inspections', aoa:aoa, meta:meta, widths:[12,26,10,28,14,22,10,7,11,7,60,34], leftCols:[1,3,5,10,11] };
};

/* ==== DMD : Entree = champ suivant + correction auto du champ ==== */
(function(){
  if (window.__dmdEnterNext) return; window.__dmdEnterNext = true;
  var NAV_SCOPE='.modal, #modalBox, .card, form, .panel, .sheet, .edit-form';
  var SKIP={button:1,submit:1,reset:1,checkbox:1,radio:1,file:1,range:1,color:1,hidden:1,image:1};
  function navigable(el){ if(!el||el.tagName!=='INPUT') return false; var ty=(el.getAttribute('type')||'text').toLowerCase(); return !SKIP[ty]; }
  function visibleField(el){ if(el.disabled||el.readOnly) return false; var ty=(el.getAttribute('type')||'text').toLowerCase(); if(ty==='hidden'||ty==='file') return false; return el.offsetParent!==null; }
  document.addEventListener('keydown',function(e){
    if(e.key!=='Enter'||e.shiftKey||e.altKey||e.ctrlKey||e.metaKey) return;
    if(e.defaultPrevented) return;
    var t=e.target; if(!navigable(t)) return;
    var scope=t.closest(NAV_SCOPE); if(!scope) return;
    var fields=[].slice.call(scope.querySelectorAll('input, select, textarea')).filter(visibleField);
    var i=fields.indexOf(t); if(i<0) return;
    e.preventDefault();
    if(i<fields.length-1){ var nx=fields[i+1]; nx.focus(); if(nx.select){ try{nx.select();}catch(_){} } } else { t.blur(); }
  });
})();

// ================== FORMATIONS (synchro avec la tuile Formations) ==================
// La tuile Formations écrit le plan dans inv:formationsPlan ; on le LIT ici -> synchro
// automatique dès qu'un admin ajoute/modifie une formation. Aucune écriture croisée.
let formationsPlan = [];   // [{id,type,lieu,debut,fin,notes,employes:[]}]
async function loadFormationsPlan(){
  try{ const r=await storage.get('inv:formationsPlan'); if(r&&r.value){ const p=JSON.parse(r.value); formationsPlan=(p&&Array.isArray(p.items))?p.items:[]; } else formationsPlan=[]; }catch(e){ formationsPlan=[]; }
}
function normNom(s){ return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim(); }
function nomsProches(n1,n2){ const w1=normNom(n1).split(' ').filter(Boolean), w2=normNom(n2).split(' ').filter(Boolean); if(!w1.length||!w2.length) return false; const common=w1.filter(w=>w2.includes(w)); return common.length>=Math.min(2,Math.min(w1.length,w2.length)); }
function userInFormation(it){ const me=myName(); return (it.employes||[]).some(n => normNom(n)===normNom(me) || nomsProches(n,me)); }
function dateStr(d){ const z=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); }
function frDate(ds){ if(!ds) return '—'; const p=String(ds).split('-'); if(p.length<3) return ds; return parseInt(p[2],10)+' '+(MOIS[parseInt(p[1],10)-1]||'')+' '+p[0]; }
// Formations de CET utilisateur actives à la date ds (AAAA-MM-JJ)
function myFormationsOn(ds){ return formationsPlan.filter(it => userInFormation(it) && (it.debut||'') <= ds && ds <= (it.fin || it.debut || '')); }
function formationDetail(it){ const bits=[]; bits.push('🎓 '+(it.type||'Formation')); if(it.lieu) bits.push('📍 '+it.lieu); bits.push('🗓️ '+frDate(it.debut)+((it.fin&&it.fin!==it.debut)?(' → '+frDate(it.fin)):'')); if(it.notes) bits.push('📝 '+it.notes); return bits.join('\n'); }
function formationLine(s){ const bits=[]; if(s.formationLieu) bits.push('📍 '+s.formationLieu); if(s.formationDebut) bits.push('🗓️ '+frDate(s.formationDebut)+((s.formationFin&&s.formationFin!==s.formationDebut)?(' → '+frDate(s.formationFin)):'')); if(s.formationNotes) bits.push('📝 '+s.formationNotes); return bits.join(' · '); }

// ================== SEMAINE (dimanche → samedi) ==================
function startOfWeek(d, offset){
  const x = new Date(d); x.setHours(0,0,0,0);
  x.setDate(x.getDate() - x.getDay() + (offset||0)*7);   // getDay(): 0 = dimanche
  return x;
}
function fmtH(h){ if(!h || h<0) h=0; const m=Math.round(h*60); return Math.floor(m/60)+' h '+String(m%60).padStart(2,'0'); }
function segHours(s, nowMs){
  const st=new Date(s.start).getTime(); if(isNaN(st)) return 0;
  const en = s.end ? new Date(s.end).getTime() : (nowMs||Date.now());
  return Math.max(0, (en-st)/3600000);
}
function timeHM(iso){ const d=new Date(iso); if(isNaN(d)) return '—'; return String(d.getHours()).padStart(2,'0')+'h'+String(d.getMinutes()).padStart(2,'0'); }
const JOURS = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const MOIS = ['janv.','févr.','mars','avr.','mai','juin','juill.','août','sept.','oct.','nov.','déc.'];
function dLabel(d){ return JOURS[d.getDay()]+' '+d.getDate()+' '+MOIS[d.getMonth()]; }

// ================== AFFICHAGE ==================
function assignText(s){
  const t = PUNCH_TYPES[s.type] || { label:s.type||'—', icon:'⏱' };
  if(s.type==='chantier'){
    let txt = (s.teamLabel||'Chantier');
    const bits=[]; if(s.projet) bits.push('Projet '+s.projet); if(s.adresse) bits.push(formatAdresse(s.adresse));
    if(bits.length) txt += ' — '+bits.join(' — ');
    const sec = secteurById(s.secteur); if(sec) txt += ' · '+sec.label;
    return txt;
  }
  if(s.type==='formation'){ let x='Formation'; if(s.formationType) x+=' — '+s.formationType; if(s.formationLieu) x+=' ('+s.formationLieu+')'; return x; }
  return t.label;
}

function updateTimers(){
  const now = Date.now();
  const open = openSegment();
  const tEl = document.getElementById('pcTimer');
  if(open && tEl) tEl.textContent = fmtH(segHours(open, now));
  // totaux jour + semaine courante réelle (offset 0), en incluant le segment ouvert
  const wkStart = startOfWeek(new Date(), 0).getTime();
  const wkEnd = wkStart + 7*86400000;
  const today = new Date(); today.setHours(0,0,0,0);
  const todayMs = today.getTime(), tomMs = todayMs + 86400000;
  let dayT=0, weekT=0;
  // Heures découpées par fenêtre (jour / semaine) : un punch qui chevauche minuit compte
  // ses heures d'après-minuit dans « Aujourd'hui » au lieu d'afficher 0 h.
  function segHoursIn(s, winStart, winEnd){
    const st = new Date(s.start).getTime(); if(isNaN(st)) return 0;
    const en = s.end ? new Date(s.end).getTime() : now;
    if(isNaN(en)) return 0;
    const a = Math.max(st, winStart), b = Math.min(en, winEnd);
    return b>a ? (b-a)/3600000 : 0;
  }
  mySegments.forEach(s => {
    weekT += segHoursIn(s, wkStart, wkEnd);
    dayT  += segHoursIn(s, todayMs, tomMs);
  });
  const dEl=document.getElementById('todayTot'), wEl=document.getElementById('weekTot');
  if(dEl) dEl.textContent = fmtH(dayT);
  if(wEl) wEl.textContent = fmtH(weekT);
}
function renderWeek(){
  const wkStart = startOfWeek(new Date(), weekOffset);
  const wkStartMs = wkStart.getTime(), wkEndMs = wkStartMs + 7*86400000;
  const end = new Date(wkStartMs + 6*86400000);
  document.getElementById('wLabel').textContent = wkStart.getDate()+' '+MOIS[wkStart.getMonth()]+' – '+end.getDate()+' '+MOIS[end.getMonth()];
  const list = document.getElementById('weekList');
  const now = Date.now();
  // regroupe par jour
  const byDay = {};
  mySegments.forEach(s => {
    const st = new Date(s.start).getTime(); if(isNaN(st) || st<wkStartMs || st>=wkEndMs) return;
    const dk = new Date(st); dk.setHours(0,0,0,0);
    (byDay[dk.getTime()] = byDay[dk.getTime()] || []).push(s);
  });
  let html='', weekT=0;
  for(let i=0;i<7;i++){
    const dayMs = wkStartMs + i*86400000;
    const segs = (byDay[dayMs]||[]).sort((a,b)=>String(a.start).localeCompare(String(b.start)));
    if(!segs.length) continue;
    let dayT=0;
    const rows = segs.map(s => {
      const h = segHours(s, now); dayT+=h; weekT+=h;
      const ic = (PUNCH_TYPES[s.type]||{}).icon || '⏱';
      const openCls = s.end ? '' : ' open';
      const timeTxt = timeHM(s.start)+' → '+(s.end?timeHM(s.end):'<span style="color:#a9d39a;">en cours</span>');
      return '<div class="seg'+openCls+'" data-seg="'+escapeAttr(s._key)+'">' +
        '<span class="seg-ic">'+ic+'</span>' +
        '<div class="seg-mid"><div class="seg-lbl">'+escapeHtml(assignText(s))+(s.outsideConfirmed?'<span class="badge-out">hors rayon</span>':'')+'</div>' +
        '<div class="seg-time">'+timeTxt+'</div></div>' +
        '<div class="seg-h">'+(s.end?fmtH(h):'…')+'</div>' +
      '</div>';
    }).join('');
    html += '<div class="day"><div class="day-head"><div class="day-name">'+dLabel(new Date(dayMs))+'</div><div class="day-tot">'+fmtH(dayT)+'</div></div>'+rows+'</div>';
  }
  list.innerHTML = html || '<div class="empty">Aucune heure cette semaine.</div>';
  list.querySelectorAll('[data-seg]').forEach(r => r.onclick = () => openSegEditor(r.getAttribute('data-seg')));
}

// ================== BANQUE DE TEMPS (onglet « Mes heures en banque ») ==================
// Chantier -> secteur de son équipe (résidentiel, rés. lourd, commercial, génie civil).
// Tout le reste (hors CCQ, formation, entrepôt, transport, gestion, transport équipe) -> Hors CCQ.
function bucketOf(s){
  if(s.type==='chantier'){ const sec=secteurById(s.secteur); if(sec && sec.id!=='hors_ccq') return { id:sec.id, label:sec.label, icon:sec.icon }; }
  const h=secteurById('hors_ccq'); return { id:'hors_ccq', label:h.label, icon:h.icon };
}
function sumBank(){
  const now=Date.now(); const map={}; let total=0;
  mySegments.forEach(s => { if(!s.end) return; const b=bucketOf(s); const hh=segHours(s,now); if(!map[b.id]) map[b.id]={label:b.label,icon:b.icon,h:0}; map[b.id].h+=hh; total+=hh; });
  return { map, total };
}
function renderBanque(){
  const el = document.getElementById('paneBanque'); if(!el) return;
  const res = sumBank();
  const order = SECTEURS.map(s=>s.id);

    '<div class="bq-statut"><span>👷 Statut : <b>'+(myStatut?escapeHtml(myStatut):'<span style="color:var(--safety-yellow);">non défini</span>')+'</b></span>' +

    : '<div class="empty" style="padding:14px;">Aucune heure en banque.</div>';

  el.innerHTML = statLine + '<div class="bq-block"><div class="bq-head">Heures accumulées par secteur</div>'+rows+'</div>';

// ================== PUNCH ==================
let _pendingLoc=null, _pendingInRadius=null, _pendingOutside=false;

async function startPunch(){
  if(openSegment()){ alert('Tu es déjà punché. Dépunche d\'abord.'); return; }
  const btn=document.getElementById('btnPunch'); if(btn) btn.disabled=true;
  try{
    let choice = null;
    const last = lastAssignment();
    if(last){
      const lbl = (PUNCH_TYPES[last.type]||{}).icon+' '+assignText({type:last.type, teamLabel:last.teamLabel, projet:last.projet, adresse:last.adresse});
      if(confirm('Es-tu sur la même affectation qu\'à ton dernier punch ?\n\n'+lbl+'\n\nOK = garder  ·  Annuler = changer')){
        choice = { type:last.type, teamId:last.teamId };
      }
    }
    if(!choice){ choice = await chooseAssignment(); }
    if(!choice){ return; }
    _pendingLoc=null; _pendingInRadius=null; _pendingOutside=false;
    // Avertissement stylisé (look S.S.T.) : une formation est prévue aujourd'hui.
    // S'affiche pour TOUT type de punch, sauf si l'employé punche justement sa formation.
    // L'employé peut tout de même continuer.
    if(choice.type!=='formation'){
      const ft = myFormationsOn(dateStr(new Date()));
      if(ft.length){
        const surChantier = (choice.type==='chantier');
        const proceed = await sstConfirm({
          icon:'📚',
          title:'Formation prévue aujourd\'hui',
          sub:'D\'après le plan, tu as une formation aujourd\'hui'+(surChantier?'. Tu peux tout de même puncher sur le chantier.':'. Tu peux tout de même puncher.'),
          detail:formationDetail(ft[0]),
          okLabel:surChantier?'🏗 Puncher quand même sur le chantier':'Puncher quand même',
          cancelLabel:'Annuler'
        });
        if(!proceed) return;
      }
    }
    if(choice.type==='chantier'){
      const g = await checkChantierGeo(choice.teamId, 'in');
      if(!g) return;
      _pendingLoc=g.loc; _pendingInRadius=g.inRadius; _pendingOutside=g.outside;
    }
    let formInfo = null;
    if(choice.type==='formation'){ const fs = myFormationsOn(dateStr(new Date())); if(fs.length) formInfo = fs[0]; }
    await createSegment(choice.type, choice.type==='chantier'?choice.teamId:'', formInfo);
  } finally { const b=document.getElementById('btnPunch'); if(b) b.disabled=false; }
}

// Vérifie la présence au chantier (rayon 250 m), au PUNCH ('in') comme au DÉPUNCH ('out').
// Retourne { loc, inRadius, outside } si on peut continuer, ou null si annulé.
async function checkChantierGeo(teamId, mode){
  const verbe = (mode==='out') ? 'Dépuncher' : 'Puncher';
  if(!geolocConsent()){
    const okC = confirm('📍 Pointage de chantier\n\nTa position est utilisée UNIQUEMENT à ce moment, pour confirmer ta présence au chantier (aucun suivi en continu). Activer la localisation ?');
    if(!okC){
      if(!confirm('Sans localisation, la présence ne peut pas être vérifiée.\n'+verbe+' quand même ?')) return null;
      return { loc:null, inRadius:null, outside:true };
    }
    setGeolocConsent(true);
  }
  const pos = await getPosition();
  const site = sites[teamId];
  if(!pos){
    if(!confirm('Position indisponible (GPS refusé ou hors service).\n'+verbe+' quand même sans vérification ?')) return null;
    return { loc:null, inRadius:null, outside:true };
  }
  if(!site || site.lat==null){
    if(mode==='in'){
      // Premier punch = TA position devient le point de référence du chantier pour toute
      // l'équipe. On demande confirmation pour éviter qu'un punch fait de la maison
      // enregistre une mauvaise position (tous les collègues seraient ensuite « hors rayon »).
      if(!confirm('📍 Premier punch de ce chantier.\n\nTa position ACTUELLE deviendra le point de référence (rayon '+RADIUS_M+' m) pour toute l\'équipe.\n\nEs-tu bien SUR le chantier en ce moment ?')){
        return { loc:pos, inRadius:null, outside:true };   // punch permis, mais sans définir le point
      }
      await saveSite(teamId, pos);
      alert('📍 Position du chantier enregistrée (premier punch). Les prochains punchs seront comparés à ce point.');
      return { loc:pos, inRadius:true, outside:false };
    }
    // Dépunch sans position de référence connue : on ne peut pas vérifier.
    return { loc:pos, inRadius:null, outside:true };
  }
  const d = haversine(pos.lat, pos.lng, site.lat, site.lng);
  if(mode==='in' && isDeviceAdmin()){
    if(confirm('Mode admin — tu es à ~'+Math.round(d)+' m du point actuel du chantier.\n\nRelocaliser le point du chantier à ta position actuelle ?')){
      await saveSite(teamId, pos); return { loc:pos, inRadius:true, outside:false };
    }
  }
  if(d <= RADIUS_M){ return { loc:pos, inRadius:true, outside:false }; }
  if(confirm('Tu es à ~'+Math.round(d)+' m du chantier (hors du rayon de '+RADIUS_M+' m).\n\n'+verbe+' quand même ?')){ return { loc:pos, inRadius:false, outside:true }; }
  return null;
}

async function createSegment(type, teamId, formInfo){
  const now = new Date().toISOString();
  const t = teamId ? teams.find(x=>x.id===teamId) : null;
  const info = teamId ? (teamInfo[teamId]||{}) : {};
  const seg = {
    id:uid(), deviceId:getDeviceId(), nom:myName(), type,
    teamId:teamId||'', teamLabel:t?t.label:'', projet:info.projet||'', adresse:info.adresse||'',
    start:now, end:null,
    startLoc:_pendingLoc||null, startInRadius:_pendingInRadius, outsideConfirmed:!!_pendingOutside, hours:0
  };
  if(type==='formation' && formInfo){
    seg.formationId=formInfo.id||''; seg.formationType=formInfo.type||''; seg.formationLieu=formInfo.lieu||'';
    seg.formationNotes=formInfo.notes||''; seg.formationDebut=formInfo.debut||''; seg.formationFin=formInfo.fin||'';
  }
  if(type==='chantier'){ seg.secteur = teamSecteur[teamId]||''; }   // secteur hérité de l'équipe/chantier
  seg.statut = myStatut||'';                                          // statut réglé par l'admin
  const key = 'punch:'+getDeviceId()+':'+now+'_'+seg.id;
  const rec = Object.assign({}, seg);
  const res = await storage.set(key, JSON.stringify(rec));
  if(!res){ alert('Enregistrement impossible. Vérifie ta connexion et réessaie.'); return; }
  seg._key = key; mySegments.push(seg);
  renderAll();
}

async function doPunchOut(){
  const open = openSegment(); if(!open) return;
  const btn=document.getElementById('btnPunch'); if(btn) btn.disabled=true;
  try{
    let endLoc=null, endInRadius=null, endOutside=false;
    if(open.type==='chantier'){
      // Le dépunch d'un chantier exige aussi d'être dans le rayon de 250 m.
      const g = await checkChantierGeo(open.teamId, 'out');
      if(!g) return;   // annulé (hors rayon non confirmé, GPS refusé, etc.)
      endLoc=g.loc; endInRadius=g.inRadius; endOutside=g.outside;
    } else {
      if(!confirm('Dépuncher ta journée maintenant ?')) return;
    }
    open.end = new Date().toISOString();
    open.hours = segHours(open, Date.now());
    open.endLoc=endLoc; open.endInRadius=endInRadius; open.endOutsideConfirmed=endOutside;
    const rec = Object.assign({}, open); delete rec._key;
    const res = await storage.set(open._key, JSON.stringify(rec));
    if(!res){ open.end=null; open.hours=0; open.endLoc=null; alert('Enregistrement impossible. Réessaie.'); return; }
    renderAll();
    // Rappel : une formation est prévue demain pour cet utilisateur ?

// ================== CORRECTION / SUPPRESSION D'UN SEGMENT ==================
function toLocalInput(iso){ if(!iso) return ''; const d=new Date(iso); if(isNaN(d)) return ''; const z=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+'T'+z(d.getHours())+':'+z(d.getMinutes()); }
function fromLocalInput(v){ if(!v) return null; const d=new Date(v); return isNaN(d)?null:d.toISOString(); }
function openSegEditor(key){
  const s = mySegments.find(x=>x._key===key); if(!s) return;
  const box = document.getElementById('modalBox');
  box.innerHTML =
    '<h3>Corriger le punch</h3>' +
    '<div class="pc-assign" style="text-align:left;margin:0 0 6px;">'+((PUNCH_TYPES[s.type]||{}).icon||'⏱')+' '+escapeHtml(assignText(s))+'</div>' +
    '<div class="field-label">Début</div><input class="inp" type="datetime-local" id="edStart" value="'+escapeAttr(toLocalInput(s.start))+'">' +
    '<div class="field-label">Fin</div><input class="inp" type="datetime-local" id="edEnd" value="'+escapeAttr(toLocalInput(s.end))+'">' +
    '<div class="hint" style="margin-top:6px;">Laisse la fin vide pour un punch encore en cours.</div>' +
    '<button class="btn primary" id="edSave">Enregistrer</button>' +
    '<button class="btn danger" id="edDel">Supprimer ce punch</button>' +
    '<button class="btn" id="edCancel">Annuler</button>';
  document.getElementById('overlay').classList.add('show');
  document.getElementById('overlay').onclick = (e)=>{ if(e.target.id==='overlay') closeModal(); };
  document.getElementById('edCancel').onclick = closeModal;
  document.getElementById('edSave').onclick = async () => {
    const st = fromLocalInput(document.getElementById('edStart').value);
    const en = fromLocalInput(document.getElementById('edEnd').value);
    if(!st){ alert('Le début est requis.'); return; }
    if(en && new Date(en) < new Date(st)){ alert('La fin doit être après le début.'); return; }
    s.start = st; s.end = en; s.hours = en ? segHours(s, Date.now()) : 0;
    const rec = Object.assign({}, s); delete rec._key;
    const res = await storage.set(s._key, JSON.stringify(rec));
    if(!res){ alert('Enregistrement impossible.'); return; }
    closeModal(); renderAll();
  };
  document.getElementById('edDel').onclick = async () => {
    if(!confirm('Supprimer définitivement ce punch ?')) return;
    await storage.del(s._key);
    mySegments = mySegments.filter(x=>x._key!==s._key);
    closeModal(); renderAll();
  };
}

let _xlsxLoading=null;
function ensureXLSX(){
  if(window.XLSX) return Promise.resolve();

async function exportAdminExcel(){

    const bk = bucketOf(s).label;
    if(s.end){ const key=(formatNom(s.nom)||'—')+'||'+bk; bank[key]=(bank[key]||0)+h; }
    const d=new Date(s.start);
    aoa.push([ formatNom(s.nom)||'—', s.statut||'', isNaN(d)?'':d.toLocaleDateString('fr-CA'), (PUNCH_TYPES[s.type]||{}).label||s.type,
      s.type==='chantier'?[s.teamLabel, s.projet?('Projet '+s.projet):'', formatAdresse(s.adresse)].filter(Boolean).join(' — '):(s.type==='formation'?[s.formationType, s.formationLieu].filter(Boolean).join(' — '):''),

  });

  XLSX.utils.book_append_sheet(wb, ws2, 'Résumé');

  const aoa3=[['Employé','Secteur','Heures']];
  Object.keys(bank).sort((a,b)=>a.localeCompare(b,'fr')).forEach(k => { const p=k.split('||'); aoa3.push([p[0], p[1], Number(bank[k].toFixed(2))]); });
  const ws3 = XLSX.utils.aoa_to_sheet(aoa3); ws3['!cols']=[{wch:24},{wch:20},{wch:10}];
  XLSX.utils.book_append_sheet(wb, ws3, 'Banque par secteur');
  XLSX.writeFile(wb, 'Heures_DMD_'+wkS.getFullYear()+'-'+String(wkS.getMonth()+1).padStart(2,'0')+'-'+String(wkS.getDate()).padStart(2,'0')+'.xlsx');
}

// ================== EXPORT GLOBAL (accueil) ==================
// Fournit UNE page Excel pour cette tuile : une ligne par segment de pointage,
// TOUT l'historique et TOUS les employés (l'export de la tuile, lui, ne couvre
// que la semaine affichée). Les heures sont recalculées depuis start/end.
window.__dmdFlatSheet = async function(){
  async function allRows(prefix){
    const out=[]; let from=0;
    for(;;){
      let d=[];
      try{ const r=await withTimeout(_sb.from('inv_store').select('key,value').like('key',prefix+'%').order('key').range(from,from+999),20000,'page'); d=(r&&Array.isArray(r.data))?r.data:[]; }catch(e){ break; }
      out.push.apply(out,d);
      if(d.length<1000) break;
      from+=1000; if(from>200000) break;
    }
    return out;
  }
  await loadTeams();
  await Promise.all([ loadTeamInfos(), loadTeamSecteurs() ]);
  const tLabel={}; (teams||[]).forEach(t=>{ tLabel[t.id]=t.label; });
  const statutRows = await allRows('punch_statut:');
  const statutNow={};
  statutRows.forEach(r=>{ try{ const v=JSON.parse(r.value); if(v) statutNow[String(r.key).slice('punch_statut:'.length)]=v.statut||''; }catch(e){} });
  const rows = await allRows('punch:');
  const H = ['Employé','Appareil','Statut au punch','Statut actuel','Semaine (dim.)','Date','Jour','Type','Équipe','Projet','Adresse','Secteur (banque)','Début','Fin','Heures','Heures (h min)','Ouvert','Hors rayon','Formation'];
  const aoa=[H], meta=[{header:true}], lignes=[];
  rows.forEach(r=>{
    let s; try{ s=JSON.parse(r.value); }catch(e){ return; }
    if(!s || !s.start) return;
    const d=new Date(s.start); if(isNaN(d)) return;
    const h = s.end ? segHours(s) : 0;
    const info = teamInfo[s.teamId] || {};
    const formation = [s.formationType, s.formationLieu, s.formationNotes].filter(Boolean).join(' — ');
    lignes.push({ nom:normNom(s.nom||''), ts:String(s.start), ouvert:!s.end, row:[
      formatNom(s.nom)||'—', s.deviceId||'', s.statut||'', statutNow[s.deviceId]||'',
      dateStr(startOfWeek(d,0)), d.toLocaleDateString('fr-CA'), JOURS[d.getDay()],
      (PUNCH_TYPES[s.type]||{}).label || s.type || '',
      s.teamLabel || tLabel[s.teamId] || '', s.projet || info.projet || '',
      s.adresse ? formatAdresse(s.adresse) : (info.adresse?formatAdresse(info.adresse):''),
      bucketOf(s).label, timeHM(s.start), s.end?timeHM(s.end):'en cours',
      s.end ? Number(h.toFixed(2)) : '', s.end ? fmtH(h) : '',
      s.end ? '' : 'Oui', s.outsideConfirmed ? 'Oui' : '', formation ] });
  });
  lignes.sort((a,b)=> a.nom.localeCompare(b.nom,'fr') || String(b.ts).localeCompare(String(a.ts)));
  lignes.forEach(l=>{ aoa.push(l.row); meta.push({ couleur: l.ouvert ? 'yellow' : null }); });
  if(!lignes.length){ aoa.push(['—','Aucun pointage enregistré','','','','','','','','','','','','','','','','','']); meta.push({}); }
  return { name:'Punch', aoa:aoa, meta:meta, widths:[24,22,13,13,14,12,11,16,14,12,32,17,9,10,9,13,8,11,34], leftCols:[0,1,8,9,10,18] };
};

/* ==== DMD : Entree = champ suivant + correction auto du champ ==== */
(function(){
  if (window.__dmdEnterNext) return; window.__dmdEnterNext = true;
  var NAV_SCOPE = '.modal, #modalBox, .card, form, .panel, .sheet, .edit-form';
  var SKIP = {button:1,submit:1,reset:1,checkbox:1,radio:1,file:1,range:1,color:1,hidden:1,image:1};
  function navigable(el){
    if(!el || el.tagName !== 'INPUT') return false;
    var ty = (el.getAttribute('type') || 'text').toLowerCase();
    return !SKIP[ty];
  }
  function visibleField(el){
    if(el.disabled || el.readOnly) return false;
    var ty = (el.getAttribute('type') || 'text').toLowerCase();
    if(ty === 'hidden' || ty === 'file') return false;
    return el.offsetParent !== null;
  }
  // Applique la correction d'ecriture au champ : majuscules, nom synchronise de la liste, adresse, telephone
  function fmtField(el){
    if(!el || el.tagName !== 'INPUT') return;
    var kind = el.getAttribute('data-fmt');
    if(!kind && (el.getAttribute('type') || '').toLowerCase() === 'tel') kind = 'tel';
    if(!kind) return;
    var v = el.value; if(v == null) return;
    var out = v;
    try{
      if(kind === 'nom'){
        if(typeof window.__dmdCanonNom === 'function') out = window.__dmdCanonNom(v);
        else if(typeof window.formatNom === 'function') out = window.formatNom(v);
      } else if(kind === 'adresse'){
        if(typeof window.formatAdresse === 'function') out = window.formatAdresse(v);
      } else if(kind === 'tel'){
        if(typeof window.formatTel === 'function') out = window.formatTel(v);
      }
    }catch(_){ out = v; }

    }

  const ordered = STD_TEAMS.map(st=>byId[st.id]).concat(teams.filter(t=>t&&t.id&&!STD_TEAMS.some(s=>s.id===t.id)));
  teams = ordered.filter(Boolean);
  if(changed && isDeviceAdmin()){ try{ await storage.set('inv:teams', JSON.stringify(teams)); }catch(e){} }
}
async function loadTeamInfos(){
  teamInfo = {};
  await Promise.all(teams.map(async t => {
    try{ const r=await storage.get('inv:info:'+t.id); if(r&&r.value){ const info=JSON.parse(r.value); if(info&&typeof info==='object') teamInfo[t.id]=info; } }catch(e){}
    if(!teamInfo[t.id]) teamInfo[t.id]={ projet:'', contremaitre:'', adresse:'' };
  }));
}
async function loadMembers(){
  members = [];
  const rows = await storage.like('inv:teammember:');
  rows.forEach(r => { try{ const m=JSON.parse(r.value); if(m&&m.nom){ m._key=r.key; members.push(m); } }catch(e){} });
}
async function loadPool(){
  people = []; personDevice = {};
  const seen = new Set();
  const add = (nom, deviceId) => {
    const n = formatNom(nom); if(!n) return;
    const key = normNom(n);
    if(deviceId) personDevice[key] = deviceId;
    if(seen.has(key)) return; seen.add(key); people.push(n);
  };
  // Répertoire (gens identifiés)
  const pr = await storage.like('inv:person:');
  pr.forEach(r => { try{ const p=JSON.parse(r.value); if(p&&p.nom) add(p.nom, p.id||r.key.replace('inv:person:','')); }catch(e){} });
  // Liste des formations (Excel)
  try{ const f=await storage.get('inv:formations'); if(f&&f.value){ const d=JSON.parse(f.value); if(d&&Array.isArray(d.people)) d.people.forEach(p=>{ if(p&&p.nom) add(p.nom, null); }); } }catch(e){}
  people.sort((a,b)=>a.localeCompare(b,'fr'));
}
async function loadPunchTeams(){
  punchTeamOf = {};
  const rows = await storage.like('punch:');
  const latest = {};   // normNom -> {ts, teamId}
  rows.forEach(r => { try{ const s=JSON.parse(r.value); if(s&&s.nom&&s.type==='chantier'&&s.teamId){ const k=normNom(s.nom); if(!latest[k] || String(s.start)>latest[k].ts){ latest[k]={ts:String(s.start||''), teamId:s.teamId}; } } }catch(e){} });
  Object.keys(latest).forEach(k => punchTeamOf[k]=latest[k].teamId);
}

// ================== SYNCHRO STATUT PUNCH ==================
async function syncStatutForMember(m){
  const st = roleToStatut(m.role); if(!st) return;
  // Trouver l'appareil de cette personne (répertoire)
  let dev = personDevice[normNom(m.nom)];
  if(!dev){ const hit = Object.keys(personDevice).find(k => nomsProches(k, m.nom)); if(hit) dev = personDevice[hit]; }
  if(!dev) return;   // personne pas encore identifiée -> rien à synchroniser
  try{ await storage.set('punch_statut:'+dev, JSON.stringify({ statut:st, nom:m.nom, at:new Date().toISOString(), source:'equipe' })); }catch(e){}
}

// ================== STATUT D'ENREGISTREMENT ==================
function setSave(state){
  const el=document.getElementById('saveStatus'); if(!el) return;
  if(state==='saving'){ el.className='save-status'; el.textContent='💾 Enregistrement…'; }
  else if(state==='ok'){ const d=new Date(); el.className='save-status ok'; el.textContent='✔ Enregistré à '+String(d.getHours()).padStart(2,'0')+'h'+String(d.getMinutes()).padStart(2,'0'); }
  else if(state==='err'){ el.className='save-status err'; el.textContent='⚠ Non enregistré — vérifie la connexion'; }
  else { el.className='save-status'; el.innerHTML='&nbsp;'; }
}

// ================== AFFICHAGE ==================
function teamLabel(id){ const t=teams.find(x=>x.id===id); return t?t.label:id; }
function membersOfTeam(id){
  const map = {};
  members.forEach(m => { if(m.teamId===id){ (map[m.role]=map[m.role]||[]).push(m); } });
  return map;
}
function countTeam(id){ return members.filter(m=>m.teamId===id).length; }

function renderTabs(){
  document.getElementById('tabs').innerHTML = teams.map(t =>
    '<button class="tab'+(t.id===currentTeam?' active':'')+'" data-team="'+escapeAttr(t.id)+'">'+escapeHtml(t.label)+'<span class="tc">'+countTeam(t.id)+'</span></button>'
  ).join('');
  document.querySelectorAll('#tabs .tab').forEach(b => b.onclick = ()=>{ flushInfoSave(); currentTeam=b.getAttribute('data-team'); renderTabs(); renderTeam(); });
}

function renderAdminBar(){
  const el=document.getElementById('adminBar');
  if(isDeviceAdmin()){
    el.innerHTML = '<button class="admin-toggle" id="admLock">🔑 Mode admin activé — toucher pour quitter</button>';
    document.getElementById('admLock').onclick = async ()=>{ await setAdmin(false); renderAdminBar(); renderTeam(); };
  } else {
    el.innerHTML = '<button class="admin-toggle" id="admUnlock">🔒 Lecture seule — activer le mode admin</button>';
    document.getElementById('admUnlock').onclick = async ()=>{ const c=prompt('Code admin :'); if(c==null) return; if(c.trim()===ADMIN_CODE){ await setAdmin(true); renderAdminBar(); renderTeam(); } else alert('Code incorrect.'); };
  }
}

function renderTeam(){
  const wrap=document.getElementById('wrap');
  const admin=isDeviceAdmin();
  const info=teamInfo[currentTeam]||{ projet:'', contremaitre:'', adresse:'' };
  // --- Infos chantier ---
  let html='<div class="card"><h3>🏗 Infos du chantier — '+escapeHtml(teamLabel(currentTeam))+'</h3>';
  if(admin){
    html += '<div class="field-label">N° de projet</div><input class="inp" data-ti="projet" value="'+escapeAttr(info.projet||'')+'" placeholder="ex : 2026-142">';
    html += '<div class="field-label">Contremaître</div><input class="inp" data-ti="contremaitre" data-fmt="nom" value="'+escapeAttr(info.contremaitre||'')+'" placeholder="Nom du contremaître">';
    html += '<div class="field-label">Adresse du chantier</div><input class="inp" data-ti="adresse" data-fmt="adresse" value="'+escapeAttr(info.adresse||'')+'" placeholder="'+escapeAttr(ADRESSE_EX)+'">';
  } else {
    html += '<div class="field-label">N° de projet</div><div class="ro-val">'+(info.projet?escapeHtml(info.projet):'<span class="muted">—</span>')+'</div>';
    html += '<div class="field-label">Contremaître</div><div class="ro-val">'+(info.contremaitre?escapeHtml(formatNom(info.contremaitre)):'<span class="muted">—</span>')+'</div>';
    html += '<div class="field-label">Adresse du chantier</div><div class="ro-val">'+(info.adresse?escapeHtml(formatAdresse(info.adresse)):'<span class="muted">—</span>')+'</div>';
  }
  html += '</div>';

  // --- Membres par rôle ---
  const map=membersOfTeam(currentTeam);
  html += '<div class="card"><h3>👷 Membres — '+escapeHtml(teamLabel(currentTeam))+' <span class="tc" style="font-size:13px;color:var(--paper-dim);">('+countTeam(currentTeam)+')</span></h3>';
  ROLES.forEach(role => {
    const list=(map[role]||[]).slice().sort((a,b)=>formatNom(a.nom).localeCompare(formatNom(b.nom),'fr'));
    html += '<div class="role-group"><div class="role-head">'+escapeHtml(role)+'<span class="rc">'+list.length+'</span></div>';
    if(list.length){
      list.forEach(m => {
        html += '<div class="mbr"><span class="mn">'+escapeHtml(formatNom(m.nom))+'</span>' +
          (roleToStatut(m.role)?'<span class="mtag">CCQ : '+escapeHtml(roleToStatut(m.role))+'</span>':'') +
          (admin?'<button class="mbtn" data-move="'+escapeAttr(m._key)+'">Déplacer</button><button class="mbtn" data-edit="'+escapeAttr(m._key)+'">Rôle</button><button class="mbtn danger" data-del="'+escapeAttr(m._key)+'">✕</button>':'') +
        '</div>';
      });
    } else { html += '<div class="empty-role">Aucun</div>'; }
    html += '</div>';
  });
  if(admin){ html += '<button class="add-btn" id="addMbr">➕ Ajouter un membre</button>'; }
  html += '</div>';

  // --- Suggestions (répertoire / punch non assignés) ---
  if(admin){
    const assigned = new Set(members.map(m=>normNom(m.nom)));
    const sugg = people.filter(n => !assigned.has(normNom(n)));
    if(sugg.length){
      html += '<div class="card"><h3>💡 À classer ('+sugg.length+')</h3><div class="count-note">Employés du répertoire / des formations pas encore assignés à une équipe.</div>';
      sugg.slice(0,40).forEach(n => {
        const pt = punchTeamOf[normNom(n)];
        html += '<div class="mbr"><span class="mn">'+escapeHtml(n)+'</span>' +
          (pt?'<span class="mtag punch">punch : '+escapeHtml(teamLabel(pt))+'</span>':'') +
          '<button class="mbtn" data-quick="'+escapeAttr(n)+'">Ajouter ici</button></div>';
      });
      if(sugg.length>40) html += '<div class="count-note">… et '+(sugg.length-40)+' autres (utilise « Ajouter un membre »).</div>';
      html += '</div>';
    }
  }

  wrap.innerHTML = html;
  wireTeam();
}

function wireTeam(){
  // Infos chantier (édition admin, sauvegarde différée)
  document.querySelectorAll('[data-ti]').forEach(inp => inp.addEventListener('input', () => {
    const team = currentTeam;                          // capture l'équipe AU MOMENT de la frappe (pas au déclenchement du timer)
    if(!teamInfo[team]) teamInfo[team]={ projet:'', contremaitre:'', adresse:'' };
    teamInfo[team][inp.dataset.ti]=inp.value;
    (_dirtyInfoFields[team]=_dirtyInfoFields[team]||new Set()).add(inp.dataset.ti);
    setSave('saving');
    clearTimeout(infoSaveTimer);
    infoSaveTimer=setTimeout(()=>saveTeamInfo(team), 600);
  }));
  const add=document.getElementById('addMbr'); if(add) add.onclick=()=>openAddMember(currentTeam);
  document.querySelectorAll('[data-quick]').forEach(b => b.onclick=()=>openAddMember(currentTeam, b.getAttribute('data-quick')));
  document.querySelectorAll('[data-del]').forEach(b => b.onclick=async ()=>{ const m=members.find(x=>x._key===b.getAttribute('data-del')); if(!m) return; if(!confirm('Retirer '+formatNom(m.nom)+' de '+teamLabel(m.teamId)+' ?')) return; setSave('saving'); await storage.del(m._key); members=members.filter(x=>x._key!==m._key); setSave('ok'); renderTabs(); renderTeam(); });
  document.querySelectorAll('[data-edit]').forEach(b => b.onclick=()=>{ const m=members.find(x=>x._key===b.getAttribute('data-edit')); if(m) openRole(m); });
  document.querySelectorAll('[data-move]').forEach(b => b.onclick=()=>{ const m=members.find(x=>x._key===b.getAttribute('data-move')); if(m) openMove(m); });
}

// ================== MODALES ==================
function closeModal(){ document.getElementById('overlay').classList.remove('show'); document.getElementById('overlay').onclick=null; }
function openAddMember(teamId, presetNom){
  const box=document.getElementById('modalBox');
  box.innerHTML =
    '<h3>➕ Ajouter à '+escapeHtml(teamLabel(teamId))+'</h3>' +
    '<div class="field-label">Nom de l\'employé</div>' +
    '<input class="inp" id="amNom" data-fmt="nom" placeholder="Chercher ou saisir un nom…" value="'+escapeAttr(presetNom||'')+'" autocomplete="off">' +
    '<div class="sugg" id="amSugg" style="display:none;"></div>' +
    '<div class="field-label">Rôle</div>' +
    '<select class="sel" id="amRole">'+ROLES.map(r=>'<option value="'+escapeAttr(r)+'">'+escapeHtml(r)+'</option>').join('')+'</select>' +
    '<div class="m-err" id="amErr">&nbsp;</div>' +
    '<button class="btn primary" id="amSave">Ajouter</button>' +
    '<button class="btn" id="amCancel">Annuler</button>';
  document.getElementById('overlay').classList.add('show');
  document.getElementById('overlay').onclick=e=>{ if(e.target.id==='overlay') closeModal(); };
  document.getElementById('amCancel').onclick=closeModal;
  const nomInp=document.getElementById('amNom'), sBox=document.getElementById('amSugg');
  nomInp.addEventListener('input', ()=>{
    const q=normNom(nomInp.value); if(!q){ sBox.style.display='none'; return; }
    const assigned=new Set(members.map(m=>normNom(m.nom)));
    const matches=people.filter(n=>normNom(n).includes(q) && !assigned.has(normNom(n))).slice(0,8);
    if(!matches.length){ sBox.style.display='none'; return; }
    sBox.innerHTML=matches.map(n=>'<div data-n="'+escapeAttr(n)+'">'+escapeHtml(n)+'</div>').join('');
    sBox.style.display='';
    sBox.querySelectorAll('div').forEach(d=>d.onclick=()=>{ nomInp.value=d.getAttribute('data-n'); sBox.style.display='none'; });
  });
  document.getElementById('amSave').onclick=async ()=>{
    const nom=formatNom(nomInp.value); const role=document.getElementById('amRole').value;
    if(!nom){ document.getElementById('amErr').textContent='Indique un nom.'; return; }
    if(members.some(m=>normNom(m.nom)===normNom(nom))){ if(!confirm(nom+' est déjà dans une équipe. L\'ajouter/déplacer ici quand même ?')) return; }
    setSave('saving');
    // s'il existe déjà, on le déplace ; sinon on crée
    let m=members.find(x=>normNom(x.nom)===normNom(nom));
    if(m){ m.teamId=teamId; m.role=role; }
    else { m={ id:uid(), nom, teamId, role }; m._key='inv:teammember:'+m.id; members.push(m); }
    const rec={ id:m.id, nom:m.nom, teamId:m.teamId, role:m.role };
    const r=await storage.set(m._key, JSON.stringify(rec));
    await syncStatutForMember(m);
    setSave(r?'ok':'err'); closeModal(); renderTabs(); renderTeam();
  };
  setTimeout(()=>{ try{ nomInp.focus(); }catch(e){} }, 60);
}
function openRole(m){
  const box=document.getElementById('modalBox');
  box.innerHTML =
    '<h3>Rôle de '+escapeHtml(formatNom(m.nom))+'</h3>' +
    '<select class="sel" id="rRole">'+ROLES.map(r=>'<option value="'+escapeAttr(r)+'"'+(r===m.role?' selected':'')+'>'+escapeHtml(r)+'</option>').join('')+'</select>' +

  document.getElementById('overlay').onclick=e=>{ if(e.target.id==='overlay') closeModal(); };
  document.getElementById('rCancel').onclick=closeModal;
  document.getElementById('rSave').onclick=async ()=>{
    m.role=document.getElementById('rRole').value;
    setSave('saving');
    const r=await storage.set(m._key, JSON.stringify({ id:m.id, nom:m.nom, teamId:m.teamId, role:m.role }));

}
function openMove(m){
  const box=document.getElementById('modalBox');
  box.innerHTML =
    '<h3>Déplacer '+escapeHtml(formatNom(m.nom))+'</h3>' +
    '<div class="field-label">Vers l\'équipe</div>' +

  document.getElementById('overlay').onclick=e=>{ if(e.target.id==='overlay') closeModal(); };
  document.getElementById('mCancel').onclick=closeModal;

}

let _xlsxLoading=null;
function ensureXLSX(){ if(window.XLSX) return Promise.resolve(); if(_xlsxLoading) return _xlsxLoading; _xlsxLoading=new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js'; s.onload=()=>res(); s.onerror=()=>{_xlsxLoading=null;rej(new Error('xlsx'));}; document.head.appendChild(s); }); return _xlsxLoading; }
async function exporterExcel(){
  try{ await ensureXLSX(); }catch(e){ alert('Impossible de charger le module Excel.'); return; }
  const wb=XLSX.utils.book_new();
  const aoa=[['Équipe','N° projet','Contremaître','Adresse','Rôle','Employé']];
  teams.forEach(t=>{
    const info=teamInfo[t.id]||{};
    const mem=members.filter(m=>m.teamId===t.id).sort((a,b)=>ROLES.indexOf(a.role)-ROLES.indexOf(b.role) || formatNom(a.nom).localeCompare(formatNom(b.nom),'fr'));
    if(!mem.length){ aoa.push([t.label, info.projet||'', formatNom(info.contremaitre)||'', formatAdresse(info.adresse), '', '']); }
    mem.forEach(m=> aoa.push([t.label, info.projet||'', formatNom(info.contremaitre)||'', formatAdresse(info.adresse), m.role, formatNom(m.nom)]));
  });
  const ws=XLSX.utils.aoa_to_sheet(aoa); ws['!cols']=[{wch:16},{wch:12},{wch:22},{wch:30},{wch:26},{wch:24}];
  XLSX.utils.book_append_sheet(wb, ws, 'Équipes');
  const d=new Date();
  XLSX.writeFile(wb, 'Equipes_DMD_'+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'.xlsx');
}

/* ==== DMD : Entree = champ suivant + correction auto du champ ==== */
(function(){
  if (window.__dmdEnterNext) return; window.__dmdEnterNext = true;
  var NAV_SCOPE = '.modal, #modalBox, .card, form, .panel, .sheet, .edit-form';
  var SKIP = {button:1,submit:1,reset:1,checkbox:1,radio:1,file:1,range:1,color:1,hidden:1,image:1};
  function navigable(el){
    if(!el || el.tagName !== 'INPUT') return false;
    var ty = (el.getAttribute('type') || 'text').toLowerCase();
    return !SKIP[ty];
  }
  function visibleField(el){
    if(el.disabled || el.readOnly) return false;
    var ty = (el.getAttribute('type') || 'text').toLowerCase();
    if(ty === 'hidden' || ty === 'file') return false;
    return el.offsetParent !== null;
  }
  // Applique la correction d'ecriture au champ : majuscules, nom synchronise de la liste, adresse, telephone
  function fmtField(el){
    if(!el || el.tagName !== 'INPUT') return;
    var kind = el.getAttribute('data-fmt');
    if(!kind && (el.getAttribute('type') || '').toLowerCase() === 'tel') kind = 'tel';
    if(!kind) return;
    var v = el.value; if(v == null) return;
    var out = v;
    try{
      if(kind === 'nom'){
        if(typeof window.__dmdCanonNom === 'function') out = window.__dmdCanonNom(v);
        else if(typeof window.formatNom === 'function') out = window.formatNom(v);
      } else if(kind === 'adresse'){
        if(typeof window.formatAdresse === 'function') out = window.formatAdresse(v);
      } else if(kind === 'tel'){
        if(typeof window.formatTel === 'function') out = window.formatTel(v);
      }
    }catch(_){ out = v; }
    if(out != null && out !== v){
      el.value = out;
      try{ el.dispatchEvent(new Event('input', {bubbles:true})); }catch(_){}
    }
  }
  window.__dmdFmtField = fmtField;
  // Fleche "suivant" sur le clavier mobile, uniquement dans un formulaire
  document.addEventListener('focusin', function(e){
    var t = e.target;
    if(navigable(t) && t.closest(NAV_SCOPE) && !t.hasAttribute('enterkeyhint')){
      t.setAttribute('enterkeyhint', 'next');
    }
  });
  // Corrige aussi quand on quitte le champ autrement (toucher ailleurs, bouton Enregistrer)
  document.addEventListener('focusout', function(e){ fmtField(e.target); });
  // Entree : corrige le champ puis passe au champ suivant du meme formulaire
  document.addEventListener('keydown', function(e){
    if(e.key !== 'Enter' || e.shiftKey || e.altKey || e.ctrlKey || e.metaKey) return;
    if(e.defaultPrevented) return;            // respecte les gestionnaires existants (chat, ajout employe...)
    var t = e.target;
    if(!navigable(t)) return;                  // laisse tranquilles les textarea et les champs de recherche
    var scope = t.closest(NAV_SCOPE);
    if(!scope) return;
    fmtField(t);                               // correction immediate du champ courant
    var fields = [].slice.call(scope.querySelectorAll('input, select, textarea')).filter(visibleField);
    var i = fields.indexOf(t);
    if(i < 0) return;
    e.preventDefault();
    if(i < fields.length - 1){
      var nx = fields[i + 1];
      nx.focus();
      if(nx.select){ try { nx.select(); } catch(_){} }
    } else {
      t.blur();                                // dernier champ : ferme le clavier
    }
  });
})();

function withTimeout(promise, ms, label){
  return Promise.race([
    Promise.resolve(promise),
    new Promise((_, rej) => setTimeout(() => rej(new Error('timeout:' + (label||''))), ms))
  ]);
}

function escapeHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escapeAttr(s){ return escapeHtml(s).replace(/'/g,'&#39;'); }

// ---- Affichage uniforme des noms et téléphones (partagé dans toute l'app) ----
function onlyDigits(s){ return String(s==null?'':s).replace(/\D/g,''); }
function formatTel(s){ const d=onlyDigits(s); let n=d; if(n.length===11 && n[0]==='1') n=n.slice(1); if(n.length===10) return '('+n.slice(0,3)+')'+n.slice(3,6)+'-'+n.slice(6); return String(s==null?'':s).trim(); }
function telHref(s){ const d=onlyDigits(s); return 'tel:'+(d||String(s==null?'':s).trim()); }
function formatNom(s){ s=String(s==null?'':s).replace(/\s+/g,' ').trim(); if(!s) return s; return s.toLocaleLowerCase('fr').replace(/[\p{L}\p{N}]+/gu, function(w){ return w.charAt(0).toLocaleUpperCase('fr')+w.slice(1); }); }
// Synchronise un nom saisi avec l'orthographe exacte du répertoire (fiches inv:person) + fichier de formations.

// ================== STOCKAGE PARTAGÉ (même logique que l'inventaire) ==================
// shared=true -> Supabase (partagé entre tous) ; shared=false -> localStorage (cet appareil)
window.storage = {
  async get(k, shared = true){
    if(shared === false){
      try{ const v = localStorage.getItem(k); return v === null ? null : { key:k, value:v }; }
      catch(e){ return null; }
    }
    try{
      const res = await withTimeout(_sb.from('inv_store').select('value').eq('key', k).maybeSingle(), 8000, 'get:'+k);
      const { data, error } = res || {};
      if(error){ console.error(error); return null; }
      return data ? { key:k, value:data.value } : null;
    }catch(e){ console.error(e); return null; }
  },
  async set(k, value, shared = true){
    if(shared === false){
      try{ localStorage.setItem(k, value); return { key:k, value }; }catch(e){ return null; }
    }
    const { error } = await _sb.from('inv_store').upsert({ key:k, value:value, updated_at:new Date().toISOString() });
    if(error){ console.error(error); return null; }
    return { key:k, value };
  },
  async delete(k, shared = true){
    if(shared === false){
      try{ localStorage.removeItem(k); return { key:k, deleted:true }; }catch(e){ return null; }
    }
    const { error } = await _sb.from('inv_store').delete().eq('key', k);
    if(error){ console.error(error); return null; }
    return { key:k, deleted:true };
  }
};

// Lit l'Excel croisé « Liste des formations » : en-têtes sur 2 lignes,
// blocs de 3 lignes par employé (Date / Attestation reçu / Échéance).
async function importFormationsFromFile(file){
  await ensureXLSX();
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type:'array', cellDates:true });

  // Choisir la feuille croisée : celle qui contient « EMPLOYÉ » en haut à gauche
  // et une ligne « Échéance ».
  let sheet = null;
  wb.SheetNames.forEach(sn => {
    const ws = wb.Sheets[sn];
    const aoa = XLSX.utils.sheet_to_json(ws, { header:1, defval:'', raw:false });
    const flat = aoa.slice(0,6).map(r => (r||[]).join(' ')).join(' ').toLowerCase();
    const hasEmp = /employ/.test(flat);
    const hasEch = aoa.some(r => (r||[]).some(c => /échéance|echeance/i.test(String(c))));
    if(hasEmp && hasEch && !sheet){ sheet = { sn, aoa }; }
  });
  if(!sheet) return { people:[], maj:new Date().toISOString() };

  const aoa = sheet.aoa;
  const fmt = v => {
    if(v == null) return '';
    if(v instanceof Date){ return v.getFullYear() + '-' + String(v.getMonth()+1).padStart(2,'0') + '-' + String(v.getDate()).padStart(2,'0'); }
    return String(v).trim();
  };

  // Ligne d'en-tête des formations = celle qui contient « SECOURISTE » (ou SILICE)
  let hRow = -1;
  for(let r=0; r<Math.min(aoa.length, 6); r++){
    if((aoa[r]||[]).some(c => /secouriste|silice/i.test(String(c)))){ hRow = r; break; }
  }
  if(hRow === -1) hRow = 1;
  // colonnes de formation = à partir de la 3e colonne (index 2)
  const formCols = [];
  const headerRow = aoa[hRow] || [];
  for(let c=2; c<headerRow.length; c++){
    const nom = fmt(headerRow[c]).replace(/\s+/g,' ').trim();
    if(nom) formCols.push({ c, nom });
  }

  // Blocs employés : nom en colonne 0 (1re ligne) ; 3 lignes = Date / Attestation / Échéance.
  const people = [];
  let r = hRow + 1;
  while(r < aoa.length){
    const nom = fmt((aoa[r]||[])[0]);
    if(nom){
      const rowDate = aoa[r] || [], rowAtt = aoa[r+1] || [], rowEch = aoa[r+2] || [];
      const forms = [];
      formCols.forEach(({c, nom:fnom}) => {
        const d = fmt(rowDate[c]), a = fmt(rowAtt[c]), e = fmt(rowEch[c]);
        if(d || a || e){ forms.push({ formation:fnom, date:d, attestation:a, echeance:e }); }
      });
      if(forms.length) people.push({ nom, forms });
      r += 3;
    } else {
      r += 1;
    }
  }
  return { people, maj:new Date().toISOString() };
}

      renderAdminBar();
    };
  });
}

// ================== CORRESPONDANCE NOMS ↔ FORMATIONS (même logique que l'inventaire) ==================
function normNom(s){
  return (s||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[.,\-]/g,' ').replace(/\s+/g,' ').trim();
}
function levenshtein(a, b){
  if(a === b) return 0;
  if(!a || !b) return (a.length + b.length);
  let prev = Array.from({length:b.length+1}, (_,i)=>i);
  for(let i=0;i<a.length;i++){
    let cur = [i+1];
    for(let j=0;j<b.length;j++){
      cur.push(Math.min(prev[j+1]+1, cur[j]+1, prev[j] + (a[i]!==b[j] ? 1 : 0)));
    }
    prev = cur;
  }
  return prev[b.length];
}
function motsProches(m1, m2){
  const d = levenshtein(m1, m2), L = Math.max(m1.length, m2.length);
  if(L >= 6) return d <= 2;
  if(L >= 4) return d <= 1;
  return d === 0;
}
function nomsProches(n1, n2){
  const w1 = normNom(n1).split(' ').filter(Boolean);
  const w2 = normNom(n2).split(' ').filter(Boolean);
  if(w1.length !== w2.length || w1.length === 0) return false;
  const used = new Array(w2.length).fill(false);
  for(const a of w1){
    let ok = false;
    for(let i=0;i<w2.length;i++){
      if(!used[i] && motsProches(a, w2[i])){ used[i] = true; ok = true; break; }
    }
    if(!ok) return false;
  }
  return true;
}
// Statut d'une échéance (tableau Excel des formations) :
// rouge = échue · jaune = échue dans moins d'un an · verte = valide
function echeanceStatus(dateStr){
  const m = (dateStr||'').match(/(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
  if(!m) return null;
  const d = new Date(+m[1], +m[2]-1, +m[3]);
  if(isNaN(d)) return null;
  const now = new Date(); now.setHours(0,0,0,0);
  const jours = Math.round((d - now) / 86400000);
  if(jours < 0) return { level:'red', label:'Échue' };
  if(jours <= 365) return { level:'orange', label:'Échue dans moins d\'un an' };
  return { level:'green', label:'Valide' };
}

// ================== DONNÉES ==================
let people = [];          // fiches inv:person:*
let formationsData = null; // { people:[{nom, forms:[{formation,date,attestation,echeance}]}], maj }
let rosterAdded = [];      // employés autorisés ajoutés via l'app (inv:roster:added)

async function loadAll(){
  // Une seule requête pour toutes les fiches + une pour les formations
  const [pRes, fRes] = await Promise.all([
    withTimeout(_sb.from('inv_store').select('key,value').like('key','inv:person:%'), 12000, 'people'),
    withTimeout(_sb.from('inv_store').select('value').eq('key','inv:formations').maybeSingle(), 12000, 'formations')
  ]);
  people = [];
  if(pRes && Array.isArray(pRes.data)){
    pRes.data.forEach(r => {
      try{
        const p = JSON.parse(r.value);
        if(p){ p._key = r.key; if(!p.id) p.id = r.key.replace('inv:person:',''); people.push(p); }
      }catch(e){}
    });
  }
  people.sort((a,b) => (a.nom||'').localeCompare(b.nom||'', 'fr'));
  formationsData = null;
  if(fRes && fRes.data && fRes.data.value){
    try{ const f = JSON.parse(fRes.data.value); if(f && Array.isArray(f.people)) formationsData = f; }catch(e){}
  }
}

function formationsHtmlFor(nom){
  if(!formationsData || !Array.isArray(formationsData.people)) return '';
  let match = formationsData.people.find(p => normNom(p.nom) === normNom(nom));
  if(!match) match = formationsData.people.find(p => nomsProches(p.nom, nom));
  if(!match || !match.forms || !match.forms.length) return '';
  const items = match.forms.map(f => {
    const st = echeanceStatus(f.echeance);
    const lineCls = st ? (' f-' + (st.level==='orange' ? 'yellow' : st.level)) : '';
    const dot = st ? '<span class="dot ' + st.level + '"></span>' : '';
    const ech = f.echeance
      ? ('<span class="f-ech ' + (st ? st.level : '') + '">' + escapeHtml(f.echeance) + (st && st.level !== 'green' ? ' — ' + st.label : '') + '</span>')
      : '—';
    return '<div class="f-line' + lineCls + '">' + dot + '<b>' + escapeHtml(f.formation) + '</b> · éch : ' + ech + '</div>';
  }).join('');
  return '<div class="pf"><div class="pf-title">🎓 Formations (' + match.forms.length + ')</div>' + items + '</div>';
}

    const urgBlock = hasUrg
      ? '<div class="p-urgence">' +
          '<button type="button" class="urg-btn" data-urg-toggle="' + uid + '">🆘 En cas d\'urgence</button>' +
          '<div class="urg-box" id="urg-' + uid + '">' +
            '<div class="urg-name">' + escapeHtml(formatNom(urg.nom) || '—') +
              (urg.lien ? ' <span class="urg-lien">(' + escapeHtml(urg.lien) + ')</span>' : '') + '</div>' +
            (urg.tel ? '<a class="urg-call" href="' + escapeAttr(telHref(urg.tel)) + '">📞 ' + escapeHtml(formatTel(urg.tel)) + '</a>' : '') +
            '<div class="urg-hint">Réservé aux situations d\'urgence sur un chantier.</div>' +
          '</div>' +
        '</div>'
      : (isMe ? '<div class="urg-none">🆘 Ajoute ton contact d\'urgence via « Modifier mes infos ».</div>' : '');
    const adminBtns = isAdmin
      ? '<div class="p-admin">' +
          '<button type="button" class="p-admin-btn" data-carte-key="' + pKey + '">🔗 ' + ((p.extra && p.extra.carteUrl) ? 'Modifier' : 'Ajouter') + ' lien carte</button>' +
          '<button type="button" class="p-admin-btn danger" data-del-key="' + pKey + '" data-del-id="' + escapeAttr(p.id || '') + '" data-del-nom="' + escapeAttr(p.nom || '') + '">🗑️ Supprimer</button>' +
        '</div>'
      : '';
    // Formations : chacun voit les siennes, l'admin voit toutes (lignes colorées selon l'échéance)
    return '<div class="card' + (isMe ? ' me' : '') + '">' +
      '<div class="p-top"><span class="p-name">' + escapeHtml(formatNom(p.nom) || '(sans nom)') +
        (isMe ? ' <span class="p-you">Toi</span>' : '') + '</span>' + equipe + '</div>' +

      carte +
      urgBlock +
      /* Formations : chaque personne voit LES SIENNES; l'admin voit celles de tout le monde. */
      ((isAdmin || isMe) ? formationsHtmlFor(p.nom) : '') +
      (isMe ? '<button type="button" class="edit-btn" id="editMe">✏️ Modifier mes infos</button>' : '') +
      adminBtns +
      '</div>';
  }).join('');
  const btn = document.getElementById('editMe');
  if(btn) btn.onclick = openEdit;

  // ---- Révéler / masquer le contact d'urgence (accès intentionnel) ----
  list.querySelectorAll('[data-urg-toggle]').forEach(b => {
    b.onclick = () => {
      const box = document.getElementById('urg-' + b.getAttribute('data-urg-toggle'));
      if(box){
        const open = box.classList.toggle('show');
        b.textContent = open ? '🆘 Masquer le contact d\'urgence' : '🆘 En cas d\'urgence';
      }
    };
  });

  // ---- Actions admin par personne (lien carte + suppression) ----
  if(isAdmin){
    list.querySelectorAll('[data-carte-key]').forEach(b => {
      b.onclick = async () => {
        const key = b.getAttribute('data-carte-key');
        const person = people.find(x => (x._key || ('inv:person:' + x.id)) === key);
        const actuel = (person && person.extra && person.extra.carteUrl) || '';
        const url = prompt('Lien vers la photo de la carte / certificat (Google Drive, etc.) :', actuel);
        if(url == null) return;
        const rec = Object.assign({}, person);
        delete rec._key; // ne pas enregistrer la clé technique dans la valeur
        rec.extra = Object.assign({}, (person && person.extra) || {}, { carteUrl: url.trim() });
        try{ await window.storage.set(key, JSON.stringify(rec), true); }catch(e){}
        try{ await loadAll(); }catch(e){}
        render();
      };
    });
    list.querySelectorAll('[data-del-key]').forEach(b => {
      b.onclick = async () => {
        const key = b.getAttribute('data-del-key');
        const pid = b.getAttribute('data-del-id') || key.replace('inv:person:', '');
        const pnom = b.getAttribute('data-del-nom') || 'cette personne';
        if(!confirm('Supprimer la fiche de « ' + pnom + ' » ?\n\n' +
          'Elle disparaîtra du répertoire. La personne devra se réidentifier pour recréer sa fiche.')) return;
        // 1) retirer la fiche partagée
        try{ await window.storage.delete(key, true); }catch(e){}
        // 2) marquer l'appareil comme « supprimé » pour qu'il ne se recrée pas tout seul
        try{
          const raw = await window.storage.get('inv:deletedPeople', true);
          const arr = (raw && raw.value) ? JSON.parse(raw.value) : [];
          if(arr.indexOf(pid) === -1) arr.push(pid);
          await window.storage.set('inv:deletedPeople', JSON.stringify(arr), true);
        }catch(e){}
        // 3) si c'est CET appareil, effacer l'identité locale -> réidentification forcée
        if(pid === getDeviceId()){
          try{ localStorage.removeItem('inv:deviceUser'); }catch(e){}
        }
        try{ await loadAll(); }catch(e){}
        render();
      };
    });
  }
}
